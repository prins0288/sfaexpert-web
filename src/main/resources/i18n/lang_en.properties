# ===========================================================================
# Base UI translations — ENGLISH (also the fallback for any key missing in
# another language). Plain UTF-8; loaded with an explicit UTF-8 reader by
# I18nService so non-ASCII languages (Hindi etc.) need no \\uXXXX escapes.
#
# A tenant may OVERRIDE any of these per language via the label_master table
# (tenant DB): a row (label_key, lang, label_value, status='Y') wins over the
# value here. Add a new language by dropping a lang_<code>.properties beside
# this file — it shows up automatically.
#
# Key convention: dotted namespaces. "common.*" = shared chrome reused on
# every page; page-specific keys use the page name, e.g. "dashboard.*".
# ===========================================================================

