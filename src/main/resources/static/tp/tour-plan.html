<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Tour Plan</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
<style>
  .tp-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: .3rem; }
  .tp-dow { text-align: center; font-size: .72rem; font-weight: 700; color: var(--bs-secondary-color); text-transform: uppercase; padding: .2rem 0; }
  .tp-cell { min-height: 4.4rem; border: 1px solid var(--bs-border-color); border-radius: .75rem; background: var(--bs-body-bg); padding: .3rem .35rem; text-align: left; display: flex; flex-direction: column; gap: .15rem; overflow: hidden; position: relative; }
  .tp-cell .n { font-weight: 800; font-size: .95rem; line-height: 1; }
  .tp-cell .t { font-size: .62rem; line-height: 1.15; font-weight: 700; border-radius: .4rem; padding: .08rem .3rem; background: var(--bs-secondary-bg); color: var(--bs-secondary-color); align-self: flex-start; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tp-cell .t.field { background: var(--bs-primary-bg-subtle); color: var(--bs-primary); }
  .tp-cell .h { font-size: .6rem; line-height: 1.1; color: var(--bs-danger); font-weight: 700; overflow: hidden; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tp-cell.off { background: var(--bs-tertiary-bg); } .tp-cell.off .h { color: var(--bs-secondary-color); }
  .tp-cell.hol { background: var(--bs-danger-bg-subtle); border-color: var(--bs-danger-border-subtle); }
  .tp-cell.past { opacity: .55; } .tp-cell.today { border: 2px solid var(--bs-primary); }
  .tp-cell.blank { border: 0; background: transparent; }
  .tp-cell .m { font-size: .58rem; color: var(--bs-secondary-color); }
  @media (min-width: 992px) { .tp-cell { min-height: 6rem; border-radius: .5rem; padding: .45rem .55rem; } .tp-cell .n { font-size: 1.05rem; } .tp-cell .t { font-size: .74rem; } .tp-cell .h { font-size: .72rem; } .tp-cell .m { font-size: .7rem; } .tp-cell:hover:not(.blank) { background: var(--bs-tertiary-bg); } }
  .tp-cell.need { border: 1.5px dashed var(--bs-warning); }
  .tp-kind { border: 1px solid var(--bs-border-color); border-radius: .85rem; margin-top: .6rem; overflow: hidden; }
  .tp-kind > .hd { display: flex; align-items: center; gap: .5rem; padding: .6rem .8rem; cursor: pointer; background: var(--bs-tertiary-bg); font-weight: 700; }
  .tp-kind > .bd { padding: .6rem .7rem; }
  .tp-kind .box { max-height: 15rem; overflow-y: auto; border: 1px solid var(--bs-border-color); border-radius: .7rem; padding: 0 .6rem; margin-top: .5rem; overscroll-behavior: contain; }
  .tp-prog { height: .5rem; border-radius: 999px; background: var(--bs-secondary-bg); overflow: hidden; }
  .tp-prog > div { height: 100%; background: var(--bs-success); transition: width .3s; }
  .tp-leg { display: flex; flex-wrap: wrap; gap: .75rem; font-size: .78rem; color: var(--bs-secondary-color); }
  .tp-leg i { display: inline-block; width: .8rem; height: .8rem; border-radius: .25rem; vertical-align: -1px; margin-right: .25rem; }
</style>

<body>
<div id="app" data-page="tourplan" data-title="Tour Plan"></div>
<template id="pageContent">
<div class="ap-app">
  <div class="ap-top"><div><h1 class="ap-title">Tour Plan</h1><div class="text-muted small" id="tpWho"></div></div>
    <button class="ap-btn go d-none" id="tpSubmitBtn" onclick="tpSubmit()"><i class="bi bi-send-check"></i> Submit for approval</button></div>
  <div class="ap-seg" id="tpSeg"><button class="active" data-t="my" onclick="tpTab('my')"><i class="bi bi-calendar3"></i> My plan</button>
    <button data-t="team" onclick="tpTab('team')"><i class="bi bi-people"></i> Team plans <span class="ap-badge bad d-none" id="tpPend"></span></button></div>
  <div class="ap-card d-flex align-items-center gap-2">
    <button class="ap-btn light sm" onclick="tpMonth(-1)"><i class="bi bi-chevron-left"></i></button>
    <b class="flex-fill text-center fs-5" id="tpMonthName"></b>
    <button class="ap-btn light sm" onclick="tpMonth(1)"><i class="bi bi-chevron-right"></i></button>
    <span id="tpStatus"></span>
  </div>
  <div id="tpBanner"></div>
  <div id="pMy">
    <div class="ap-card"><label class="form-label small mb-1">Goal of the month</label><textarea class="form-control" rows="2" id="tpGoal" maxlength="1000" placeholder="What do you want to achieve this month?" onchange="tpGoalSave()"></textarea></div>
    <div class="ap-card d-none" id="tpProg"></div>
    <div class="ap-card"><div class="tp-cal mb-1" id="tpDow"></div><div class="tp-cal" id="tpCal"></div>
      <div class="tp-leg mt-2"><span><i style="background:var(--bs-primary-bg-subtle)"></i>Field day</span><span><i style="background:var(--bs-secondary-bg)"></i>Other day type</span><span><i style="background:var(--bs-danger-bg-subtle)"></i>Holiday</span><span><i style="background:var(--bs-tertiary-bg)"></i>Weekly off</span></div></div>
    <div class="ap-card d-none" id="tpTrailCard"><div class="ap-sec mt-0">Approval</div><div id="tpTrail"></div></div>
  </div>
  <div id="pTeam" class="d-none"><div class="ap-card" id="tpTeamList"></div></div>
  <div class="ap-bar" id="tpBar"><div class="info" id="tpBarInfo"></div>
    <button class="ap-btn danger" onclick="tpReject()"><i class="bi bi-x-circle"></i> Reject</button>
    <button class="ap-btn go" onclick="tpApprove()"><i class="bi bi-patch-check"></i> Approve</button></div>
  <div class="offcanvas offcanvas-bottom ap-sheet" tabindex="-1" id="tpSheet" data-bs-backdrop="true">
    <div class="offcanvas-header"><h5 class="offcanvas-title" id="tpSheetTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body" id="tpSheetBody"></div>
    <div class="ap-sheet-foot" id="tpSheetFoot"></div>
  </div>
</div>
</template>

<script>
  const EP = API.master.tourPlan;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  const pad = (n) => String(n).padStart(2, '0');
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const ST_NAME = { DRAFT: ['Draft', ''], PENDING_MANAGER: ['Waiting for manager', 'wait'], PENDING_ADMIN: ['Waiting for admin', 'wait'], APPROVED: ['Approved', 'ok'], REJECTED: ['Rejected', 'bad'] };
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  let OPT = null, PLAN = null, Y = new Date().getFullYear(), M = new Date().getMonth() + 1, VIEW = null, TAB = 'my', SHEET = null, DAY = null;

  window.pageInit = async function () {
    SHEET = new bootstrap.Offcanvas('#tpSheet');
    document.getElementById('tpDow').innerHTML = DOW.map(d => `<div class="tp-dow">${d}</div>`).join('');
    try { OPT = await Api.get(EP.options); await tpLoad(); teamPending(); if (/[?&]tab=team/.test(location.search)) tpTab('team'); } catch (e) { SFA.toast(e.message, false); }
  };
  const isField = (code) => !!((OPT.workTypes.find(w => w.code === code) || {}).fieldWork);
  const wtName = (code) => ((OPT.workTypes.find(w => w.code === code) || {}).name) || code;
  const areaOf = (id) => OPT.areas.find(a => String(a.id) === String(id)) || {};
  const fmt = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  function tpMonth(n) { M += n; if (M < 1) { M = 12; Y--; } if (M > 12) { M = 1; Y++; } tpLoad().then(() => { if (TAB === 'team') teamLoad(); }).catch(e => SFA.toast(e.message, false)); }
  function tpTab(t) {
    TAB = t; if (t === 'my') VIEW = null;
    document.querySelectorAll('#tpSeg button').forEach(b => b.classList.toggle('active', b.dataset.t === t));
    document.getElementById('pMy').classList.toggle('d-none', t !== 'my' && !VIEW);
    document.getElementById('pTeam').classList.toggle('d-none', t !== 'team' || !!VIEW);
    if (t === 'team') teamLoad(); else tpLoad().catch(e => SFA.toast(e.message, false));
  }
  async function tpLoad() {
    PLAN = await Api.get(EP.plan, { query: { year: Y, month: M, empId: VIEW } });
    render();
  }

  function render() {
    document.getElementById('tpMonthName').textContent = MONTHS[M - 1] + ' ' + Y;
    document.getElementById('tpWho').textContent = PLAN.mine ? '' : (PLAN.empName + ' (' + PLAN.empCode + ') · ' + (PLAN.designation || ''));
    const st = ST_NAME[PLAN.status] || [PLAN.status, ''];
    document.getElementById('tpStatus').innerHTML = `<span class="ap-badge ${st[1]}">${st[0]}</span>`;
    const ban = [];
    if (!PLAN.mine) ban.push(`<div class="ap-card d-flex align-items-center gap-2"><i class="bi bi-person-lines-fill text-primary fs-4"></i><div class="flex-fill"><b>${esc(PLAN.empName)}</b><small class="d-block text-muted">Viewing this plan</small></div><button class="ap-btn light sm" onclick="tpBack()">Back</button></div>`);
    if (PLAN.status === 'REJECTED' && PLAN.rejectReason) ban.push(`<div class="alert alert-danger py-2 small"><i class="bi bi-x-circle"></i> Rejected: ${esc(PLAN.rejectReason)} - correct the plan and submit again.</div>`);
    document.getElementById('tpBanner').innerHTML = ban.join('');
    document.getElementById('pMy').classList.toggle('d-none', TAB !== 'my' && !VIEW);
    document.getElementById('pTeam').classList.toggle('d-none', TAB !== 'team' || !!VIEW);
    const goal = document.getElementById('tpGoal'); goal.value = PLAN.monthGoal || ''; goal.disabled = !PLAN.canEdit;
    progress();
    const bar = document.getElementById('tpBar'); bar.classList.toggle('show', !!PLAN.canApprove);
    document.getElementById('tpBarInfo').textContent = PLAN.canApprove ? (PLAN.empName + "'s plan is waiting for you") : '';
    calendar();
    const trail = PLAN.approval || [];
    document.getElementById('tpTrailCard').classList.toggle('d-none', !trail.length);
    document.getElementById('tpTrail').innerHTML = trail.map(t => `<div class="ap-row" style="cursor:default"><i class="bi bi-${t.action === 'REJECTED' ? 'x-circle text-danger' : t.action === 'APPROVED' ? 'check-circle text-success' : 'send text-primary'} fs-5"></i>
      <div class="grow"><b>${esc(({ REQUESTED: 'Submitted', APPROVED: 'Approved', REJECTED: 'Rejected' })[t.action] || t.action)}</b> <small class="d-inline text-muted">${esc(t.step === 'MANAGER' ? 'manager step' : t.step === 'FINAL' ? 'final' : '')}</small>
        <small>${esc(t.byName || '')}${t.byDesignation ? ' · ' + esc(t.byDesignation) : ''} · ${esc(String(t.at).replace('T', ' ').slice(0, 16))}${t.remarks ? ' · ' + esc(t.remarks) : ''}</small></div></div>`).join('');
  }

  // dates the plan must cover before it can be submitted: from TODAY to the month end (never the 1st if the month is running), minus holidays / weekly off
  function requiredDates() {
    if (!PLAN || !PLAN.canEdit) return [];
    const today = todayStr(), days = new Date(Y, M, 0).getDate(), out = [];
    for (let d = 1; d <= days; d++) { const ds = Y + '-' + pad(M) + '-' + pad(d); if (ds >= today && !(PLAN.holidays || {})[ds]) out.push(ds); }
    return out;
  }
  function progress() {
    const card = document.getElementById('tpProg'), btn = document.getElementById('tpSubmitBtn'), req = requiredDates();
    if (!PLAN.canEdit) { card.classList.add('d-none'); btn.classList.add('d-none'); return; }
    const planned = new Set((PLAN.days || []).map(d => d.date)), left = req.filter(d => !planned.has(d)), done = req.length - left.length;
    const from = todayStr() > Y + '-' + pad(M) + '-01' ? 'from today (' + new Date().getDate() + ' ' + MONTHS[M - 1].slice(0, 3) + ')' : 'for the whole month';
    card.classList.remove('d-none');
    card.innerHTML = `<div class="d-flex justify-content-between align-items-baseline mb-1"><b>${done} of ${req.length} days planned</b><small class="text-muted">${from} to month end</small></div>
      <div class="tp-prog"><div style="width:${req.length ? Math.round(done * 100 / req.length) : 100}%"></div></div>
      <small class="d-block mt-2 ${left.length ? 'text-warning-emphasis' : 'text-success'}">${left.length ? '<i class="bi bi-exclamation-triangle"></i> The plan can be submitted only when <b>every working day till the month end</b> is planned. ' + left.length + ' day' + (left.length === 1 ? '' : 's') + ' left: ' + left.slice(0, 6).map(x => Number(x.slice(8))).join(', ') + (left.length > 6 ? ' …' : '') + '.'
        : '<i class="bi bi-check-circle"></i> The whole month is planned - you can submit it now.'}</small>`;
    btn.classList.remove('d-none'); btn.disabled = left.length > 0 || !(PLAN.days || []).length;
    btn.innerHTML = left.length ? `<i class="bi bi-send-check"></i> Submit (${left.length} day${left.length === 1 ? '' : 's'} left)` : '<i class="bi bi-send-check"></i> Submit for approval';
  }
  function calendar() {
    const first = new Date(Y, M - 1, 1), days = new Date(Y, M, 0).getDate(), lead = (first.getDay() + 6) % 7, today = todayStr();
    const byDate = {}; (PLAN.days || []).forEach(d => byDate[d.date] = d);
    let h = '';
    for (let i = 0; i < lead; i++) h += '<div class="tp-cell blank"></div>';
    for (let d = 1; d <= days; d++) {
      const ds = Y + '-' + pad(M) + '-' + pad(d), p = byDate[ds], hol = (PLAN.holidays || {})[ds] || [];
      const isHoliday = hol.some(x => x.kind === 'HOLIDAY'), isOff = !isHoliday && hol.length;
      const needs = PLAN.canEdit && ds >= today && !hol.length && !p;
      h += `<button type="button" class="tp-cell ${isHoliday ? 'hol' : isOff ? 'off' : ''} ${ds < today ? 'past' : ''} ${ds === today ? 'today' : ''} ${needs ? 'need' : ''}" onclick="dayOpen('${ds}')"><span class="n">${d}</span>
        ${hol.map(x => `<span class="h">${esc(x.name)}</span>`).join('')}
        ${p ? `<span class="t ${isField(p.worktypeCode) ? 'field' : ''}">${esc(wtName(p.worktypeCode))}</span>${p.areas.length ? `<span class="m">${p.areas.map(a => esc(a.name)).join(', ')}</span>` : ''}` : ''}</button>`;
    }
    document.getElementById('tpCal').innerHTML = h;
  }

  // ---------------- one day ----------------
  function dayOpen(ds) {
    const p = (PLAN.days || []).find(d => d.date === ds), hol = (PLAN.holidays || {})[ds] || [];
    const editable = PLAN.canEdit && ds >= todayStr();
    DAY = { date: ds, worktypeCode: p ? p.worktypeCode : '', areaIds: new Set(p ? p.areas.map(a => String(a.id)) : []),
      clients: new Map(p ? p.clients.map(c => [String(c.id), String(c.areaId)]) : []), visitWith: new Set(p ? p.visitWith.map(w => w.id) : []),
      stayAreaId: p && p.stayAreaId ? String(p.stayAreaId) : '', remark: p ? (p.remark || '') : '', existing: !!p, hol };
    if (!editable) return viewDay(p);
    if (!DAY.worktypeCode) { const w = OPT.workTypes.find(x => x.fieldWork) || OPT.workTypes[0]; DAY.worktypeCode = w ? w.code : ''; }
    dayForm(true);
  }
  function holBanner() {
    return DAY.hol.map(x => `<div class="alert ${x.kind === 'HOLIDAY' ? 'alert-danger' : 'alert-secondary'} py-2 small mb-2"><b><i class="bi bi-calendar-x"></i> ${esc(x.name)}</b>${x.remarks ? ' · ' + esc(x.remarks) : ''}</div>`).join('');
  }
  function viewDay(p) {
    let h = holBanner();
    if (!p) h += '<div class="ap-empty"><i class="bi bi-calendar-x fs-1"></i><div>Nothing planned for this day</div></div>';
    else {
      const kv = (l, v) => v ? `<div class="d-flex justify-content-between py-1 border-bottom"><span class="text-muted">${l}</span><b class="text-end ms-3">${v}</b></div>` : '';
      h += `<div class="ap-card">${kv('Work type', esc(wtName(p.worktypeCode)))}${kv('Remark', esc(p.remark))}${p.stayAreaId ? kv('Night stay', esc(areaOf(p.stayAreaId).name)) : ''}</div>`;
      p.areas.forEach(a => { const cs = p.clients.filter(c => String(c.areaId) === String(a.id));
        h += `<div class="ap-card"><div class="fw-bold"><i class="bi bi-geo-alt text-primary"></i> ${esc(a.name)} ${a.areaType ? `<span class="ap-badge">${esc(a.areaType)}</span>` : ''}</div>
          ${cs.length ? cs.map(c => `<div class="small py-1 border-bottom">${esc(c.name)} <span class="text-muted">${esc(c.code)}</span></div>`).join('') : '<small class="text-muted">No client picked - all clients of this area</small>'}</div>`; });
      if (p.visitWith.length) h += `<div class="ap-card"><div class="fw-bold mb-1"><i class="bi bi-people text-primary"></i> Visit with</div>${p.visitWith.map(w => `<div class="small py-1 border-bottom">${esc(w.name)}</div>`).join('')}</div>`;
    }
    sheetOpen(fmt(DAY.date), h, '<button class="ap-btn light" data-bs-dismiss="offcanvas">Close</button>');
  }
  function sheetOpen(title, body, foot) { document.getElementById('tpSheetTitle').textContent = title; document.getElementById('tpSheetBody').innerHTML = body; document.getElementById('tpSheetFoot').innerHTML = foot; SHEET.show(); }

  const KINDS = ['CLIENT', 'RETAILER', 'PARTY'];
  const kindLabel = (k) => ((OPT.clientTypes.find(t => t.dcrTab === k) || {}).label) || ((OPT.tabs.find(t => t.code === k) || {}).name) || k;
  const KOPEN = {};   // section key -> open / closed (kept while the form is re-drawn)

  // one collapsible box per area + kind: own search, own scroll, own counter - so 100 doctors never make the page long
  function kindSection(aid, k, list) {
    const key = aid + '_' + k, open = key in KOPEN ? KOPEN[key] : list.length <= 8;
    const sel = list.filter(c => DAY.clients.get(String(c.id)) === String(aid)).length;
    return `<div class="tp-kind" id="kd_${key}"><div class="hd" onclick="kToggle('${key}')"><i class="bi bi-chevron-${open ? 'down' : 'right'}" id="ki_${key}"></i><span class="flex-fill">${esc(kindLabel(k))}</span>
        <span class="ap-badge ${sel ? 'ok' : ''}" id="kc_${key}">${sel} / ${list.length}</span></div>
      <div class="bd ${open ? '' : 'd-none'}" id="kb_${key}">
        <div class="d-flex gap-2 align-items-center">
          <input class="form-control form-control-sm" id="kq_${key}" placeholder="Search ${esc(kindLabel(k)).toLowerCase()} (name or code)…" oninput="kFilter('${key}')">
          <label class="small text-nowrap d-flex align-items-center gap-1"><input type="checkbox" class="form-check-input" id="ks_${key}" onchange="kFilter('${key}')"> Selected</label></div>
        <div class="d-flex justify-content-between small mt-2"><a href="javascript:void(0)" onclick="kAll('${aid}','${k}',true)">Select all shown</a><a href="javascript:void(0)" onclick="kAll('${aid}','${k}',false)">Clear shown</a></div>
        <div class="box" id="kx_${key}">${list.map(c => `<label class="ap-row kr" data-n="${esc((c.name + ' ' + c.code).toLowerCase())}"><input type="checkbox" class="form-check-input" data-c="${c.id}" ${DAY.clients.get(String(c.id)) === String(aid) ? 'checked' : ''} onchange="dayClient('${c.id}','${aid}','${k}',this.checked)">
          <div class="grow">${esc(c.name)}<small>${esc(c.code)}${c.speciality ? ' · ' + esc(c.speciality) : ''}</small></div></label>`).join('')}<div class="ap-empty d-none" id="ke_${key}">No match</div></div>
      </div></div>`;
  }
  function kToggle(key) { const b = document.getElementById('kb_' + key), open = b.classList.contains('d-none'); KOPEN[key] = open; b.classList.toggle('d-none', !open); document.getElementById('ki_' + key).className = 'bi bi-chevron-' + (open ? 'down' : 'right'); }
  function kFilter(key) {
    const q = (document.getElementById('kq_' + key).value || '').toLowerCase(), only = document.getElementById('ks_' + key).checked; let n = 0;
    document.querySelectorAll('#kx_' + key + ' .kr').forEach(r => { const show = (!q || r.dataset.n.includes(q)) && (!only || r.querySelector('input').checked); r.style.display = show ? '' : 'none'; if (show) n++; });
    document.getElementById('ke_' + key).classList.toggle('d-none', n > 0);
  }
  function kCount(aid, k) {
    const key = aid + '_' + k, list = OPT.clients.filter(c => String(c.areaId) === String(aid) && c.dcrTab === k), sel = list.filter(c => DAY.clients.get(String(c.id)) === String(aid)).length, b = document.getElementById('kc_' + key);
    if (b) { b.textContent = sel + ' / ' + list.length; b.classList.toggle('ok', sel > 0); }
  }
  function dayClient(cid, aid, k, on) { on ? DAY.clients.set(String(cid), String(aid)) : DAY.clients.delete(String(cid)); kCount(aid, k); if (document.getElementById('ks_' + aid + '_' + k).checked) kFilter(aid + '_' + k); }
  function kAll(aid, k, on) {
    const key = aid + '_' + k;
    document.querySelectorAll('#kx_' + key + ' .kr').forEach(r => { if (r.style.display === 'none') return; const i = r.querySelector('input'); i.checked = on; on ? DAY.clients.set(String(i.dataset.c), String(aid)) : DAY.clients.delete(String(i.dataset.c)); });
    kCount(aid, k);
  }
  function areaFilter() {
    const q = (document.getElementById('aq').value || '').toLowerCase();
    document.querySelectorAll('#ax .ar').forEach(r => r.style.display = !q || r.dataset.n.includes(q) ? '' : 'none');
  }
  function dayForm(keepScroll) {
    const sb = document.getElementById('tpSheetBody'), top = keepScroll && sb ? sb.scrollTop : 0;
    const field = isField(DAY.worktypeCode);
    let h = holBanner();
    h += `<div class="ap-sec mt-0">Work type</div><div class="ap-chips scroll">${OPT.workTypes.map(w => `<button type="button" class="ap-chip ${DAY.worktypeCode === w.code ? 'on' : ''}" onclick="dayWork('${esc(w.code)}')">${esc(w.name)}</button>`).join('')}</div>`;
    if (field) {
      h += `<div class="ap-sec">Areas <span class="text-muted fw-normal">(${DAY.areaIds.size} selected)</span></div>
        ${OPT.areas.length > 6 ? '<input class="form-control mb-2" id="aq" placeholder="Search area…" oninput="areaFilter()">' : '<span id="aq" class="d-none"></span>'}
        <div class="ap-pick" id="ax">${OPT.areas.map(a => `<label class="ap-row ar" data-n="${esc(a.name.toLowerCase())}"><input type="checkbox" class="form-check-input" ${DAY.areaIds.has(String(a.id)) ? 'checked' : ''} onchange="dayArea('${a.id}', this.checked)">
        <div class="grow">${esc(a.name)}</div>${a.areaType ? `<span class="ap-badge">${esc(a.areaType)}</span>` : ''}</label>`).join('') || '<div class="ap-empty">You have no approved area</div>'}</div>`;
      [...DAY.areaIds].forEach(aid => {
        const a = areaOf(aid);
        h += `<div class="ap-card mt-3"><div class="fw-bold mb-1"><i class="bi bi-geo-alt text-primary"></i> ${esc(a.name)} ${a.areaType ? `<span class="ap-badge">${esc(a.areaType)}</span>` : ''}</div>`;
        let any = false;
        KINDS.forEach(k => { const list = OPT.clients.filter(c => String(c.areaId) === String(aid) && c.dcrTab === k); if (!list.length) return; any = true; h += kindSection(aid, k, list); });
        h += (any ? '<small class="text-muted d-block mt-2">Pick none = every client of this area is allowed in the DCR.</small>' : '<small class="text-muted">No client in this area.</small>') + '</div>';
      });
      const groups = [['MANAGER', 'Manager'], ['SENIOR', 'Seniors'], ['JUNIOR', 'Juniors']];
      h += '<div class="ap-sec">Visit with</div>' + (OPT.joint.length ? groups.map(([rel, name]) => { const l = OPT.joint.filter(j => j.relation === rel); return l.length ? `<div class="small fw-bold text-muted mt-2">${name}</div><div class="ap-pick" style="max-height:26vh">${l.map(j => `<label class="ap-row"><input type="checkbox" class="form-check-input" ${DAY.visitWith.has(j.id) ? 'checked' : ''} onchange="dayWith('${esc(j.id)}', this.checked)"><div class="grow">${esc(j.empName)} <span class="text-muted">(${esc(j.empCode)})</span><small>${esc(j.designation || '')}</small></div></label>`).join('')}</div>` : ''; }).join('') : '<div class="small text-muted">No manager, senior or junior found.</div>');
      h += `<div class="ap-sec">Night stay</div><select class="form-select" onchange="DAY.stayAreaId=this.value"><option value="">No night stay</option>${OPT.areas.map(a => `<option value="${a.id}" ${String(a.id) === DAY.stayAreaId ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>`;
    }
    h += `<div class="ap-sec">Remark</div><input class="form-control" maxlength="250" value="${esc(DAY.remark)}" oninput="DAY.remark=this.value">`;
    sheetOpen(fmt(DAY.date), h, `${DAY.existing ? '<button class="ap-btn danger" style="flex:0 0 auto" onclick="dayClear()" title="Take this day out of the plan"><i class="bi bi-trash"></i></button>' : ''}<button class="ap-btn light" data-bs-dismiss="offcanvas">Cancel</button><button class="ap-btn go" onclick="daySave()"><i class="bi bi-check2"></i> Save day</button>`);
    document.getElementById('tpSheetBody').scrollTop = top;
  }
  function dayWork(c) { DAY.worktypeCode = c; if (!isField(c)) { DAY.areaIds = new Set(); DAY.clients = new Map(); DAY.visitWith = new Set(); DAY.stayAreaId = ''; } dayForm(true); }
  function dayArea(id, on) { id = String(id); if (on) DAY.areaIds.add(id); else { DAY.areaIds.delete(id); [...DAY.clients].forEach(([c, a]) => { if (a === id) DAY.clients.delete(c); }); } dayForm(true); }
  function dayWith(id, on) { on ? DAY.visitWith.add(id) : DAY.visitWith.delete(id); }
  async function daySave() {
    try {
      await Api.post(EP.day, { date: DAY.date, worktypeCode: DAY.worktypeCode, areaIds: [...DAY.areaIds].map(Number), clients: [...DAY.clients].map(([c, a]) => ({ clientId: Number(c), areaId: Number(a) })),
        visitWith: [...DAY.visitWith], stayAreaId: DAY.stayAreaId ? Number(DAY.stayAreaId) : null, remark: DAY.remark });
      SHEET.hide(); await tpLoad(); SFA.toast('Day saved', true);
    } catch (e) { SFA.toast(e.message, false); }
  }
  async function dayClear() {
    if (!confirm('Take ' + DAY.date + ' out of the plan?')) return;
    try { await Api.del(EP.day + '?date=' + DAY.date); SHEET.hide(); await tpLoad(); SFA.toast('Day removed'); } catch (e) { SFA.toast(e.message, false); }
  }
  async function tpGoalSave() { try { await Api.post(EP.goal, { year: Y, month: M, goal: document.getElementById('tpGoal').value }); SFA.toast('Goal saved'); } catch (e) { SFA.toast(e.message, false); } }

  // ---------------- submit / approval ----------------
  async function tpSubmit() {
    if (!confirm('Submit the plan of ' + MONTHS[M - 1] + ' ' + Y + ' for approval? It cannot be changed after this.')) return;
    try { await Api.post(EP.submit, { year: Y, month: M }); await tpLoad(); SFA.toast('Tour plan submitted for approval', true); } catch (e) { SFA.toast(e.message, false); }
  }
  async function tpApprove() {
    if (!confirm('Approve the tour plan of ' + PLAN.empName + '?')) return;
    try { await Api.post(EP.approve(PLAN.tourMain), {}); await tpLoad(); teamPending(); SFA.toast('Approved', true); } catch (e) { SFA.toast(e.message, false); }
  }
  async function tpReject() {
    const reason = prompt('Reason for rejecting the plan of ' + PLAN.empName + ':'); if (!reason) return;
    try { await Api.post(EP.reject(PLAN.tourMain), { reason }); await tpLoad(); teamPending(); SFA.toast('Rejected'); } catch (e) { SFA.toast(e.message, false); }
  }
  function tpBack() { VIEW = null; tpTab('team'); }
  async function teamLoad() {
    const rows = await Api.get(EP.list, { query: { year: Y, month: M } });
    document.getElementById('tpTeamList').innerHTML = rows.map(r => { const st = ST_NAME[r.status] || [r.status, ''];
      return `<div class="ap-row" onclick="teamOpen('${esc(r.empId)}')"><div class="grow"><b>${esc(r.empName)}</b> <span class="text-muted">(${esc(r.empCode)})</span><small>${esc(r.designation || '')} · ${r.plannedDays} days planned</small></div>
        <span class="ap-badge ${st[1]}">${st[0]}</span>${r.canApprove ? '<span class="ap-badge bad">Action</span>' : ''}<i class="bi bi-chevron-right text-muted"></i></div>`; }).join('')
      || '<div class="ap-empty"><i class="bi bi-people fs-1"></i><div>No submitted plan for this month</div></div>';
    return rows;
  }
  function teamOpen(emp) { VIEW = emp; TAB = 'my'; document.querySelectorAll('#tpSeg button').forEach(b => b.classList.toggle('active', false)); tpLoad().catch(e => SFA.toast(e.message, false)); }
  async function teamPending() {
    try { const rows = await Api.get(EP.list, { query: { year: Y, month: M }, noLoader: true }); const n = rows.filter(r => r.canApprove).length, b = document.getElementById('tpPend'); b.textContent = n; b.classList.toggle('d-none', !n); } catch (e) { /* optional */ }
  }
</script>
</body>
</html>
