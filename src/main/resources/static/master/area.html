<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Area</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="area" data-title="Area Master"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-geo-alt"></i> Areas
      <div class="card-tools d-flex gap-2 align-items-center">
        <select class="form-select form-select-sm" id="areaFilter" style="width:190px" data-no-search onchange="render()">
          <option value="">All areas</option><option value="mine">Waiting for my approval</option><option value="pending">Waiting for approval</option>
          <option value="rejected">Rejected</option><option value="delete">Delete requested</option><option value="active">Active</option><option value="inactive">Inactive</option>
        </select>
        <button data-perm="AREA_SAVE" class="btn btn-sm btn-primary" onclick="areaAdd()"><i class="bi bi-plus-lg"></i> Add Single</button>
        <button data-perm="AREA_SAVE" class="btn btn-sm btn-outline-primary" onclick="areaMultiAdd()"><i class="bi bi-plus-square"></i> Add Multiple</button>
        <button data-perm="AREA_UPLOAD" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#areaUploadModal"><i class="bi bi-upload"></i> Bulk Upload</button>
      </div>
    </div>
    <div class="card-body">
      <p class="text-muted small" id="areaNote">You see your own areas; a manager also sees his team's, an admin all.
        A new area stays inactive and a delete request keeps the area active until approved (Settings &gt; General &gt; Area approval). Nobody approves his own request.</p>
      <div class="table-responsive">
        <table data-screen-key="AREA_MASTER" id="areaTable" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr>
            <th>S.No</th><th data-field="code">Code</th><th data-field="name">Name</th><th data-field="employee">Employee</th><th data-field="city">City</th>
            <th data-field="state">State</th><th data-field="hq">HQ</th><th data-field="pincode">Pincode</th><th data-field="type">Type</th><th data-field="routes">Routes</th>
            <th data-field="approval">Approval</th><th data-field="status">Status</th><th class="no-export">Actions</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="areaModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="areaSave(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="areaModalTitle">Add Area</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <input type="hidden" id="a_oid" />
        <div class="col-12"><div class="alert alert-warning py-2 small d-none mb-0" id="a_statusNote"></div></div>
        <div class="col-md-4"><label class="form-label">Area Code <span class="required-star">*</span></label>
          <input class="form-control" id="a_areaCode" required maxlength="40" /></div>
        <div class="col-md-8"><label class="form-label">Area Name <span class="required-star">*</span></label>
          <input class="form-control" id="a_areaName" required maxlength="150" /></div>
        <div class="col-md-6 a-admin-only"><label class="form-label">Employee</label>
          <select class="form-select" id="a_empId"></select></div>
        <div class="col-md-6 a-self-only"><label class="form-label">Employee</label>
          <input class="form-control" id="a_empSelf" disabled /></div>
        <div class="col-md-6"><label class="form-label">City</label>
          <input class="form-control" id="a_city" maxlength="120" /></div>
        <div class="col-md-4"><label class="form-label">State</label>
          <select class="form-select" id="a_stateOid"></select></div>
        <div class="col-md-4"><label class="form-label">HQ</label>
          <select class="form-select" id="a_hqOid"></select></div>
        <div class="col-md-4"><label class="form-label">Pincode</label>
          <input class="form-control" id="a_pincode" maxlength="12" /></div>
        <div class="col-md-6"><label class="form-label">Area Type</label>
          <input class="form-control" id="a_areaType" maxlength="30" placeholder="Core / Metro" /></div>
        <div class="col-md-6"><label class="form-label">Distance (km)</label>
          <input class="form-control" id="a_distanceKm" type="number" step="0.01" /></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>

  <!-- Add Multiple -->
  <div class="modal fade" id="areaMultiModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="areaSaveMultiple(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title">Add Multiple &middot; Areas</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="row mb-3 a-admin-only"><div class="col-md-6"><label class="form-label">Employee (for all rows)</label>
          <select class="form-select" id="am_empId"></select></div></div>
        <table class="table table-bordered multi-row-table" id="areaMultiTable">
          <thead><tr><th style="width:40px">#</th><th>Code *</th><th>Name *</th><th>City</th><th>HQ</th><th>Pincode</th><th style="width:60px"></th></tr></thead>
          <tbody>
            <tr>
              <td class="row-sno">1</td>
              <td><input class="form-control" name="areaCode" maxlength="40" /></td>
              <td><input class="form-control" name="areaName" maxlength="150" /></td>
              <td><input class="form-control" name="city" maxlength="120" /></td>
              <td><select class="form-select" name="hqOid" data-lk="hqs"></select></td>
              <td><input class="form-control" name="pincode" maxlength="12" /></td>
              <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="sfaRemoveRow(this,'areaMultiTable')"><i class="bi bi-x"></i></button></td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="sfaAddRow('areaMultiTable')"><i class="bi bi-plus"></i> Add Row</button>
        <div id="areaMultiResult" class="mt-2 small text-danger"></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>

  <!-- Bulk Upload -->
  <div class="modal fade" id="areaUploadModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="areaUpload(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title">Bulk Upload &middot; Areas</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <p class="text-muted small">Existing rows (matched by <b>area_code</b>, only your own / team's) are updated; new codes are added and go for approval.
          <span class="a-admin-only"><code>emp_code</code> = whose area (admin only; others always add for themselves).</span></p>
        <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="Api.download(API.master.area.template,'area_template.xlsx')">
          <i class="bi bi-download"></i> Download Template</button>
        <input type="file" class="form-control" id="areaFile" name="file" accept=".xlsx,.xls" required />
        <div id="areaUploadResult" class="mt-3 small text-danger"></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-accent">Upload</button></div>
    </form>
  </div></div>

  <!-- Approval history -->
  <div class="modal fade" id="areaHistModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-lg-down">
    <div class="modal-content">
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="areaHistTitle">Approval history</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="areaHistBody"></div>
    </div>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null, MULTI = null, LK = {}, OPT = { pickEmployee: false, employees: [] }, ROWS = [];
  const EP = API.master.area;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  const STEP = { PENDING_MANAGER: 'Manager', PENDING_ADMIN: 'Admin' };

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#areaModal');
    MULTI = new bootstrap.Modal('#areaMultiModal');
    try {
      [LK, OPT] = await Promise.all([Api.get(API.lookups), Api.get(EP.options)]);
      SFA.fillSelect(document.getElementById('a_stateOid'), LK.states);
      SFA.fillSelect(document.getElementById('a_hqOid'), LK.hqs);
      SFA.fillSelect(document.getElementById('a_empId'), OPT.employees);
      SFA.fillSelect(document.getElementById('am_empId'), OPT.employees);
      document.querySelectorAll('.a-admin-only').forEach(el => el.classList.toggle('d-none', !OPT.pickEmployee));
      document.querySelectorAll('.a-self-only').forEach(el => el.classList.toggle('d-none', OPT.pickEmployee));
      const flow = { AUTO: 'approved at once', MANAGER: 'approved by the employee\'s manager', ADMIN: 'approved by an admin',
        MANAGER_ADMIN: 'approved by the employee\'s manager, then finally by an admin' }[OPT.approvalFlow];
      if (flow) document.getElementById('areaNote').textContent = 'You see your own areas; a manager also sees his team\'s, an admin all. '
        + 'New areas and delete requests are ' + flow + ' (Settings > General > Area approval). A new area stays inactive until approved; nobody approves his own request.';
      await reload();
    } catch (e) { SFA.toast(e.message, false); }
  };

  async function reload() {
    ROWS = await Api.get(EP.list);
    render();
  }

  function approvalBadge(r) {
    const del = r.deleteRequested && STEP[r.deleteStatus]
      ? ` <span class="badge bg-danger" title="${esc((r.deleteRequestedByName ? r.deleteRequestedByName + ': ' : '') + (r.deleteRequestReason || ''))}">Delete pending · ${STEP[r.deleteStatus]}</span>`
      : r.deleteStatus === 'REJECTED' && r.status === 'Y' ? ' <span class="badge bg-light text-dark border" title="The last delete request was rejected">Delete rejected</span>' : '';
    switch (r.approvalStatus) {
      case 'APPROVED': return `<span class="badge badge-active" title="${esc('Approved by ' + (r.approvedByName || '-'))}">Approved</span>` + del;
      case 'PENDING_ADMIN': return `<span class="badge bg-info text-dark" title="${esc(r.managerApprovedByName ? 'Manager: ' + r.managerApprovedByName : '')}">Add pending · Admin</span>` + del;
      case 'REJECTED': return `<span class="badge bg-secondary" title="${esc((r.rejectedByName || '') + ': ' + (r.rejectReason || ''))}">Rejected</span>` + del;
      default: return '<span class="badge bg-warning text-dark">Add pending · Manager</span>' + del;
    }
  }

  function render() {
    const f = document.getElementById('areaFilter').value;
    const rows = ROWS.filter(r => !f || (f === 'mine' && r.canApprove) || (f === 'pending' && !!r.pendingRequest)
      || (f === 'rejected' && r.approvalStatus === 'REJECTED') || (f === 'delete' && r.deleteRequested)
      || (f === 'active' && r.status === 'Y') || (f === 'inactive' && r.status !== 'Y'));
    if (DT) { DT.destroy(); }
    document.querySelector('#areaTable tbody').innerHTML = rows.map((r, i) => `
      <tr>
        <td>${i + 1}</td><td>${esc(r.areaCode)}</td><td>${esc(r.areaName)}</td><td>${esc(r.empName)}</td>
        <td>${esc(r.city)}</td><td>${esc(r.stateName)}</td><td>${esc(r.hqName)}</td>
        <td>${esc(r.pincode)}</td><td>${esc(r.areaType)}</td><td>${esc(r.routes)}</td>
        <td>${approvalBadge(r)}</td><td>${SFA.statusBadge(r.status)}</td>
        <td class="no-export">
          <button data-perm="AREA_SAVE" class="btn btn-sm btn-outline-primary" title="Edit" onclick="areaEdit(${r.oid})"><i class="bi bi-pencil"></i></button>
          ${r.canApprove && r.pendingRequest === 'ADD' ? `<button class="btn btn-sm btn-outline-success" title="Approve new area" onclick="areaApprove(${r.oid})"><i class="bi bi-patch-check"></i></button>
            <button class="btn btn-sm btn-outline-danger" title="Reject new area" onclick="areaReject(${r.oid})"><i class="bi bi-hand-thumbs-down"></i></button>` : ''}
          ${r.canApprove && r.pendingRequest === 'DELETE' ? `<button class="btn btn-sm btn-danger" title="Approve delete request" onclick="areaApprove(${r.oid})"><i class="bi bi-trash"></i></button>
            <button class="btn btn-sm btn-outline-secondary" title="Reject delete request" onclick="areaReject(${r.oid})"><i class="bi bi-x-circle"></i></button>` : ''}
          <button class="btn btn-sm btn-outline-info" title="Approval history" onclick="areaHistory(${r.oid})"><i class="bi bi-clock-history"></i></button>
          ${r.status === 'Y' && !r.deleteRequested ? `<button data-perm="AREA_DELETE" class="btn btn-sm btn-outline-warning" title="Request delete" onclick="areaRequestDelete(${r.oid})"><i class="bi bi-flag"></i></button>` : ''}
          ${r.status === 'Y'
            ? `<button data-perm="AREA_STATUS" class="btn btn-sm btn-outline-danger" title="Deactivate" onclick="areaStatus(${r.oid},'N')"><i class="bi bi-slash-circle"></i></button>`
            : r.approvalStatus !== 'APPROVED' ? '' : `<button data-perm="AREA_STATUS" class="btn btn-sm btn-outline-success" title="Activate" onclick="areaStatus(${r.oid},'Y')"><i class="bi bi-check-circle"></i></button>`}
        </td>
      </tr>`).join('');
    DT = sfaDataTable('#areaTable');
  }

  function fillForm(r) {
    document.getElementById('a_oid').value = r.oid || '';
    document.getElementById('a_areaCode').value = r.areaCode || '';
    document.getElementById('a_areaName').value = r.areaName || '';
    document.getElementById('a_empId').value = r.empId || '';
    document.getElementById('a_empSelf').value = r.oid ? (r.empName || '') : (OPT.meName || '');
    document.getElementById('a_city').value = r.city || '';
    document.getElementById('a_stateOid').value = r.stateOid || '';
    document.getElementById('a_hqOid').value = r.hqOid || '';
    document.getElementById('a_pincode').value = r.pincode || '';
    document.getElementById('a_areaType').value = r.areaType || '';
    document.getElementById('a_distanceKm').value = r.distanceKm == null ? '' : r.distanceKm;
    ['a_empId', 'a_stateOid', 'a_hqOid'].forEach(id => { const el = document.getElementById(id); if (window.$ && $(el).data('select2')) $(el).trigger('change'); });
    const note = document.getElementById('a_statusNote');
    note.textContent = !r.oid ? '' : r.approvalStatus === 'REJECTED'
      ? 'Rejected by ' + (r.rejectedByName || '') + ': ' + (r.rejectReason || '') + ' — saving sends it for approval again.'
      : STEP[r.approvalStatus] ? 'New area: waiting for the ' + STEP[r.approvalStatus].toLowerCase() + '\'s approval (inactive till approved).'
      : r.deleteRequested ? 'Delete requested: ' + (r.deleteRequestReason || '') + ' — waiting for the ' + (STEP[r.deleteStatus] || '').toLowerCase() + '\'s approval.' : '';
    note.classList.toggle('d-none', !note.textContent);
  }
  function areaAdd() {
    fillForm({});
    document.getElementById('areaModalTitle').textContent = 'Add Area';
    MODAL.show();
  }
  function areaEdit(oid) {
    const r = ROWS.find(x => x.oid === oid);
    if (!r) return;
    fillForm(r);
    document.getElementById('areaModalTitle').textContent = 'Edit Area';
    MODAL.show();
  }
  async function areaSave(ev) {
    ev.preventDefault();
    const v = id => { const x = document.getElementById(id).value.trim(); return x === '' ? null : x; };
    const body = {
      oid: v('a_oid'), areaCode: v('a_areaCode'), areaName: v('a_areaName'), city: v('a_city'),
      stateOid: v('a_stateOid'), hqOid: v('a_hqOid'), pincode: v('a_pincode'),
      areaType: v('a_areaType'), distanceKm: v('a_distanceKm'), empId: OPT.pickEmployee ? v('a_empId') : null
    };
    try {
      const saved = await Api.post(EP.save, body);
      MODAL.hide(); await reload();
      const wait = { PENDING_MANAGER: ' — inactive till the manager approves', PENDING_ADMIN: ' — inactive till the admin approves' }[saved.approvalStatus] || '';
      SFA.toast('Area ' + saved.areaCode + (body.oid ? ' updated' : ' added') + wait, wait ? 'info' : true);
    } catch (e) { SFA.toast(e.message, false); }
  }
  async function act(fn, ok) {
    try { await fn(); await reload(); if (ok) SFA.toast(ok); } catch (e) { SFA.toast(e.message, false); }
  }
  function areaStatus(oid, status) {
    if (!confirm(status === 'N' ? 'Deactivate this area?' : 'Activate this area?')) return;
    act(() => Api.post(EP.status(oid), null, { query: { status } }), status === 'N' ? 'Area deactivated' : 'Area activated');
  }
  const DONE = { ADD: 'New area approved — it is active now', DELETE: 'Delete request approved — area deactivated' };
  function areaApprove(oid) {
    const row = ROWS.find(x => x.oid === oid) || {};
    const req = row.pendingRequest;
    if (req === 'DELETE' && !confirm('Approve the delete request of ' + (row.areaName || 'this area') + '?')) return;
    act(async () => {
      const r = await Api.post(EP.approve(oid));
      const final = req === 'DELETE' ? !r.deleteRequested : r.approvalStatus === 'APPROVED';
      SFA.toast(final ? DONE[req] : 'Approved — now waiting for the admin\'s final approval', final ? true : 'info');
    });
  }
  function areaReject(oid) {
    const row = ROWS.find(x => x.oid === oid) || {};
    const del = row.pendingRequest === 'DELETE';
    const reason = prompt(del ? 'Why is the delete request rejected? (the area stays active)' : 'Why is this area rejected? (the creator sees this and can correct it)');
    if (reason === null) return;
    if (!reason.trim()) { SFA.toast('Please give the reason', false); return; }
    act(() => Api.post(EP.reject(oid), { reason: reason.trim() }), del ? 'Delete request rejected — area stays active' : 'Area rejected');
  }
  function areaRequestDelete(oid) {
    const reason = prompt('Why should this area be deleted? (it stays active until the request is approved)');
    if (reason === null) return;
    if (!reason.trim()) { SFA.toast('Please give the reason', false); return; }
    act(async () => {
      const r = await Api.post(EP.deleteRequest(oid), { reason: reason.trim() });
      SFA.toast(r.status !== 'Y' ? 'Area deactivated' : 'Delete request sent — waiting for the ' + (r.deleteStatus === 'PENDING_ADMIN' ? 'admin' : 'manager') + '\'s approval', r.status !== 'Y' ? true : 'info');
    });
  }
  const ACTION = { REQUESTED: ['Requested', 'bg-primary'], APPROVED: ['Approved', 'bg-success'], REJECTED: ['Rejected', 'bg-danger'] };
  async function areaHistory(oid) {
    const row = ROWS.find(x => x.oid === oid) || {};
    document.getElementById('areaHistTitle').textContent = 'Approval history · ' + (row.areaCode || '') + ' ' + (row.areaName || '');
    const body = document.getElementById('areaHistBody');
    body.innerHTML = '<div class="text-muted">Loading…</div>';
    bootstrap.Modal.getOrCreateInstance(document.getElementById('areaHistModal')).show();
    try {
      const list = await Api.get(EP.approvals(oid));
      body.innerHTML = !list.length ? '<div class="text-muted">No approval history (area made before the approval log).</div>' : `
        <div class="table-responsive"><table class="table table-sm table-bordered align-middle mb-0">
          <thead><tr><th>When</th><th>Request</th><th>Step</th><th>Action</th><th>By</th><th>Designation</th><th>Level / Role</th><th>Status after</th><th>Remarks</th></tr></thead>
          <tbody>${list.map(a => `<tr>
            <td class="text-nowrap">${esc((a.actionAt || '').replace('T', ' ').slice(0, 19))}</td>
            <td>${a.requestType === 'DELETE' ? 'Delete' : 'Add'}</td><td>${esc(a.step)}</td>
            <td><span class="badge ${(ACTION[a.action] || [0, 'bg-secondary'])[1]}">${esc((ACTION[a.action] || [a.action])[0])}</span></td>
            <td>${esc(a.empName || a.empId)}${a.empCode ? ' <small class="text-muted">(' + esc(a.empCode) + ')</small>' : ''}</td>
            <td>${esc(a.designationName)}</td><td>${a.hierarchyLevel != null ? esc(a.hierarchyLevel) + ' / ' : ''}${esc(a.role)}</td>
            <td>${esc(a.statusAfter)}</td><td>${esc(a.remarks)}</td></tr>`).join('')}</tbody></table></div>`;
    } catch (e) { body.innerHTML = '<div class="text-danger">' + esc(e.message) + '</div>'; }
  }

  // ---- Add Multiple ----
  function areaMultiAdd() {
    const tb = document.querySelector('#areaMultiTable tbody');
    const rows = tb.querySelectorAll('tr');
    for (let i = rows.length - 1; i > 0; i--) rows[i].remove();
    const first = tb.querySelector('tr');
    first.querySelectorAll('input').forEach(x => x.value = '');
    first.querySelectorAll('select[data-lk]').forEach(sel => SFA.fillSelect(sel, LK[sel.getAttribute('data-lk')]));
    document.getElementById('areaMultiResult').innerHTML = '';
    MULTI.show();
  }
  async function areaSaveMultiple(ev) {
    ev.preventDefault();
    const rows = collectRows('areaMultiTable', ['areaCode', 'areaName', 'city', 'hqOid', 'pincode']);
    if (!rows.length) { SFA.toast('No rows to save', false); return; }
    const emp = OPT.pickEmployee ? (document.getElementById('am_empId').value || null) : null;
    rows.forEach(r => r.empId = emp);
    try {
      const res = await Api.post(EP.saveMultiple, rows);
      await reload();
      if (res.skipped) {
        document.getElementById('areaMultiResult').innerHTML = (res.errors || []).map(e => esc(e)).join('<br>');
        SFA.toast(res.saved + ' saved, ' + res.skipped + ' skipped', false);
      } else { MULTI.hide(); SFA.toast(res.saved + ' saved'); }
    } catch (e) { SFA.toast(e.message, false); }
  }
  // ---- Bulk Upload ----
  async function areaUpload(ev) {
    ev.preventDefault();
    const f = document.getElementById('areaFile').files[0];
    if (!f) { SFA.toast('Choose a file', false); return; }
    const fd = new FormData(); fd.append('file', f);
    const out = document.getElementById('areaUploadResult');
    out.innerHTML = '';
    try {
      const res = await Api.post(EP.upload, fd);
      document.getElementById('areaFile').value = '';
      await reload();
      SFA.toast('Upload: ' + res.inserted + ' added, ' + res.updated + ' updated, ' + res.skipped + ' skipped', !res.skipped);
      if (res.errors && res.errors.length) out.innerHTML = res.errors.map(e => esc(e)).join('<br>');
      else bootstrap.Modal.getInstance(document.getElementById('areaUploadModal')).hide();
    } catch (e) { SFA.toast(e.message, false); }
  }
  function collectRows(tableId, fields) {
    const rows = [];
    document.querySelectorAll('#' + tableId + ' tbody tr').forEach(tr => {
      const o = {}; let any = false;
      fields.forEach(f => {
        const el = tr.querySelector('[name="' + f + '"]');
        const val = el ? String(el.value).trim() : '';
        o[f] = val === '' ? null : val;
        if (val) any = true;
      });
      if (any) rows.push(o);
    });
    return rows;
  }
</script>
