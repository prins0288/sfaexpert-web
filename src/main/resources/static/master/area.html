<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Area</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        d.setAttribute('data-theme', s.getItem('sfa_mode') || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav') || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density') || 'comfortable');
        var f = s.getItem('sfa_font'); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme');
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="area" data-title="Area Master"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-geo-alt"></i> Areas
      <div class="card-tools">
        <button class="btn btn-sm btn-primary" onclick="areaAdd()"><i class="bi bi-plus-lg"></i> Add Single</button>
        <button class="btn btn-sm btn-outline-primary" onclick="areaMultiAdd()"><i class="bi bi-plus-square"></i> Add Multiple</button>
        <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#areaUploadModal"><i class="bi bi-upload"></i> Bulk Upload</button>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table id="areaTable" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr>
            <th>S.No</th><th>Code</th><th>Name</th><th>City</th><th>State</th><th>HQ</th>
            <th>Pincode</th><th>Type</th><th>Routes</th><th>Status</th><th class="no-export">Actions</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="areaModal" tabindex="-1"><div class="modal-dialog modal-lg">
    <form class="modal-content" onsubmit="areaSave(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="areaModalTitle">Add Area</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <input type="hidden" id="a_oid" />
        <div class="col-md-4"><label class="form-label">Area Code <span class="required-star">*</span></label>
          <input class="form-control" id="a_areaCode" required /></div>
        <div class="col-md-8"><label class="form-label">Area Name <span class="required-star">*</span></label>
          <input class="form-control" id="a_areaName" required /></div>
        <div class="col-md-4"><label class="form-label">City</label>
          <input class="form-control" id="a_city" /></div>
        <div class="col-md-4"><label class="form-label">State</label>
          <select class="form-select" id="a_stateOid"></select></div>
        <div class="col-md-4"><label class="form-label">HQ</label>
          <select class="form-select" id="a_hqOid"></select></div>
        <div class="col-md-4"><label class="form-label">Pincode</label>
          <input class="form-control" id="a_pincode" /></div>
        <div class="col-md-4"><label class="form-label">Area Type</label>
          <input class="form-control" id="a_areaType" placeholder="Core / Metro" /></div>
        <div class="col-md-4"><label class="form-label">Distance (km)</label>
          <input class="form-control" id="a_distanceKm" type="number" step="0.01" /></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>

  <!-- Add Multiple -->
  <div class="modal fade" id="areaMultiModal" tabindex="-1"><div class="modal-dialog modal-xl">
    <form class="modal-content" onsubmit="areaSaveMultiple(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title">Add Multiple &middot; Areas</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <table class="table table-bordered multi-row-table" id="areaMultiTable">
          <thead><tr><th style="width:40px">#</th><th>Code *</th><th>Name *</th><th>City</th><th>HQ</th><th>Pincode</th><th style="width:60px"></th></tr></thead>
          <tbody>
            <tr>
              <td class="row-sno">1</td>
              <td><input class="form-control" name="areaCode" /></td>
              <td><input class="form-control" name="areaName" /></td>
              <td><input class="form-control" name="city" /></td>
              <td><select class="form-select" name="hqOid" data-lk="hqs"></select></td>
              <td><input class="form-control" name="pincode" /></td>
              <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="sfaRemoveRow(this,'areaMultiTable')"><i class="bi bi-x"></i></button></td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="sfaAddRow('areaMultiTable')"><i class="bi bi-plus"></i> Add Row</button>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>

  <!-- Bulk Upload -->
  <div class="modal fade" id="areaUploadModal" tabindex="-1"><div class="modal-dialog">
    <form class="modal-content" onsubmit="areaUpload(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title">Bulk Upload &middot; Areas</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <p class="text-muted small">Existing rows (matched by <b>area_code</b>) are updated; new codes inserted.</p>
        <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="Api.download(API.master.area.template,'area_template.xlsx')">
          <i class="bi bi-download"></i> Download Template</button>
        <input type="file" class="form-control" id="areaFile" name="file" accept=".xlsx,.xls" required />
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-accent">Upload</button></div>
    </form>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="/js/core/session.js"></script>
<script src="/js/core/endpoints.js"></script>
<script src="/js/core/http.js"></script>
<script src="/js/core/theme.js"></script>
<script src="/js/app.js"></script>
<script src="/js/shell.js"></script>
<script>
  let DT = null, MODAL = null, MULTI = null, LK = {};

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#areaModal');
    MULTI = new bootstrap.Modal('#areaMultiModal');
    try {
      LK = await Api.get(API.lookups);
      SFA.fillSelect(document.getElementById('a_stateOid'), LK.states);
      SFA.fillSelect(document.getElementById('a_hqOid'), LK.hqs);
      await reload();
    } catch (e) { SFA.toast(e.message, false); }
  };

  async function reload() {
    const rows = await Api.get(API.master.area.list);
    if (DT) { DT.destroy(); }
    document.querySelector('#areaTable tbody').innerHTML = rows.map((r, i) => `
      <tr>
        <td>${i + 1}</td><td>${SFA.esc(r.areaCode)}</td><td>${SFA.esc(r.areaName)}</td>
        <td>${SFA.esc(r.city)}</td><td>${SFA.esc(r.stateName)}</td><td>${SFA.esc(r.hqName)}</td>
        <td>${SFA.esc(r.pincode)}</td><td>${SFA.esc(r.areaType)}</td><td>${SFA.esc(r.routes)}</td>
        <td>${SFA.statusBadge(r.status)}</td>
        <td class="no-export">
          <button class="btn btn-sm btn-outline-primary" onclick='areaEdit(${JSON.stringify(r)})'><i class="bi bi-pencil"></i></button>
          ${r.status === 'Y'
            ? `<button class="btn btn-sm btn-outline-danger" onclick="areaStatus(${r.oid},'N')"><i class="bi bi-slash-circle"></i></button>`
            : `<button class="btn btn-sm btn-outline-success" onclick="areaStatus(${r.oid},'Y')"><i class="bi bi-check-circle"></i></button>`}
        </td>
      </tr>`).join('');
    DT = sfaDataTable('#areaTable');
  }

  function areaAdd() {
    ['a_oid','a_areaCode','a_areaName','a_city','a_pincode','a_areaType','a_distanceKm'].forEach(id => document.getElementById(id).value = '');
    ['a_stateOid','a_hqOid'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('areaModalTitle').textContent = 'Add Area';
    MODAL.show();
  }
  function areaEdit(r) {
    document.getElementById('a_oid').value = r.oid;
    document.getElementById('a_areaCode').value = r.areaCode || '';
    document.getElementById('a_areaName').value = r.areaName || '';
    document.getElementById('a_city').value = r.city || '';
    document.getElementById('a_stateOid').value = r.stateOid || '';
    document.getElementById('a_hqOid').value = r.hqOid || '';
    document.getElementById('a_pincode').value = r.pincode || '';
    document.getElementById('a_areaType').value = r.areaType || '';
    document.getElementById('a_distanceKm').value = r.distanceKm == null ? '' : r.distanceKm;
    document.getElementById('areaModalTitle').textContent = 'Edit Area';
    MODAL.show();
  }
  async function areaSave(ev) {
    ev.preventDefault();
    const v = id => { const x = document.getElementById(id).value; return x === '' ? null : x; };
    const body = {
      oid: v('a_oid'), areaCode: v('a_areaCode'), areaName: v('a_areaName'), city: v('a_city'),
      stateOid: v('a_stateOid'), hqOid: v('a_hqOid'), pincode: v('a_pincode'),
      areaType: v('a_areaType'), distanceKm: v('a_distanceKm')
    };
    try { await Api.post(API.master.area.save, body); MODAL.hide(); await reload(); SFA.toast('Saved'); }
    catch (e) { SFA.toast(e.message, false); }
  }
  async function areaStatus(oid, status) {
    if (!confirm(status === 'N' ? 'Deactivate this area?' : 'Activate this area?')) return;
    try { await Api.post(API.master.area.status(oid), null, { query: { status } }); await reload(); }
    catch (e) { SFA.toast(e.message, false); }
  }

  // ---- Add Multiple ----
  function areaMultiAdd() {
    const tb = document.querySelector('#areaMultiTable tbody');
    const rows = tb.querySelectorAll('tr');
    for (let i = rows.length - 1; i > 0; i--) rows[i].remove();
    const first = tb.querySelector('tr');
    first.querySelectorAll('input').forEach(x => x.value = '');
    first.querySelectorAll('select[data-lk]').forEach(sel => SFA.fillSelect(sel, LK[sel.getAttribute('data-lk')]));
    MULTI.show();
  }
  async function areaSaveMultiple(ev) {
    ev.preventDefault();
    const rows = collectRows('areaMultiTable', ['areaCode', 'areaName', 'city', 'hqOid', 'pincode']);
    if (!rows.length) { SFA.toast('No rows to save', false); return; }
    try {
      const res = await Api.post(API.master.area.saveMultiple, rows);
      MULTI.hide(); await reload(); SFA.toast(res.saved + ' saved' + (res.skipped ? ', ' + res.skipped + ' skipped' : ''));
    } catch (e) { SFA.toast(e.message, false); }
  }

  // ---- Bulk Upload ----
  async function areaUpload(ev) {
    ev.preventDefault();
    const f = document.getElementById('areaFile').files[0];
    if (!f) { SFA.toast('Choose a file', false); return; }
    const fd = new FormData(); fd.append('file', f);
    try {
      const res = await Api.post(API.master.area.upload, fd);
      bootstrap.Modal.getInstance(document.getElementById('areaUploadModal')).hide();
      document.getElementById('areaFile').value = '';
      await reload();
      SFA.toast('Upload: ' + res.inserted + ' inserted, ' + res.updated + ' updated, ' + res.skipped + ' skipped');
    } catch (e) { SFA.toast(e.message, false); }
  }

  function collectRows(tableId, fields) {
    const rows = [];
    document.querySelectorAll('#' + tableId + ' tbody tr').forEach(tr => {
      const o = {}; let any = false;
      fields.forEach(f => {
        const el = tr.querySelector('[name="' + f + '"]');
        const val = el ? String(el.value).trim() : '';
        o[f] = val === '' ? null : val;
        if (val) any = true;
      });
      if (any) rows.push(o);
    });
    return rows;
  }
</script>
</body>
</html>
