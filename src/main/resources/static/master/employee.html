<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Employee</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="employee" data-title="Employee Master"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-person-badge"></i> Employees
      <div class="card-tools">
        <button class="btn btn-sm btn-primary" onclick="empAdd()"><i class="bi bi-plus-lg"></i> Add Employee</button>
      </div>
    </div>
    <div class="card-body">
      <p class="text-muted small mb-2">Adding an employee also creates a login (username + password) in the common DB, so they can sign in immediately.</p>
      <div class="table-responsive">
        <table id="empTable" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr>
            <th>S.No</th><th>Emp ID</th><th>Name</th><th>Username</th><th>Role</th>
            <th>Designation</th><th>State</th><th>District</th><th>DOB</th><th>Mobile</th>
            <th>Login</th><th>Status</th><th class="no-export">Actions</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="empModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="empSave(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="empModalTitle">Add Employee</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <input type="hidden" id="e_oid" />
        <div class="col-md-4"><label class="form-label">Name <span class="required-star">*</span></label>
          <input class="form-control" id="e_name" required /></div>
        <div class="col-md-4"><label class="form-label">Username <span class="required-star">*</span></label>
          <input class="form-control" id="e_username" required autocomplete="off" /></div>
        <div class="col-md-4"><label class="form-label">Password <span class="required-star" id="e_pwStar">*</span>
          <small class="text-muted" id="e_pwHint"></small></label>
          <input class="form-control" id="e_password" type="text" autocomplete="new-password" /></div>

        <div class="col-md-4"><label class="form-label">Role</label>
          <select class="form-select" id="e_role">
            <option value="USER">USER</option><option value="MANAGER">MANAGER</option><option value="ADMIN">ADMIN</option>
          </select></div>
        <div class="col-md-4"><label class="form-label">Designation</label>
          <select class="form-select" id="e_designationOid"></select></div>
        <div class="col-md-4"><label class="form-label">DOB</label>
          <input class="form-control sfa-date" id="e_dob" type="text" /></div>

        <div class="col-md-4"><label class="form-label">State</label>
          <select class="form-select" id="e_stateOid"></select></div>
        <div class="col-md-4"><label class="form-label">District</label>
          <select class="form-select" id="e_districtOid"></select></div>
        <div class="col-md-4"><label class="form-label">Mobile</label>
          <input class="form-control" id="e_mobile" /></div>

        <div class="col-md-6"><label class="form-label">Email</label>
          <input class="form-control" id="e_email" type="email" /></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null, LK = {};

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#empModal');
    try {
      LK = await Api.get(API.lookups);
      SFA.fillSelect(document.getElementById('e_designationOid'), LK.designations);
      SFA.fillSelect(document.getElementById('e_stateOid'), LK.states);
      SFA.fillSelect(document.getElementById('e_districtOid'), LK.districts);
      await reload();
    } catch (e) { SFA.toast(e.message, false); }
  };

  async function reload() {
    const rows = await Api.get(API.master.employee.list);
    if (DT) { DT.destroy(); }
    document.querySelector('#empTable tbody').innerHTML = rows.map((r, i) => `
      <tr>
        <td>${i + 1}</td><td>${SFA.esc(r.empId)}</td><td>${SFA.esc(r.name)}</td>
        <td>${SFA.esc(r.username)}</td>
        <td>${r.role ? '<span class="badge bg-secondary">' + SFA.esc(r.role) + '</span>' : ''}</td>
        <td>${SFA.esc(r.designation)}</td><td>${SFA.esc(r.state)}</td><td>${SFA.esc(r.district)}</td>
        <td>${SFA.esc(r.dob)}</td><td>${SFA.esc(r.mobile)}</td>
        <td>${r.loginEnabled ? '<span class="badge badge-active">Enabled</span>' : '<span class="badge badge-inactive">No login</span>'}</td>
        <td>${SFA.statusBadge(r.status)}</td>
        <td class="no-export">
          <button class="btn btn-sm btn-outline-primary" onclick='empEdit(${JSON.stringify(r)})'><i class="bi bi-pencil"></i></button>
          ${r.status === 'Y'
            ? `<button class="btn btn-sm btn-outline-danger" onclick="empStatus(${r.oid},'N')" title="Deactivate + disable login"><i class="bi bi-slash-circle"></i></button>`
            : `<button class="btn btn-sm btn-outline-success" onclick="empStatus(${r.oid},'Y')" title="Activate + enable login"><i class="bi bi-check-circle"></i></button>`}
        </td>
      </tr>`).join('');
    DT = sfaDataTable('#empTable');
  }

  function empAdd() {
    ['e_oid','e_name','e_username','e_password','e_mobile','e_email'].forEach(id => document.getElementById(id).value = '');
    ['e_designationOid','e_stateOid','e_districtOid'].forEach(id => document.getElementById(id).value = '');
    sfaSetDate('e_dob', '');
    document.getElementById('e_role').value = 'USER';
    document.getElementById('e_username').removeAttribute('readonly');
    document.getElementById('e_pwStar').style.display = '';
    document.getElementById('e_pwHint').textContent = '(required)';
    document.getElementById('empModalTitle').textContent = 'Add Employee';
    MODAL.show();
  }
  function empEdit(r) {
    document.getElementById('e_oid').value = r.oid;
    document.getElementById('e_name').value = r.name || '';
    document.getElementById('e_username').value = r.username || '';
    document.getElementById('e_username').setAttribute('readonly', 'readonly'); // username is the login key
    document.getElementById('e_password').value = '';
    document.getElementById('e_role').value = r.role || 'USER';
    document.getElementById('e_designationOid').value = r.designationOid || '';
    document.getElementById('e_stateOid').value = r.stateOid || '';
    document.getElementById('e_districtOid').value = r.districtOid || '';
    sfaSetDate('e_dob', r.dob);
    document.getElementById('e_mobile').value = r.mobile || '';
    document.getElementById('e_email').value = r.email || '';
    document.getElementById('e_pwStar').style.display = 'none';
    document.getElementById('e_pwHint').textContent = '(leave blank to keep current)';
    document.getElementById('empModalTitle').textContent = 'Edit Employee';
    MODAL.show();
  }
  async function empSave(ev) {
    ev.preventDefault();
    const v = id => { const x = document.getElementById(id).value; return x === '' ? null : x; };
    const body = {
      empId: null, name: v('e_name'), username: v('e_username'), password: v('e_password'),
      role: v('e_role'), designationOid: v('e_designationOid'), stateOid: v('e_stateOid'),
      districtOid: v('e_districtOid'), dob: v('e_dob'), mobile: v('e_mobile'), email: v('e_email')
    };
    try { await Api.post(API.master.employee.save, body); MODAL.hide(); await reload(); SFA.toast('Saved'); }
    catch (e) { SFA.toast(e.message, false); }
  }
  async function empStatus(oid, status) {
    if (!confirm(status === 'N' ? 'Deactivate this employee and disable their login?' : 'Activate and enable login?')) return;
    try { await Api.post(API.master.employee.status(oid), null, { query: { status } }); await reload(); }
    catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
