<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Brand Master</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="brandmaster" data-title="Brand Master"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-award"></i> Brands
      <div class="card-tools">
        <button data-perm="BRAND_SAVE" class="btn btn-sm btn-primary" onclick="brAdd()"><i class="bi bi-plus-lg"></i> Add Single</button>
        <button data-perm="BRAND_SAVE" class="btn btn-sm btn-outline-primary" onclick="brMultiAdd()"><i class="bi bi-plus-square"></i> Add Multiple</button>
      </div>
    </div>
    <div class="card-body">
      <p class="text-muted small mb-2">Hover a thumbnail to zoom, click it to see the full image and download it.</p>
      <div class="table-responsive">
        <table id="brTable" data-screen-key="BRAND_MASTER" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr>
            <th>S.No</th><th data-field="image" class="no-export">Image</th><th data-field="code">Code</th><th data-field="name">Name</th>
            <th data-field="status">Status</th><th data-field="created">Created</th><th data-field="updated">Updated</th><th class="no-export">Actions</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add / Edit -->
  <div class="modal fade" id="brModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="brSave(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="brModalTitle">Add Brand</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <input type="hidden" id="b_id" />
        <div class="col-md-5"><label class="form-label">Code <span class="required-star">*</span></label>
          <input class="form-control text-uppercase" id="b_brandCode" required maxlength="30" placeholder="BR-DOLO" /></div>
        <div class="col-md-7"><label class="form-label">Name <span class="required-star">*</span></label>
          <input class="form-control" id="b_brandName" required maxlength="150" placeholder="Dolo" /></div>
        <div class="col-12"><label class="form-label">Image</label>
          <div id="b_image"></div></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="b_saveBtn">Save</button></div>
    </form>
  </div></div>

  <!-- Add Multiple -->
  <div class="modal fade" id="brMultiModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="brSaveMultiple(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title">Add Multiple &middot; Brands</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <p class="small text-muted">Images can be added afterwards from Edit.</p>
        <table class="table table-bordered multi-row-table" id="brMultiTable">
          <thead><tr><th style="width:40px">#</th><th>Code *</th><th>Name *</th><th style="width:60px"></th></tr></thead>
          <tbody>
            <tr>
              <td class="row-sno">1</td>
              <td><input class="form-control text-uppercase" name="brandCode" maxlength="30" /></td>
              <td><input class="form-control" name="brandName" maxlength="150" /></td>
              <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="sfaRemoveRow(this,'brMultiTable')"><i class="bi bi-x"></i></button></td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="sfaAddRow('brMultiTable')"><i class="bi bi-plus"></i> Add Row</button>
        <div id="brMultiResult" class="mt-2 small text-danger"></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null, MULTI = null, ROWS = [], PICK = null;
  const EP = API.master.brandMaster;

  const auditCell = (by, at) => (by ? `<div>${SFA.esc(by)}</div><small class="text-muted">${SFA.esc(at || '')}</small>` : '');
  const boolBadge = (b) => (b
    ? '<span class="badge badge-active">Active</span>'
    : '<span class="badge badge-inactive">Inactive</span>');
  const fileMeta = (r) => ({ path: r.imagePath, thumbPath: r.thumbnailPath, name: r.imageName, type: r.imageType, size: r.imageSize });

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#brModal');
    MULTI = new bootstrap.Modal('#brMultiModal');
    PICK = SFAFiles.picker(document.getElementById('b_image'), { maxMb: 5 });
    try { await reload(); } catch (e) { SFA.toast(e.message, false); }
  };

  async function reload() {
    ROWS = await Api.get(EP.list);
    if (DT) { DT.destroy(); }
    document.querySelector('#brTable tbody').innerHTML = ROWS.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td class="no-export">${SFAFiles.thumb(r.imagePath, r.thumbnailPath, { name: r.imageName, type: r.imageType, size: r.imageSize })}</td>
        <td>${SFA.esc(r.brandCode)}</td><td>${SFA.esc(r.brandName)}</td>
        <td>${boolBadge(r.status)}</td>
        <td>${auditCell(r.createdBy, r.createdAt)}</td>
        <td>${auditCell(r.updatedBy, r.updatedAt)}</td>
        <td class="no-export">
          <button data-perm="BRAND_SAVE" class="btn btn-sm btn-outline-primary" onclick="brEdit(${r.id})"><i class="bi bi-pencil"></i></button>
          ${r.status
            ? `<button data-perm="BRAND_STATUS" class="btn btn-sm btn-outline-danger" onclick="brStatus(${r.id},false)"><i class="bi bi-slash-circle"></i></button>`
            : `<button data-perm="BRAND_STATUS" class="btn btn-sm btn-outline-success" onclick="brStatus(${r.id},true)"><i class="bi bi-check-circle"></i></button>`}
        </td>
      </tr>`).join('');
    DT = sfaDataTable('#brTable');
  }

  function brAdd() {
    ['b_id', 'b_brandCode', 'b_brandName'].forEach(id => document.getElementById(id).value = '');
    PICK.reset();
    document.getElementById('brModalTitle').textContent = 'Add Brand';
    MODAL.show();
  }
  function brEdit(id) {
    const r = ROWS.find(x => x.id === id);
    if (!r) return;
    document.getElementById('b_id').value = r.id;
    document.getElementById('b_brandCode').value = r.brandCode || '';
    document.getElementById('b_brandName').value = r.brandName || '';
    PICK.set(fileMeta(r));
    document.getElementById('brModalTitle').textContent = 'Edit Brand';
    MODAL.show();
  }
  async function brSave(ev) {
    ev.preventDefault();
    const v = id => { const x = document.getElementById(id).value.trim(); return x === '' ? null : x; };
    const data = {
      id: v('b_id'), brandCode: v('b_brandCode'), brandName: v('b_brandName'),
      removeImage: PICK.removed(), compressImage: PICK.compress(),
    };
    const btn = document.getElementById('b_saveBtn');
    btn.disabled = true;
    try {
      const saved = await Api.saveWithFiles(EP.save, data, { image: PICK.file() });
      MODAL.hide(); await reload();
      SFA.toast('Saved' + (saved && saved.imagePath && PICK.file() ? ' · image ' + SFAFiles.prettySize(saved.imageSize) : ''));
    } catch (e) { SFA.toast(e.message, false); }
    finally { btn.disabled = false; }
  }
  async function brStatus(id, status) {
    if (!confirm(status ? 'Activate this brand?' : 'Deactivate this brand?')) return;
    try { await Api.post(EP.status(id), null, { query: { status } }); await reload(); }
    catch (e) { SFA.toast(e.message, false); }
  }

  // ---- Add Multiple ----
  function brMultiAdd() {
    const tb = document.querySelector('#brMultiTable tbody');
    const rows = tb.querySelectorAll('tr');
    for (let i = rows.length - 1; i > 0; i--) rows[i].remove();
    tb.querySelector('tr').querySelectorAll('input').forEach(x => x.value = '');
    document.getElementById('brMultiResult').innerHTML = '';
    MULTI.show();
  }
  async function brSaveMultiple(ev) {
    ev.preventDefault();
    const rows = [];
    document.querySelectorAll('#brMultiTable tbody tr').forEach(tr => {
      const g = n => { const x = tr.querySelector('[name="' + n + '"]').value.trim(); return x === '' ? null : x; };
      const o = { brandCode: g('brandCode'), brandName: g('brandName') };
      if (o.brandCode || o.brandName) rows.push(o);
    });
    if (!rows.length) { SFA.toast('No rows to save', false); return; }
    try {
      const res = await Api.post(EP.saveMultiple, rows);
      await reload();
      if (res.skipped) {
        document.getElementById('brMultiResult').innerHTML = (res.errors || []).map(e => SFA.esc(e)).join('<br>');
        SFA.toast(res.saved + ' saved, ' + res.skipped + ' skipped', false);
      } else {
        MULTI.hide(); SFA.toast(res.saved + ' saved');
      }
    } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
