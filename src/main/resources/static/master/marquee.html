<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Marquee Message</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="marqueemessage" data-title="Marquee Message"></div>
<template id="pageContent">
<div class="ap-app">
  <div class="ap-top"><div><h1 class="ap-title">Marquee Message</h1><div class="text-muted small">The scrolling message in the page header - HTML and placeholders, for everyone or for chosen states / HQs / designations / employees</div></div>
    <button class="ap-btn go" onclick="mqAdd()"><i class="bi bi-plus-circle"></i> Add message</button></div>
  <div class="ap-card"><div class="d-flex align-items-center gap-2"><b id="mqCount"></b>
    <label class="d-flex align-items-center gap-2 ms-auto"><input type="checkbox" class="form-check-input" id="mqAll" onchange="mqSelAll(this.checked)"> Select all</label></div></div>
  <div id="mqList"></div>
  <div class="ap-bar" id="mqBar"><div class="info" id="mqBarInfo"></div><button class="ap-btn danger" onclick="mqDelete()"><i class="bi bi-trash"></i> Delete</button></div>
  <div class="offcanvas offcanvas-bottom ap-sheet" tabindex="-1" id="mqSheet" data-bs-backdrop="true">
    <div class="offcanvas-header"><h5 class="offcanvas-title" id="mqSheetTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body" id="mqSheetBody"></div><div class="ap-sheet-foot" id="mqSheetFoot"></div>
  </div>
</div>
</template>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  const EP = API.master.marquee;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  let CFG = null, ROWS = [], SEL = new Set(), SHEET = null, F = null;
  const PK = {};
  const SAMPLE = { '{name}': 'Asha Verma', '{empCode}': 'ACM208', '{empId}': 'ACM208', '{designation}': 'MR', '{hq}': 'Patna', '{state}': 'Bihar', '{manager}': 'Manoj Kumar', '{date}': new Date().toISOString().slice(0, 10) };
  const fill = (html) => Object.entries(SAMPLE).reduce((h, [k, v]) => h.split(k).join(v), html || '');
  const view = (html) => (window.sanitizeMarquee ? sanitizeMarquee(fill(html)) : esc(fill(html)));

  window.pageInit = async function () {
    SHEET = new bootstrap.Offcanvas('#mqSheet');
    try { CFG = await Api.get(EP.config); await load(); } catch (e) { SFA.toast(e.message, false); }
  };
  async function load() { ROWS = await Api.get(EP.list); SEL = new Set([...SEL].filter(id => ROWS.some(r => r.id === id))); render(); }
  const fmtDt = (d) => d ? String(d).replace('T', ' ').slice(0, 16) : '';
  function render() {
    document.getElementById('mqCount').textContent = ROWS.length + ' message' + (ROWS.length === 1 ? '' : 's');
    document.getElementById('mqList').innerHTML = ROWS.map(r => `<div class="ap-card" style="cursor:pointer" onclick="mqEdit(${r.id})"><div class="d-flex align-items-start gap-2">
      <input type="checkbox" class="form-check-input mt-1" ${SEL.has(r.id) ? 'checked' : ''} onclick="event.stopPropagation()" onchange="mqSel(${r.id}, this.checked)">
      <div class="flex-fill" style="min-width:0"><div class="text-nowrap overflow-hidden" style="text-overflow:ellipsis">${view(r.html)}</div>
        <div class="small text-muted mt-1">${r.active ? '' : '<span class="ap-badge bad">Off</span> '}Speed ${r.speed}px/s${r.startsAt ? ' · from ' + esc(fmtDt(r.startsAt)) : ''}${r.endsAt ? ' · till ' + esc(fmtDt(r.endsAt)) : ''}</div>
        <div class="ap-chips mt-1">${r.targets.length ? r.targets.map(t => `<span class="ap-badge wait">${({ STATE: 'State', HQ: 'HQ', DESIGNATION: 'Designation', EMP: 'Employee' })[t.targetType]}: ${esc(t.targetName)}</span>`).join('') : '<span class="ap-badge ok">Everyone</span>'}</div></div>
      <i class="bi bi-chevron-right text-muted"></i></div></div>`).join('') || '<div class="ap-card ap-empty"><i class="bi bi-megaphone fs-1"></i><div>No message yet</div></div>';
    document.getElementById('mqAll').checked = ROWS.length > 0 && SEL.size === ROWS.length;
    document.getElementById('mqBar').classList.toggle('show', SEL.size > 0); document.getElementById('mqBarInfo').textContent = SEL.size + ' selected';
  }
  function mqSel(id, on) { on ? SEL.add(id) : SEL.delete(id); render(); }
  function mqSelAll(on) { SEL = on ? new Set(ROWS.map(r => r.id)) : new Set(); render(); }
  async function mqDelete() {
    if (!confirm('Delete ' + SEL.size + ' message(s)?')) return;
    try { await Api.post(EP.remove, { ids: [...SEL] }); SEL = new Set(); await load(); SFA.toast('Deleted'); } catch (e) { SFA.toast(e.message, false); }
  }

  function picker(key, title, items, chosen) {
    PK[key] = { items, chosen: new Set(chosen.map(String)) };
    return `<div class="ap-sec">${title} <span class="text-muted fw-normal" id="pc_${key}"></span></div><input class="form-control mb-2" placeholder="Search ${title.toLowerCase()}…" oninput="pkRender('${key}', this.value)"><div class="ap-pick" id="pk_${key}"></div>`;
  }
  function pkRender(key, q) {
    const p = PK[key], t = (q || '').toLowerCase();
    document.getElementById('pk_' + key).innerHTML = p.items.filter(i => !t || i.name.toLowerCase().includes(t)).slice(0, 300).map(i => `<label class="ap-row"><input type="checkbox" class="form-check-input" ${p.chosen.has(String(i.id)) ? 'checked' : ''} onchange="pkToggle('${key}','${esc(i.id)}',this.checked)"><div class="grow">${esc(i.name)}</div></label>`).join('') || '<div class="ap-empty">None found</div>';
    document.getElementById('pc_' + key).textContent = p.chosen.size ? '(' + p.chosen.size + ' selected)' : '';
  }
  function pkToggle(key, id, on) { const p = PK[key]; on ? p.chosen.add(String(id)) : p.chosen.delete(String(id)); document.getElementById('pc_' + key).textContent = p.chosen.size ? '(' + p.chosen.size + ' selected)' : ''; }

  function mqAdd() { F = { id: null, html: '', speed: 60, startsAt: '', endsAt: '', sortOrder: 0, active: true }; form({}); }
  function mqEdit(id) {
    const r = ROWS.find(x => x.id === id); F = { id, html: r.html, speed: r.speed, startsAt: r.startsAt ? String(r.startsAt).slice(0, 16) : '', endsAt: r.endsAt ? String(r.endsAt).slice(0, 16) : '', sortOrder: r.sortOrder, active: !!r.active };
    const by = (t) => r.targets.filter(x => x.targetType === t).map(x => x.targetValue); form({ s: by('STATE'), h: by('HQ'), d: by('DESIGNATION'), e: by('EMP') });
  }
  function form(c) {
    document.getElementById('mqSheetTitle').textContent = F.id ? 'Edit message' : 'Add message';
    document.getElementById('mqSheetBody').innerHTML = `<label class="form-label">Message (HTML allowed)</label>
      <textarea class="form-control" id="mq_html" rows="4" maxlength="2000" oninput="mqPrev()" placeholder="Welcome <b>{name}</b> · HQ {hq} · <span style='color:#d9441a'>Target this month: 50 calls</span>">${esc(F.html)}</textarea>
      <div class="ap-chips mt-2">${CFG.placeholders.map(p => `<button type="button" class="ap-chip" onclick="mqIns('${p}')">${p}</button>`).join('')}</div>
      <div class="small text-muted mt-1">Tags: &lt;b&gt; &lt;i&gt; &lt;u&gt; &lt;s&gt; &lt;span style="color:..."&gt; &lt;mark&gt; &lt;a href="https://..."&gt; &lt;br&gt;. The employee's own state / HQ / designation / name / code is filled in for each user. (The internal employee id is never shown - {empCode} is the code.)</div>
      <div class="ap-sec">Preview (sample values)</div><div class="ap-card text-nowrap overflow-hidden" id="mq_prev"></div>
      <div class="row g-3"><div class="col-6"><label class="form-label">Speed (px / second)</label><input type="number" class="form-control" id="mq_speed" min="10" max="300" value="${F.speed}"></div>
        <div class="col-6"><label class="form-label">Order</label><input type="number" class="form-control" id="mq_sort" value="${F.sortOrder}"></div>
        <div class="col-6"><label class="form-label">Show from</label><input type="datetime-local" class="form-control" id="mq_from" value="${esc(F.startsAt)}"></div>
        <div class="col-6"><label class="form-label">Show until</label><input type="datetime-local" class="form-control" id="mq_to" value="${esc(F.endsAt)}"></div>
        <div class="col-12"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="mq_on" ${F.active ? 'checked' : ''}><label class="form-check-label" for="mq_on">Message is on</label></div></div></div>
      <div class="alert alert-info py-2 small mt-3 mb-0"><i class="bi bi-info-circle"></i> Pick states, HQs, designations or employees. Leave all empty = <b>everyone</b>.</div>`
      + picker('s', 'States', CFG.states, c.s || []) + picker('h', 'HQs', CFG.hqs, c.h || []) + picker('d', 'Designations', CFG.designations, c.d || []) + picker('e', 'Employees', CFG.employees, c.e || []);
    document.getElementById('mqSheetFoot').innerHTML = '<button class="ap-btn light" data-bs-dismiss="offcanvas">Cancel</button><button class="ap-btn go" onclick="mqSave()"><i class="bi bi-check2"></i> Save</button>';
    SHEET.show(); ['s', 'h', 'd', 'e'].forEach(k => pkRender(k, '')); mqPrev();
  }
  function mqPrev() { document.getElementById('mq_prev').innerHTML = view(document.getElementById('mq_html').value) || '<span class="text-muted">Nothing yet</span>'; }
  function mqIns(tag) { const t = document.getElementById('mq_html'), a = t.selectionStart || 0, b = t.selectionEnd || 0; t.value = t.value.slice(0, a) + tag + t.value.slice(b); t.focus(); t.selectionStart = t.selectionEnd = a + tag.length; mqPrev(); }
  async function mqSave() {
    const v = (id) => document.getElementById(id).value;
    try {
      await Api.post(EP.list, { id: F.id, html: v('mq_html'), speed: v('mq_speed'), sortOrder: v('mq_sort'), startsAt: v('mq_from'), endsAt: v('mq_to'), active: document.getElementById('mq_on').checked,
        assign: { states: [...PK.s.chosen], hqs: [...PK.h.chosen], designations: [...PK.d.chosen], employees: [...PK.e.chosen] } });
      Object.keys(sessionStorage).filter(k => k.startsWith('sfa_mq_')).forEach(k => sessionStorage.removeItem(k)); SHEET.hide(); await load(); SFA.toast('Saved - it shows in the header within 5 minutes (or on the next page load)');
    } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
