<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; DCR Permissions</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="dcrpermission" data-title="DCR Permissions"></div>
<template id="pageContent">
<div class="card mb-2">
  <div class="card-header d-flex align-items-center flex-wrap gap-2"><span><i class="bi bi-unlock"></i> <span data-i18n="perm.title">DCR Permissions</span></span>
    <div class="card-tools ms-auto d-flex gap-2 flex-wrap"><button class="btn btn-sm btn-primary" onclick="giveOpen()"><i class="bi bi-plus-lg"></i> <span data-i18n="perm.give">Give permission</span></button></div></div>
  <div class="card-body">
    <div class="small text-muted mb-2" data-i18n="perm.help">Back-date submit: the employee may fill the DCR of the chosen dates although the lock period has passed. DCR edit: the employee may add or change a submitted DCR of the chosen dates. Both work only on the days of the permission window; after it the permission expires and is no longer listed.</div>
    <div class="row g-2 align-items-end">
      <div class="col-6 col-md-3"><label class="form-label small fw-semibold" data-i18n="perm.type">Permission</label><select class="form-select form-select-sm" id="q_type" onchange="load()"><option value="" data-i18n="common.all">All</option><option value="BACKDATE" data-i18n="perm.backdate">Back-date submit</option><option value="EDIT" data-i18n="perm.edit">DCR edit</option></select></div>
      <div class="col-6 col-md-3"><label class="form-label small fw-semibold" data-i18n="entity.employee">Employee</label><select class="form-select form-select-sm" id="q_emp" onchange="load()"><option value="">All</option></select></div>
      <div class="col-12 col-md-3"><div class="form-check mt-3"><input class="form-check-input" type="checkbox" id="q_exp" onchange="load()"><label class="form-check-label small" for="q_exp" data-i18n="perm.showExpired">Show expired too</label></div></div>
    </div>
  </div>
</div>
<div class="card"><div class="card-body"><div id="permWrap"></div></div></div>

<div class="modal fade" id="giveModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down"><div class="modal-content">
  <div class="modal-header sfa-modal"><h5 class="modal-title"><i class="bi bi-unlock"></i> <span data-i18n="perm.give">Give permission</span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><div class="row g-2">
    <div class="col-12"><label class="form-label small fw-semibold" data-i18n="perm.type">Permission</label>
      <div class="btn-group w-100"><input type="radio" class="btn-check" name="g_type" id="g_t1" value="BACKDATE" checked><label class="btn btn-outline-primary" for="g_t1" data-i18n="perm.backdate">Back-date submit</label><input type="radio" class="btn-check" name="g_type" id="g_t2" value="EDIT"><label class="btn btn-outline-primary" for="g_t2" data-i18n="perm.edit">DCR edit</label></div></div>
    <div class="col-6"><label class="form-label small fw-semibold" data-i18n="perm.dcrFrom">DCR date from</label><input type="date" class="form-control form-control-sm" id="g_df"></div>
    <div class="col-6"><label class="form-label small fw-semibold" data-i18n="perm.dcrTo">DCR date to</label><input type="date" class="form-control form-control-sm" id="g_dt"></div>
    <div class="col-6"><label class="form-label small fw-semibold" data-i18n="perm.allowFrom">Allowed from</label><input type="date" class="form-control form-control-sm" id="g_af"></div>
    <div class="col-6"><label class="form-label small fw-semibold" data-i18n="perm.allowTo">Allowed till</label><input type="date" class="form-control form-control-sm" id="g_at"></div>
    <div class="col-12"><label class="form-label small fw-semibold" data-i18n="perm.reason">Reason</label><input class="form-control form-control-sm" id="g_reason" maxlength="250"></div>
    <div class="col-6 col-md-4"><label class="form-label small fw-semibold" data-i18n="entity.state">State</label><select class="form-select form-select-sm" id="g_state" onchange="gCascade()"><option value="">All</option></select></div>
    <div class="col-6 col-md-4"><label class="form-label small fw-semibold" data-i18n="entity.hq">HQ</label><select class="form-select form-select-sm" id="g_hq" onchange="gCascade()"><option value="">All</option></select></div>
    <div class="col-12 col-md-4"><label class="form-label small fw-semibold" data-i18n="entity.designation">Designation</label><select class="form-select form-select-sm" id="g_des" onchange="gCascade()"><option value="">All</option></select></div>
    <div class="col-12"><div class="d-flex align-items-center gap-2 mb-1"><label class="form-label small fw-semibold mb-0" data-i18n="perm.employees">Employees</label><button class="btn btn-sm btn-light ms-auto" onclick="gAll(true)" data-i18n="perm.selAll">Select all shown</button><button class="btn btn-sm btn-light" onclick="gAll(false)" data-i18n="perm.selNone">Clear</button></div>
      <div id="g_emps" class="border rounded p-2" style="max-height:220px;overflow:auto"></div><div class="small text-muted mt-1" id="g_cnt"></div></div>
  </div></div>
  <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="common.close">Close</button><button type="button" class="btn btn-primary" onclick="giveSave()"><i class="bi bi-check2"></i> <span data-i18n="common.save">Save</span></button></div></div></div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/core/activity.js"></script>
<script src="js/shell.js"></script>
<script>
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);
  const EP = API.report.dcrPermissions, FEP = API.report.attendance;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  const fmt = (d) => d ? String(d).substring(8, 10) + '-' + String(d).substring(5, 7) + '-' + String(d).substring(0, 4) : '';
  let FIL = null, ROWS = [], MODAL = null, LASTLANG = window.I18n ? I18n.lang : 'en';
  if (window.I18n) I18n.onChange(() => { if (I18n.lang !== LASTLANG) { LASTLANG = I18n.lang; draw(); } });

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#giveModal');
    try { FIL = await Api.get(FEP + '/filters'); fillQ(); fillG(); await load(); } catch (e) { SFA.toast(e.message, false); }
  };
  const opts = (list, first) => `<option value="">${first}</option>` + list.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
  function fillQ() { document.getElementById('q_emp').innerHTML = opts(FIL.employees, T('common.all', 'All')); }
  function fillG() {
    document.getElementById('g_state').innerHTML = opts(FIL.states, T('common.all', 'All')); document.getElementById('g_hq').innerHTML = opts(FIL.hqs, T('common.all', 'All')); document.getElementById('g_des').innerHTML = opts(FIL.designations, T('common.all', 'All'));
  }
  const gShown = () => { const v = (i) => document.getElementById(i).value; return FIL.employees.filter(e => (!v('g_state') || String(e.stateId) === v('g_state')) && (!v('g_hq') || String(e.hqId) === v('g_hq')) && (!v('g_des') || String(e.designationId) === v('g_des'))); };
  const picked = new Set();
  function gCascade() {
    document.getElementById('g_emps').innerHTML = gShown().map(e => `<div class="form-check"><input class="form-check-input g-e" type="checkbox" id="ge_${esc(e.id)}" value="${esc(e.id)}" ${picked.has(String(e.id)) ? 'checked' : ''} onchange="gPick(this)"><label class="form-check-label small" for="ge_${esc(e.id)}">${esc(e.name)}</label></div>`).join('') || `<div class="text-muted small">${T('rep.nothing', 'Nothing found for these filters')}</div>`;
    gCount();
  }
  function gPick(el) { el.checked ? picked.add(el.value) : picked.delete(el.value); gCount(); }
  function gAll(on) { document.querySelectorAll('.g-e').forEach(c => { c.checked = on; on ? picked.add(c.value) : picked.delete(c.value); }); gCount(); }
  const gCount = () => document.getElementById('g_cnt').textContent = picked.size + ' ' + T('perm.selected', 'selected');
  function giveOpen() {
    picked.clear(); const t = new Date().toISOString().substring(0, 10);
    ['g_df', 'g_dt'].forEach(i => document.getElementById(i).value = ''); document.getElementById('g_af').value = t; document.getElementById('g_at').value = ''; document.getElementById('g_reason').value = '';
    ['g_state', 'g_hq', 'g_des'].forEach(i => document.getElementById(i).value = ''); gCascade(); MODAL.show();
  }
  async function giveSave() {
    const v = (i) => document.getElementById(i).value;
    try {
      const r = await Api.post(EP, { type: document.querySelector('input[name=g_type]:checked').value, empIds: [...picked], dcrFrom: v('g_df'), dcrTo: v('g_dt'), allowFrom: v('g_af'), allowTo: v('g_at'), reason: v('g_reason') });
      SFA.toast(T('perm.saved', 'Permission given') + ' (' + r.created + ')', true); MODAL.hide(); load();
    } catch (e) { SFA.toast(e.message, false); }
  }
  async function load() {
    try {
      const q = { type: document.getElementById('q_type').value || undefined, empId: document.getElementById('q_emp').value || undefined, expired: document.getElementById('q_exp').checked ? true : undefined };
      ROWS = await Api.get(EP, { query: q }); draw();
    } catch (e) { SFA.toast(e.message, false); }
  }
  const tag = (st) => `<span class="badge ${st === 'ACTIVE' ? 'bg-success' : st === 'UPCOMING' ? 'bg-info' : 'bg-secondary'}">${esc(T('perm.st.' + st.toLowerCase(), st))}</span>`;
  function draw() {
    const w = document.getElementById('permWrap');
    if (window.jQuery && $.fn.DataTable.isDataTable('#permT')) $('#permT').DataTable().destroy();
    if (!ROWS.length) { w.innerHTML = `<div class="text-center text-muted py-4">${T('perm.none', 'No permission given')}</div>`; return; }
    w.innerHTML = `<table id="permT" data-screen-key="DCR_PERMISSION" class="table table-striped table-bordered nowrap" style="width:100%"><thead><tr><th>${T('common.sno', 'S.No')}</th><th data-field="emp">${T('entity.employee', 'Employee')}</th><th data-field="designation">${T('entity.designation', 'Designation')}</th><th data-field="hq">${T('entity.hq', 'HQ')}</th>
      <th data-field="type">${T('perm.type', 'Permission')}</th><th data-field="dcrDates">${T('perm.dcrDates', 'DCR dates')}</th><th data-field="window">${T('perm.window', 'Allowed on')}</th><th data-field="status">${T('common.status', 'Status')}</th><th data-field="reason">${T('perm.reason', 'Reason')}</th><th data-field="givenBy">${T('perm.givenBy', 'Given by')}</th><th class="no-export"></th></tr></thead><tbody>
      ${ROWS.map((r, i) => `<tr><td>${i + 1}</td><td><b>${esc(r.name)}</b> <small class="text-muted">${esc(r.empCode)}</small></td><td>${esc(r.designation)}</td><td>${esc(r.hq)}</td><td>${r.type === 'EDIT' ? T('perm.edit', 'DCR edit') : T('perm.backdate', 'Back-date submit')}</td>
      <td data-order="${esc(r.dcrFrom)}">${fmt(r.dcrFrom)}${r.dcrTo !== r.dcrFrom ? ' → ' + fmt(r.dcrTo) : ''}</td><td data-order="${esc(r.allowFrom)}">${fmt(r.allowFrom)} → ${fmt(r.allowTo)}</td><td>${tag(r.state)}</td><td>${esc(r.reason)}</td><td>${esc(r.createdBy)}</td>
      <td class="no-export"><button class="btn btn-sm btn-outline-danger" title="${T('common.delete', 'Delete')}" onclick="del(${r.id})"><i class="bi bi-trash"></i></button></td></tr>`).join('')}</tbody></table>`;
    sfaDataTable('#permT', { order: [[6, 'asc']] });
  }
  async function del(id) {
    if (!confirm(T('perm.confirmDel', 'Remove this permission?'))) return;
    try { await Api.post(EP + '/delete', { ids: [id] }); SFA.toast(T('perm.removed', 'Permission removed'), true); load(); } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
