<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Sponsorship Type Master</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="sponsorshiptypemaster" data-title="Sponsorship Type Master"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-award"></i> Sponsorship Types
      <div class="card-tools">
        <button class="btn btn-sm btn-primary" onclick="spAdd()"><i class="bi bi-plus-lg"></i> Add Single</button>
        <button class="btn btn-sm btn-outline-primary" onclick="spMultiAdd()"><i class="bi bi-plus-square"></i> Add Multiple</button>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table id="spTable" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr>
            <th>S.No</th><th>Code</th><th>Name</th><th>Short Name</th><th>Description</th>
            <th>Order</th><th>Status</th><th>Created</th><th>Updated</th><th class="no-export">Actions</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="spModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="spSave(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="spModalTitle">Add Sponsorship Type</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <input type="hidden" id="sp_id" />
        <div class="col-md-5"><label class="form-label">Code <span class="required-star">*</span></label>
          <input class="form-control" id="sp_code" required placeholder="QTR" maxlength="30" /></div>
        <div class="col-md-7"><label class="form-label">Name <span class="required-star">*</span></label>
          <input class="form-control" id="sp_name" required placeholder="Quarterly" maxlength="100" /></div>
        <div class="col-md-7"><label class="form-label">Short Name</label>
          <input class="form-control" id="sp_shortName" placeholder="Qtr" maxlength="30" /></div>
        <div class="col-md-5"><label class="form-label">Display Order</label>
          <input type="number" class="form-control" id="sp_displayOrder" placeholder="0" value="0" /></div>
        <div class="col-12"><label class="form-label">Description</label>
          <input class="form-control" id="sp_description" maxlength="500" /></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>

  <div class="modal fade" id="spMultiModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="spSaveMultiple(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title">Add Multiple &middot; Sponsorship Types</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <table class="table table-bordered multi-row-table" id="spMultiTable">
          <thead><tr><th style="width:40px">#</th><th>Code *</th><th>Name *</th><th>Short Name</th><th>Order</th><th>Description</th><th style="width:60px"></th></tr></thead>
          <tbody>
            <tr>
              <td class="row-sno">1</td>
              <td><input class="form-control" name="code" /></td>
              <td><input class="form-control" name="name" /></td>
              <td><input class="form-control" name="shortName" /></td>
              <td><input type="number" class="form-control" name="displayOrder" value="0" /></td>
              <td><input class="form-control" name="description" /></td>
              <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="sfaRemoveRow(this,'spMultiTable')"><i class="bi bi-x"></i></button></td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="sfaAddRow('spMultiTable')"><i class="bi bi-plus"></i> Add Row</button>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null, MULTI = null;
  const EP = API.master.sponsorshipTypeMaster;
  const auditCell = (by, at) => (by ? `<div>${SFA.esc(by)}</div><small class="text-muted">${SFA.esc(at || '')}</small>` : '');
  const boolBadge = (b) => (b
    ? '<span class="badge badge-active">Active</span>'
    : '<span class="badge badge-inactive">Inactive</span>');

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#spModal');
    MULTI = new bootstrap.Modal('#spMultiModal');
    try { await reload(); } catch (e) { SFA.toast(e.message, false); }
  };

  async function reload() {
    const rows = await Api.get(EP.list);
    if (DT) { DT.destroy(); }
    document.querySelector('#spTable tbody').innerHTML = rows.map((r, i) => `
      <tr>
        <td>${i + 1}</td><td>${SFA.esc(r.sponsorshipTypeCode)}</td><td>${SFA.esc(r.sponsorshipTypeName)}</td>
        <td>${SFA.esc(r.shortName)}</td><td>${SFA.esc(r.description)}</td>
        <td>${r.displayOrder == null ? '' : SFA.esc(r.displayOrder)}</td>
        <td>${boolBadge(r.isActive)}</td>
        <td>${auditCell(r.createdBy, r.createdAt)}</td>
        <td>${auditCell(r.updatedBy, r.updatedAt)}</td>
        <td class="no-export">
          <button class="btn btn-sm btn-outline-primary" onclick='spEdit(${JSON.stringify(r)})'><i class="bi bi-pencil"></i></button>
          ${r.isActive
            ? `<button class="btn btn-sm btn-outline-danger" onclick="spStatus(${r.id},false)"><i class="bi bi-slash-circle"></i></button>`
            : `<button class="btn btn-sm btn-outline-success" onclick="spStatus(${r.id},true)"><i class="bi bi-check-circle"></i></button>`}
        </td>
      </tr>`).join('');
    DT = sfaDataTable('#spTable');
  }

  function spAdd() {
    ['sp_id', 'sp_code', 'sp_name', 'sp_shortName', 'sp_description'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('sp_displayOrder').value = '0';
    document.getElementById('spModalTitle').textContent = 'Add Sponsorship Type';
    MODAL.show();
  }
  function spEdit(r) {
    document.getElementById('sp_id').value = r.id;
    document.getElementById('sp_code').value = r.sponsorshipTypeCode || '';
    document.getElementById('sp_name').value = r.sponsorshipTypeName || '';
    document.getElementById('sp_shortName').value = r.shortName || '';
    document.getElementById('sp_displayOrder').value = r.displayOrder == null ? 0 : r.displayOrder;
    document.getElementById('sp_description').value = r.description || '';
    document.getElementById('spModalTitle').textContent = 'Edit Sponsorship Type';
    MODAL.show();
  }
  async function spSave(ev) {
    ev.preventDefault();
    const val = id => { const x = document.getElementById(id).value; return x === '' ? null : x; };
    const body = {
      id: val('sp_id'), sponsorshipTypeCode: val('sp_code'), sponsorshipTypeName: val('sp_name'),
      shortName: val('sp_shortName'), description: val('sp_description'),
      displayOrder: val('sp_displayOrder') == null ? 0 : Number(val('sp_displayOrder'))
    };
    try { await Api.post(EP.save, body); MODAL.hide(); await reload(); SFA.toast('Saved'); }
    catch (e) { SFA.toast(e.message, false); }
  }
  async function spStatus(id, isActive) {
    if (!confirm(isActive ? 'Activate this sponsorship type?' : 'Deactivate this sponsorship type?')) return;
    try { await Api.post(EP.status(id), null, { query: { status: isActive } }); await reload(); }
    catch (e) { SFA.toast(e.message, false); }
  }

  function spMultiAdd() {
    const tb = document.querySelector('#spMultiTable tbody');
    const rows = tb.querySelectorAll('tr');
    for (let i = rows.length - 1; i > 0; i--) rows[i].remove();
    tb.querySelector('tr').querySelectorAll('input').forEach(x => { x.value = x.name === 'displayOrder' ? '0' : ''; });
    MULTI.show();
  }
  async function spSaveMultiple(ev) {
    ev.preventDefault();
    const rows = collectRows('spMultiTable');
    if (!rows.length) { SFA.toast('No rows to save', false); return; }
    try {
      const res = await Api.post(EP.saveMultiple, rows);
      MULTI.hide(); await reload(); SFA.toast(res.saved + ' saved' + (res.skipped ? ', ' + res.skipped + ' skipped' : ''));
    } catch (e) { SFA.toast(e.message, false); }
  }
  function collectRows(tableId) {
    const rows = [];
    document.querySelectorAll('#' + tableId + ' tbody tr').forEach(tr => {
      const g = n => { const el = tr.querySelector('[name="' + n + '"]'); const x = el ? String(el.value).trim() : ''; return x === '' ? null : x; };
      const code = g('code'), name = g('name');
      if (code || name) rows.push({
        sponsorshipTypeCode: code, sponsorshipTypeName: name, shortName: g('shortName'),
        displayOrder: g('displayOrder') == null ? 0 : Number(g('displayOrder')), description: g('description')
      });
    });
    return rows;
  }
</script>
</body>
</html>
