<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Area Type Master</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="areatype" data-title="Area Type Master"></div>
<template id="pageContent">
<div class="card"><div class="card-header d-flex align-items-center gap-2"><span><i class="bi bi-geo"></i> <span data-i18n="at.title">Area Type Master</span></span>
  <div class="card-tools ms-auto"><button class="btn btn-sm btn-primary" onclick="addRow()"><i class="bi bi-plus-lg"></i> <span data-i18n="at.add">Add type</span></button></div></div>
  <div class="card-body"><div class="small text-muted mb-2" data-i18n="at.help">The type of an area follows its distance from the HQ: every type has a km range (no overlap). The types are used in Area Master and decide the DA and the fare of a day in the expense. The type marked "Stay" is the type of a day on which the user stays the night.</div>
    <div class="table-responsive"><table class="table table-sm align-middle" id="atT"><thead><tr><th>Code</th><th data-i18n="inv.label">Name</th><th style="width:7rem">Km from</th><th style="width:7rem">Km to</th><th style="width:6rem" data-i18n="inv.order">Order</th><th class="text-center" data-i18n="at.stay">Stay</th><th class="text-center" data-i18n="at.on">On</th><th></th></tr></thead><tbody></tbody></table></div>
    <div class="form-text" data-i18n="at.unlimited">Leave "Km to" empty for unlimited.</div></div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/core/activity.js"></script>
<script src="js/shell.js"></script>
<script>
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);
  const EP = API.report.areaType, esc = (v) => SFA.esc(v == null ? '' : v);
  let ROWS = [];
  window.pageInit = async function () { await load(); };
  async function load() { try { ROWS = await Api.get(EP); draw(); } catch (e) { SFA.toast(e.message, false); } }
  function draw() {
    document.querySelector('#atT tbody').innerHTML = ROWS.map((r, i) => `<tr><td><input class="form-control form-control-sm" data-i="${i}" data-k="code" value="${esc(r.code)}" maxlength="10" style="text-transform:uppercase" ${r.id ? 'readonly' : ''}></td>
      <td><input class="form-control form-control-sm" data-i="${i}" data-k="name" value="${esc(r.name)}" maxlength="40"></td>
      <td><input class="form-control form-control-sm" type="number" min="0" data-i="${i}" data-k="kmFrom" value="${esc(r.kmFrom)}"></td><td><input class="form-control form-control-sm" type="number" min="0" data-i="${i}" data-k="kmTo" value="${r.kmTo == null ? '' : esc(r.kmTo)}"></td>
      <td><input class="form-control form-control-sm" type="number" data-i="${i}" data-k="sortOrder" value="${esc(r.sortOrder)}"></td>
      <td class="text-center"><input class="form-check-input" type="radio" name="stay" data-i="${i}" data-k="stay" ${r.stay ? 'checked' : ''}></td><td class="text-center"><input class="form-check-input" type="checkbox" data-i="${i}" data-k="active" ${r.active !== false ? 'checked' : ''}></td>
      <td class="text-nowrap"><button class="btn btn-sm btn-primary" onclick="save(${i})"><i class="bi bi-check2"></i></button> ${r.id ? `<button class="btn btn-sm btn-outline-danger" onclick="del(${r.id})"><i class="bi bi-trash"></i></button>` : ''}</td></tr>`).join('');
  }
  function addRow() { ROWS.push({ id: null, code: '', name: '', kmFrom: '', kmTo: null, sortOrder: (ROWS.length + 1) * 10, stay: false, active: true }); draw(); }
  async function save(i) {
    const g = (k) => document.querySelector(`[data-i="${i}"][data-k="${k}"]`);
    try { await Api.post(EP, { id: ROWS[i].id, code: g('code').value, name: g('name').value, kmFrom: g('kmFrom').value, kmTo: g('kmTo').value, sortOrder: g('sortOrder').value, stay: g('stay').checked, active: g('active').checked }); SFA.toast(T('inv.saved', 'Saved'), true); await load(); } catch (e) { SFA.toast(e.message, false); }
  }
  async function del(id) { if (!confirm(T('perm.confirmDel', 'Remove?'))) return; try { await Api.post(EP + '/' + id + '/delete', {}); await load(); } catch (e) { SFA.toast(e.message, false); } }
</script>
</body>
</html>
