<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Password Reset</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="passwordreset" data-title="Password Reset"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header"><i class="bi bi-key"></i> User Password Reset</div>
    <div class="card-body">
      <p class="text-muted small mb-2">Set a new password for a user — type one or let the system make an 8-digit password.
        The new password is shown once after saving: share it with the user. You can reset users of your own or a lower level only.</p>
      <div class="table-responsive">
        <table id="prTable" data-screen-key="PASSWORD_RESET" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr>
            <th>S.No</th><th data-field="empCode">Emp Code</th><th data-field="name">Name</th><th data-field="designation">Designation</th>
            <th data-field="division">Division</th><th data-field="username">Username</th><th data-field="login">Login</th>
            <th data-field="vacant">Working / Vacant</th><th data-field="lastLogin">Last Login</th><th class="no-export">Action</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="prModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="prSave(event)" novalidate>
      <div class="modal-header sfa-modal"><h5 class="modal-title">Reset Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="r_empId" />
        <div class="mb-3 small"><div><span class="text-muted">Employee:</span> <b id="r_name"></b></div>
          <div><span class="text-muted">Username:</span> <b class="font-monospace" id="r_username"></b></div></div>
        <div id="r_form">
          <div class="mb-2">
            <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="r_mode" id="r_auto" value="auto" checked onchange="prMode()">
              <label class="form-check-label" for="r_auto">Auto-generate</label></div>
            <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="r_mode" id="r_own" value="own" onchange="prMode()">
              <label class="form-check-label" for="r_own">Type a password</label></div>
          </div>
          <label class="form-label">New Password <span class="required-star">*</span></label>
          <div class="input-group">
            <input type="text" class="form-control font-monospace" id="r_password" maxlength="100" autocomplete="new-password" />
            <button type="button" class="btn btn-outline-secondary" id="r_regen" title="Generate another" onclick="prGenerate()"><i class="bi bi-arrow-repeat"></i></button>
          </div>
          <div class="form-text">At least 4 characters, no spaces.</div>
        </div>
        <div id="r_done" class="d-none">
          <div class="alert alert-success py-2 small mb-2"><i class="bi bi-check-circle"></i> Password changed. Share it with the user — it is not shown again.</div>
          <div class="border rounded p-2 font-monospace" id="r_result"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal" id="r_cancel">Cancel</button>
        <button type="button" class="btn btn-outline-primary d-none" id="r_copy" onclick="prCopy()"><i class="bi bi-clipboard"></i> Copy</button>
        <button type="submit" class="btn btn-primary" id="r_saveBtn" data-perm="USER_PASSWORD_RESET">Reset Password</button>
      </div>
    </form>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null, ROWS = [], LAST = null;
  const EP = API.master.passwordReset;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  const fmtDateTime = (v) => {
    if (!v) return '<span class="text-muted">never</span>';
    const d = new Date(v);
    if (isNaN(d)) return esc(v);
    const p = n => String(n).padStart(2, '0');
    return `${p(d.getDate())}-${p(d.getMonth() + 1)}-${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#prModal');
    try { await reload(); } catch (e) { SFA.toast(e.message, false); }
  };

  async function reload() {
    ROWS = await Api.get(EP.list);
    if (DT) { DT.destroy(); }
    document.querySelector('#prTable tbody').innerHTML = ROWS.map((r, i) => `
      <tr>
        <td>${i + 1}</td><td>${esc(r.empCode)}</td><td>${esc(r.empName)}</td><td>${esc(r.designationName)}</td>
        <td>${esc(r.divisionName)}</td><td class="font-monospace">${esc(r.username) || '<span class="text-muted">no login</span>'}</td>
        <td>${!r.username ? '' : r.loginActive ? '<span class="badge badge-active">Active</span>' : '<span class="badge badge-inactive">Disabled</span>'}</td>
        <td>${r.vacant ? '<span class="badge bg-warning text-dark">Vacant</span>' : '<span class="badge badge-active">Working</span>'}</td>
        <td>${fmtDateTime(r.lastLoginAt)}</td>
        <td class="no-export">${r.username
          ? `<button data-perm="USER_PASSWORD_RESET" class="btn btn-sm btn-outline-primary" onclick="prOpen('${esc(r.empId)}')"><i class="bi bi-key"></i> Reset</button>` : ''}</td>
      </tr>`).join('');
    DT = sfaDataTable('#prTable');
  }

  async function prOpen(empId) {
    const r = ROWS.find(x => x.empId === empId);
    if (!r) return;
    LAST = null;
    document.getElementById('r_empId').value = r.empId;
    document.getElementById('r_name').textContent = r.empName + ' (' + r.empCode + ')';
    document.getElementById('r_username').textContent = r.username;
    document.getElementById('r_auto').checked = true;
    showDone(false);
    MODAL.show();
    await prMode();
  }

  async function prMode() {
    const auto = document.getElementById('r_auto').checked, input = document.getElementById('r_password');
    document.getElementById('r_regen').classList.toggle('d-none', !auto);
    input.readOnly = auto;
    input.classList.toggle('bg-body-secondary', auto);
    if (auto) await prGenerate();
    else { input.value = ''; input.focus(); }
  }

  async function prGenerate() {
    try { document.getElementById('r_password').value = (await Api.get(EP.generate, { noLoader: true })).password; }
    catch (e) { SFA.toast(e.message, false); }
  }

  function showDone(on) {
    document.getElementById('r_form').classList.toggle('d-none', on);
    document.getElementById('r_done').classList.toggle('d-none', !on);
    document.getElementById('r_copy').classList.toggle('d-none', !on);
    document.getElementById('r_saveBtn').classList.toggle('d-none', on);
    document.getElementById('r_cancel').textContent = on ? 'Close' : 'Cancel';
  }

  async function prSave(ev) {
    ev.preventDefault();
    const pwd = document.getElementById('r_password').value.trim();
    if (pwd.length < 4) { SFA.toast('Password must be at least 4 characters', false); return; }
    if (/\s/.test(pwd)) { SFA.toast('Password cannot contain spaces', false); return; }
    const empId = document.getElementById('r_empId').value;
    const btn = document.getElementById('r_saveBtn');
    btn.disabled = true;
    try {
      LAST = await Api.post(EP.reset(empId), { password: pwd });
      document.getElementById('r_result').innerHTML = 'Username: ' + esc(LAST.username) + '<br>Password: ' + esc(LAST.password);
      showDone(true);
      SFA.toast('Password changed for ' + LAST.empName);
    } catch (e) { SFA.toast(e.message, false); }
    finally { btn.disabled = false; }
  }

  function prCopy() {
    if (!LAST) return;
    const text = 'Username: ' + LAST.username + '\nPassword: ' + LAST.password;
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => SFA.toast('Copied'), () => SFA.toast('Copy failed', false));
  }
</script>
</body>
</html>
