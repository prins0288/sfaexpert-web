<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; DCR Tabs</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="dcrworktype" data-title="DCR Tabs"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header"><i class="bi bi-ui-checks-grid"></i> DCR Tabs
      <div class="card-tools"><button class="btn btn-sm btn-primary" onclick="wtAdd()"><i class="bi bi-plus-lg"></i> Add rule</button></div></div>
    <div class="card-body">
      <p class="text-muted small mb-2">Which tabs appear in a user's DCR form. A rule is for <b>Everyone</b>, one <b>employee</b>, a <b>designation</b> or a <b>hierarchy level</b>.
        For each tab the most specific rule wins: employee &gt; designation &gt; level &gt; everyone. A rule that is switched <b>off</b> hides the tab for that target.
        A Check-in tab with a <b>client type</b> shows only clients of that type (e.g. Retailer); the plain Client tab then shows the other types.</p>
      <div class="table-responsive">
        <table id="wtTable" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr><th>For</th><th>Tab</th><th>Opens</th><th>Client type</th><th>Inside a call</th><th>Order</th><th>On</th><th class="no-export">Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="wtModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="wtSave(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="wtTitle">Add rule</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <div class="col-md-6"><label class="form-label">Rule for</label>
          <select class="form-select" id="w_type" data-no-search onchange="wtTypeChanged()">
            <option value="ALL">Everyone</option><option value="HIERARCHY_LEVEL">A hierarchy level</option><option value="DESIGNATION">A designation</option><option value="EMP_ID">One employee</option></select></div>
        <div class="col-md-6" id="w_valWrap"><label class="form-label" id="w_valLabel">Value</label><select class="form-select" id="w_val"></select></div>
        <div class="col-md-6"><label class="form-label">Tab code <span class="required-star">*</span></label>
          <input class="form-control text-uppercase" id="w_code" list="w_codes" maxlength="30" placeholder="RETAILER" oninput="wtCodePicked()" /><datalist id="w_codes"></datalist></div>
        <div class="col-md-6"><label class="form-label">Tab name <span class="required-star">*</span></label><input class="form-control" id="w_name" maxlength="60" placeholder="Retailer Check-in" /></div>
        <div class="col-md-6"><label class="form-label">Opens</label>
          <select class="form-select" id="w_form" data-no-search onchange="wtFormChanged()">
            <option value="CHECKIN">Check-in (listed clients)</option><option value="UNLISTED">Unlisted check-in</option><option value="EXPENSE">Daily expense</option><option value="JOINT">Joint working</option><option value="DAYEND">Day end</option></select></div>
        <div class="col-md-6" id="w_ctWrap"><label class="form-label">Only this client type</label><select class="form-select" id="w_ct"></select></div>
        <div class="col-12" id="w_subWrap"><label class="form-label d-block">Inside a call</label>
          <label class="me-3"><input type="checkbox" class="form-check-input w-sub" value="ITEMS"> Items (sample / gift / POB)</label>
          <label class="me-3"><input type="checkbox" class="form-check-input w-sub" value="LEAFLETS"> Leaflets</label>
          <label><input type="checkbox" class="form-check-input w-sub" value="TREATMENT"> Treatment</label></div>
        <div class="col-md-6"><label class="form-label">Order</label><input type="number" class="form-control" id="w_sort" min="0" max="999" value="100" /></div>
        <div class="col-md-6 d-flex align-items-end"><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="w_on" checked><label class="form-check-label" for="w_on">Tab is ON for this target</label></div></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>
</template>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null, ROWS = [], LK = {};
  const EP = API.master.dcrSubmit;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  const FORM_NAME = { CHECKIN: 'Check-in', UNLISTED: 'Unlisted', EXPENSE: 'Expense', JOINT: 'Joint working', DAYEND: 'Day end' };

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#wtModal');
    try {
      LK = await Api.get(API.lookups, { query: { keys: 'employees,designations,clientTypes' } });
      SFA.fillSelect(document.getElementById('w_ct'), LK.clientTypes || []);
      await reload();
    } catch (e) { SFA.toast(e.message, false); }
  };
  async function reload() {
    ROWS = await Api.get(EP.worktypes);
    document.getElementById('w_codes').innerHTML = [...new Set(ROWS.map(r => r.worktypeCode))].map(c => `<option value="${esc(c)}">`).join('');
    if (DT) DT.destroy();
    document.querySelector('#wtTable tbody').innerHTML = ROWS.map(r => `<tr>
      <td>${r.targetType === 'ALL' ? '<span class="badge bg-secondary">Everyone</span>' : esc(r.targetLabel) + ' <small class="text-muted">' + esc(r.targetType.replace('_', ' ').toLowerCase()) + '</small>'}</td>
      <td><b>${esc(r.displayName)}</b> <small class="text-muted">${esc(r.worktypeCode)}</small></td><td>${esc(FORM_NAME[r.formOpen] || r.formOpen)}</td>
      <td>${esc(r.clientTypeName)}</td><td>${esc((r.subForms || '').replace(/,/g, ', '))}</td><td>${r.sortOrder}</td>
      <td>${r.enabled ? '<span class="badge badge-active">On</span>' : '<span class="badge badge-inactive">Off</span>'}</td>
      <td class="no-export"><button class="btn btn-sm btn-outline-primary" title="Edit" onclick="wtEdit(${r.id})"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-sm btn-outline-${r.enabled ? 'danger' : 'success'}" title="${r.enabled ? 'Switch off' : 'Switch on'}" onclick="wtToggle(${r.id})"><i class="bi bi-${r.enabled ? 'toggle-on' : 'toggle-off'}"></i></button>
        ${r.targetType === 'ALL' ? '' : `<button class="btn btn-sm btn-outline-danger" title="Delete this rule" onclick="wtDelete(${r.id})"><i class="bi bi-trash"></i></button>`}</td></tr>`).join('');
    DT = sfaDataTable('#wtTable');
  }
  function fillValue(type, sel) {
    const el = document.getElementById('w_val'), wrap = document.getElementById('w_valWrap');
    wrap.style.display = type === 'ALL' ? 'none' : '';
    document.getElementById('w_valLabel').textContent = type === 'EMP_ID' ? 'Employee' : type === 'DESIGNATION' ? 'Designation' : 'Hierarchy level';
    if (type === 'EMP_ID') SFA.fillSelect(el, LK.employees || []);
    else if (type === 'DESIGNATION') SFA.fillSelect(el, LK.designations || []);
    else if (type === 'HIERARCHY_LEVEL') {
      const levels = [...new Set((LK.designations || []).map(d => d.hierarchyLevel).filter(x => x != null))].sort((a, b) => a - b);
      el.innerHTML = '<option value="">--</option>' + levels.map(l => `<option value="${l}">Level ${l}</option>`).join('');
    }
    el.value = sel || '';
  }
  function wtTypeChanged() { fillValue(document.getElementById('w_type').value, ''); }
  function wtFormChanged() {
    const f = document.getElementById('w_form').value;
    document.getElementById('w_ctWrap').style.display = f === 'CHECKIN' ? '' : 'none';
    document.getElementById('w_subWrap').style.display = f === 'CHECKIN' || f === 'UNLISTED' ? '' : 'none';
  }
  function wtCodePicked() {   // copy the settings of an existing tab with that code
    const r = ROWS.find(x => x.worktypeCode === document.getElementById('w_code').value.toUpperCase().trim() && x.targetType === 'ALL');
    if (!r || document.getElementById('w_name').value) return;
    document.getElementById('w_name').value = r.displayName; document.getElementById('w_form').value = r.formOpen;
    document.querySelectorAll('.w-sub').forEach(c => c.checked = (r.subForms || '').split(',').includes(c.value)); wtFormChanged();
  }
  function setForm(r) {
    document.getElementById('w_type').value = r.targetType || 'ALL'; fillValue(r.targetType || 'ALL', r.targetValue);
    document.getElementById('w_code').value = r.worktypeCode || ''; document.getElementById('w_code').readOnly = !!r.id;
    document.getElementById('w_name').value = r.displayName || ''; document.getElementById('w_form').value = r.formOpen || 'CHECKIN';
    document.getElementById('w_ct').value = r.clientTypeId || '';
    document.querySelectorAll('.w-sub').forEach(c => c.checked = (r.subForms || '').split(',').includes(c.value));
    document.getElementById('w_sort').value = r.sortOrder == null ? 100 : r.sortOrder; document.getElementById('w_on').checked = r.enabled !== false && r.enabled !== 0;
    document.getElementById('w_type').disabled = !!r.id; document.getElementById('w_val').disabled = !!r.id;
    wtFormChanged();
  }
  function wtAdd() { setForm({ targetType: 'EMP_ID', formOpen: 'CHECKIN', enabled: true }); document.getElementById('wtTitle').textContent = 'Add rule'; MODAL.show(); }
  function wtEdit(id) { setForm(ROWS.find(r => r.id === id)); document.getElementById('wtTitle').textContent = 'Edit rule'; MODAL.show(); }
  async function post(r, enabled) {
    await Api.post(EP.worktypes, { targetType: r.targetType, targetValue: r.targetValue, worktypeCode: r.worktypeCode, displayName: r.displayName, formOpen: r.formOpen,
      clientTypeId: r.clientTypeId, subForms: r.subForms ? r.subForms.split(',') : [], sortOrder: r.sortOrder, enabled });
  }
  async function wtToggle(id) {
    const r = ROWS.find(x => x.id === id);
    try { await post(r, !r.enabled); await reload(); SFA.toast(r.enabled ? 'Tab switched off' : 'Tab switched on'); } catch (e) { SFA.toast(e.message, false); }
  }
  async function wtDelete(id) {
    if (!confirm('Delete this rule? The user then gets the tab as per the next rule (designation / level / everyone).')) return;
    try { await Api.del(EP.worktype(id)); await reload(); SFA.toast('Rule deleted'); } catch (e) { SFA.toast(e.message, false); }
  }
  async function wtSave(ev) {
    ev.preventDefault();
    const v = id => document.getElementById(id).value.trim();
    const body = { targetType: v('w_type'), targetValue: v('w_val'), worktypeCode: v('w_code'), displayName: v('w_name'), formOpen: v('w_form'),
      clientTypeId: v('w_form') === 'CHECKIN' && v('w_ct') ? Number(v('w_ct')) : null,
      subForms: ['CHECKIN', 'UNLISTED'].includes(v('w_form')) ? [...document.querySelectorAll('.w-sub:checked')].map(c => c.value) : [],
      sortOrder: Number(v('w_sort') || 100), enabled: document.getElementById('w_on').checked };
    try { await Api.post(EP.worktypes, body); MODAL.hide(); await reload(); SFA.toast('Rule saved'); } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
