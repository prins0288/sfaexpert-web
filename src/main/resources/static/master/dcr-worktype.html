<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; DCR Tabs</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="dcrworktype" data-title="DCR Tabs"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header"><i class="bi bi-ui-checks-grid"></i> DCR Work Types &amp; Tabs
      <div class="card-tools"><button class="btn btn-sm btn-primary" onclick="wtAdd()"><i class="bi bi-plus-lg"></i> Add</button></div></div>
    <div class="card-body">
      <div class="row g-2 align-items-end mb-2">
        <div class="col-md-5"><label class="form-label mb-1">Showing</label>
          <select class="form-select" id="w_scope" onchange="reload()"></select></div>
        <div class="col-md-7"><p class="text-muted small mb-0" id="w_hint"></p></div>
      </div>
      <p class="text-muted small mb-2"><b>Master</b> rows are the default. A new employee gets a copy of the master rows; after that you can change that employee's own rows
        (rename a label, switch a tab off, add another). An employee with no rows of their own sees the master rows. <b>Code</b> is the backend value, <b>Label</b> is what the user sees.</p>
      <div class="table-responsive">
        <table id="wtTable" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr><th>Label</th><th>Code</th><th>Type</th><th>Opens</th><th>Client type</th><th>Inside a call</th><th>Order</th><th>On</th><th class="no-export">Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="modal fade" id="wtModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="wtSave(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="wtTitle">Add</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <div class="col-md-6"><label class="form-label">Code (backend) <span class="required-star">*</span></label>
          <input class="form-control text-uppercase" id="w_code" maxlength="30" placeholder="RETAILER" /></div>
        <div class="col-md-6"><label class="form-label">Label (user sees) <span class="required-star">*</span></label><input class="form-control" id="w_name" maxlength="60" placeholder="Chemist Check In" /></div>
        <div class="col-md-6"><label class="form-label">Type</label>
          <select class="form-select" id="w_rtype" data-no-search onchange="wtTypeChanged()">
            <option value="wd">Day type (Start Day dropdown)</option><option value="attn">Attendance type (Start Day dropdown)</option>
            <option value="av">Client check-in tab</option><option value="tab">Other tab</option></select></div>
        <div class="col-md-6 d-flex align-items-end" id="w_fieldWrap"><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="w_field"><label class="form-check-label" for="w_field">Field day (client calls, start area)</label></div></div>
        <div class="col-md-6" id="w_formWrap"><label class="form-label">Opens</label>
          <select class="form-select" id="w_form" data-no-search onchange="wtTypeChanged()">
            <option value="CHECKIN">Check-in (listed clients)</option><option value="UNLISTED">Unlisted check-in</option><option value="EXPENSE">Daily expense</option><option value="JOINT">Joint working</option><option value="DAYEND">Day end</option></select></div>
        <div class="col-md-6" id="w_ctWrap"><label class="form-label">Only this client type</label><select class="form-select" id="w_ct"></select></div>
        <div class="col-12" id="w_subWrap"><label class="form-label d-block">Inside a call</label>
          <label class="me-3"><input type="checkbox" class="form-check-input w-sub" value="ITEMS"> Items (sample / gift / POB)</label>
          <label class="me-3"><input type="checkbox" class="form-check-input w-sub" value="LEAFLETS"> Leaflets</label>
          <label><input type="checkbox" class="form-check-input w-sub" value="TREATMENT"> Treatment</label></div>
        <div class="col-md-4"><label class="form-label">Order</label><input type="number" class="form-control" id="w_sort" min="0" max="999" value="100" /></div>
        <div class="col-md-4"><label class="form-label">Icon</label><input class="form-control" id="w_icon" maxlength="40" placeholder="person-badge" /></div>
        <div class="col-md-4 d-flex align-items-end"><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="w_on" checked><label class="form-check-label" for="w_on">On</label></div></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>
</template>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null, ROWS = [], LK = {}, DATA = {};
  const EP = API.master.dcrSubmit;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  const FORM_NAME = { CHECKIN: 'Check-in', UNLISTED: 'Unlisted', EXPENSE: 'Expense', JOINT: 'Joint working', DAYEND: 'Day end', WORK: 'Field work', ATTN: 'Attendance' };
  const TYPE_NAME = { wd: 'Day type', attn: 'Attendance type', av: 'Check-in tab', tab: 'Other tab' };
  const scope = () => document.getElementById('w_scope').value;
  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#wtModal');
    try {
      LK = await Api.get(API.lookups, { query: { keys: 'employees,clientTypes' } });
      SFA.fillSelect(document.getElementById('w_ct'), LK.clientTypes || []);
      document.getElementById('w_scope').innerHTML = '<option value="">Master (default for everyone)</option>' +
        (LK.employees || []).map(e => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('');
      await reload();
    } catch (e) { SFA.toast(e.message, false); }
  };
  async function reload() {
    DATA = await Api.get(EP.worktypes, { query: { empId: scope() } });
    ROWS = DATA.rows || [];
    document.getElementById('w_hint').innerHTML = DATA.master ? 'Editing the <b>master</b> rows.'
      : DATA.usesMaster ? 'This employee has no rows of their own yet - they see the master rows. Your first change here creates their own copy.' : 'Editing this employee\'s own rows.';
    if (DT) DT.destroy();
    document.querySelector('#wtTable tbody').innerHTML = ROWS.map(r => `<tr>
      <td><b>${esc(r.displayName)}</b></td><td><code>${esc(r.worktypeCode)}</code></td><td>${esc(TYPE_NAME[r.rowType] || r.rowType)}</td><td>${esc(FORM_NAME[r.formOpen] || r.formOpen)}</td>
      <td>${esc(r.clientTypeName)}</td><td>${esc((r.subForms || '').replace(/,/g, ', '))}</td><td>${r.sortOrder}</td>
      <td>${r.enabled ? '<span class="badge badge-active">On</span>' : '<span class="badge badge-inactive">Off</span>'}</td>
      <td class="no-export"><button class="btn btn-sm btn-outline-primary" title="Edit" onclick="wtEdit(${r.id})"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-sm btn-outline-${r.enabled ? 'danger' : 'success'}" title="${r.enabled ? 'Switch off' : 'Switch on'}" onclick="wtToggle(${r.id})"><i class="bi bi-${r.enabled ? 'toggle-on' : 'toggle-off'}"></i></button>
        ${DATA.master ? '' : `<button class="btn btn-sm btn-outline-danger" title="Delete" onclick="wtDelete(${r.id})"><i class="bi bi-trash"></i></button>`}</td></tr>`).join('');
    DT = sfaDataTable('#wtTable');
  }
  function wtTypeChanged() {
    const t = document.getElementById('w_rtype').value, day = t === 'wd' || t === 'attn';
    if (t === 'av') document.getElementById('w_form').value = 'CHECKIN';
    document.getElementById('w_formWrap').style.display = day ? 'none' : '';
    document.getElementById('w_fieldWrap').style.display = day ? '' : 'none';
    document.getElementById('w_form').disabled = t === 'av';
    document.getElementById('w_ctWrap').style.display = !day && document.getElementById('w_form').value === 'CHECKIN' ? '' : 'none';
    document.getElementById('w_subWrap').style.display = !day && ['CHECKIN', 'UNLISTED'].includes(document.getElementById('w_form').value) ? '' : 'none';
  }
  function setForm(r) {
    document.getElementById('w_code').value = r.worktypeCode || ''; document.getElementById('w_code').readOnly = !!r.id;
    document.getElementById('w_name').value = r.displayName || ''; document.getElementById('w_rtype').value = r.rowType || 'av';
    document.getElementById('w_form').value = ['WORK', 'ATTN'].includes(r.formOpen) ? 'CHECKIN' : (r.formOpen || 'CHECKIN');
    document.getElementById('w_ct').value = r.clientTypeId || '';
    document.getElementById('w_field').checked = r.formOpen === 'WORK';
    document.querySelectorAll('.w-sub').forEach(c => c.checked = (r.subForms || '').split(',').includes(c.value));
    document.getElementById('w_sort').value = r.sortOrder == null ? 100 : r.sortOrder; document.getElementById('w_icon').value = r.icon || '';
    document.getElementById('w_on').checked = r.enabled !== false && r.enabled !== 0;
    wtTypeChanged();
  }
  function wtAdd() { setForm({ rowType: 'av', enabled: true }); document.getElementById('wtTitle').textContent = 'Add'; MODAL.show(); }
  function wtEdit(id) { setForm(ROWS.find(r => r.id === id)); document.getElementById('wtTitle').textContent = 'Edit'; MODAL.show(); }
  async function post(r, enabled) {
    await Api.post(EP.worktypes, { empId: scope() || null, worktypeCode: r.worktypeCode, displayName: r.displayName, rowType: r.rowType, formOpen: r.formOpen,
      clientTypeId: r.clientTypeId, subForms: r.subForms ? r.subForms.split(',') : [], sortOrder: r.sortOrder, icon: r.icon, fieldWork: r.formOpen === 'WORK', enabled });
  }
  async function wtToggle(id) {
    const r = ROWS.find(x => x.id === id);
    try { await post(r, !r.enabled); await reload(); SFA.toast(r.enabled ? 'Switched off' : 'Switched on'); } catch (e) { SFA.toast(e.message, false); }
  }
  async function wtDelete(id) {
    if (!confirm('Delete this row for this employee?')) return;
    try { await Api.del(EP.worktype(id)); await reload(); SFA.toast('Deleted'); } catch (e) { SFA.toast(e.message, false); }
  }
  async function wtSave(ev) {
    ev.preventDefault();
    try {
      await Api.post(EP.worktypes, {
        empId: scope() || null, worktypeCode: document.getElementById('w_code').value, displayName: document.getElementById('w_name').value,
        rowType: document.getElementById('w_rtype').value, formOpen: document.getElementById('w_form').value, clientTypeId: document.getElementById('w_ct').value || null,
        subForms: [...document.querySelectorAll('.w-sub:checked')].map(c => c.value), sortOrder: document.getElementById('w_sort').value,
        icon: document.getElementById('w_icon').value, fieldWork: document.getElementById('w_field').checked, enabled: document.getElementById('w_on').checked });
      MODAL.hide(); await reload(); SFA.toast('Saved');
    } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
