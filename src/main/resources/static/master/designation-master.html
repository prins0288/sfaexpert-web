<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Designation Master</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="designationmaster" data-title="Create Designation"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-person-workspace"></i> Designations
      <div class="card-tools">
        <button data-perm="DESIGNATION_SAVE" class="btn btn-sm btn-primary" onclick="dsgAdd()"><i class="bi bi-plus-lg"></i> Add Single</button>
        <button data-perm="DESIGNATION_SAVE" class="btn btn-sm btn-outline-primary" onclick="dsgMultiAdd()"><i class="bi bi-plus-square"></i> Add Multiple</button>
      </div>
    </div>
    <div class="card-body">
      <p class="text-muted small mb-2">The <b>emp level</b> of a designation is copied to every employee holding it and decides
        their role: 1-4 User, 5-8 Manager, 9-20 Admin, 21+ Super Admin. Changing it updates those employees (from their next login).</p>
      <div class="table-responsive">
        <table id="dsgTable" data-screen-key="DESIGNATION_MASTER" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr>
            <th>S.No</th><th data-field="code">Code</th><th data-field="name">Name</th><th data-field="empLevel">Emp Level</th>
            <th data-field="role">Role</th><th data-field="employees">Employees</th><th data-field="status">Status</th><th class="no-export">Actions</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add / Edit -->
  <div class="modal fade" id="dsgModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="dsgSave(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="dsgModalTitle">Add Designation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <input type="hidden" id="d_oid" />
        <div class="col-md-5"><label class="form-label">Code <span class="required-star">*</span></label>
          <input class="form-control text-uppercase" id="d_designationCode" required maxlength="30" placeholder="DSG-MR" /></div>
        <div class="col-md-7"><label class="form-label">Name <span class="required-star">*</span></label>
          <input class="form-control" id="d_designationName" required maxlength="120" placeholder="Medical Representative" /></div>
        <div class="col-md-5"><label class="form-label">Emp Level <span class="required-star">*</span></label>
          <input type="number" class="form-control" id="d_empLevel" required min="1" max="99" step="1" placeholder="1" oninput="dsgRoleHint()" /></div>
        <div class="col-md-7 d-flex align-items-end"><div class="mb-2">Role: <span id="d_roleHint" class="badge bg-secondary">—</span></div></div>
        <div class="col-12"><div class="form-text" id="d_levelWarn"></div></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>

  <!-- Add Multiple -->
  <div class="modal fade" id="dsgMultiModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="dsgSaveMultiple(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title">Add Multiple &middot; Designations</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <table class="table table-bordered multi-row-table" id="dsgMultiTable">
          <thead><tr><th style="width:40px">#</th><th>Code *</th><th>Name *</th><th style="width:140px">Emp Level *</th><th style="width:60px"></th></tr></thead>
          <tbody>
            <tr>
              <td class="row-sno">1</td>
              <td><input class="form-control text-uppercase" name="designationCode" maxlength="30" /></td>
              <td><input class="form-control" name="designationName" maxlength="120" /></td>
              <td><input type="number" class="form-control" name="empLevel" min="1" max="99" step="1" /></td>
              <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="sfaRemoveRow(this,'dsgMultiTable')"><i class="bi bi-x"></i></button></td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="sfaAddRow('dsgMultiTable')"><i class="bi bi-plus"></i> Add Row</button>
        <div id="dsgMultiResult" class="mt-2 small text-danger"></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null, MULTI = null, ROWS = [], EDIT_LEVEL = null;
  const EP = API.master.designationMaster;

  const boolBadge = (b) => (b
    ? '<span class="badge badge-active">Active</span>'
    : '<span class="badge badge-inactive">Inactive</span>');
  // same bands as RoleLevelMapper on the server
  const roleFor = (lvl) => lvl == null || lvl === '' ? '' : (lvl >= 21 ? 'SUPER_ADMIN' : lvl >= 9 ? 'ADMIN' : lvl >= 5 ? 'MANAGER' : 'USER');
  const ROLE_CLASS = { SUPER_ADMIN: 'bg-danger', ADMIN: 'bg-primary', MANAGER: 'bg-info text-dark', USER: 'bg-secondary' };
  const roleBadge = (role) => role ? `<span class="badge ${ROLE_CLASS[role] || 'bg-secondary'}">${SFA.esc(role)}</span>` : '';

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#dsgModal');
    MULTI = new bootstrap.Modal('#dsgMultiModal');
    try { await reload(); } catch (e) { SFA.toast(e.message, false); }
  };

  async function reload() {
    ROWS = await Api.get(EP.list);
    if (DT) { DT.destroy(); }
    document.querySelector('#dsgTable tbody').innerHTML = ROWS.map((r, i) => `
      <tr>
        <td>${i + 1}</td><td>${SFA.esc(r.designationCode)}</td><td>${SFA.esc(r.designationName)}</td>
        <td>${r.empLevel ?? ''}</td><td>${roleBadge(r.role)}</td><td>${r.employeeCount ?? 0}</td>
        <td>${boolBadge(r.status)}</td>
        <td class="no-export">
          <button data-perm="DESIGNATION_SAVE" class="btn btn-sm btn-outline-primary" onclick="dsgEdit(${r.oid})"><i class="bi bi-pencil"></i></button>
          ${r.status
            ? `<button data-perm="DESIGNATION_STATUS" class="btn btn-sm btn-outline-danger" onclick="dsgStatus(${r.oid},false)"><i class="bi bi-slash-circle"></i></button>`
            : `<button data-perm="DESIGNATION_STATUS" class="btn btn-sm btn-outline-success" onclick="dsgStatus(${r.oid},true)"><i class="bi bi-check-circle"></i></button>`}
        </td>
      </tr>`).join('');
    DT = sfaDataTable('#dsgTable');
  }

  function dsgRoleHint() {
    const raw = document.getElementById('d_empLevel').value;
    const lvl = raw === '' ? null : Number(raw);
    const role = roleFor(lvl);
    const el = document.getElementById('d_roleHint');
    el.textContent = role || '—';
    el.className = 'badge ' + (ROLE_CLASS[role] || 'bg-secondary');
    const r = ROWS.find(x => String(x.oid) === document.getElementById('d_oid').value);
    document.getElementById('d_levelWarn').textContent = (r && r.employeeCount && EDIT_LEVEL != null && lvl !== EDIT_LEVEL)
      ? `Saving will change the level (and role) of ${r.employeeCount} employee(s) with this designation.` : '';
  }

  function dsgAdd() {
    ['d_oid', 'd_designationCode', 'd_designationName', 'd_empLevel'].forEach(id => document.getElementById(id).value = '');
    EDIT_LEVEL = null;
    dsgRoleHint();
    document.getElementById('dsgModalTitle').textContent = 'Add Designation';
    MODAL.show();
  }
  function dsgEdit(oid) {
    const r = ROWS.find(x => x.oid === oid);
    if (!r) return;
    document.getElementById('d_oid').value = r.oid;
    document.getElementById('d_designationCode').value = r.designationCode || '';
    document.getElementById('d_designationName').value = r.designationName || '';
    document.getElementById('d_empLevel').value = r.empLevel ?? '';
    EDIT_LEVEL = r.empLevel ?? null;
    dsgRoleHint();
    document.getElementById('dsgModalTitle').textContent = 'Edit Designation';
    MODAL.show();
  }
  async function dsgSave(ev) {
    ev.preventDefault();
    const v = id => { const x = document.getElementById(id).value.trim(); return x === '' ? null : x; };
    const body = {
      oid: v('d_oid'), designationCode: v('d_designationCode'), designationName: v('d_designationName'),
      empLevel: v('d_empLevel') === null ? null : Number(v('d_empLevel'))
    };
    try { await Api.post(EP.save, body); MODAL.hide(); await reload(); SFA.toast('Saved'); }
    catch (e) { SFA.toast(e.message, false); }
  }
  async function dsgStatus(oid, status) {
    const r = ROWS.find(x => x.oid === oid);
    const extra = (!status && r && r.employeeCount) ? '\n' + r.employeeCount + ' employee(s) still have this designation.' : '';
    if (!confirm((status ? 'Activate this designation?' : 'Deactivate this designation?') + extra)) return;
    try { await Api.post(EP.status(oid), null, { query: { status } }); await reload(); }
    catch (e) { SFA.toast(e.message, false); }
  }

  // ---- Add Multiple ----
  function dsgMultiAdd() {
    const tb = document.querySelector('#dsgMultiTable tbody');
    const rows = tb.querySelectorAll('tr');
    for (let i = rows.length - 1; i > 0; i--) rows[i].remove();
    tb.querySelector('tr').querySelectorAll('input').forEach(x => x.value = '');
    document.getElementById('dsgMultiResult').innerHTML = '';
    MULTI.show();
  }
  async function dsgSaveMultiple(ev) {
    ev.preventDefault();
    const rows = [];
    document.querySelectorAll('#dsgMultiTable tbody tr').forEach(tr => {
      const g = n => { const x = tr.querySelector('[name="' + n + '"]').value.trim(); return x === '' ? null : x; };
      const o = { designationCode: g('designationCode'), designationName: g('designationName'), empLevel: g('empLevel') === null ? null : Number(g('empLevel')) };
      if (o.designationCode || o.designationName || o.empLevel != null) rows.push(o);
    });
    if (!rows.length) { SFA.toast('No rows to save', false); return; }
    try {
      const res = await Api.post(EP.saveMultiple, rows);
      await reload();
      if (res.skipped) {
        document.getElementById('dsgMultiResult').innerHTML = (res.errors || []).map(e => SFA.esc(e)).join('<br>');
        SFA.toast(res.saved + ' saved, ' + res.skipped + ' skipped', false);
      } else {
        MULTI.hide(); SFA.toast(res.saved + ' saved');
      }
    } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
