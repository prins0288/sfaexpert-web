<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Designation Master</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="designationmaster" data-title="Create Designation"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-person-workspace"></i> Designations
      <div class="card-tools">
        <button data-perm="DESIGNATION_SAVE" class="btn btn-sm btn-primary" onclick="dsgAdd()"><i class="bi bi-plus-lg"></i> Add Single</button>
        <button data-perm="DESIGNATION_SAVE" class="btn btn-sm btn-outline-primary" onclick="dsgMultiAdd()"><i class="bi bi-plus-square"></i> Add Multiple</button>
      </div>
    </div>
    <div class="card-body">
      <p class="text-muted small mb-2" id="dsgNote">Each employee holds a designation; its <b>hierarchy level</b> (unique, higher = more senior) decides their role
        by the ranges in Settings &gt; General &gt; Role by hierarchy level. Changes apply from the employee's next login.
        <i class="bi bi-lock-fill"></i> Admin / Super Admin designations are managed by the backend only — they cannot be added, edited or deactivated here.</p>
      <div class="table-responsive">
        <table id="dsgTable" data-screen-key="DESIGNATION_MASTER" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr>
            <th>S.No</th><th data-field="name">Designation</th><th data-field="hierarchyLevel">Hierarchy Level</th><th data-field="displayOrder">Display Order</th>
            <th data-field="grade">Grade</th><th data-field="role">Role</th><th data-field="employees">Employees</th>
            <th data-field="status">Status</th><th class="no-export">Actions</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add / Edit -->
  <div class="modal fade" id="dsgModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="dsgSave(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="dsgModalTitle">Add Designation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <input type="hidden" id="d_id" />
        <div class="col-md-7"><label class="form-label">Designation <span class="required-star">*</span></label>
          <input class="form-control" id="d_designation" required maxlength="50" placeholder="MR / ABM / Dy. RSM" /></div>
        <div class="col-md-5"><label class="form-label">Hierarchy level <span class="required-star">*</span></label>
          <input type="number" class="form-control" id="d_hierarchyLevel" required min="1" max="9999" step="1" placeholder="10" oninput="dsgRoleHint()" /></div>
        <div class="col-md-4"><label class="form-label">Display order</label>
          <input type="number" class="form-control" id="d_displayOrder" min="0" max="9999" step="1" placeholder="Auto" /></div>
        <div class="col-md-4"><label class="form-label">Grade</label>
          <input class="form-control" id="d_grade" maxlength="20" list="d_gradeList" placeholder="Junior / Senior" />
          <datalist id="d_gradeList"><option>Junior</option><option>Senior</option></datalist></div>
        <div class="col-md-4"><label class="form-label">Category</label>
          <select class="form-select" id="d_designationCategory" data-no-search><option value="">--</option></select></div>
        <div class="col-12">Role: <span id="d_roleHint" class="badge bg-secondary">—</span> <small class="text-muted" id="d_rangeText"></small></div>
        <div class="col-12"><div class="form-text" id="d_levelWarn"></div></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>

  <!-- Add Multiple -->
  <div class="modal fade" id="dsgMultiModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="dsgSaveMultiple(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title">Add Multiple &middot; Designations</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <table class="table table-bordered multi-row-table" id="dsgMultiTable">
          <thead><tr><th style="width:40px">#</th><th>Designation *</th><th style="width:130px">Hierarchy level *</th><th style="width:120px">Display order</th>
            <th style="width:130px">Grade</th><th style="width:150px">Category</th><th style="width:60px"></th></tr></thead>
          <tbody>
            <tr>
              <td class="row-sno">1</td>
              <td><input class="form-control" name="designation" maxlength="50" /></td>
              <td><input type="number" class="form-control" name="hierarchyLevel" min="1" max="9999" step="1" /></td>
              <td><input type="number" class="form-control" name="displayOrder" min="0" max="9999" step="1" placeholder="Auto" /></td>
              <td><input class="form-control" name="grade" maxlength="20" list="d_gradeList" /></td>
              <td><select class="form-select" name="designationCategory" data-no-search><option value="">--</option>
                <option>Field</option><option>Manager</option><option>Admin</option><option>Support</option></select></td>
              <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="sfaRemoveRow(this,'dsgMultiTable')"><i class="bi bi-x"></i></button></td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="sfaAddRow('dsgMultiTable')"><i class="bi bi-plus"></i> Add Row</button>
        <div id="dsgMultiResult" class="mt-2 small text-danger"></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null, MULTI = null, ROWS = [], EDIT_LEVEL = null;
  let OPT = { categories: ['Field', 'Manager', 'Admin', 'Support'], managerFrom: 15, adminFrom: 50, superAdminFrom: 90 };
  const EP = API.master.designationMaster;
  const esc = (v) => SFA.esc(v == null ? '' : v);

  const boolBadge = (b) => (b
    ? '<span class="badge badge-active">Active</span>'
    : '<span class="badge badge-inactive">Inactive</span>');
  // same ranges as LevelRoleService on the server (company setting)
  const roleFor = (lvl) => lvl == null || lvl === '' || isNaN(lvl) ? ''
    : (lvl >= OPT.superAdminFrom ? 'SUPER_ADMIN' : lvl >= OPT.adminFrom ? 'ADMIN' : lvl >= OPT.managerFrom ? 'MANAGER' : 'USER');
  const ROLE_CLASS = { SUPER_ADMIN: 'bg-danger', ADMIN: 'bg-primary', MANAGER: 'bg-info text-dark', USER: 'bg-secondary' };
  // the Role column shows the designation's category (designation_category)
  const CATEGORY_CLASS = { field: 'bg-secondary', manager: 'bg-info text-dark', admin: 'bg-primary', support: 'bg-warning text-dark' };
  const categoryBadge = (c) => c ? `<span class="badge ${CATEGORY_CLASS[String(c).toLowerCase()] || 'bg-dark'}">${esc(c)}</span>` : '';

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#dsgModal');
    MULTI = new bootstrap.Modal('#dsgMultiModal');
    try {
      OPT = await Api.get(EP.options);
      const sel = document.getElementById('d_designationCategory');
      sel.innerHTML = '<option value="">--</option>' + OPT.categories.map(c => `<option>${esc(c)}</option>`).join('');
      document.getElementById('d_rangeText').textContent =
        `(User below ${OPT.managerFrom}, Manager ${OPT.managerFrom}+, Admin ${OPT.adminFrom}+, Super Admin ${OPT.superAdminFrom}+)`;
      await reload();
    } catch (e) { SFA.toast(e.message, false); }
  };

  async function reload() {
    ROWS = await Api.get(EP.list);
    if (DT) { DT.destroy(); }
    document.querySelector('#dsgTable tbody').innerHTML = ROWS.map((r, i) => `
      <tr>
        <td>${i + 1}</td><td>${esc(r.designation)}</td><td>${r.hierarchyLevel ?? ''}</td><td>${r.displayOrder ?? ''}</td>
        <td>${esc(r.grade)}</td><td>${categoryBadge(r.designationCategory)}</td><td>${r.employeeCount ?? 0}</td>
        <td>${boolBadge(r.active)}</td>
        <td class="no-export">${r.locked ? '<span class="text-muted" title="Admin / Super Admin designation — managed by the backend only"><i class="bi bi-lock-fill"></i> Locked</span>' : `
          <button data-perm="DESIGNATION_SAVE" class="btn btn-sm btn-outline-primary" title="Edit" onclick="dsgEdit(${r.id})"><i class="bi bi-pencil"></i></button>
          ${r.active
            ? `<button data-perm="DESIGNATION_STATUS" class="btn btn-sm btn-outline-danger" title="Deactivate" onclick="dsgStatus(${r.id},false)"><i class="bi bi-slash-circle"></i></button>`
            : `<button data-perm="DESIGNATION_STATUS" class="btn btn-sm btn-outline-success" title="Activate" onclick="dsgStatus(${r.id},true)"><i class="bi bi-check-circle"></i></button>`}`}
        </td>
      </tr>`).join('');
    DT = sfaDataTable('#dsgTable');
  }

  function dsgRoleHint() {
    const raw = document.getElementById('d_hierarchyLevel').value;
    const lvl = raw === '' ? null : Number(raw);
    const role = roleFor(lvl);
    const el = document.getElementById('d_roleHint');
    el.textContent = role || '—';
    el.className = 'badge ' + (ROLE_CLASS[role] || 'bg-secondary');
    const r = ROWS.find(x => String(x.id) === document.getElementById('d_id').value);
    const taken = lvl != null && ROWS.find(x => x.hierarchyLevel === lvl && String(x.id) !== document.getElementById('d_id').value);
    document.getElementById('d_levelWarn').textContent = (role === 'ADMIN' || role === 'SUPER_ADMIN')
      ? `Level ${lvl} is in the Admin range — Admin / Super Admin designations are managed by the backend only. Use a level below ${OPT.adminFrom}.`
      : taken ? `Level ${lvl} is already used by ${taken.designation}.`
      : (r && r.employeeCount && EDIT_LEVEL != null && lvl !== EDIT_LEVEL && roleFor(EDIT_LEVEL) !== role)
        ? `Saving changes the role of ${r.employeeCount} employee(s) with this designation to ${role} (from their next login).` : '';
  }

  function dsgAdd() {
    ['d_id', 'd_designation', 'd_hierarchyLevel', 'd_displayOrder', 'd_grade', 'd_designationCategory'].forEach(id => document.getElementById(id).value = '');
    EDIT_LEVEL = null;
    dsgRoleHint();
    document.getElementById('dsgModalTitle').textContent = 'Add Designation';
    MODAL.show();
  }
  function dsgEdit(id) {
    const r = ROWS.find(x => x.id === id);
    if (!r) return;
    document.getElementById('d_id').value = r.id;
    document.getElementById('d_designation').value = r.designation || '';
    document.getElementById('d_hierarchyLevel').value = r.hierarchyLevel ?? '';
    document.getElementById('d_displayOrder').value = r.displayOrder ?? '';
    document.getElementById('d_grade').value = r.grade || '';
    document.getElementById('d_designationCategory').value = r.designationCategory || '';
    EDIT_LEVEL = r.hierarchyLevel ?? null;
    dsgRoleHint();
    document.getElementById('dsgModalTitle').textContent = 'Edit Designation';
    MODAL.show();
  }
  const num = (x) => x === null ? null : Number(x);
  async function dsgSave(ev) {
    ev.preventDefault();
    const v = id => { const x = document.getElementById(id).value.trim(); return x === '' ? null : x; };
    const body = {
      id: v('d_id'), designation: v('d_designation'), hierarchyLevel: num(v('d_hierarchyLevel')),
      displayOrder: num(v('d_displayOrder')), grade: v('d_grade'), designationCategory: v('d_designationCategory')
    };
    try { await Api.post(EP.save, body); MODAL.hide(); await reload(); SFA.toast(body.id ? 'Designation updated' : 'Designation added'); }
    catch (e) { SFA.toast(e.message, false); }
  }
  async function dsgStatus(id, status) {
    if (!confirm(status ? 'Activate this designation?' : 'Deactivate this designation?')) return;
    try { await Api.post(EP.status(id), null, { query: { status } }); await reload(); SFA.toast(status ? 'Activated' : 'Deactivated'); }
    catch (e) { SFA.toast(e.message, false); }
  }

  // ---- Add Multiple ----
  function dsgMultiAdd() {
    const tb = document.querySelector('#dsgMultiTable tbody');
    const rows = tb.querySelectorAll('tr');
    for (let i = rows.length - 1; i > 0; i--) rows[i].remove();
    tb.querySelector('tr').querySelectorAll('input, select').forEach(x => x.value = '');
    document.getElementById('dsgMultiResult').innerHTML = '';
    MULTI.show();
  }
  async function dsgSaveMultiple(ev) {
    ev.preventDefault();
    const rows = [];
    document.querySelectorAll('#dsgMultiTable tbody tr').forEach(tr => {
      const g = n => { const x = tr.querySelector('[name="' + n + '"]').value.trim(); return x === '' ? null : x; };
      const o = { designation: g('designation'), hierarchyLevel: num(g('hierarchyLevel')), displayOrder: num(g('displayOrder')),
                  grade: g('grade'), designationCategory: g('designationCategory') };
      if (o.designation || o.hierarchyLevel != null) rows.push(o);
    });
    if (!rows.length) { SFA.toast('No rows to save', false); return; }
    try {
      const res = await Api.post(EP.saveMultiple, rows);
      await reload();
      if (res.skipped) {
        document.getElementById('dsgMultiResult').innerHTML = (res.errors || []).map(e => esc(e)).join('<br>');
        SFA.toast(res.saved + ' saved, ' + res.skipped + ' skipped', false);
      } else {
        MULTI.hide(); SFA.toast(res.saved + ' saved');
      }
    } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
