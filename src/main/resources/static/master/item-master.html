<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Item Master</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
  <style>
    #i_sections .accordion-button { padding: .6rem 1rem; font-weight: 500; }
    #i_sections .accordion-button .badge { margin-left: .5rem; }
    .i-row { border: 1px dashed var(--sfa-border, #dee2e6); border-radius: .5rem; padding: .75rem 2.25rem .75rem .75rem; margin-bottom: .5rem; position: relative; }
    .i-row .i-remove { position: absolute; top: .35rem; right: .35rem; }
    .i-row.i-inactive { opacity: .6; }
    #itTable td.i-comp { white-space: normal; min-width: 220px; max-width: 360px; }
  </style>
</head>
<body>
<div id="app" data-page="itemmaster" data-title="Item Master"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-capsule"></i> Items
      <div class="card-tools">
        <button data-perm="ITEM_SAVE" class="btn btn-sm btn-primary" onclick="itAdd()"><i class="bi bi-plus-lg"></i> Add Item</button>
        <button data-perm="ITEM_UPLOAD" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#itUploadModal"><i class="bi bi-upload"></i> Bulk Upload</button>
      </div>
    </div>
    <div class="card-body">
      <p class="text-muted small mb-2">PTS / PTR / MRP = today's rate (All India, else a state's). Use <b>Columns</b> / <b>Column Settings</b> to show HSN, GST, division and more.</p>
      <div class="table-responsive">
        <table id="itTable" data-screen-key="ITEM_MASTER" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr>
            <th>S.No</th><th data-field="image" class="no-export">Image</th><th data-field="code">Code</th><th data-field="name">Name</th>
            <th data-field="type">Type</th><th data-field="brand">Brand</th><th data-field="division">Division</th><th data-field="packSize">Pack Size</th>
            <th data-field="composition">Composition</th><th data-field="hsn">HSN</th><th data-field="gst">GST %</th>
            <th data-field="pts">PTS</th><th data-field="ptr">PTR</th><th data-field="mrp">MRP</th><th data-field="rateCount">Rates</th>
            <th data-field="manufacturer">Manufacturer</th><th data-field="status">Status</th><th data-field="created">Created</th><th data-field="updated">Updated</th>
            <th class="no-export">Actions</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add / Edit -->
  <div class="modal fade" id="itModal" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-lg-down">
    <form class="modal-content" id="itForm" onsubmit="itSave(event)" novalidate>
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="itModalTitle">Add Item</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="i_id" /><input type="hidden" id="i_version" />
        <div class="row g-3">
          <div class="col-md-3"><label class="form-label">Type <span class="required-star">*</span></label>
            <select class="form-select" id="i_itemTypeId" required onchange="itTypeChanged()"></select>
            <div class="invalid-feedback">Choose the item type</div>
            <div class="form-text" id="i_typeHelp">Product / Sample / Gift / Input — from Item Type Master</div></div>
          <div class="col-md-3"><label class="form-label">Item Code</label>
            <input class="form-control text-uppercase" id="i_itemCode" maxlength="50" placeholder="Auto — choose the Type"
                   oninput="CODE_SUGGESTED = null; document.getElementById('i_codeHelp').textContent = 'Your own code — must be unique'" />
            <div class="form-text" id="i_codeHelp">Made automatically: Product PD01, Gift GP01, Input IP01, Sample SP01</div></div>
          <div class="col-md-6"><label class="form-label">Item Name <span class="required-star">*</span></label>
            <input class="form-control" id="i_itemName" required maxlength="200" placeholder="Dolo 650" />
            <div class="invalid-feedback">Enter the item name</div></div>
        </div>

        <h6 class="text-muted mt-4">More details <small>(optional — click a section to open it)</small></h6>
        <div class="accordion" id="i_sections">

          <div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button"
              data-bs-toggle="collapse" data-bs-target="#s_details"><i class="bi bi-info-circle me-2"></i> Item details
              <span class="badge bg-success d-none" data-badge="details"></span></button></h2>
            <div id="s_details" class="accordion-collapse collapse"><div class="accordion-body"><div class="row g-3">
              <div class="col-md-4"><label class="form-label">Short Name</label><input class="form-control" id="i_shortName" maxlength="100" /></div>
              <div class="col-md-4"><label class="form-label">Brand</label><select class="form-select" id="i_brandId"></select></div>
              <div class="col-md-4"><label class="form-label">Division</label><select class="form-select" id="i_divisionId"></select></div>
              <div class="col-md-4"><label class="form-label">Class</label><input class="form-control" id="i_itemClass" maxlength="100" placeholder="Analgesic" /></div>
              <div class="col-md-4"><label class="form-label">Manufacturer</label><input class="form-control" id="i_manufacturer" maxlength="150" /></div>
              <div class="col-md-4"><label class="form-label">Unit</label><input class="form-control" id="i_uom" maxlength="20" list="i_uomList" placeholder="strip" /></div>
              <div class="col-md-4"><label class="form-label">Pack Size</label><input class="form-control" id="i_packSize" maxlength="50" placeholder="10x10" /></div>
              <div class="col-md-4"><label class="form-label">Sample Pack Size</label><input class="form-control" id="i_samplePackSize" maxlength="50" /></div>
              <div class="col-md-4"><label class="form-label">Main Item Code</label><input class="form-control" id="i_itemCodeMain" maxlength="100" /></div>
            </div></div></div></div>

          <div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button"
              data-bs-toggle="collapse" data-bs-target="#s_tax"><i class="bi bi-receipt me-2"></i> Tax (HSN / GST)
              <span class="badge bg-success d-none" data-badge="tax"></span></button></h2>
            <div id="s_tax" class="accordion-collapse collapse"><div class="accordion-body"><div class="row g-3">
              <div class="col-md-4"><label class="form-label">HSN Code</label><input class="form-control" id="i_hsnCode" inputmode="numeric" maxlength="8" placeholder="30049099" /></div>
              <div class="col-md-4"><label class="form-label">GST %</label><input class="form-control" id="i_gstRate" type="number" min="0" max="100" step="0.01" list="i_gstList" placeholder="12" /></div>
            </div></div></div></div>

          <div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button"
              data-bs-toggle="collapse" data-bs-target="#s_comp"><i class="bi bi-diagram-3 me-2"></i> Composition (salts)
              <span class="badge bg-success d-none" data-badge="comp"></span></button></h2>
            <div id="s_comp" class="accordion-collapse collapse"><div class="accordion-body">
              <p class="small text-muted mb-2">Type each salt with its strength — add as many lines as the item has. Names already used appear as suggestions.</p>
              <div id="il_comp"></div>
              <button type="button" class="btn btn-sm btn-outline-primary" onclick="itAddComp()"><i class="bi bi-plus"></i> Add composition</button>
              <div class="small mt-2"><span class="text-muted">Shows as:</span> <b id="i_compPreview">—</b></div>
            </div></div></div>

          <div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button"
              data-bs-toggle="collapse" data-bs-target="#s_rates"><i class="bi bi-currency-rupee me-2"></i> Rates (state / date-wise)
              <span class="badge bg-success d-none" data-badge="rates"></span></button></h2>
            <div id="s_rates" class="accordion-collapse collapse"><div class="accordion-body">
              <ul class="small text-muted mb-2 ps-3">
                <li>State blank = <b>All India</b>; a state's own rate is used first. <b>To</b> blank = current rate.</li>
                <li>A current rate is closed automatically the day before a newer rate of the same state starts.</li>
                <li>Type <b>Product</b> needs PTS, PTR and MRP (MRP &ge; PTR &ge; PTS); Sample / Gift / Input don't.</li>
              </ul>
              <div id="il_rates"></div>
              <button type="button" class="btn btn-sm btn-outline-primary" onclick="itAddRate()"><i class="bi bi-plus"></i> Add rate</button>
            </div></div></div>

          <div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button"
              data-bs-toggle="collapse" data-bs-target="#s_image"><i class="bi bi-image me-2"></i> Image
              <span class="badge bg-success d-none" data-badge="image"></span></button></h2>
            <div id="s_image" class="accordion-collapse collapse"><div class="accordion-body">
              <div id="i_image"></div>
            </div></div></div>
        </div>

        <datalist id="i_uomList"><option>strip</option><option>bottle</option><option>tube</option><option>box</option><option>vial</option><option>sachet</option><option>piece</option></datalist>
        <datalist id="i_gstList"><option>0</option><option>5</option><option>12</option><option>18</option><option>28</option></datalist>
        <datalist id="i_unitList"><option>mg</option><option>mcg</option><option>g</option><option>ml</option><option>IU</option><option>% w/w</option><option>% w/v</option></datalist>
        <datalist id="i_perList"><option>per tablet</option><option>per capsule</option><option>per 5 ml</option><option>per ml</option><option>per g</option><option>per sachet</option><option>per vial</option></datalist>
        <datalist id="i_molList"></datalist>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="i_saveBtn">Save</button></div>
    </form>
  </div></div>

  <!-- Bulk upload -->
  <div class="modal fade" id="itUploadModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="itUpload(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title">Bulk Upload &middot; Items, Rates, Composition</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <ul class="text-muted small ps-3">
          <li>One Excel file, 3 sheets — <b>Items</b>, <b>Rates</b>, <b>Composition</b>. Each sheet is optional (e.g. upload only Rates to change prices).</li>
          <li><b>Items:</b> <code>item_code</code> blank = new item, code made from the type (PD01, GP01, IP01, SP01 …) and listed below;
            an existing <code>item_code</code> updates that item (blank cell = keep the stored value).
            <code>item_type</code>, <code>division</code>, <code>brand</code> = code or name from the masters.</li>
          <li><b>Rates:</b> one row per item &times; state &times; <code>effective_from</code> (state blank = All India). The same item + state + date again updates that rate.</li>
          <li><b>Composition:</b> an item's lines in this sheet <b>replace</b> its stored composition, in row order.</li>
          <li>Dates 2026-04-01 or 01-04-2026; Y / N for status and tax_included. Bad rows are skipped and listed below.</li>
        </ul>
        <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="Api.download(EP.template,'item_master_template.xlsx').catch(e => SFA.toast(e.message, false))">
          <i class="bi bi-download"></i> Download template</button>
        <input type="file" class="form-control" id="itFile" name="file" accept=".xlsx,.xls" required />
        <div id="itUploadResult" class="mt-3"></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-accent" id="itUploadBtn">Upload</button></div>
    </form>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null, LK = null, ROWS = [], PICK = null;
  const EP = API.master.itemMaster;

  const esc = (v) => SFA.esc(v == null ? '' : v);
  const money = (v) => (v == null || v === '' ? '' : Number(v).toFixed(2));
  const auditCell = (by, at) => (by ? `<div>${esc(by)}</div><small class="text-muted">${esc(at || '')}</small>` : '');
  const boolBadge = (b) => (b ? '<span class="badge badge-active">Active</span>' : '<span class="badge badge-inactive">Inactive</span>');
  const fileMeta = (r) => ({ path: r.imagePath, thumbPath: r.thumbnailPath, type: r.imageType, size: r.imageSize,
    name: r.imageName || (r.imagePath ? r.imagePath.split('/').pop() : null) });

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#itModal');
    PICK = SFAFiles.picker(document.getElementById('i_image'), { maxMb: 5, keepName: true });
    const form = document.getElementById('itForm');
    form.addEventListener('input', itBadges);
    form.addEventListener('change', itBadges);
    document.getElementById('i_itemName').addEventListener('input', e => e.target.classList.remove('is-invalid'));
    document.getElementById('itUploadModal').addEventListener('show.bs.modal', () => document.getElementById('itUploadResult').innerHTML = '');
    try {
      LK = await Api.get(API.lookups, { query: { keys: 'itemTypes,brands,divisions,states' } });
      SFA.fillSelect(document.getElementById('i_itemTypeId'), LK.itemTypes, '-- Select --');
      SFA.fillSelect(document.getElementById('i_brandId'), LK.brands);
      SFA.fillSelect(document.getElementById('i_divisionId'), LK.divisions);
      await reload();
    } catch (e) { SFA.toast(e.message, false); }
  };

  async function reload() {
    ROWS = await Api.get(EP.list);
    if (DT) { DT.destroy(); }
    document.querySelector('#itTable tbody').innerHTML = ROWS.map((r, i) => {
      const cr = r.currentRate || {};
      return `
      <tr>
        <td>${i + 1}</td>
        <td class="no-export">${r.imagePath ? SFAFiles.thumb(r.imagePath, r.thumbnailPath, fileMeta(r)) : ''}</td>
        <td>${esc(r.itemCode)}</td><td>${esc(r.itemName)}</td><td>${esc(r.itemTypeName)}</td>
        <td>${esc(r.brandName)}</td><td>${esc(r.divisionName)}</td><td>${esc(r.packSize)}</td>
        <td class="i-comp">${esc(r.compositionText)}</td><td>${esc(r.hsnCode)}</td><td>${esc(r.gstRate)}</td>
        <td class="text-end">${money(cr.pts)}</td><td class="text-end">${money(cr.ptr)}</td>
        <td class="text-end" title="${esc(cr.stateName || '')}">${money(cr.mrp)}</td>
        <td class="text-end">${r.rateCount || 0}</td><td>${esc(r.manufacturer)}</td>
        <td>${boolBadge(r.status)}</td>
        <td>${auditCell(r.createdBy, r.createdAt)}</td><td>${auditCell(r.updatedBy, r.updatedAt)}</td>
        <td class="no-export">
          <button data-perm="ITEM_SAVE" class="btn btn-sm btn-outline-primary" onclick="itEdit(${r.id})"><i class="bi bi-pencil"></i></button>
          ${r.status
            ? `<button data-perm="ITEM_STATUS" class="btn btn-sm btn-outline-danger" onclick="itStatus(${r.id},false)"><i class="bi bi-slash-circle"></i></button>`
            : `<button data-perm="ITEM_STATUS" class="btn btn-sm btn-outline-success" onclick="itStatus(${r.id},true)"><i class="bi bi-check-circle"></i></button>`}
        </td>
      </tr>`; }).join('');
    DT = sfaDataTable('#itTable');
  }

  // ---- form ----
  const FIELDS = ['itemCode', 'itemName', 'itemTypeId', 'shortName', 'brandId', 'divisionId', 'itemClass', 'manufacturer',
    'uom', 'packSize', 'samplePackSize', 'itemCodeMain', 'hsnCode', 'gstRate'];

  async function loadMolecules() {
    try {
      const names = await Api.get(EP.molecules);
      document.getElementById('i_molList').innerHTML = (names || []).map(n => `<option value="${esc(n)}"></option>`).join('');
    } catch (e) { /* suggestions only */ }
  }

  function fillForm(r) {
    document.getElementById('i_id').value = r ? r.id : '';
    document.getElementById('i_version').value = r && r.version != null ? r.version : '';
    FIELDS.forEach(f => { document.getElementById('i_' + f).value = r && r[f] != null ? r[f] : ''; });
    document.querySelectorAll('#itForm .is-invalid').forEach(el => el.classList.remove('is-invalid'));
    CODE_SUGGESTED = null;
    document.getElementById('i_codeHelp').textContent = r ? 'You can change the code (must stay unique)'
      : 'Made automatically: Product PD01, Gift GP01, Input IP01, Sample SP01 — or type your own';
    document.getElementById('il_comp').innerHTML = '';
    document.getElementById('il_rates').innerHTML = '';
    ((r && r.compositions) || []).forEach(c => itAddComp(c));
    ((r && r.rates) || []).forEach(x => itAddRate(x));
    PICK.set(r && r.imagePath ? fileMeta(r) : null);
    // every optional section starts closed; the badges show what is filled
    document.querySelectorAll('#i_sections .accordion-collapse.show').forEach(el => bootstrap.Collapse.getOrCreateInstance(el, { toggle: false }).hide());
    itBadges();
  }

  // new item: show the code it will get (the real one is given on Save)
  // CODE_SUGGESTED = the auto code shown in the box (null once the user types their own)
  let codeReq = 0, CODE_SUGGESTED = null;
  async function itTypeChanged() {
    const sel = document.getElementById('i_itemTypeId');
    sel.classList.remove('is-invalid');
    if (document.getElementById('i_id').value) return;            // edit: type change keeps the code
    const code = document.getElementById('i_itemCode'), help = document.getElementById('i_codeHelp');
    if (code.value.trim() && CODE_SUGGESTED === null) return;     // keep a code the user typed
    code.value = ''; CODE_SUGGESTED = null;
    if (!sel.value) { help.textContent = 'Made automatically: Product PD01, Gift GP01, Input IP01, Sample SP01'; return; }
    const mine = ++codeReq;
    try {
      const res = await Api.get(EP.nextCode, { query: { itemTypeId: sel.value } });
      if (mine !== codeReq || (code.value.trim() && CODE_SUGGESTED === null)) return;
      code.value = res.itemCode; CODE_SUGGESTED = res.itemCode;
      help.textContent = 'Next free code (given for real on Save) — you can type your own';
    } catch (e) { help.textContent = 'Code is made on Save'; }
  }

  function itAdd() {
    fillForm(null);
    document.getElementById('itModalTitle').textContent = 'Add Item';
    loadMolecules();
    MODAL.show();
  }
  async function itEdit(id) {
    try {
      const r = await Api.get(EP.get(id));
      fillForm(r);
      document.getElementById('itModalTitle').textContent = 'Edit Item · ' + r.itemCode;
      loadMolecules();
      MODAL.show();
    } catch (e) { SFA.toast(e.message, false); }
  }

  // composition line
  function itAddComp(c) {
    c = c || {};
    const div = document.createElement('div');
    div.className = 'i-row i-comp-row';
    div.innerHTML = `
      <button type="button" class="btn btn-sm btn-outline-danger i-remove" title="Remove" onclick="this.closest('.i-row').remove(); itBadges()"><i class="bi bi-x"></i></button>
      <div class="row g-2">
        <div class="col-md-5"><label class="form-label small mb-0">Salt / Molecule <span class="required-star">*</span></label>
          <input class="form-control" data-k="moleculeName" maxlength="150" list="i_molList" placeholder="Paracetamol" value="${esc(c.moleculeName)}" /></div>
        <div class="col-4 col-md-2"><label class="form-label small mb-0">Strength</label>
          <input class="form-control" data-k="strength" type="number" min="0" step="any" placeholder="500" value="${esc(c.strength)}" /></div>
        <div class="col-4 col-md-2"><label class="form-label small mb-0">Unit</label>
          <input class="form-control" data-k="strengthUnit" maxlength="20" list="i_unitList" placeholder="mg" value="${esc(c.strengthUnit)}" /></div>
        <div class="col-4 col-md-3"><label class="form-label small mb-0">Per</label>
          <input class="form-control" data-k="perQty" maxlength="30" list="i_perList" placeholder="per tablet" value="${esc(c.perQty)}" /></div>
      </div>`;
    document.getElementById('il_comp').appendChild(div);
    if (!c.moleculeName) div.querySelector('input').focus();
    itBadges();
  }

  // rate line
  function itAddRate(x) {
    x = x || {};
    const div = document.createElement('div');
    div.className = 'i-row i-rate-row' + (x.status === false ? ' i-inactive' : '');
    const states = '<option value="">All India</option>' + (LK.states || []).map(s =>
      `<option value="${s.oid}" ${String(s.oid) === String(x.stateId) ? 'selected' : ''}>${esc(s.label)}</option>`).join('');
    const num = (k, label, ph) => `<div class="col-4 col-md-2 col-xl-1"><label class="form-label small mb-0">${label}</label>
      <input class="form-control" data-k="${k}" type="number" min="0" step="0.01" placeholder="${ph || ''}" value="${x[k] != null ? esc(x[k]) : ''}" /></div>`;
    div.innerHTML = `
      <button type="button" class="btn btn-sm btn-outline-danger i-remove" title="Remove" onclick="this.closest('.i-row').remove(); itBadges()"><i class="bi bi-x"></i></button>
      <input type="hidden" data-k="id" value="${x.id || ''}" />
      <div class="row g-2 align-items-end">
        <div class="col-md-3 col-xl-2"><label class="form-label small mb-0">State</label><select class="form-select" data-k="stateId">${states}</select></div>
        <div class="col-6 col-md-3 col-xl-2"><label class="form-label small mb-0">From <span class="required-star">*</span></label>
          <input class="form-control sfa-date" data-k="effectiveFrom" /></div>
        <div class="col-6 col-md-3 col-xl-2"><label class="form-label small mb-0">To</label>
          <input class="form-control sfa-date" data-k="effectiveTo" placeholder="current" /></div>
        ${num('pts', 'PTS')}${num('ptr', 'PTR')}${num('mrp', 'MRP')}
        ${num('purchaseRate', 'Purchase')}${num('sampleRate', 'Sample')}${num('discountPct', 'Disc %')}
        <div class="col-auto"><div class="form-check"><input class="form-check-input" type="checkbox" data-k="taxIncluded" ${x.taxIncluded ? 'checked' : ''}>
          <label class="form-check-label small">Tax incl.</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" data-k="status" ${x.status === false ? '' : 'checked'}
            onchange="this.closest('.i-row').classList.toggle('i-inactive', !this.checked)">
          <label class="form-check-label small">Active</label></div></div>
      </div>
      ${x.legacyItemId ? `<div class="form-text">Old item id: ${esc(x.legacyItemId)}</div>` : ''}`;
    document.getElementById('il_rates').appendChild(div);
    if (window.sfaFlatpickr) sfaFlatpickr(div);
    setDate(div.querySelector('[data-k="effectiveFrom"]'), x.effectiveFrom || (x.id ? '' : todayIso()));
    setDate(div.querySelector('[data-k="effectiveTo"]'), x.effectiveTo || '');
    itBadges();
  }
  function setDate(el, iso) { if (el._flatpickr) el._flatpickr.setDate(iso || null, false); else el.value = iso || ''; }
  function todayIso() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }

  function readRows(sel) {
    return [...document.querySelectorAll(sel)].map(row => {
      const o = {};
      row.querySelectorAll('[data-k]').forEach(el => {
        const k = el.getAttribute('data-k');
        if (el.type === 'checkbox') o[k] = el.checked;
        else { const v = el.value.trim(); o[k] = v === '' ? null : v; }
      });
      return o;
    });
  }
  const compLines = () => readRows('#il_comp .i-comp-row').filter(c => c.moleculeName || c.strength || c.strengthUnit || c.perQty);
  const rateLines = () => readRows('#il_rates .i-rate-row');

  // section badges + live composition text
  function itBadges() {
    const val = id => document.getElementById(id).value.trim();
    const filled = ['shortName', 'brandId', 'divisionId', 'itemClass', 'manufacturer', 'uom', 'packSize', 'samplePackSize', 'itemCodeMain']
      .filter(f => val('i_' + f)).length;
    const comps = compLines(), rates = rateLines();
    const set = (k, text) => { const b = document.querySelector(`[data-badge="${k}"]`); b.textContent = text || ''; b.classList.toggle('d-none', !text); };
    set('details', filled ? filled + ' filled' : '');
    set('tax', [val('i_hsnCode') && 'HSN', val('i_gstRate') && 'GST ' + val('i_gstRate') + '%'].filter(Boolean).join(' · '));
    set('comp', comps.length ? comps.length + (comps.length === 1 ? ' salt' : ' salts') : '');
    set('rates', rates.length ? rates.length + (rates.length === 1 ? ' rate' : ' rates') : '');
    set('image', PICK && (PICK.file() || (!PICK.removed() && document.querySelector('#i_image .sfa-file-thumb'))) ? 'added' : '');
    document.getElementById('i_compPreview').textContent = comps.filter(c => c.moleculeName).map(c =>
      [c.moleculeName, c.strength, c.strengthUnit].filter(Boolean).join(' ')).join(' + ') || '—';
  }

  // open the section holding a field the server complained about
  function openSectionFor(message) {
    const m = (message || '').toLowerCase();
    const id = m.startsWith('rate') || /pts|ptr|mrp|discount|overlap|state/.test(m) ? 's_rates'
      : m.startsWith('composition') ? 's_comp'
      : /hsn|gst/.test(m) ? 's_tax'
      : /short name|class|manufacturer|pack size|unit|main item code|brand|division/.test(m) ? 's_details'
      : /file|image|rename/.test(m) ? 's_image' : null;
    if (id) bootstrap.Collapse.getOrCreateInstance(document.getElementById(id), { toggle: false }).show();
  }

  async function itSave(ev) {
    ev.preventDefault();
    const v = id => { const x = document.getElementById(id).value.trim(); return x === '' ? null : x; };
    // say exactly which required field is empty, and point at it
    const missing = [];
    if (!v('i_itemTypeId')) missing.push(['i_itemTypeId', (LK.itemTypes || []).length
      ? 'Choose the item Type' : 'No item types found — add Product / Sample / Gift / Input in Item Type Master (or run 72_item_master.sql)']);
    if (!v('i_itemName')) missing.push(['i_itemName', 'Enter the Item Name']);
    document.querySelectorAll('#itForm .is-invalid').forEach(el => el.classList.remove('is-invalid'));
    if (missing.length) {
      missing.forEach(([id]) => document.getElementById(id).classList.add('is-invalid'));
      document.getElementById(missing[0][0]).focus();
      missing.forEach(([, msg]) => SFA.toast(msg, false));
      return;
    }
    const missingFrom = rateLines().findIndex(r => !r.effectiveFrom);
    if (missingFrom >= 0) { openSectionFor('rate'); SFA.toast('Rate line ' + (missingFrom + 1) + ': From date is required', false); return; }
    const missingName = compLines().findIndex(c => !c.moleculeName);
    if (missingName >= 0) { openSectionFor('composition'); SFA.toast('Composition line ' + (missingName + 1) + ': salt name is required', false); return; }
    const data = { id: v('i_id'), version: v('i_version') };
    FIELDS.forEach(f => data[f] = v('i_' + f));
    // new item still showing the suggested code: let the server give the next free one on save
    if (!data.id && (CODE_SUGGESTED !== null && (data.itemCode || '').toUpperCase() === CODE_SUGGESTED)) data.itemCode = null;
    data.compositions = compLines();
    data.rates = rateLines().map(r => ({ ...r, id: r.id ? Number(r.id) : null }));
    data.removeImage = PICK.removed();
    data.compressImage = PICK.compress();
    const btn = document.getElementById('i_saveBtn');
    btn.disabled = true;
    try {
      const saved = await Api.saveWithFiles(EP.save, data, { image: PICK.file() });
      MODAL.hide(); await reload();
      SFA.toast(data.id ? 'Item ' + saved.itemCode + ' updated' : 'Item ' + saved.itemCode + ' created');
    } catch (e) { openSectionFor(e.message); SFA.toast(e.message, false); }
    finally { btn.disabled = false; }
  }

  async function itStatus(id, status) {
    if (!confirm(status ? 'Activate this item?' : 'Deactivate this item?')) return;
    try { await Api.post(EP.status(id), null, { query: { status } }); await reload(); }
    catch (e) { SFA.toast(e.message, false); }
  }

  // ---- bulk upload ----
  async function itUpload(ev) {
    ev.preventDefault();
    const f = document.getElementById('itFile').files[0];
    if (!f) { SFA.toast('Choose a file', false); return; }
    const fd = new FormData(); fd.append('file', f);
    const out = document.getElementById('itUploadResult');
    const btn = document.getElementById('itUploadBtn');
    out.innerHTML = '';
    btn.disabled = true;
    try {
      const res = await Api.post(EP.upload, fd);
      document.getElementById('itFile').value = '';
      await reload();
      const errs = res.errors || [];
      out.innerHTML = `
        <div class="alert ${res.skipped ? 'alert-warning' : 'alert-success'} py-2 small mb-2">
          Items: <b>${res.created}</b> created, <b>${res.updated}</b> updated &middot; Rates: <b>${res.rates}</b> saved
          &middot; Composition: <b>${res.compositionItems}</b> items &middot; <b>${res.skipped}</b> rows skipped</div>
        ${(res.generatedCodes || []).length ? `<div class="small mb-2"><b>New item codes</b><ul class="mb-0 ps-3">${res.generatedCodes.map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>` : ''}
        ${errs.length ? `<div class="small text-danger"><b>Skipped</b><ul class="mb-0 ps-3">${errs.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}`;
    } catch (e) { SFA.toast(e.message, false); }
    finally { btn.disabled = false; }
  }
</script>
</body>
</html>
