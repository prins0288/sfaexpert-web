<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Products</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>
<body>
<div id="app" data-page="products" data-title="Products"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-box-seam"></i> Products
      <div class="card-tools">
        <button class="btn btn-sm btn-primary" onclick="prodAdd()"><i class="bi bi-plus-lg"></i> Add Product</button>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table id="prodTable" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr><th>S.No</th><th>ID</th><th>Name</th><th>Price</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="prodModal" tabindex="-1"><div class="modal-dialog">
    <form class="modal-content" onsubmit="prodSave(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title">Add Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <div class="col-md-8"><label class="form-label">Name <span class="required-star">*</span></label>
          <input class="form-control" id="p_name" required /></div>
        <div class="col-md-4"><label class="form-label">Price</label>
          <input class="form-control" id="p_price" type="number" step="0.01" /></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/shell.js"></script>
<script>
  let DT = null, MODAL = null;

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#prodModal');
    try { await reload(); } catch (e) { SFA.toast(e.message, false); }
  };

  async function reload() {
    const rows = await SFA.api('/api/products');
    if (DT) { DT.destroy(); }
    document.querySelector('#prodTable tbody').innerHTML = rows.map((p, i) =>
      `<tr><td>${i + 1}</td><td>${p.id}</td><td>${SFA.esc(p.name)}</td><td>${SFA.money(p.price)}</td></tr>`
    ).join('');
    DT = sfaDataTable('#prodTable');
  }

  function prodAdd() {
    document.getElementById('p_name').value = '';
    document.getElementById('p_price').value = '';
    MODAL.show();
  }
  async function prodSave(ev) {
    ev.preventDefault();
    const name = document.getElementById('p_name').value;
    const price = document.getElementById('p_price').value || null;
    try { await SFA.api('/api/products', { method: 'POST', body: { name, price } }); MODAL.hide(); await reload(); SFA.toast('Saved'); }
    catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
