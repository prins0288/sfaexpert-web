<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Route-Area</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="routearea" data-title="Route-Area Mapping"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-diagram-3"></i> Route &ndash; Area Mapping
      <div class="card-tools">
        <button data-perm="ROUTE_AREA_SAVE" class="btn btn-sm btn-primary" onclick="raAdd()"><i class="bi bi-plus-lg"></i> Map Areas to Route</button>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table id="raTable" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr>
            <th>S.No</th><th>Route Code</th><th>Route</th><th>Area Code</th><th>Area</th>
            <th>Visit Seq</th><th>Status</th><th class="no-export">Actions</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="raModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="raSave(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title">Map Areas to Route</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <div class="col-md-8"><label class="form-label">Route <span class="required-star">*</span></label>
          <select class="form-select" id="m_routeOid" required></select></div>
        <div class="col-md-4"><label class="form-label">Start Sequence</label>
          <input class="form-control" id="m_startSequence" type="number" value="1" /></div>
        <div class="col-12"><label class="form-label">Areas <span class="required-star">*</span>
          <small class="text-muted">(Ctrl/Cmd-click for multiple)</small></label>
          <select class="form-select" id="m_areaOids" multiple size="8" required></select></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Mapping</button></div>
    </form>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null;

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#raModal');
    try {
      const lk = await Api.get(API.lookups);
      SFA.fillSelect(document.getElementById('m_routeOid'), lk.routes);
      const areaSel = document.getElementById('m_areaOids');
      areaSel.innerHTML = (lk.areas || []).map(a => `<option value="${a.oid}">${SFA.esc(a.label)}</option>`).join('');
      await reload();
    } catch (e) { SFA.toast(e.message, false); }
  };

  async function reload() {
    const rows = await Api.get(API.master.routeArea.list);
    if (DT) { DT.destroy(); }
    document.querySelector('#raTable tbody').innerHTML = rows.map((r, i) => `
      <tr>
        <td>${i + 1}</td><td>${SFA.esc(r.routeCode)}</td><td>${SFA.esc(r.routeName)}</td>
        <td>${SFA.esc(r.areaCode)}</td><td>${SFA.esc(r.areaName)}</td>
        <td>${r.visitSequence == null ? '' : r.visitSequence}</td>
        <td>${SFA.statusBadge(r.status)}</td>
        <td class="no-export">
          ${r.status === 'Y'
            ? `<button data-perm="ROUTE_AREA_STATUS" class="btn btn-sm btn-outline-danger" onclick="raStatus(${r.oid},'N')"><i class="bi bi-slash-circle"></i></button>`
            : `<button data-perm="ROUTE_AREA_STATUS" class="btn btn-sm btn-outline-success" onclick="raStatus(${r.oid},'Y')"><i class="bi bi-check-circle"></i></button>`}
        </td>
      </tr>`).join('');
    DT = sfaDataTable('#raTable');
  }

  function raAdd() {
    document.getElementById('m_routeOid').value = '';
    document.getElementById('m_startSequence').value = '1';
    Array.from(document.getElementById('m_areaOids').options).forEach(o => o.selected = false);
    MODAL.show();
  }
  async function raSave(ev) {
    ev.preventDefault();
    const routeOid = document.getElementById('m_routeOid').value || null;
    const startSequence = document.getElementById('m_startSequence').value || 1;
    const areaOids = Array.from(document.getElementById('m_areaOids').selectedOptions).map(o => Number(o.value));
    try {
      const res = await Api.post(API.master.routeArea.save, { routeOid, areaOids, startSequence });
      MODAL.hide(); await reload(); SFA.toast(res.mapped + ' area(s) mapped');
    } catch (e) { SFA.toast(e.message, false); }
  }
  async function raStatus(oid, status) {
    if (!confirm(status === 'N' ? 'Remove this mapping?' : 'Restore this mapping?')) return;
    try { await Api.post(API.master.routeArea.status(oid), null, { query: { status } }); await reload(); }
    catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
