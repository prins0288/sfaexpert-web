<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Salutation Master</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="salutationmaster" data-title="Salutation Master"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header"><i class="bi bi-person-badge"></i> Salutations
      <div class="card-tools"><button data-perm="SALUTATION_SAVE" class="btn btn-sm btn-primary" onclick="slAdd()"><i class="bi bi-plus-lg"></i> Add</button></div>
    </div>
    <div class="card-body">
      <p class="text-muted small mb-2">Shown before names in Client Master and Create Employee (Dr. Anil Sharma). Forms save the text itself,
        so renaming or deactivating one here does not change clients / employees already saved with it.</p>
      <div class="table-responsive">
        <table id="slTable" data-screen-key="SALUTATION_MASTER" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr><th>S.No</th><th data-field="salutation">Salutation</th><th data-field="order">Display Order</th>
            <th data-field="status">Status</th><th class="no-export">Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="slModal" tabindex="-1"><div class="modal-dialog modal-sm modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="slSave(event)" novalidate>
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="slTitle">Add Salutation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="hidden" id="s_id" />
        <div class="mb-3"><label class="form-label">Salutation <span class="required-star">*</span></label>
          <input class="form-control" id="s_salutation" maxlength="20" placeholder="Dr." /></div>
        <div><label class="form-label">Display order</label>
          <input class="form-control" id="s_displayOrder" type="number" min="0" placeholder="0" /></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="s_saveBtn">Save</button></div>
    </form>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null, ROWS = [];
  const EP = API.master.salutation;
  const esc = (v) => SFA.esc(v == null ? '' : v);

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#slModal');
    try { await reload(); } catch (e) { SFA.toast(e.message, false); }
  };
  async function reload() {
    ROWS = await Api.get(EP.list);
    if (DT) { DT.destroy(); }
    document.querySelector('#slTable tbody').innerHTML = ROWS.map((r, i) => `
      <tr><td>${i + 1}</td><td>${esc(r.salutation)}</td><td>${esc(r.displayOrder)}</td>
        <td>${r.active ? '<span class="badge badge-active">Active</span>' : '<span class="badge badge-inactive">Inactive</span>'}</td>
        <td class="no-export">
          <button data-perm="SALUTATION_SAVE" class="btn btn-sm btn-outline-primary" onclick="slEdit(${r.id})"><i class="bi bi-pencil"></i></button>
          ${r.active
            ? `<button data-perm="SALUTATION_SAVE" class="btn btn-sm btn-outline-danger" onclick="slStatus(${r.id},false)"><i class="bi bi-slash-circle"></i></button>`
            : `<button data-perm="SALUTATION_SAVE" class="btn btn-sm btn-outline-success" onclick="slStatus(${r.id},true)"><i class="bi bi-check-circle"></i></button>`}
        </td></tr>`).join('');
    DT = sfaDataTable('#slTable');
  }
  function slAdd() {
    document.getElementById('s_id').value = '';
    document.getElementById('s_salutation').value = '';
    document.getElementById('s_displayOrder').value = ROWS.length ? Math.max(...ROWS.map(r => r.displayOrder || 0)) + 1 : 1;
    document.getElementById('slTitle').textContent = 'Add Salutation';
    MODAL.show();
  }
  function slEdit(id) {
    const r = ROWS.find(x => x.id === id);
    if (!r) return;
    document.getElementById('s_id').value = r.id;
    document.getElementById('s_salutation').value = r.salutation;
    document.getElementById('s_displayOrder').value = r.displayOrder;
    document.getElementById('slTitle').textContent = 'Edit Salutation';
    MODAL.show();
  }
  async function slSave(ev) {
    ev.preventDefault();
    const sal = document.getElementById('s_salutation').value.trim();
    if (!sal) { SFA.toast('Enter the salutation', false); return; }
    const btn = document.getElementById('s_saveBtn');
    btn.disabled = true;
    try {
      await Api.post(EP.save, { id: document.getElementById('s_id').value || null, salutation: sal,
        displayOrder: document.getElementById('s_displayOrder').value || null });
      MODAL.hide(); await reload(); SFA.toast('Saved');
    } catch (e) { SFA.toast(e.message, false); }
    finally { btn.disabled = false; }
  }
  async function slStatus(id, active) {
    try { await Api.post(EP.status(id), null, { query: { active } }); await reload(); }
    catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
