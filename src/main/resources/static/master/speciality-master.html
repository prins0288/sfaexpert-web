<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Speciality Master</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="specialitymaster" data-title="Speciality Master"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-clipboard2-pulse"></i> Specialities
      <div class="card-tools">
        <button class="btn btn-sm btn-primary" onclick="specAdd()"><i class="bi bi-plus-lg"></i> Add Single</button>
        <button class="btn btn-sm btn-outline-primary" onclick="specMultiAdd()"><i class="bi bi-plus-square"></i> Add Multiple</button>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table id="specTable" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr>
            <th>S.No</th><th>Code</th><th>Name</th><th>Icon</th><th>Description</th>
            <th>Status</th><th>Created</th><th>Updated</th><th class="no-export">Actions</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add / Edit -->
  <div class="modal fade" id="specModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="specSave(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="specModalTitle">Add Speciality</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <input type="hidden" id="s_oid" />
        <div class="col-md-5"><label class="form-label">Code <span class="required-star">*</span></label>
          <input class="form-control" id="s_specialityCode" required placeholder="SPEC-CARD" /></div>
        <div class="col-md-7"><label class="form-label">Name <span class="required-star">*</span></label>
          <input class="form-control" id="s_specialityName" required placeholder="Cardiology" /></div>
        <div class="col-md-12"><label class="form-label">Icon
          <small class="text-muted">(bootstrap-icon name)</small></label>
          <div class="input-group">
            <span class="input-group-text"><i id="s_iconPreview" class="bi bi-clipboard2-pulse"></i></span>
            <input class="form-control" id="s_icon" placeholder="heart-pulse" oninput="specIconPreview()" />
          </div>
          <div class="form-text">e.g. heart-pulse, bandaid, activity — see Bootstrap Icons.</div></div>
        <div class="col-12"><label class="form-label">Description</label>
          <input class="form-control" id="s_description" /></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>

  <!-- Add Multiple -->
  <div class="modal fade" id="specMultiModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
    <form class="modal-content" onsubmit="specSaveMultiple(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title">Add Multiple &middot; Specialities</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <table class="table table-bordered multi-row-table" id="specMultiTable">
          <thead><tr><th style="width:40px">#</th><th>Code *</th><th>Name *</th><th>Icon</th><th>Description</th><th style="width:60px"></th></tr></thead>
          <tbody>
            <tr>
              <td class="row-sno">1</td>
              <td><input class="form-control" name="specialityCode" /></td>
              <td><input class="form-control" name="specialityName" /></td>
              <td><input class="form-control" name="icon" /></td>
              <td><input class="form-control" name="description" /></td>
              <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="sfaRemoveRow(this,'specMultiTable')"><i class="bi bi-x"></i></button></td>
            </tr>
          </tbody>
        </table>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="sfaAddRow('specMultiTable')"><i class="bi bi-plus"></i> Add Row</button>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null, MULTI = null;

  // Dates arrive from the API already formatted as dd-MM-yyyy (see @JsonFormat).
  const auditCell = (by, at) => (by ? `<div>${SFA.esc(by)}</div><small class="text-muted">${SFA.esc(at || '')}</small>` : '');
  const boolBadge = (b) => (b
    ? '<span class="badge badge-active">Active</span>'
    : '<span class="badge badge-inactive">Inactive</span>');
  const iconCell = (ic) => (ic ? (/^https?:|\//.test(ic)
      ? `<img src="${SFA.esc(ic)}" style="width:18px;height:18px;object-fit:contain" /> <small>${SFA.esc(ic)}</small>`
      : `<i class="bi bi-${SFA.esc(ic)}"></i> <small>${SFA.esc(ic)}</small>`) : '');

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#specModal');
    MULTI = new bootstrap.Modal('#specMultiModal');
    try { await reload(); } catch (e) { SFA.toast(e.message, false); }
  };

  async function reload() {
    const rows = await Api.get(API.master.specialityMaster.list);
    if (DT) { DT.destroy(); }
    document.querySelector('#specTable tbody').innerHTML = rows.map((r, i) => `
      <tr>
        <td>${i + 1}</td><td>${SFA.esc(r.specialityCode)}</td><td>${SFA.esc(r.specialityName)}</td>
        <td>${iconCell(r.icon)}</td><td>${SFA.esc(r.description)}</td>
        <td>${boolBadge(r.status)}</td>
        <td>${auditCell(r.createdBy, r.createdAt)}</td>
        <td>${auditCell(r.updatedBy, r.updatedAt)}</td>
        <td class="no-export">
          <button class="btn btn-sm btn-outline-primary" onclick='specEdit(${JSON.stringify(r)})'><i class="bi bi-pencil"></i></button>
          ${r.status
            ? `<button class="btn btn-sm btn-outline-danger" onclick="specStatus(${r.oid},false)"><i class="bi bi-slash-circle"></i></button>`
            : `<button class="btn btn-sm btn-outline-success" onclick="specStatus(${r.oid},true)"><i class="bi bi-check-circle"></i></button>`}
        </td>
      </tr>`).join('');
    DT = sfaDataTable('#specTable');
  }

  function specIconPreview() {
    const v = document.getElementById('s_icon').value.trim();
    document.getElementById('s_iconPreview').className = 'bi bi-' + (v || 'clipboard2-pulse');
  }

  function specAdd() {
    ['s_oid', 's_specialityCode', 's_specialityName', 's_icon', 's_description'].forEach(id => document.getElementById(id).value = '');
    specIconPreview();
    document.getElementById('specModalTitle').textContent = 'Add Speciality';
    MODAL.show();
  }
  function specEdit(r) {
    document.getElementById('s_oid').value = r.oid;
    document.getElementById('s_specialityCode').value = r.specialityCode || '';
    document.getElementById('s_specialityName').value = r.specialityName || '';
    document.getElementById('s_icon').value = r.icon || '';
    document.getElementById('s_description').value = r.description || '';
    specIconPreview();
    document.getElementById('specModalTitle').textContent = 'Edit Speciality';
    MODAL.show();
  }
  async function specSave(ev) {
    ev.preventDefault();
    const v = id => { const x = document.getElementById(id).value; return x === '' ? null : x; };
    const body = {
      oid: v('s_oid'), specialityCode: v('s_specialityCode'), specialityName: v('s_specialityName'),
      icon: v('s_icon'), description: v('s_description')
    };
    try { await Api.post(API.master.specialityMaster.save, body); MODAL.hide(); await reload(); SFA.toast('Saved'); }
    catch (e) { SFA.toast(e.message, false); }
  }
  async function specStatus(oid, status) {
    if (!confirm(status ? 'Activate this speciality?' : 'Deactivate this speciality?')) return;
    try { await Api.post(API.master.specialityMaster.status(oid), null, { query: { status } }); await reload(); }
    catch (e) { SFA.toast(e.message, false); }
  }

  // ---- Add Multiple ----
  function specMultiAdd() {
    const tb = document.querySelector('#specMultiTable tbody');
    const rows = tb.querySelectorAll('tr');
    for (let i = rows.length - 1; i > 0; i--) rows[i].remove();
    tb.querySelector('tr').querySelectorAll('input').forEach(x => x.value = '');
    MULTI.show();
  }
  async function specSaveMultiple(ev) {
    ev.preventDefault();
    const rows = collectRows('specMultiTable', ['specialityCode', 'specialityName', 'icon', 'description']);
    if (!rows.length) { SFA.toast('No rows to save', false); return; }
    try {
      const res = await Api.post(API.master.specialityMaster.saveMultiple, rows);
      MULTI.hide(); await reload(); SFA.toast(res.saved + ' saved' + (res.skipped ? ', ' + res.skipped + ' skipped' : ''));
    } catch (e) { SFA.toast(e.message, false); }
  }
  function collectRows(tableId, fields) {
    const rows = [];
    document.querySelectorAll('#' + tableId + ' tbody tr').forEach(tr => {
      const o = {}; let any = false;
      fields.forEach(f => {
        const el = tr.querySelector('[name="' + f + '"]');
        const val = el ? String(el.value).trim() : '';
        o[f] = val === '' ? null : val;
        if (val) any = true;
      });
      if (any) rows.push(o);
    });
    return rows;
  }
</script>
</body>
</html>
