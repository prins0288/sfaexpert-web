<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Menu Master</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="menumaster" data-title="Menu Master"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-diagram-3-fill"></i> Menu Master
      <small class="text-muted ms-2">Add, edit, activate/deactivate or delete any WEB or APP menu item, at any level</small>
      <div class="card-tools">
        <button class="btn btn-sm btn-primary" onclick="mmAdd()"><i class="bi bi-plus-lg"></i> Add Menu Item</button>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table id="mmTable" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr>
            <th>S.No</th><th>Label</th><th>Parent</th><th>Type</th><th>Href / Page</th>
            <th>Target</th><th>Order</th><th>Status</th><th class="no-export">Actions</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add / Edit -->
  <div class="modal fade" id="mmModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-lg">
    <form class="modal-content" onsubmit="mmSave(event)">
      <div class="modal-header sfa-modal"><h5 class="modal-title" id="mmModalTitle">Add Menu Item</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <input type="hidden" id="mm_id" />
        <div class="col-md-6"><label class="form-label">Label <span class="required-star">*</span></label>
          <input class="form-control" id="mm_label" required placeholder="Degree" /></div>
        <div class="col-md-6"><label class="form-label">Title <small class="text-muted">(header/breadcrumb; falls back to Label)</small></label>
          <input class="form-control" id="mm_title" /></div>

        <div class="col-md-12"><label class="form-label">Parent</label>
          <select class="form-select" id="mm_parentId"><option value="">-- Top Level --</option></select></div>

        <div class="col-md-4"><label class="form-label">Platform</label>
          <select class="form-select" id="mm_menuType">
            <option value="WEB">Web</option>
            <option value="APP">App</option>
            <option value="BOTH">Both</option>
          </select></div>
        <div class="col-md-4"><label class="form-label">Link Target</label>
          <select class="form-select" id="mm_target">
            <option value="_SELF">Same tab</option>
            <option value="_BLANK">New tab</option>
          </select></div>
        <div class="col-md-4"><label class="form-label">Sort Order</label>
          <input type="number" class="form-control" id="mm_sortOrder" value="0" /></div>

        <div class="col-md-4"><label class="form-label">Icon <small class="text-muted">(bootstrap-icon name)</small></label>
          <div class="input-group">
            <span class="input-group-text"><i id="mm_iconPreview" class="bi bi-circle"></i></span>
            <input class="form-control" id="mm_icon" placeholder="mortarboard" oninput="mmIconPreview()" /></div></div>
        <div class="col-md-4"><label class="form-label">Page key <small class="text-muted">(data-page match)</small></label>
          <input class="form-control" id="mm_page" placeholder="degreemaster" /></div>
        <div class="col-md-4"><label class="form-label">Href <small class="text-muted">(blank = branch/folder)</small></label>
          <input class="form-control" id="mm_href" placeholder="master/degree-master.html" /></div>

        <div class="col-md-6"><label class="form-label">Badge text</label>
          <input class="form-control" id="mm_badge" placeholder="New" /></div>
        <div class="col-md-6"><label class="form-label">Badge color</label>
          <input class="form-control" id="mm_badgeColor" placeholder="#f5b301" /></div>

        <div class="col-md-6"><label class="form-label">Base URL <small class="text-muted">(external / APP base, optional)</small></label>
          <input class="form-control" id="mm_baseUrl" /></div>
        <div class="col-md-6"><label class="form-label">Description <small class="text-muted">(header help text)</small></label>
          <input class="form-control" id="mm_description" /></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null, MODAL = null, ROWS = [];
  const EP = API.menuMaster;
  const boolBadge = (b) => (b
    ? '<span class="badge badge-active">Active</span>'
    : '<span class="badge badge-inactive">Inactive</span>');
  const typeBadge = (t) => {
    const cls = t === 'APP' ? 'bg-info-subtle text-info-emphasis' : t === 'BOTH' ? 'bg-warning-subtle text-warning-emphasis' : 'bg-primary-subtle text-primary-emphasis';
    return `<span class="badge ${cls}">${SFA.esc(t || 'WEB')}</span>`;
  };

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#mmModal');
    try { await reload(); } catch (e) { SFA.toast(e.message, false); }
  };

  async function reload() {
    ROWS = await Api.get(EP.list);
    if (DT) { DT.destroy(); }
    document.querySelector('#mmTable tbody').innerHTML = ROWS.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${'&nbsp;&nbsp;'.repeat(r.depth)}${r.depth > 0 ? '<i class="bi bi-arrow-return-right text-muted"></i> ' : ''}${r.icon ? `<i class="bi bi-${SFA.esc(r.icon)}"></i> ` : ''}${SFA.esc(r.label)}</td>
        <td>${SFA.esc(r.parentLabel) || '<span class="text-muted">&mdash;</span>'}</td>
        <td>${typeBadge(r.menuType)}</td>
        <td><small>${SFA.esc(r.href) || (r.href === '' || !r.href ? '<span class="text-muted">branch</span>' : '')}</small></td>
        <td>${SFA.esc(r.target)}</td>
        <td>${r.sortOrder == null ? '' : SFA.esc(r.sortOrder)}</td>
        <td>${boolBadge(r.isActive)}</td>
        <td class="no-export">
          <button class="btn btn-sm btn-outline-primary" onclick='mmEdit(${JSON.stringify(r)})'><i class="bi bi-pencil"></i></button>
          ${r.isActive
            ? `<button class="btn btn-sm btn-outline-warning" onclick="mmStatus(${r.id},false)" title="Deactivate"><i class="bi bi-slash-circle"></i></button>`
            : `<button class="btn btn-sm btn-outline-success" onclick="mmStatus(${r.id},true)" title="Activate"><i class="bi bi-check-circle"></i></button>`}
          <button class="btn btn-sm btn-outline-danger" onclick="mmDelete(${r.id})" title="Delete"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`).join('');
    DT = sfaDataTable('#mmTable');
    fillParentSelect(null);
  }

  function fillParentSelect(excludeId) {
    const sel = document.getElementById('mm_parentId');
    const opts = ROWS.filter(r => r.id !== excludeId)
      .map(r => `<option value="${r.id}">${'    '.repeat(r.depth)}${SFA.esc(r.label)}</option>`).join('');
    sel.innerHTML = '<option value="">-- Top Level --</option>' + opts;
  }

  function mmIconPreview() {
    const v = document.getElementById('mm_icon').value.trim();
    document.getElementById('mm_iconPreview').className = 'bi bi-' + (v || 'circle');
  }

  function mmAdd() {
    ['mm_id', 'mm_label', 'mm_title', 'mm_icon', 'mm_page', 'mm_href', 'mm_badge', 'mm_badgeColor', 'mm_baseUrl', 'mm_description']
      .forEach(id => document.getElementById(id).value = '');
    document.getElementById('mm_parentId').value = '';
    document.getElementById('mm_menuType').value = 'WEB';
    document.getElementById('mm_target').value = '_SELF';
    document.getElementById('mm_sortOrder').value = '0';
    mmIconPreview();
    fillParentSelect(null);
    document.getElementById('mmModalTitle').textContent = 'Add Menu Item';
    MODAL.show();
  }
  function mmEdit(r) {
    document.getElementById('mm_id').value = r.id;
    document.getElementById('mm_label').value = r.label || '';
    document.getElementById('mm_title').value = r.title || '';
    fillParentSelect(r.id);   // an item can never be re-parented under its own subtree's descendant... (server also re-validates)
    document.getElementById('mm_parentId').value = r.parentId || '';
    document.getElementById('mm_menuType').value = r.menuType || 'WEB';
    document.getElementById('mm_target').value = r.target || '_SELF';
    document.getElementById('mm_sortOrder').value = r.sortOrder == null ? 0 : r.sortOrder;
    document.getElementById('mm_icon').value = r.icon || '';
    document.getElementById('mm_page').value = r.page || '';
    document.getElementById('mm_href').value = r.href || '';
    document.getElementById('mm_badge').value = r.badge || '';
    document.getElementById('mm_badgeColor').value = r.badgeColor || '';
    document.getElementById('mm_baseUrl').value = r.baseUrl || '';
    document.getElementById('mm_description').value = r.description || '';
    mmIconPreview();
    document.getElementById('mmModalTitle').textContent = 'Edit Menu Item';
    MODAL.show();
  }
  async function mmSave(ev) {
    ev.preventDefault();
    const v = id => { const x = document.getElementById(id).value; return x === '' ? null : x; };
    const id = v('mm_id');
    const body = {
      label: v('mm_label'), title: v('mm_title'), parentId: v('mm_parentId'),
      menuType: v('mm_menuType'), target: v('mm_target'), sortOrder: Number(v('mm_sortOrder') || 0),
      icon: v('mm_icon'), page: v('mm_page'), href: v('mm_href'),
      badge: v('mm_badge'), badgeColor: v('mm_badgeColor'), baseUrl: v('mm_baseUrl'), description: v('mm_description'),
    };
    try {
      if (id) await Api.put(EP.update(id), body);
      else await Api.post(EP.create, body);
      MODAL.hide(); await reload(); SFA.toast('Saved');
    } catch (e) { SFA.toast(e.message, false); }
  }
  async function mmStatus(id, isActive) {
    if (!confirm(isActive ? 'Activate this menu item?' : 'Deactivate this menu item? It (and its sub-items) will disappear from every menu.')) return;
    try { await Api.post(EP.status(id), null, { query: { status: isActive } }); await reload(); }
    catch (e) { SFA.toast(e.message, false); }
  }
  async function mmDelete(id) {
    if (!confirm('Permanently delete this menu item? This cannot be undone.')) return;
    try { await Api.del(EP.delete(id)); await reload(); SFA.toast('Deleted'); }
    catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
