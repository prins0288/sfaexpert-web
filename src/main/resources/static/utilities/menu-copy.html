<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Menu Copy</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
  <style>
    .mc-tree-box { max-height: 50vh; overflow-y: auto; border: 1px solid var(--sfa-border, #dee2e6); border-radius: .5rem; padding: .5rem .75rem; }
    .mc-node { padding: .15rem 0; }
    .mc-node label { cursor: pointer; }
    .mc-badge { font-size: .65rem; padding: .1rem .4rem; }
    .mc-dd-menu { max-height: 320px; overflow-y: auto; }
    .mc-dd-item { cursor: pointer; }
    /* Bootstrap's .d-flex utility carries !important, which beats a plain inline
       style="display:none" — this compound-class selector out-specifies it. */
    .mc-dd-item.mc-hidden, .mc-node.mc-hidden { display: none !important; }
  </style>
</head>
<body>
<div id="app" data-page="menucopy" data-title="Menu Copy"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-diagram-2"></i> Menu Copy
      <small class="text-muted ms-2">Copy one or more menu items — with their full sub-tree, any depth — from one tenant into others</small>
    </div>
    <div class="card-body">
      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Source Company <span class="required-star">*</span></label>
          <div class="dropdown">
            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button"
                    id="mc_sourceBtn" data-bs-toggle="dropdown" data-bs-auto-close="outside">
              <span id="mc_sourceLabel">Select…</span>
            </button>
            <div class="dropdown-menu p-2" style="min-width:100%">
              <input type="text" class="form-control form-control-sm mb-2" placeholder="Search…"
                     oninput="mcFilterDropdown(this, 'mc_sourceList')">
              <div class="mc-dd-menu" id="mc_sourceList"></div>
            </div>
          </div>
          <input type="hidden" id="mc_source" />
        </div>
        <div class="col-md-8">
          <label class="form-label">Target Company(s) <span class="required-star">*</span></label>
          <div class="dropdown">
            <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button"
                    id="mc_targetsBtn" data-bs-toggle="dropdown" data-bs-auto-close="outside">
              <span id="mc_targetsLabel">Select target companies…</span>
            </button>
            <div class="dropdown-menu p-2" style="min-width:100%">
              <input type="text" class="form-control form-control-sm mb-2" placeholder="Search…"
                     oninput="mcFilterDropdown(this, 'mc_targetsList')">
              <label class="dropdown-item d-flex align-items-center gap-2 border-bottom pb-2 mb-1">
                <input type="checkbox" class="form-check-input mt-0" id="mc_targetsAll" onchange="mcToggleAllTargets(this)">
                <strong>Check all</strong>
              </label>
              <div class="mc-dd-menu" id="mc_targetsList"></div>
            </div>
          </div>
        </div>
      </div>

      <label class="form-label">Pick item(s) to copy <small class="text-muted">(checking a branch also copies everything under it)</small></label>
      <input type="text" class="form-control form-control-sm mb-2" id="mc_treeSearch" placeholder="Search menu items…" oninput="mcFilterTree()">
      <div id="mc_tree" class="mc-tree-box"><div class="text-muted small">Choose a source company…</div></div>

      <div class="mt-3 d-flex align-items-center gap-2">
        <button class="btn btn-primary" onclick="mcCopy()"><i class="bi bi-copy"></i> Copy</button>
        <span id="mc_selCount" class="text-muted small"></span>
      </div>

      <div id="mc_result" class="mt-3"></div>
    </div>
  </div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let TENANTS = [], TREE = [];
  const EP = API.menuCopy;

  window.pageInit = async function () {
    try {
      TENANTS = await Api.get(EP.tenants);
      fillTenantDropdowns();
      if (TENANTS.length) mcSetSource(TENANTS[0]);
    } catch (e) { SFA.toast(e.message, false); }
  };

  function fillTenantDropdowns() {
    document.getElementById('mc_sourceList').innerHTML = TENANTS.map(t => `
      <div class="dropdown-item mc-dd-item" data-val="${SFA.esc(t)}" onclick="mcSetSource('${t}')">${SFA.esc(t)}</div>`).join('');

    document.getElementById('mc_targetsList').innerHTML = TENANTS.map(t => `
      <label class="dropdown-item d-flex align-items-center gap-2 mc-dd-item" data-val="${SFA.esc(t)}">
        <input type="checkbox" class="form-check-input mt-0 mc-target-cb" value="${SFA.esc(t)}" onchange="mcTargetsChanged()">
        ${SFA.esc(t)}
      </label>`).join('');
  }

  // Live text filter shared by both dropdowns — hides non-matching .mc-dd-item rows.
  function mcFilterDropdown(input, listId) {
    const q = input.value.trim().toLowerCase();
    document.querySelectorAll('#' + listId + ' .mc-dd-item').forEach(el => {
      el.classList.toggle('mc-hidden', !el.getAttribute('data-val').toLowerCase().includes(q));
    });
  }

  async function mcSetSource(tenant) {
    document.getElementById('mc_source').value = tenant;
    document.getElementById('mc_sourceLabel').textContent = tenant;
    await mcLoadSourceTree();
  }

  function mcTargetsChanged() {
    const boxes = Array.from(document.querySelectorAll('.mc-target-cb'));
    const checked = boxes.filter(b => b.checked && !b.disabled);
    document.getElementById('mc_targetsAll').checked = checked.length > 0 && checked.length === boxes.filter(b => !b.disabled).length;
    document.getElementById('mc_targetsLabel').textContent = checked.length
      ? checked.map(b => b.value).join(', ')
      : 'Select target companies…';
  }

  function mcToggleAllTargets(cb) {
    document.querySelectorAll('.mc-target-cb').forEach(b => { if (!b.disabled) b.checked = cb.checked; });
    mcTargetsChanged();
  }

  async function mcLoadSourceTree() {
    const source = document.getElementById('mc_source').value;
    document.querySelectorAll('.mc-target-cb').forEach(b => {
      b.disabled = (b.value === source);
      if (b.disabled) b.checked = false;
    });
    mcTargetsChanged();
    if (!source) return;
    try {
      TREE = await Api.get(EP.tree(source));
      renderTree();
    } catch (e) { SFA.toast(e.message, false); }
  }

  function renderTree() {
    document.getElementById('mc_treeSearch').value = '';
    const typeBadge = (t) => {
      const cls = t === 'APP' ? 'bg-info-subtle text-info-emphasis' : t === 'BOTH' ? 'bg-warning-subtle text-warning-emphasis' : 'bg-primary-subtle text-primary-emphasis';
      return `<span class="badge mc-badge ${cls}">${SFA.esc(t || 'WEB')}</span>`;
    };
    document.getElementById('mc_tree').innerHTML = TREE.map(n => `
      <div class="mc-node" data-label="${SFA.esc((n.label || '').toLowerCase())}" style="margin-left:${n.depth * 22}px">
        <div class="form-check">
          <input class="form-check-input mc-item-cb" type="checkbox" value="${n.id}" id="mc_node_${n.id}" onchange="mcUpdateCount()">
          <label class="form-check-label" for="mc_node_${n.id}">
            ${n.icon ? `<i class="bi bi-${SFA.esc(n.icon)}"></i> ` : ''}${SFA.esc(n.label)} ${typeBadge(n.menuType)}
            ${n.isActive ? '' : '<span class="badge mc-badge bg-secondary-subtle text-secondary-emphasis">inactive</span>'}
          </label>
        </div>
      </div>`).join('');
    mcUpdateCount();
  }

  // Live text filter for the item-picker tree — simple substring match on label.
  function mcFilterTree() {
    const q = document.getElementById('mc_treeSearch').value.trim().toLowerCase();
    document.querySelectorAll('#mc_tree .mc-node').forEach(el => {
      el.classList.toggle('mc-hidden', !(!q || el.getAttribute('data-label').includes(q)));
    });
  }

  function mcUpdateCount() {
    const n = document.querySelectorAll('.mc-item-cb:checked').length;
    document.getElementById('mc_selCount').textContent = n ? `${n} item(s) selected` : '';
  }

  async function mcCopy() {
    const source = document.getElementById('mc_source').value;
    const targets = Array.from(document.querySelectorAll('.mc-target-cb:checked')).map(b => b.value);
    const itemIds = Array.from(document.querySelectorAll('.mc-item-cb:checked')).map(cb => Number(cb.value));

    if (!source) { SFA.toast('Choose a source company', false); return; }
    if (!targets.length) { SFA.toast('Choose at least one target company', false); return; }
    if (!itemIds.length) { SFA.toast('Pick at least one item to copy', false); return; }
    if (!confirm(`Copy ${itemIds.length} item(s) (with their full sub-tree) from "${source}" into ${targets.length} compan${targets.length === 1 ? 'y' : 'ies'}?`)) return;

    try {
      const results = await Api.post(EP.copy, { sourceCompanyCode: source, targetCompanyCodes: targets, itemIds });
      document.getElementById('mc_result').innerHTML = `
        <div class="table-responsive">
          <table class="table table-sm table-bordered">
            <thead><tr><th>Company</th><th>Created</th><th>Already existed (reused)</th><th>Error</th></tr></thead>
            <tbody>${results.map(r => `
              <tr class="${r.error ? 'table-danger' : ''}">
                <td>${SFA.esc(r.companyCode)}</td><td>${r.created}</td><td>${r.reused}</td>
                <td>${r.error ? SFA.esc(r.error) : ''}</td>
              </tr>`).join('')}</tbody>
          </table>
        </div>`;
      SFA.toast('Copy finished');
    } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
