<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Dashboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>
<body>
<div id="app" data-page="dashboard" data-title="Dashboard"></div>

<template id="pageContent">
  <div class="row g-3 mb-4">
    <div class="col-md-3 col-6"><a href="/master/route.html" class="text-decoration-none">
      <div class="stat-tile"><div class="icon" style="background:#2a56a0"><i class="bi bi-signpost-2"></i></div>
        <div><div class="num" id="routeCount">0</div><div class="lbl">Routes</div></div></div></a></div>
    <div class="col-md-3 col-6"><a href="/master/area.html" class="text-decoration-none">
      <div class="stat-tile"><div class="icon" style="background:#0aa3a3"><i class="bi bi-geo-alt"></i></div>
        <div><div class="num" id="areaCount">0</div><div class="lbl">Areas</div></div></div></a></div>
    <div class="col-md-3 col-6"><a href="/master/client.html" class="text-decoration-none">
      <div class="stat-tile"><div class="icon" style="background:#1a9d63"><i class="bi bi-people"></i></div>
        <div><div class="num" id="clientCount">0</div><div class="lbl">Clients</div></div></div></a></div>
    <div class="col-md-3 col-6"><a href="/master/products.html" class="text-decoration-none">
      <div class="stat-tile"><div class="icon" style="background:#b0384a"><i class="bi bi-box-seam"></i></div>
        <div><div class="num" id="productCount">0</div><div class="lbl">Products</div></div></div></a></div>
  </div>

  <div class="card">
    <div class="card-header"><i class="bi bi-speedometer2"></i> Overview</div>
    <div class="card-body">
      <p>Welcome, <b id="welcomeUser"></b>. You are signed in to tenant <b id="welcomeTenant"></b>.</p>
      <p class="text-muted mb-0">
        Multi-tenant (one DB per tenant, a dedicated HikariCP pool per tenant), JPA repositories that
        auto-route to the active tenant, and the list &rarr; add/edit &rarr; soft-delete master pattern
        on Route, Area, Route&ndash;Area mapping, Client Type and Client.
      </p>
    </div>
  </div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/shell.js"></script>
<script>
  window.pageInit = async function () {
    document.getElementById('welcomeUser').textContent = SFA.user;
    document.getElementById('welcomeTenant').textContent = SFA.tenant;
    const count = async (path, el) => {
      try { const d = await SFA.api(path); document.getElementById(el).textContent = Array.isArray(d) ? d.length : 0; }
      catch (e) { /* leave 0 */ }
    };
    count('/api/master/route', 'routeCount');
    count('/api/master/area', 'areaCount');
    count('/api/master/client', 'clientCount');
    count('/api/products', 'productCount');
  };
</script>
</body>
</html>
