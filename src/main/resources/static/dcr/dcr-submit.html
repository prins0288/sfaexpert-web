<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; DCR</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
<style>
  .dcr-app { max-width: 760px; margin: 0 auto; padding-bottom: 5.5rem; }
  .card-lite { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: 1rem; padding: .85rem 1rem; margin-bottom: .75rem; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .dcr-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; margin-bottom: .85rem; }
  .dcr-title { font-size: 1.7rem; font-weight: 800; line-height: 1.1; }
  .dcr-histlink { font-weight: 700; color: var(--bs-primary); text-decoration: none; white-space: nowrap; padding-top: .35rem; }
  .dcr-start-btn { background: #d9441a; border: 0; color: #fff; border-radius: 999px; padding: .75rem 1.25rem; font-weight: 700; white-space: nowrap; box-shadow: 0 4px 12px rgba(217,68,26,.35); }
  .dcr-start-btn:active { transform: scale(.97); }
  .dcr-seg { display: flex; background: var(--bs-tertiary-bg); border-radius: 999px; padding: .25rem; margin-bottom: .75rem; }
  .dcr-seg button { flex: 1; border: 0; background: transparent; padding: .5rem; border-radius: 999px; font-weight: 600; color: var(--bs-secondary-color); display: flex; align-items: center; justify-content: center; gap: .4rem; }
  .dcr-seg button.active { background: var(--bs-body-bg); color: var(--bs-primary); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .dcr-badge { background: #dc3545; color: #fff; border-radius: 999px; font-size: .7rem; padding: 0 .4rem; }
  .dcr-date { max-width: 11rem; font-weight: 600; border-radius: 999px; text-align: center; }
  .dcr-tabs { display: flex; gap: .5rem; overflow-x: auto; padding: .1rem .1rem .6rem; scrollbar-width: none; position: sticky; top: 0; z-index: 5; background: var(--bs-body-bg); }
  .dcr-tabs::-webkit-scrollbar { display: none; }
  .dcr-tabs button { flex: 0 0 auto; border: 1px solid var(--bs-border-color); background: var(--bs-body-bg); border-radius: 999px; padding: .45rem .95rem; font-weight: 600; font-size: .9rem; white-space: nowrap; color: var(--bs-body-color); }
  .dcr-tabs button.active { background: var(--bs-primary); border-color: var(--bs-primary); color: #fff; }
  .dcr-tabs .n { background: rgba(0,0,0,.12); border-radius: 999px; padding: 0 .45rem; margin-left: .35rem; font-size: .75rem; }
  .dcr-tabs button.active .n { background: rgba(255,255,255,.3); }
  .dcr-pane .form-label { font-size: .8rem; font-weight: 600; color: var(--bs-secondary-color); margin-bottom: .2rem; }
  .dcr-pane .form-control, .dcr-pane .form-select, .dcr-sheet .form-control, .dcr-sheet .form-select { border-radius: .75rem; min-height: 2.8rem; }
  .dcr-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .dcr-chip { border: 1px solid var(--bs-border-color); border-radius: 999px; padding: .4rem .85rem; background: var(--bs-body-bg); font-size: .9rem; }
  .dcr-chip.on { background: var(--bs-primary-bg-subtle); border-color: var(--bs-primary); color: var(--bs-primary); font-weight: 600; }
  .dcr-visit { display: flex; gap: .75rem; align-items: center; cursor: pointer; }
  .dcr-visit .ava { width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--bs-primary-bg-subtle); color: var(--bs-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; flex: 0 0 auto; }
  .dcr-visit .meta { min-width: 0; flex: 1; }
  .dcr-visit .meta b, .dcr-visit .meta small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dcr-addvisit { width: 100%; border: 0; background: #d9441a; color: #fff; border-radius: 999px; padding: .85rem 1rem; font-weight: 700; font-size: 1.05rem; box-shadow: 0 4px 12px rgba(217,68,26,.35); margin-bottom: .75rem; }
  .dcr-kinds { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; max-height: 62vh; overflow-y: auto; padding: .1rem; }
  .dcr-kind { border: 1px solid var(--bs-border-color); border-radius: 1rem; background: var(--bs-body-bg); padding: 1rem .6rem; text-align: center; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: .4rem; }
  .dcr-kind i { font-size: 1.7rem; color: var(--bs-primary); }
  .dcr-kind:active { background: var(--bs-tertiary-bg); }
  .dcr-kind small { font-weight: 400; color: var(--bs-secondary-color); }
  .dcr-add { width: 100%; border: 2px dashed var(--bs-border-color); background: transparent; border-radius: 1rem; padding: .85rem; font-weight: 600; color: var(--bs-primary); }
  .dcr-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: .6rem; align-items: center; padding: .65rem 1rem calc(.65rem + env(safe-area-inset-bottom)); background: var(--bs-body-bg); border-top: 1px solid var(--bs-border-color); box-shadow: 0 -4px 14px rgba(0,0,0,.08); }
  .dcr-bar .btn { border-radius: 999px; padding: .55rem 1.1rem; font-weight: 600; }
  .dcr-bar-sum { flex: 1; font-size: .8rem; line-height: 1.2; color: var(--bs-secondary-color); }
  .dcr-bar-sum b { color: var(--bs-body-color); }
  @media (min-width: 992px) { .dcr-bar { left: 250px; } }
  .dcr-sheet { height: 92vh !important; max-width: 760px; margin: 0 auto; border-radius: 1.25rem 1.25rem 0 0; }
  .dcr-sheet .offcanvas-body { padding-bottom: 6rem; }
  .dcr-sheet-foot { position: absolute; left: 0; right: 0; bottom: 0; padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom)); background: var(--bs-body-bg); border-top: 1px solid var(--bs-border-color); display: flex; gap: .6rem; }
  .dcr-sheet-foot .btn { flex: 1; border-radius: 999px; font-weight: 600; padding: .6rem; }
  .dcr-sec { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--bs-secondary-color); font-weight: 700; margin: 1rem 0 .4rem; }
  .dcr-item { background: var(--bs-tertiary-bg); border-radius: .85rem; padding: .65rem; margin-bottom: .5rem; }
  .dcr-pick { max-height: 55vh; overflow-y: auto; }
  .dcr-pick .row-i { display: flex; align-items: center; gap: .7rem; padding: .7rem .5rem; border-bottom: 1px solid var(--bs-border-color); cursor: pointer; }
  .dcr-pick .row-i:active { background: var(--bs-tertiary-bg); }
  .dcr-empty { text-align: center; color: var(--bs-secondary-color); padding: 1.5rem .5rem; }
  .dcr-readonly input, .dcr-readonly select, .dcr-readonly textarea, .dcr-readonly .dcr-add { pointer-events: none; opacity: .7; }
  /* ===== Desktop / web look (>=992px): wide page, underline tabs, side-panel editor, inline action bar.
         Below this width everything above stays the phone-app look. ===== */
  @media (min-width: 992px) {
    .dcr-app { max-width: 1120px; padding-bottom: 1.5rem; }
    .card-lite { border-radius: .5rem; box-shadow: none; padding: 1rem 1.25rem; }
    .dcr-title { font-size: 1.4rem; font-weight: 700; }
    .dcr-top { align-items: center; padding-bottom: .75rem; border-bottom: 1px solid var(--bs-border-color); }
    .dcr-start-btn { border-radius: .4rem; padding: .5rem 1.1rem; box-shadow: none; }
    .dcr-histlink { padding-top: 0; }
    .dcr-seg { display: inline-flex; border-radius: .5rem; }
    .dcr-seg button { border-radius: .4rem; padding: .4rem 1.1rem; }
    .dcr-date { border-radius: .4rem; max-width: 12rem; }
    .dcr-tabs { gap: 0; border-bottom: 1px solid var(--bs-border-color); padding: 0; position: static; margin-bottom: 1rem; }
    .dcr-tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: transparent; padding: .65rem 1.1rem; }
    .dcr-tabs button.active { background: transparent; color: var(--bs-primary); border-bottom-color: var(--bs-primary); }
    .dcr-tabs button.active .n { background: var(--bs-primary-bg-subtle); }
    .dcr-pane .form-control, .dcr-pane .form-select, .dcr-sheet .form-control, .dcr-sheet .form-select { border-radius: .4rem; min-height: 2.4rem; }
    .dcr-chip { border-radius: .4rem; }
    .dcr-kinds { grid-template-columns: repeat(3, 1fr); }
    .dcr-kind { border-radius: .5rem; }
    .dcr-addvisit { width: auto; border-radius: .4rem; padding: .5rem 1.4rem; box-shadow: none; }
    .dcr-add { border-radius: .5rem; width: auto; padding: .5rem 1.25rem; }
    .dcr-visit { padding: .1rem 0; }
    .dcr-visit:hover { background: var(--bs-tertiary-bg); }
    #dcrBar { position: sticky; bottom: 0; left: auto; right: auto; border: 1px solid var(--bs-border-color); border-radius: .5rem; box-shadow: 0 -2px 10px rgba(0,0,0,.06); margin-top: 1rem; }
    #dcrBar .btn { border-radius: .4rem; }
    /* editor opens as a right-hand side panel instead of a phone bottom sheet */
    .dcr-sheet.offcanvas-bottom { top: 0; bottom: 0; left: auto; right: 0; width: 560px; max-width: 100%; height: 100vh !important; max-height: none; border-radius: 0; border-top: 0; transform: translateX(100%); }
    .dcr-sheet.offcanvas-bottom.showing, .dcr-sheet.offcanvas-bottom.show:not(.hiding) { transform: none; }
    .dcr-sheet-foot .btn { border-radius: .4rem; flex: 0 1 auto; min-width: 8rem; }
    .dcr-sheet-foot { justify-content: flex-end; }
  }
  @media (max-width: 575px) { .dcr-date { max-width: 9rem; } }
</style>

<body>
<div id="app" data-page="dcrsubmit" data-title="Daily Call Report"></div>
<template id="pageContent">
<div class="dcr-app">

  <!-- header like the phone app: title + who, DCR History link -->
  <div class="dcr-top">
    <div><div class="dcr-title" id="dcrTitle">DCR</div><div class="text-muted small" id="dcrWho"></div></div>
    <button class="dcr-start-btn d-none" id="dcrFinalBtn" onclick="dcrSave(true)" title="Ends your day - the day-end time is captured automatically"><i class="bi bi-check2-circle"></i> Final Submit</button>
    <a href="javascript:void(0)" class="dcr-histlink" id="dcrHistLink" onclick="dcrView(VIEW === 'form' ? 'list' : 'form')"><i class="bi bi-clock-history"></i> <span id="dcrHistTxt">DCR History</span><span class="dcr-badge d-none" id="dcrPendingBadge"></span></a>
  </div>

  <!-- ================= FORM ================= -->
  <div id="dcrForm">
    <div class="dcr-head card-lite">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-light btn-sm rounded-circle" onclick="dcrShiftDay(-1)" title="Previous day"><i class="bi bi-chevron-left"></i></button>
        <input type="date" class="form-control dcr-date" id="dcrDate" onchange="dcrDateChanged()" />
        <button class="btn btn-light btn-sm rounded-circle" onclick="dcrShiftDay(1)" title="Next day"><i class="bi bi-chevron-right"></i></button>
        <span id="dcrStatus" class="ms-auto"></span>
      </div>
      <div class="small mt-2 d-none" id="dcrReject"></div>
    </div>

    <div class="dcr-tabs" id="dcrTabs"></div>
    <div id="dcrPane" class="dcr-pane"></div>
    <div class="dcr-spacer"></div>
  </div>

  <!-- ================= HISTORY ================= -->
  <div id="dcrList" class="d-none">
    <div class="card-lite d-flex gap-2 flex-wrap align-items-center">
      <select class="form-select form-select-sm w-auto" id="hRange" data-no-search onchange="dcrLoadList()">
        <option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option>
      </select>
      <select class="form-select form-select-sm w-auto" id="hStatus" data-no-search onchange="dcrRenderList()">
        <option value="">All</option><option value="mine">Waiting for my approval</option><option value="0">Draft</option><option value="1">Submitted</option><option value="2">Approved</option><option value="3">Rejected</option>
      </select>
      <input class="form-control form-control-sm w-auto flex-grow-1" id="hSearch" placeholder="Search employee…" oninput="dcrRenderList()" />
    </div>
    <div id="hRows" class="mt-2"></div>
  </div>

  <!-- bottom action bar (form only) -->
  <div class="dcr-bar" id="dcrBar">
    <div class="dcr-bar-sum" id="dcrSum"></div>
    <button class="btn btn-outline-secondary" id="dcrDraftBtn" onclick="dcrSave(false)"><i class="bi bi-save"></i> Draft</button>
    <button class="btn btn-primary" id="dcrSubmitBtn" onclick="dcrSave(true)"><i class="bi bi-send-check"></i> Submit</button>
  </div>
</div>

<!-- bottom sheet (call / expense / detail editors) -->
<div class="offcanvas offcanvas-bottom dcr-sheet" tabindex="-1" id="dcrSheet" data-bs-backdrop="static">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="sheetTitle"></h5>
    <button type="button" class="btn-close" onclick="sheetX()"></button>
  </div>
  <div class="offcanvas-body" id="sheetBody"></div>
  <div class="dcr-sheet-foot" id="sheetFoot"></div>
</div>
</template>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>

<script src="js/shell.js"></script>
<script>
  const EP = API.master.dcrSubmit;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  const pad = (n) => String(n).padStart(2, '0');
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const nowHm = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const nowDt = () => todayStr() + 'T' + nowHm();
  const initials = (n) => (n || '?').replace(/^(Dr\.?|Mr\.?|Mrs\.?|Ms\.?)\s+/i, '').split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const money = (v) => (Number(v || 0)).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  const STATUS = [['Draft', 'secondary'], ['Submitted', 'info'], ['Approved', 'success'], ['Rejected', 'danger']];
  const stBadge = (s) => s == null ? '<span class="badge bg-light text-dark border">New</span>' : `<span class="badge bg-${STATUS[s][1]}${s === 1 ? ' text-dark' : ''}">${STATUS[s][0]}</span>`;

  let OPT = null, ST = null, CUR = 'day', VIEW = 'form', SHEET = null, EDIT = null, ROWS = [], KEYSEQ = 0, SHEET_ON_CLOSE = null;

  const blank = (date) => ({ dcrId: null, dcrDate: date, workType: 'WORKING', startAreaId: '', workingAreaId: '', timeIn: '', timeOut: '', travelMode: '', meterStart: '', meterEnd: '',
    remarks: '', dayEndAreaId: '', dayEndAt: '', dayEndRemarks: '', stayAreaId: '', stayHotel: '', jointWith: [], visits: [], unlisted: [], expenses: [], status: null, canEdit: true });

  window.pageInit = async function () {
    SHEET = new bootstrap.Offcanvas('#dcrSheet');
    try {
      OPT = await Api.get(EP.options);
      document.getElementById('dcrWho').textContent = [OPT.meName, OPT.meDesignation, OPT.meHq].filter(Boolean).join(' · ');
      const d = document.getElementById('dcrDate');
      d.max = todayStr(); d.value = todayStr();
      await loadDay();
      pendingBadge();
    } catch (e) { SFA.toast(e.message, false); }
  };

  // ============================================================== day load / header
  async function loadDay() {
    const date = document.getElementById('dcrDate').value || todayStr();
    const d = await Api.get(EP.mine, { query: { date } });
    ST = d && d.dcrId ? fromDto(d) : blank(date);   // no DCR yet: the API answers with an empty envelope
    if (!tabList().some(t => t.code === CUR)) CUR = 'day';
    render();
  }
  function dcrDateChanged() { loadDay().catch(e => SFA.toast(e.message, false)); }
  function dcrShiftDay(n) {
    const el = document.getElementById('dcrDate'), d = new Date((el.value || todayStr()) + 'T00:00:00');
    d.setDate(d.getDate() + n);
    const v = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    if (v > todayStr()) return;
    el.value = v; dcrDateChanged();
  }
  function fromDto(d) {
    const x = JSON.parse(JSON.stringify(d));
    ['startAreaId', 'workingAreaId', 'dayEndAreaId', 'stayAreaId'].forEach(k => { if (x[k] == null) x[k] = ''; });
    ['timeIn', 'timeOut', 'travelMode', 'meterStart', 'meterEnd', 'remarks', 'dayEndAt', 'dayEndRemarks', 'stayHotel'].forEach(k => { if (x[k] == null) x[k] = ''; });
    x.unlisted.forEach(u => { u.key = u.key || ('n' + (++KEYSEQ)); });
    return x;
  }
  function dcrView(v) {
    VIEW = v;
    document.getElementById('dcrHistTxt').textContent = v === 'form' ? 'DCR History' : 'My DCR';
    document.getElementById('dcrTitle').textContent = v === 'form' ? 'DCR' : 'DCR History';
    document.getElementById('dcrForm').classList.toggle('d-none', v !== 'form');
    document.getElementById('dcrList').classList.toggle('d-none', v !== 'list');
    document.getElementById('dcrBar').classList.toggle('d-none', v !== 'form' || !started());
    document.getElementById('dcrFinalBtn').classList.toggle('d-none', v !== 'form' || !started() || !(ST && ST.canEdit));
    if (v === 'list') dcrLoadList();
  }

  // ============================================================== tabs / panes
  function tabList() {
    const t = [{ code: 'day', name: 'Day', form: 'DAY' }];
    if (!started()) return t;   // nothing else until the day is started
    if (ST && ST.workType === 'WORKING') OPT.tabs.forEach(x => t.push({ code: x.code, name: x.name, form: x.form, clientTypeId: x.clientTypeId, subForms: x.subForms }));
    t.push({ code: 'review', name: 'Review', form: 'REVIEW' });
    return t;
  }
  const started = () => !!(ST && ST.dcrId);
  const isOpen = (c) => !!c.inTime && !c.outTime && !c.refused;
  const tabCount = (t) => t.form === 'CHECKIN' ? ST.visits.filter(v => v.worktypeCode === t.code).length : t.form === 'UNLISTED' ? ST.unlisted.length
    : t.form === 'EXPENSE' ? ST.expenses.length : t.form === 'JOINT' ? ST.jointWith.length : 0;

  function render() {
    document.getElementById('dcrStatus').innerHTML = stBadge(ST.status);
    const rj = document.getElementById('dcrReject');
    if (ST.status === 3) { rj.className = 'small mt-2 text-danger'; rj.innerHTML = '<i class="bi bi-x-circle"></i> Rejected' + (ST.approvedByName ? ' by ' + esc(ST.approvedByName) : '') + ': ' + esc(ST.approvalRemarks || '') + ' — correct it and submit again.'; }
    else if (ST.status === 2) { rj.className = 'small mt-2 text-success'; rj.innerHTML = '<i class="bi bi-patch-check"></i> Approved' + (ST.approvedByName ? ' by ' + esc(ST.approvedByName) : '') + '.'; }
    else rj.className = 'small mt-2 d-none';
    const tabs = tabList();
    document.getElementById('dcrTabs').innerHTML = tabs.map(t => { const n = tabCount(t);
      return `<button class="${t.code === CUR ? 'active' : ''}" onclick="dcrTab('${esc(t.code)}')">${esc(t.name)}${n ? `<span class="n">${n}</span>` : ''}</button>`; }).join('');
    const tab = tabs.find(t => t.code === CUR) || tabs[0];
    const pane = document.getElementById('dcrPane');
    pane.innerHTML = tab.form === 'DAY' ? paneDay() : tab.form === 'CHECKIN' ? paneCalls(tab, 'v') : tab.form === 'UNLISTED' ? paneCalls(tab, 'u')
      : tab.form === 'JOINT' ? paneJoint() : tab.form === 'EXPENSE' ? paneExpense() : tab.form === 'DAYEND' ? paneDayEnd() : paneReview();

    document.getElementById('dcrTabs').classList.toggle('d-none', !started());
    document.getElementById('dcrBar').classList.toggle('d-none', VIEW !== 'form' || !started());
    summary();
  }
  function dcrTab(code) { CUR = code; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  function summary() {
    const pob = ST.visits.concat(ST.unlisted).reduce((s, c) => s + callPob(c), 0), exp = ST.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
    document.getElementById('dcrSum').innerHTML = `<b>${ST.visits.length + ST.unlisted.length}</b> calls · POB <b>₹${money(pob)}</b><br>Expense <b>₹${money(exp)}</b>`;
    const ro = !ST.canEdit;
    document.getElementById('dcrFinalBtn').classList.toggle('d-none', ro || !started() || VIEW !== 'form');
    document.getElementById('dcrDraftBtn').disabled = ro; document.getElementById('dcrSubmitBtn').disabled = ro;
    document.getElementById('dcrSubmitBtn').innerHTML = ST.status === 3 ? '<i class="bi bi-send-check"></i> <span class="t">Resubmit</span>' : '<i class="bi bi-send-check"></i> <span class="t">Submit</span>';
  }
  const callPob = (c) => { const s = (c.items || []).reduce((a, i) => a + Number(i.pobQty || 0) * Number(i.rate || 0), 0); return s > 0 ? s : Number(c.pobValue || 0); };

  const opts = (list, sel, ph) => `<option value="">${ph || '--'}</option>` + list.map(o => { const v = o.id != null ? o.id : o, l = o.name != null ? o.name : o;
    return `<option value="${esc(v)}"${String(v) === String(sel) ? ' selected' : ''}>${esc(l)}</option>`; }).join('');
  const field = (label, html, cls) => `<div class="${cls || 'col-12'}"><label class="form-label">${label}</label>${html}</div>`;
  const inp = (key, type, extra) => `<input class="form-control" type="${type || 'text'}" value="${esc(ST[key])}" oninput="ST.${key}=this.value" ${extra || ''} />`;

  const RULE = (code, dflt) => { const v = ((OPT && OPT.rules) || {})[code]; return v == null || v === '' ? dflt : /^(true|1|y)$/i.test(v); };
  const tmField = (sel) => RULE('DAY_START_TRAVEL_MODE_VISIBLITY', true) ? field('Travel mode' + (RULE('DAY_START_TRAVEL_MODE_MANDATORY', false) ? ' *' : ''), sel, 'col-6') : '';
  const meterField = () => RULE('METER_READING_DAYSTART_VISIBLITY', true) ? field('Meter start (km)', inp('meterStart', 'number', 'inputmode="decimal" step="0.1"'), 'col-6') : '';
  const wtName = (c) => { const w = (OPT.workTypes || []).find(x => x.code === c); return w ? w.name : c; };
  function paneDay() {
    const working = ST.workType === 'WORKING', today = ST.dcrDate === todayStr();
    if (!started()) {
      const when = today ? 'Today: ' : 'Date: ', dt = new Date(ST.dcrDate + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
      return `<div class="card-lite d-flex align-items-center gap-3"><div class="flex-fill"><div class="fs-5 fw-bold">Day not started</div>
          <div class="text-muted">${when}${esc(dt)}</div><div class="text-muted">Start your day first.</div></div>
          <button class="dcr-start-btn" onclick="startSheet()"><i class="bi bi-play-circle"></i> Start Day</button></div>
        <div class="small text-muted text-center mt-3">Client check-in, expense and the other tabs open once your day is started.</div>`;
    }
    return `<div class="card-lite"><div class="d-flex justify-content-between text-center">
        <div class="flex-fill"><small class="text-muted d-block">Time in</small><b class="fs-5">${esc(ST.timeIn || '--:--')}</b></div>
        <div class="flex-fill"><small class="text-muted d-block">Time out</small><b class="fs-5">${esc(ST.timeOut || '--:--')}</b><small class="text-muted d-block">${ST.timeOut ? '' : 'set when you submit'}</small></div>
        <div class="flex-fill"><small class="text-muted d-block">Day</small><b class="fs-6">${esc(wtName(ST.workType))}</b></div></div></div>
      ${working && ST.canEdit ? '<button class="dcr-addvisit" onclick="addVisitSheet()"><i class="bi bi-plus-circle"></i> Add visit</button>' : ''}
      ${working ? visitSummary() : ''}
      ${working ? `<div class="card-lite"><div class="row g-3">
        ${field('Started from', `<select class="form-select" data-no-search onchange="ST.startAreaId=this.value">${opts(OPT.areas, ST.startAreaId, 'Select area')}</select>`)}
        ${tmField(`<select class="form-select" data-no-search onchange="ST.travelMode=this.value">${opts(OPT.travelModes, ST.travelMode, 'Select')}</select>`)}
        ${meterField()}
        ${field('Remarks', `<textarea class="form-control" rows="2" oninput="ST.remarks=this.value">${esc(ST.remarks)}</textarea>`)}</div></div>`
        : `<div class="card-lite">${field('Remarks', `<textarea class="form-control" rows="2" oninput="ST.remarks=this.value">${esc(ST.remarks)}</textarea>`)}</div>`}
      ${ST.canEdit ? `<button class="btn btn-outline-danger w-100 mt-1" onclick="dcrDelete(${ST.dcrId})"><i class="bi bi-trash"></i> Delete this DCR</button>` : ''}`;
  }
  async function dcrDelete(id) {
    if (!confirm('Delete this DCR with all its visits and expenses? This cannot be undone.')) return;
    try {
      await Api.del(EP.del(id)); SFA.toast('DCR deleted', true);
      if (VIEW === 'list') { dcrLoadList(); sheetClose(); } else { await loadDay(); }
      pendingBadge();
    } catch (e) { SFA.toast(e.message, false); }
  }
  function startSheet() {
    const working = ST.workType === 'WORKING', today = ST.dcrDate === todayStr();
    const wt = `<select class="form-select" data-no-search onchange="ST.workType=this.value;startSheet()">${opts(OPT.workTypes.map(w => ({ id: w.code, name: w.name })), ST.workType)}</select>`;
    sheetOpen('Start your day', `<div class="row g-3">${field('Work type', wt)}
      ${working ? field('Starting from (area)', `<select class="form-select" data-no-search onchange="ST.startAreaId=this.value">${opts(OPT.areas, ST.startAreaId, 'Select area')}</select>`) : ''}
      ${working ? tmField(`<select class="form-select" data-no-search onchange="ST.travelMode=this.value">${opts(OPT.travelModes, ST.travelMode, 'Select')}</select>`) + meterField() : ''}
      ${today ? '' : field('Time in (earlier day)', inp('timeIn', 'time'), 'col-6')}
      ${field('Remarks', `<textarea class="form-control" rows="2" oninput="ST.remarks=this.value">${esc(ST.remarks)}</textarea>`)}</div>
      <div class="small text-muted mt-3"><i class="bi bi-clock"></i> ${today ? 'Your time in is captured when you tap Start Day.' : 'Enter the time your day started.'}</div>`,
      '<button class="btn btn-light" onclick="sheetClose()">Cancel</button><button class="dcr-start-btn flex-fill" onclick="dcrStart()"><i class="bi bi-play-circle"></i> Start Day</button>');
  }
  async function dcrStart() {
    try {
      const d = await Api.post(EP.start, { dcrDate: ST.dcrDate, workType: ST.workType, startAreaId: n(ST.startAreaId), travelMode: s(ST.travelMode), meterStart: n(ST.meterStart), remarks: s(ST.remarks), timeIn: s(ST.timeIn) });
      ST = fromDto(d); CUR = 'day'; sheetClose(); render();
      SFA.toast('Day started at ' + ST.timeIn, true);
    } catch (e) { SFA.toast(e.message, false); }
  }
  function setWork(w) { if (!ST.canEdit || started()) return; ST.workType = w; render(); }


  // ---- "Add visit": what are you doing now? (one card per tab the table gives this user)
  const KIND_ICON = { CHECKIN: 'person-badge', UNLISTED: 'person-plus', EXPENSE: 'wallet2', JOINT: 'people', DAYEND: 'moon' };
  function addVisitSheet() {
    const cards = OPT.tabs.map(t => `<button class="dcr-kind" onclick="chooseKind('${esc(t.code)}')"><i class="bi bi-${esc(t.icon || KIND_ICON[t.form] || 'journal')}"></i>${esc(t.name)}
      ${tabCount(t) ? `<small>${tabCount(t)} added</small>` : ''}</button>`).join('');
    sheetOpen('What are you doing now?', `<div class="dcr-kinds">${cards || '<div class="dcr-empty">Nothing is enabled for you</div>'}</div>`, '<button class="btn btn-light" onclick="sheetClose()">Close</button>');
  }
  function chooseKind(code) {
    const t = OPT.tabs.find(x => x.code === code);
    if (t.form === 'CHECKIN') return pickClient(code);
    if (t.form === 'UNLISTED') return newUnlisted(code);
    if (t.form === 'EXPENSE') return editExpense(-1);
    CUR = code; sheetClose(); render();   // joint working / day end are plain tabs
  }
  function visitSummary() {
    const rows = ST.visits.map((c, i) => ['v', i, c]).concat(ST.unlisted.map((c, i) => ['u', i, c])).filter(x => x[2].inTime);
    if (!rows.length) return '';
    return '<div class="dcr-sec mt-0">Visit summary</div>' + rows.map(([k, i, c]) => `<div class="card-lite dcr-visit" onclick="editCall('${k}',${i})"><div class="ava">${esc(initials(c.clientName))}</div>
      <div class="meta"><b>${esc(c.clientName)}</b><small class="text-muted">${esc(c.inTime)}${c.outTime ? ' – ' + esc(c.outTime) : ''}${k === 'u' ? ' · Unlisted' : ''}</small></div>
      ${isOpen(c) ? '<span class="badge bg-success">Checked in</span>' : c.refused ? '<span class="badge bg-warning text-dark">Refused</span>' : '<span class="badge bg-secondary">Done</span>'}</div>`).join('');
  }

  // ---- check-in / unlisted card lists
  function paneCalls(tab, kind) {
    const list = kind === 'v' ? ST.visits.map((c, i) => [c, i]).filter(x => x[0].worktypeCode === tab.code) : ST.unlisted.map((c, i) => [c, i]);
    const cards = list.map(([c, i]) => {
      const name = kind === 'v' ? c.clientName : c.clientName, sub = kind === 'v' ? [c.clientCode, c.clientTypeName].filter(Boolean).join(' · ') : (c.mobile || 'Unlisted');
      const pob = callPob(c), nItems = (c.items || []).length;
      return `<div class="card-lite dcr-visit" onclick="editCall('${kind}',${i})"><div class="ava">${esc(initials(name))}</div>
        <div class="meta"><b>${esc(name)}</b><small class="text-muted">${esc(sub)}${c.inTime ? ' · ' + esc(c.inTime) + (c.outTime ? '–' + esc(c.outTime) : '') : ''}</small>
        <small>${isOpen(c) ? '<span class="badge bg-success">Checked in — tap to check out</span> ' : ''}${c.refused ? '<span class="badge bg-warning text-dark">Refused</span> ' : ''}${pob ? `<span class="badge bg-success">POB ₹${money(pob)}</span> ` : ''}${nItems ? `<span class="badge bg-light text-dark border">${nItems} item${nItems > 1 ? 's' : ''}</span>` : ''}</small></div>
        <i class="bi bi-chevron-right text-muted"></i></div>`; }).join('');
    return (cards || `<div class="dcr-empty"><i class="bi bi-person-plus fs-1"></i><div>No ${kind === 'v' ? 'client' : 'unlisted'} calls yet</div></div>`) +
      (ST.canEdit ? `<button class="dcr-add" onclick="${kind === 'v' ? `pickClient('${esc(tab.code)}')` : `newUnlisted('${esc(tab.code)}')`}"><i class="bi bi-plus-circle"></i> Add ${kind === 'v' ? 'client' : 'unlisted client'}</button>` : '');
  }

  function clientsFor(tab) {
    const claimed = new Set(OPT.tabs.filter(t => t.form === 'CHECKIN' && t.clientTypeId != null).map(t => t.clientTypeId));
    return OPT.clients.filter(c => tab.clientTypeId != null ? c.clientTypeId === tab.clientTypeId : !claimed.has(c.clientTypeId));
  }
  function pickClient(code) {
    EDIT = null;
    const tab = OPT.tabs.find(t => t.code === code), used = new Set(ST.visits.filter(v => v.worktypeCode === code).map(v => v.clientId));
    const list = clientsFor(tab).filter(c => !used.has(c.id));
    sheetOpen('Add ' + tab.name.replace(/ Check-in$/, ''), `<input class="form-control mb-2" id="pickQ" placeholder="Search name, code, area…" oninput="pickFilter()" />
      <div class="dcr-pick" id="pickList"></div>`, `<button class="btn btn-light" onclick="sheetClose()">Close</button>`);
    window.__pick = list; window.__pickTab = code; pickFilter();
  }
  function pickFilter() {
    const q = (document.getElementById('pickQ').value || '').toLowerCase();
    const rows = window.__pick.filter(c => !q || (c.name + ' ' + c.code + ' ' + (c.areaName || '') + ' ' + (c.speciality || '')).toLowerCase().includes(q));
    document.getElementById('pickList').innerHTML = rows.map(c => `<div class="row-i" onclick="addClient(${c.id})"><div class="dcr-visit"><div class="ava">${esc(initials(c.name))}</div></div>
      <div class="meta" style="min-width:0"><b>${esc(c.name)}</b><br><small class="text-muted">${esc([c.code, c.speciality, c.areaName].filter(Boolean).join(' · '))}</small></div></div>`).join('')
      || '<div class="dcr-empty">No client found</div>';
  }
  function addClient(id) {
    const c = OPT.clients.find(x => x.id === id), code = window.__pickTab;
    ST.visits.push({ clientId: c.id, clientName: c.name, clientCode: c.code, clientTypeName: c.clientTypeName, worktypeCode: code, visitType: (OPT.visitTypes[0] || 'CALL'), activityType: '', areaId: c.areaId || '',
      inTime: '', outTime: '', checkinAt: '', checkinLat: null, checkinLng: null, pobValue: '', remarks: '', refused: false, nextVisit: '', nextVisitPriority: '', nextVisitRemarks: '',
      signaturePath: '', items: [], leaflets: [], treatments: [], jointWith: [] });
    render(); editCall('v', ST.visits.length - 1);   // same sheet: its content is replaced (closing + reopening it would race)
  }
  function newUnlisted(code) {
    ST.unlisted.push({ key: 'n' + (++KEYSEQ), worktypeCode: code, clientName: '', clientTypeId: '', specialityId: '', categoryId: '', qualification: '', mobile: '', contactPerson: '', address: '', areaId: '',
      visitType: (OPT.visitTypes[0] || 'CALL'), activityType: '', inTime: '', outTime: '', checkinAt: '', checkinLat: null, checkinLng: null, pobValue: '', remarks: '', refused: false,
      nextVisit: '', nextVisitPriority: '', nextVisitRemarks: '', signaturePath: '', items: [], leaflets: [], treatments: [], jointWith: [] });
    render(); editCall('u', ST.unlisted.length - 1, true);
  }

  // ============================================================== bottom sheet
  function sheetOpen(title, body, foot, onClose) {
    document.getElementById('sheetTitle').textContent = title;
    document.getElementById('sheetBody').innerHTML = body;
    document.getElementById('sheetFoot').innerHTML = foot || '';
    SHEET_ON_CLOSE = onClose || null;
    SHEET.show();
  }
  function sheetClose() { SHEET.hide(); }
  // X on a call that was never checked in: drop it again (nothing was saved)
  function sheetX() { dropUnsaved(); sheetClose(); }
  function dropUnsaved() {
    if (!EDIT || (EDIT.kind !== 'v' && EDIT.kind !== 'u')) return;
    const list = EDIT.kind === 'v' ? ST.visits : ST.unlisted;
    if (list[EDIT.idx] && !list[EDIT.idx].inTime) { list.splice(EDIT.idx, 1); render(); }
  }

  // ============================================================== call editor
  function editCall(kind, idx, isNew) {
    const src = kind === 'v' ? ST.visits[idx] : ST.unlisted[idx];
    EDIT = { kind, idx, isNew: !!isNew, o: JSON.parse(JSON.stringify(src)) };
    sheetOpen(kind === 'v' ? EDIT.o.clientName : (EDIT.o.clientName || 'New unlisted client'), '', '', null);
    renderCall();
    callFoot();
  }
  function callFoot() {
    const o = EDIT.o, ro = !ST.canEdit;
    document.getElementById('sheetFoot').innerHTML = ro ? '<button class="btn btn-light" onclick="sheetClose()">Close</button>'
      : !o.inTime ? '<button class="btn btn-light" onclick="sheetX()">Cancel</button><button class="btn btn-success" onclick="doCheckIn()"><i class="bi bi-geo-alt"></i> Check in</button>'
      : !o.outTime && !o.refused ? '<button class="btn btn-outline-danger" style="flex:0 0 auto" onclick="callDelete()" title="Delete this check-in"><i class="bi bi-trash"></i></button><button class="btn btn-outline-primary" onclick="callSave()"><i class="bi bi-save"></i> Save</button><button class="btn btn-success" onclick="doCheckOut()"><i class="bi bi-box-arrow-right"></i> Check out</button>'
      : '<button class="btn btn-outline-danger" style="flex:0 0 auto" onclick="callDelete()" title="Delete this check-in"><i class="bi bi-trash"></i></button><button class="btn btn-primary" onclick="callSave()"><i class="bi bi-check2"></i> Done</button>';
  }
  const tabOf = (code) => OPT.tabs.find(t => t.code === code) || { subForms: [] };
  function renderCall() {
    const o = EDIT.o, tab = tabOf(o.worktypeCode), subs = tab.subForms || [], u = EDIT.kind === 'u';
    const o_ = (k) => `EDIT.o.${k}`;
    let h = '';
    if (u) {
      h += `<div class="dcr-sec mt-0">Client</div><div class="row g-2">
        ${field('Name *', `<input class="form-control" value="${esc(o.clientName)}" oninput="${o_('clientName')}=this.value;document.getElementById('sheetTitle').textContent=this.value||'New unlisted client'" />`)}
        ${!RULE('UNLISTED_VISIT_MOBILE_VISIBLITY', true) ? '' : field('Mobile' + (RULE('UNLISTED_VISIT_MOBILE', false) ? ' *' : ''), `<input class="form-control" inputmode="numeric" maxlength="10" value="${esc(o.mobile)}" oninput="${o_('mobile')}=this.value" />`, 'col-6')}
        ${field('Client type', `<select class="form-select" data-no-search onchange="${o_('clientTypeId')}=this.value">${opts(OPT.clientTypes, o.clientTypeId)}</select>`, 'col-6')}
        ${!RULE('UNLISTED_VISIT_SPECIALITY_VISIBLITY', true) ? '' : field('Speciality' + (RULE('UNLISTED_VISIT_SPECIALITY', false) ? ' *' : ''), `<select class="form-select" data-no-search onchange="${o_('specialityId')}=this.value">${opts(OPT.specialities, o.specialityId)}</select>`, 'col-6')}
        ${!RULE('UNLISTED_VISIT_CATEGORY_VISIBLITY', true) ? '' : field('Category' + (RULE('UNLISTED_VISIT_CATEGORY', false) ? ' *' : ''), `<select class="form-select" data-no-search onchange="${o_('categoryId')}=this.value">${opts(OPT.categories, o.categoryId)}</select>`, 'col-6')}
        ${field('Qualification', `<input class="form-control" value="${esc(o.qualification)}" oninput="${o_('qualification')}=this.value" />`, 'col-6')}
        ${field('Contact person', `<input class="form-control" value="${esc(o.contactPerson)}" oninput="${o_('contactPerson')}=this.value" />`, 'col-6')}
        ${field('Area', `<select class="form-select" data-no-search onchange="${o_('areaId')}=this.value">${opts(OPT.areas, o.areaId, 'Select area')}</select>`)}
        ${field('Address', `<textarea class="form-control" rows="2" oninput="${o_('address')}=this.value">${esc(o.address)}</textarea>`)}</div>`;
    } else {
      h += `<div class="small text-muted mb-2">${esc([o.clientCode, o.clientTypeName].filter(Boolean).join(' · '))}</div>`;
    }
    h += `<div class="dcr-sec">Visit</div><div class="row g-2">
        ${field('Visit type', `<select class="form-select" data-no-search onchange="${o_('visitType')}=this.value">${opts(OPT.visitTypes.length ? OPT.visitTypes : ['CALL'], o.visitType, '')}</select>`, 'col-6')}
        ${field('Activity', `<select class="form-select" data-no-search onchange="${o_('activityType')}=this.value">${opts(OPT.activityTypes, o.activityType)}</select>`, 'col-6')}
        ${u ? '' : field('Area', `<select class="form-select" data-no-search onchange="${o_('areaId')}=this.value">${opts(OPT.areas, o.areaId)}</select>`)}</div>`;
    h += o.inTime ? `<div class="alert ${o.outTime || o.refused ? 'alert-secondary' : 'alert-success'} mt-3 mb-0 py-2"><i class="bi bi-geo-alt-fill"></i> Checked in at <b>${esc(o.inTime)}</b>${o.checkinLat ? ' · location saved' : ''}${o.outTime ? ` · Checked out at <b>${esc(o.outTime)}</b>` : o.refused ? '' : ' — tap <b>Check out</b> when you leave'}</div>`
      : `<div class="alert alert-info mt-3 mb-0 py-2 small"><i class="bi bi-info-circle"></i> ${u ? 'Fill the client details, then tap <b>Check in</b>.' : 'Tap <b>Check in</b> when you reach the client.'} It is saved in your draft and the time is captured.</div>`;
    h += `<div class="form-check form-switch my-3"><input class="form-check-input" type="checkbox" id="refSw" ${o.refused ? 'checked' : ''} onchange="${o_('refused')}=this.checked"><label class="form-check-label" for="refSw">Client refused to meet</label></div>`;
    if (subs.includes('ITEMS')) {
      h += `<div class="dcr-sec">Items — sample / gift / input / POB</div>` + (o.items.map((it, i) => itemRow(it, i)).join('') || '<div class="small text-muted mb-2">No items added</div>')
        + `<button class="btn btn-outline-primary btn-sm rounded-pill" onclick="addItem()"><i class="bi bi-plus"></i> Add item</button>
          <div class="row g-2 mt-2">${field('POB value (₹) — used when no POB items', `<input class="form-control" type="number" inputmode="decimal" value="${esc(o.pobValue)}" oninput="${o_('pobValue')}=this.value" />`)}</div>`;
    } else {
      h += `<div class="row g-2 mt-1">${field('POB value (₹)', `<input class="form-control" type="number" inputmode="decimal" value="${esc(o.pobValue)}" oninput="${o_('pobValue')}=this.value" />`)}</div>`;
    }
    if (subs.includes('LEAFLETS')) {
      const leafItems = OPT.items;
      h += `<div class="dcr-sec">Leaflets</div>` + (o.leaflets.map((l, i) => `<div class="dcr-item"><div class="row g-2 align-items-end">
        ${field('Leaflet', `<select class="form-select" data-no-search onchange="EDIT.o.leaflets[${i}].itemId=this.value">${opts(leafItems, l.itemId, 'Select')}</select>`, 'col-8')}
        ${field('Qty', `<input class="form-control" type="number" inputmode="numeric" value="${esc(l.qty)}" oninput="EDIT.o.leaflets[${i}].qty=this.value" />`, 'col-3')}
        <div class="col-1 text-end"><button class="btn btn-sm text-danger" onclick="EDIT.o.leaflets.splice(${i},1);renderCall()"><i class="bi bi-x-lg"></i></button></div></div></div>`).join(''))
        + `<button class="btn btn-outline-primary btn-sm rounded-pill" onclick="EDIT.o.leaflets.push({itemId:'',qty:1,value:0});renderCall()"><i class="bi bi-plus"></i> Add leaflet</button>`;
    }
    if (subs.includes('TREATMENT') && OPT.treatments.length) {
      h += `<div class="dcr-sec">Treatment</div><div class="dcr-chips">` + OPT.treatments.map(t => `<button type="button" class="dcr-chip ${o.treatments.includes(t.id) ? 'on' : ''}" onclick="toggleIn(EDIT.o.treatments,${t.id});renderCall()">${esc(t.name)}</button>`).join('') + '</div>';
    }
    if (OPT.tabs.some(t => t.form === 'JOINT') && OPT.joint.length) {
      h += `<div class="dcr-sec">Worked with</div><div class="dcr-chips">` + OPT.joint.map(j => `<button type="button" class="dcr-chip ${o.jointWith.includes(j.id) ? 'on' : ''}" onclick="toggleIn(EDIT.o.jointWith,'${esc(j.id)}');renderCall()">${esc(j.name)}</button>`).join('') + '</div>';

  // ============================================================== save / submit
  const n = (v) => (v === '' || v == null ? null : Number(v));
  const s = (v) => (v === '' || v == null ? null : v);
  function callPayload(c) {
    return { worktypeCode: c.worktypeCode, visitType: c.visitType, activityType: s(c.activityType), areaId: n(c.areaId), inTime: s(c.inTime), outTime: s(c.outTime), checkinAt: s(c.checkinAt),
      checkinLat: c.checkinLat, checkinLng: c.checkinLng, pobValue: n(c.pobValue), remarks: s(c.remarks), refused: !!c.refused, nextVisit: s(c.nextVisit), nextVisitPriority: s(c.nextVisitPriority),
      nextVisitRemarks: s(c.nextVisitRemarks), signaturePath: s(c.signaturePath), jointWith: c.jointWith || [], treatments: c.treatments || [],
      items: (c.items || []).map(i => ({ itemId: Number(i.itemId), itemType: i.itemType, qty: n(i.qty) || 0, pobQty: n(i.pobQty) || 0, rate: n(i.rate), detailed: !!i.detailed, remarks: s(i.remarks) })),
      leaflets: (c.leaflets || []).map(l => ({ itemId: Number(l.itemId), qty: n(l.qty) || 0, value: n(l.value) || 0 })) };
  }
  function payload(submit) {
    return { dcrDate: ST.dcrDate, workType: ST.workType, startAreaId: n(ST.startAreaId), workingAreaId: n(ST.workingAreaId), travelMode: s(ST.travelMode),
      meterStart: n(ST.meterStart), meterEnd: n(ST.meterEnd), remarks: s(ST.remarks), dayEndAreaId: n(ST.dayEndAreaId), dayEndAt: s(ST.dayEndAt), dayEndRemarks: s(ST.dayEndRemarks),
      stayAreaId: n(ST.stayAreaId), stayHotel: s(ST.stayHotel), jointWith: ST.jointWith, submit,
      visits: ST.visits.filter(v => v.inTime).map(v => Object.assign({ clientId: v.clientId }, callPayload(v))),   // only checked-in calls are saved
      unlisted: ST.unlisted.filter(u => u.inTime).map(u => Object.assign({ key: u.key, clientName: u.clientName, clientTypeId: n(u.clientTypeId), specialityId: n(u.specialityId), categoryId: n(u.categoryId),
        qualification: s(u.qualification), mobile: s(u.mobile), contactPerson: s(u.contactPerson), address: s(u.address) }, callPayload(u))),
      expenses: ST.expenses.map(e => ({ expenseId: Number(e.expenseId), amount: Number(e.amount), description: s(e.description), clientKind: e.clientKind || 0, clientId: e.clientId, unlistedKey: e.unlistedKey,
        fromAreaId: n(e.fromAreaId), toAreaId: n(e.toAreaId), startKm: n(e.startKm), endKm: n(e.endKm), startImagePath: s(e.startImagePath), endImagePath: s(e.endImagePath),
        fileName: s(e.fileName), fileType: s(e.fileType), filePath: s(e.filePath) })) };
  }
  // The same rules the server enforces (app_validations), checked first so the user sees ALL problems at once.
  function submitIssues() {
    const out = [], calls = ST.visits.concat(ST.unlisted).filter(c => c.inTime), working = ST.workType === 'WORKING';
    if (working && !calls.length) out.push('Add at least one client call');
    if (RULE('CHECKOUT', true)) calls.filter(c => !c.outTime && !c.refused).forEach(c => out.push('Check out of ' + (c.clientName || 'the client') + ' first'));
    if (RULE('DCR_Remarks', false) && !String(ST.remarks || '').trim()) out.push('Remarks are required');
    ST.unlisted.filter(u => u.inTime).forEach(u => {
      [['MOBILE', 'mobile', 'Mobile'], ['SPECIALITY', 'specialityId', 'Speciality'], ['CATEGORY', 'categoryId', 'Category']].forEach(([c, k, l]) => {
        if (RULE('UNLISTED_VISIT_' + c + '_VISIBLITY', true) && RULE('UNLISTED_VISIT_' + c, false) && !String(u[k] || '').trim()) out.push(l + ' of ' + (u.clientName || 'unlisted client') + ' is required');
      });
    });
    const w = ((OPT.rules || {}).DCR_BETWEEN_TIME || '').split('-');
    if (working && w.length === 2) calls.forEach(c => [c.inTime, c.outTime].filter(Boolean).forEach(t => {
      const hm = String(t).slice(-5); if (hm < w[0].trim() || hm > w[1].trim()) out.push((c.clientName || 'A call') + ': time ' + hm + ' is outside ' + w[0].trim() + '-' + w[1].trim());
    }));
    return [...new Set(out)];
  }
  async function dcrSave(submit, silent) {
    if (submit) {
      const issues = submitIssues();
      if (issues.length) { SFA.toast(issues.slice(0, 4).join(' · ') + (issues.length > 4 ? ' (+' + (issues.length - 4) + ' more)' : ''), false); CUR = 'day'; render(); return false; }
    }
    if (submit && !confirm('Submit this DCR for approval? Your time out is captured now.')) return false;
    try {
      const saved = await Api.post(EP.save, payload(submit));
      ST = fromDto(saved); render();
      if (!silent) SFA.toast(submit ? 'DCR submitted' : 'Draft saved', true);
      return true;
    } catch (e) { SFA.toast(e.message, false); return false; }
  }

  async function dcrOpen(id) {

      const d = await Api.get(EP.get(id));
      if (d.empId === OPT.me && d.canEdit) { document.getElementById('dcrDate').value = d.dcrDate; dcrView('form'); await loadDay(); return; }
      const foot = d.canApprove ? `<button class="btn btn-outline-danger" onclick="dcrDecide(${id},false)"><i class="bi bi-x-circle"></i> Reject</button><button class="btn btn-success" onclick="dcrDecide(${id},true)"><i class="bi bi-patch-check"></i> Approve</button>`
        : '<button class="btn btn-light" onclick="sheetClose()">Close</button>';
      const delBtn = OPT.isAdmin ? `<button class="btn btn-outline-danger" onclick="dcrDelete(${id})"><i class="bi bi-trash"></i> Delete</button>` : '';
      sheetOpen(d.empName + ' · ' + Settings.formatDate(d.dcrDate), detailHtml(d), delBtn + foot);
    } catch (e) { SFA.toast(e.message, false); }
  }
  const jname = (id) => { const j = OPT.joint.find(x => x.id === id); return j ? j.name : id; };
  function detailHtml(d) {
    const call = (c, u) => `<div class="card-lite"><b>${esc(c.clientName)}</b> <small class="text-muted">${esc(u ? (c.mobile || 'Unlisted') : (c.clientCode || ''))}</small>
      <div class="small text-muted">${esc([c.inTime && c.outTime ? c.inTime + '–' + c.outTime : c.inTime, c.visitType, c.activityType].filter(Boolean).join(' · '))}</div>
      ${c.refused ? '<span class="badge bg-warning text-dark">Refused to meet</span>' : ''}
      ${(c.items || []).map(i => `<div class="small">• ${esc(i.itemName)} <span class="text-muted">(${esc(i.itemType)})</span> given ${i.qty}${i.pobQty ? ', POB ' + i.pobQty + ' × ₹' + money(i.rate) : ''}${i.detailed ? ' · detailed' : ''}</div>`).join('')}
      ${(c.leaflets || []).map(l => `<div class="small">• Leaflet ${esc(l.itemName)} × ${l.qty}</div>`).join('')}
      ${(c.treatments || []).map(t => { const x = OPT.treatments.find(z => z.id === t); return `<div class="small">• Treatment: ${esc(x ? x.name : t)}</div>`; }).join('')}
      ${(c.jointWith || []).length ? `<div class="small">With: ${c.jointWith.map(j => esc(jname(j))).join(', ')}</div>` : ''}
      ${Number(c.pobValue) ? `<span class="badge bg-success">POB ₹${money(c.pobValue)}</span>` : ''} ${c.remarks ? `<div class="small mt-1">${esc(c.remarks)}</div>` : ''}</div>`;
    return `<div class="d-flex justify-content-between align-items-center mb-2"><div class="text-muted small">${esc(d.designation || '')} · ${esc(d.workType)}${d.timeIn ? ' · ' + esc(d.timeIn) + (d.timeOut ? '–' + esc(d.timeOut) : '') : ''}</div>${stBadge(d.status)}</div>
      ${d.remarks ? `<div class="small mb-2">${esc(d.remarks)}</div>` : ''}
      ${(d.jointWith || []).length ? `<div class="small mb-2">Worked with: ${d.jointWith.map(j => esc(jname(j))).join(', ')}</div>` : ''}
      ${d.visits.length ? '<div class="dcr-sec">Client calls</div>' + d.visits.map(v => call(v, false)).join('') : ''}
      ${d.unlisted.length ? '<div class="dcr-sec">Unlisted calls</div>' + d.unlisted.map(v => call(v, true)).join('') : ''}
      ${d.expenses.length ? '<div class="dcr-sec">Expenses</div>' + d.expenses.map(e => `<div class="card-lite d-flex justify-content-between"><span>${esc(e.expenseName)} <small class="text-muted">${esc(e.description || '')}</small></span><b>₹${money(e.amount)}</b></div>`).join('') : ''}
      ${d.approvalRemarks ? `<div class="alert alert-light small">${esc(d.approvedByName || '')}: ${esc(d.approvalRemarks)}</div>` : ''}`;
  }
  async function dcrDecide(id, ok) {
    try {
      if (ok) { await Api.post(EP.approve(id), { remarks: null }); SFA.toast('DCR approved', true); }
      else { const r = prompt('Why is this DCR rejected? (the employee sees this)'); if (r === null) return; if (!r.trim()) { SFA.toast('Please give the reason', false); return; }
        await Api.post(EP.reject(id), { reason: r.trim() }); SFA.toast('DCR rejected', true); }
      sheetClose(); dcrLoadList(); pendingBadge();
    } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
