<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Mail Settings</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
<style>
  .rp-kpis { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 .6rem; } .rp-kpi { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-left: 3px solid var(--bs-primary); border-radius: .4rem; padding: .35rem .8rem; min-width: 7.5rem; flex: 1 1 7.5rem; }
  .rp-kpi small { color: var(--bs-secondary-color); display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; } .rp-kpi b { font-size: 1.05rem; } .rp-kpi.ok { border-left-color: #198754; } .rp-kpi.warn { border-left-color: #fd7e14; }
  .rp-filters .form-label { font-size: .72rem; font-weight: 600; color: var(--bs-secondary-color); margin-bottom: .1rem; }
  .ex-wrap { max-height: calc(100vh - 330px); min-height: 280px; overflow: auto; border: 1px solid var(--bs-border-color); border-radius: .4rem; }
  table.ex { border-collapse: separate; border-spacing: 0; font-size: .78rem; width: max-content; min-width: 100%; }
  table.ex th, table.ex td { border-right: 1px solid var(--bs-border-color); border-bottom: 1px solid var(--bs-border-color); padding: .25rem .4rem; vertical-align: middle; }
  table.ex thead th { background: #0a5a78; color: #fff; position: sticky; top: 0; z-index: 3; text-align: center; white-space: nowrap; }
  table.ex td.n { text-align: right; font-variant-numeric: tabular-nums; } table.ex td.route { min-width: 260px; } table.ex input { width: 5.4rem; text-align: right; } table.ex input.rm { width: 9rem; text-align: left; } table.ex input.bl { width: 3.6rem; }
  table.ex tr.lv-U td { background: #d6e9ff; } table.ex tr.lv-M td { background: #ffe2a8; } table.ex tr.lv-A td { background: #e6d0ff; } table.ex tr.k-abs td { background: #ffd0d0; color: #842029; font-weight: 600; } table.ex tr.k-lv td { background: #d3f2dd; color: #0f5132; } table.ex tr.off td { color: var(--bs-secondary-color); background: var(--bs-tertiary-bg); }
  table.ex tfoot td { position: sticky; bottom: 0; background: #e7f0f4; font-weight: 700; z-index: 3; }
  .lg { display: inline-flex; align-items: center; gap: .3rem; font-size: .75rem; margin-right: .8rem; } .lg i { width: 1rem; height: 1rem; display: inline-block; border: 1px solid #0003; border-radius: .2rem; }
  .flow { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; font-size: .78rem; } .flow span { padding: .15rem .6rem; border-radius: 1rem; background: var(--bs-tertiary-bg); } .flow span.on { background: #198754; color: #fff; } .flow span.cur { background: #fd7e14; color: #fff; }
  tr.rp-click { cursor: pointer; }
</style>

<body>
<div id="app" data-page="mailsettings" data-title="Mail Settings"></div>
<template id="pageContent">
<div class="alert alert-warning py-2 d-none" id="keyWarn"><i class="bi bi-shield-exclamation"></i> <span data-i18n="ms.noKey">The mail encryption key is not set on the server (environment variable SFA_MAIL_KEY). Your mail password cannot be saved until the admin sets it.</span></div>
<div class="card mb-2"><div class="card-header d-flex align-items-center gap-2"><span><i class="bi bi-envelope-at"></i> <span data-i18n="ms.title">My mail account (SMTP + IMAP)</span></span><span class="ms-auto small text-muted" id="syncInfo"></span></div>
  <div class="card-body"><div class="small text-muted mb-2" data-i18n="ms.help">Connect your own mail account to read and send external mail inside the app. Without an account you still get the Intramail (company messages). Your password is stored encrypted and is never shown again.</div>
    <div class="row g-2 mb-2"><div class="col-md-4"><label class="form-label small fw-semibold" data-i18n="ms.preset">Provider</label><select class="form-select form-select-sm" id="m_preset" onchange="usePreset()"></select></div>
      <div class="col-md-8 align-self-end"><div class="small text-muted" id="m_hint"></div></div></div>
    <div class="row g-2">
      <div class="col-md-4"><label class="form-label small fw-semibold" data-i18n="ms.email">Email</label><input class="form-control form-control-sm" id="m_email" maxlength="150" autocomplete="off"></div>
      <div class="col-md-4"><label class="form-label small fw-semibold" data-i18n="ms.name">Display name</label><input class="form-control form-control-sm" id="m_name" maxlength="100"></div>
      <div class="col-md-4"><label class="form-label small fw-semibold" data-i18n="ms.user">User name</label><input class="form-control form-control-sm" id="m_user" maxlength="150" autocomplete="off" placeholder="same as email"></div>
      <div class="col-md-4"><label class="form-label small fw-semibold" data-i18n="ms.pass">Password</label><input class="form-control form-control-sm" id="m_pass" type="password" autocomplete="new-password"></div>
      <div class="col-md-8 align-self-end"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="m_on" checked><label class="form-check-label small" for="m_on" data-i18n="ms.enabled">Account is on</label></div></div>
      <div class="col-md-4"><label class="form-label small fw-semibold">SMTP <span data-i18n="ms.host">host</span></label><input class="form-control form-control-sm" id="m_sh" maxlength="150"></div>
      <div class="col-6 col-md-2"><label class="form-label small fw-semibold">SMTP <span data-i18n="ms.port">port</span></label><input class="form-control form-control-sm" id="m_sp" type="number"></div>
      <div class="col-6 col-md-2"><label class="form-label small fw-semibold" data-i18n="ms.sec">Security</label><select class="form-select form-select-sm" id="m_ss"><option>STARTTLS</option><option>SSL</option><option>NONE</option></select></div>
      <div class="col-md-4"><label class="form-label small fw-semibold">IMAP <span data-i18n="ms.host">host</span></label><input class="form-control form-control-sm" id="m_ih" maxlength="150"></div>
      <div class="col-6 col-md-2"><label class="form-label small fw-semibold">IMAP <span data-i18n="ms.port">port</span></label><input class="form-control form-control-sm" id="m_ip" type="number"></div>
      <div class="col-6 col-md-2"><label class="form-label small fw-semibold" data-i18n="ms.sec">Security</label><select class="form-select form-select-sm" id="m_is"><option>SSL</option><option>STARTTLS</option><option>NONE</option></select></div>
      <div class="col-12"><label class="form-label small fw-semibold" data-i18n="ms.sig">Signature</label><textarea class="form-control form-control-sm" id="m_sig" rows="3" maxlength="4000"></textarea></div></div>
    <div class="mt-2 d-flex flex-wrap gap-2"><button class="btn btn-sm btn-outline-primary" onclick="testConn()"><i class="bi bi-plug"></i> <span data-i18n="ms.test">Test connection</span></button>
      <button class="btn btn-sm btn-primary" onclick="saveAcc()"><i class="bi bi-check2"></i> <span data-i18n="common.save">Save</span></button>
      <button class="btn btn-sm btn-outline-danger ms-auto d-none" id="delBtn" onclick="delAcc()"><i class="bi bi-trash"></i> <span data-i18n="ms.remove">Remove my account</span></button></div>
    <div id="testRes" class="mt-2"></div></div></div>
<div class="card mb-2 d-none" id="adminCard"><div class="card-header"><i class="bi bi-gear"></i> <span data-i18n="ms.adminTitle">Company mail defaults (admin)</span></div>
  <div class="card-body"><div class="row g-2">
    <div class="col-md-3"><label class="form-label small fw-semibold" data-i18n="ms.domain">Company domain</label><input class="form-control form-control-sm" id="a_domain" placeholder="company.com"></div>
    <div class="col-md-3"><label class="form-label small fw-semibold">SMTP <span data-i18n="ms.host">host</span></label><input class="form-control form-control-sm" id="a_sh"></div>
    <div class="col-3 col-md-1"><label class="form-label small fw-semibold" data-i18n="ms.port">Port</label><input class="form-control form-control-sm" id="a_sp" type="number"></div>
    <div class="col-3 col-md-2"><label class="form-label small fw-semibold" data-i18n="ms.sec">Security</label><select class="form-select form-select-sm" id="a_ss"><option value=""></option><option>STARTTLS</option><option>SSL</option><option>NONE</option></select></div>
    <div class="col-md-3"></div>
    <div class="col-md-3"><label class="form-label small fw-semibold">IMAP <span data-i18n="ms.host">host</span></label><input class="form-control form-control-sm" id="a_ih"></div>
    <div class="col-3 col-md-1"><label class="form-label small fw-semibold" data-i18n="ms.port">Port</label><input class="form-control form-control-sm" id="a_ip" type="number"></div>
    <div class="col-3 col-md-2"><label class="form-label small fw-semibold" data-i18n="ms.sec">Security</label><select class="form-select form-select-sm" id="a_is"><option value=""></option><option>SSL</option><option>STARTTLS</option><option>NONE</option></select></div>
    <div class="col-md-6"><label class="form-label small fw-semibold" data-i18n="ms.internal">Company's own mail server on the internal network (allowed hosts, comma separated)</label><input class="form-control form-control-sm" id="a_int" placeholder="mail.company.local"></div>
    <div class="col-4 col-md-2"><label class="form-label small fw-semibold" data-i18n="ms.syncMin">Sync every (minutes)</label><input class="form-control form-control-sm" id="a_sync" type="number" min="1"></div>
    <div class="col-4 col-md-2"><label class="form-label small fw-semibold" data-i18n="ms.firstDays">First sync (days)</label><input class="form-control form-control-sm" id="a_days" type="number" min="1"></div>
    <div class="col-4 col-md-2"><label class="form-label small fw-semibold" data-i18n="ms.maxMb">Attachment limit (MB)</label><input class="form-control form-control-sm" id="a_mb" type="number" min="1"></div></div>
    <div class="mt-2"><button class="btn btn-sm btn-primary" onclick="saveAdmin()"><i class="bi bi-check2"></i> <span data-i18n="common.save">Save</span></button></div></div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/core/activity.js"></script>
<script src="js/shell.js"></script>
<script>
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);
  const EP = '/api/mailbox', esc = (v) => SFA.esc(v == null ? '' : v), g = (i) => document.getElementById(i);
  let S = null;
  window.pageInit = async function () { await load(); try { const a = await Api.get(EP + '/admin'); g('adminCard').classList.remove('d-none'); fillAdmin(a); } catch (e) { /* not an admin */ } };
  async function load() {
    try {
      S = await Api.get(EP + '/account'); g('keyWarn').classList.toggle('d-none', S.keyReady);
      g('m_preset').innerHTML = '<option value="">' + T('ms.custom', 'Other / company server') + '</option>' + S.presets.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
      const a = S.account, d = S.defaults || {};
      g('m_email').value = a ? a.email : ''; g('m_name').value = a ? (a.displayName || '') : ''; g('m_user').value = a ? a.username : ''; g('m_pass').value = ''; g('m_pass').placeholder = a && a.hasPassword ? '••••••••  (' + T('ms.keep', 'leave blank to keep') + ')' : '';
      g('m_on').checked = a ? a.enabled : true; g('m_sig').value = a ? (a.signature || '') : '';
      g('m_sh').value = a ? a.smtpHost : (d.smtpHost || ''); g('m_sp').value = a ? a.smtpPort : (d.smtpPort || 587); g('m_ss').value = a ? a.smtpSecurity : (d.smtpSecurity || 'STARTTLS');
      g('m_ih').value = a ? a.imapHost : (d.imapHost || ''); g('m_ip').value = a ? a.imapPort : (d.imapPort || 993); g('m_is').value = a ? a.imapSecurity : (d.imapSecurity || 'SSL');
      g('delBtn').classList.toggle('d-none', !a); g('syncInfo').innerHTML = a ? (a.lastSyncError ? `<span class="text-danger">${esc(a.lastSyncError)}</span>` : (a.lastSyncAt ? T('ms.lastSync', 'Last sync') + ': ' + esc(String(a.lastSyncAt).replace('T', ' ').substring(0, 16)) : '')) : '';
    } catch (e) { SFA.toast(e.message, false); }
  }
  function usePreset() { const p = S.presets.find(x => x.id === g('m_preset').value); g('m_hint').textContent = p ? p.hint : ''; if (!p) return; g('m_sh').value = p.smtpHost; g('m_sp').value = p.smtpPort; g('m_ss').value = p.smtpSecurity; g('m_ih').value = p.imapHost; g('m_ip').value = p.imapPort; g('m_is').value = p.imapSecurity; }
  const body = () => ({ email: g('m_email').value, displayName: g('m_name').value, username: g('m_user').value, password: g('m_pass').value, enabled: g('m_on').checked, signature: g('m_sig').value, smtpHost: g('m_sh').value, smtpPort: g('m_sp').value, smtpSecurity: g('m_ss').value, imapHost: g('m_ih').value, imapPort: g('m_ip').value, imapSecurity: g('m_is').value });
  async function saveAcc() { try { await Api.post(EP + '/account', body()); SFA.toast(T('inv.saved', 'Saved'), true); await load(); } catch (e) { SFA.toast(e.message, false); } }
  async function testConn() {
    g('testRes').innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
    try { const r = await Api.post(EP + '/account/test', body()); const row = (n, x) => `<div class="small ${x.ok ? 'text-success' : 'text-danger'}"><i class="bi bi-${x.ok ? 'check-circle' : 'x-circle'}"></i> <b>${n}</b>: ${esc(x.message)}</div>`; g('testRes').innerHTML = row('SMTP', r.smtp) + row('IMAP', r.imap); }
    catch (e) { g('testRes').innerHTML = `<div class="small text-danger">${esc(e.message)}</div>`; }
  }
  async function delAcc() { if (!confirm(T('ms.confirmRemove', 'Remove your mail account and the mails cached in the app? The mails on your mail server stay.'))) return; try { await Api.post(EP + '/account/delete', {}); SFA.toast(T('exp.done', 'Done'), true); await load(); } catch (e) { SFA.toast(e.message, false); } }
  function fillAdmin(a) { g('a_domain').value = a.company_domain || ''; g('a_sh').value = a.default_smtp_host || ''; g('a_sp').value = a.default_smtp_port || ''; g('a_ss').value = a.default_smtp_security || ''; g('a_ih').value = a.default_imap_host || ''; g('a_ip').value = a.default_imap_port || ''; g('a_is').value = a.default_imap_security || ''; g('a_int').value = a.internal_hosts || ''; g('a_sync').value = a.sync_interval_min; g('a_days').value = a.initial_sync_days; g('a_mb').value = a.max_attachment_mb; }
  async function saveAdmin() { try { await Api.post(EP + '/admin', { company_domain: g('a_domain').value, default_smtp_host: g('a_sh').value, default_smtp_port: g('a_sp').value, default_smtp_security: g('a_ss').value, default_imap_host: g('a_ih').value, default_imap_port: g('a_ip').value, default_imap_security: g('a_is').value, internal_hosts: g('a_int').value, sync_interval_min: g('a_sync').value, initial_sync_days: g('a_days').value, max_attachment_mb: g('a_mb').value }); SFA.toast(T('inv.saved', 'Saved'), true); } catch (e) { SFA.toast(e.message, false); } }
</script>
</body>
</html>
