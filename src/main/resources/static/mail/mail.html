  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>

  // ---------------------------------------------------------------- refresh / poll
  async function refresh(quiet) {

    catch (e) { SFA.toast(e.message, false); } finally { g('refreshBtn').disabled = false; }
  }
  // every minute: the counts are read again; when a sync has brought something new (or the outbox has just emptied) the open list is reloaded too - no need to press Refresh

      const inb = () => (F.folders.find(f => f.role === 'INBOX') || {}), before = inb().unread || 0, syncBefore = F.info.lastSyncAt, outBefore = F.outbox;
      await loadFolders(); const now = inb().unread || 0;

  }
  // after Send: look at the outbox every 5 seconds (up to 3 minutes); when the mail has left, the Sent folder and the list are reloaded

      if (++n > 36 || MODE !== 'ext') { clearInterval(WATCH); return; }
      try { const had = F.outbox; await loadFolders(); if (F.outbox === 0) { clearInterval(WATCH); if (typeof CUR === 'number') await go(PAGE); else if (CUR === 'outbox') await openOutbox(); } } catch (e) { /* try again */ }
    }, 5000);
  }

  // ---------------------------------------------------------------- outbox

  async function ob(id, action) { if (action === 'RETRY' && !confirm(T('mb.confirmAgain', 'Send this mail again? If the first one reached the server, the person will get it twice.'))) return; try { await Api.post(EP + '/outbox/' + id + '/' + action, {}); await loadFolders(); await openOutbox(); } catch (e) { SFA.toast(e.message, false); } }

  // ---------------------------------------------------------------- compose

  const list = (id) => g(id).value.split(/[;,]/).map(s => s.trim()).filter(Boolean);

  const fmt = (c) => { document.execCommand(c); g('c_body').focus(); dirty(); };

  async function saveDraft(manual) {

  async function sendMail() {
    const p = payload(); if (!p.to.length && !p.cc.length && !p.bcc.length) { SFA.toast(T('mb.needTo', 'Add at least one recipient'), false); return; }
    if (!p.subject.trim() && !confirm(T('mb.noSubjectAsk', 'Send without a subject?'))) return;
    g('sendBtn').disabled = true;
    try { await Api.post(EP + '/send', p); if (DRAFT) { try { await Api.post(EP + '/messages/action', { ids: [DRAFT], action: 'PURGE' }, { noLoader: true }); } catch (e) { /* the draft stays */ } } DIRTY = false; CM.hide(); SFA.toast(T('mb.queued', 'Queued - it will be sent in a moment. See Outbox.'), true); await loadFolders(); watchOutbox(); }
    catch (e) { SFA.toast(e.message, false); } finally { g('sendBtn').disabled = false; }
  }
  let SUGT = null;
  function suggest(inp) {
    clearTimeout(SUGT); const last = inp.value.split(/[;,]/).pop().trim(); document.querySelectorAll('.mb-sug').forEach(e => e.remove()); dirty(); if (last.length < 2) return;
    SUGT = setTimeout(async () => { try { const l = await Api.get(EP + '/contacts', { query: { q: last }, noLoader: true }); if (!l.length) return; const box = document.createElement('div'); box.className = 'mb-sug';
      box.innerHTML = l.map(c => `<div data-e="${esc(c.email)}" data-n="${esc(c.name)}">${esc(c.name ? c.name + ' ' : '')}<small class="text-muted">&lt;${esc(c.email)}&gt;</small></div>`).join(''); inp.parentElement.appendChild(box);
      box.onclick = (ev) => { const d = ev.target.closest('div[data-e]'); if (!d) return; const parts = inp.value.split(/[;,]/); parts.pop(); parts.push(d.dataset.e); inp.value = parts.map(s => s.trim()).filter(Boolean).join(', ') + ', '; box.remove(); inp.focus(); }; } catch (e) { /* no suggestions */ } }, 250);
  }
  document.addEventListener('click', (e) => { if (!e.target.closest('.mb-sug')) document.querySelectorAll('.mb-sug').forEach(x => x.remove()); });
</script>
