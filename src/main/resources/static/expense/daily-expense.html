<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Daily Expense</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="dailyexpense" data-title="Daily Expense"></div>
<template id="pageContent">
<div class="card mb-2"><div class="card-header d-flex align-items-center flex-wrap gap-2"><span><i class="bi bi-journal-plus"></i> <span data-i18n="de.title">Daily Expense</span></span><span class="badge bg-secondary d-none" id="lockBadge" data-i18n="de.locked">Statement submitted - closed</span></div>
  <div class="card-body"><div class="row g-2 align-items-end">
    <div class="col-6 col-md-2"><label class="form-label small fw-semibold" data-i18n="rep.month">Month</label><select class="form-select form-select-sm" id="f_month" onchange="load()"></select></div>
    <div class="col-6 col-md-1"><label class="form-label small fw-semibold" data-i18n="inv.year">Year</label><select class="form-select form-select-sm" id="f_year" onchange="load()"></select></div>
    <div class="col-12 col-md-4"><label class="form-label small fw-semibold" data-i18n="entity.employee">Employee</label><select class="form-select form-select-sm" id="f_emp" onchange="load()"></select></div></div></div></div>
<div class="card mb-2" id="feedCard"><div class="card-header" data-i18n="de.feed">Feed an expense</div><div class="card-body"><div class="row g-2 align-items-end">
  <div class="col-6 col-md-2"><label class="form-label small fw-semibold" data-i18n="exp.date">Date</label><input class="form-control form-control-sm" type="date" id="e_date"></div>
  <div class="col-6 col-md-3"><label class="form-label small fw-semibold" data-i18n="de.type">Expense type</label><select class="form-select form-select-sm" id="e_type"></select></div>
  <div class="col-6 col-md-2"><label class="form-label small fw-semibold" data-i18n="exp.amount">Amount</label><input class="form-control form-control-sm" type="number" min="0" step="any" id="e_amt"></div>
  <div class="col-12 col-md-5"><label class="form-label small fw-semibold" data-i18n="de.desc">Description</label><input class="form-control form-control-sm" id="e_desc" maxlength="150"></div>
  <div class="col-12 col-md-5"><label class="form-label small fw-semibold"><span data-i18n="de.bill">Bill / invoice</span> <span id="e_star"></span></label><input class="form-control form-control-sm" type="file" id="e_file" accept="image/*,application/pdf"></div>
  <div class="col-12 col-md-3"><button class="btn btn-sm btn-primary w-100" onclick="feed()"><i class="bi bi-plus-lg"></i> <span data-i18n="de.add">Add</span></button></div></div></div></div>
<div class="card"><div class="card-header"><span data-i18n="de.list">Entries of the month</span> <b class="ms-2" id="sumTot"></b></div><div class="card-body"><div id="lst"></div></div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/core/activity.js"></script>
<script src="js/shell.js"></script>
<script>
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);
  const EP = API.report.expense, FEP = API.report.attendance, esc = (v) => SFA.esc(v == null ? '' : v);
  const loc = () => (window.I18n && I18n.lang === 'hi' ? 'hi-IN' : 'en-GB'), num = (v) => Number(v || 0).toLocaleString(loc(), { maximumFractionDigits: 2 });
  const MONTHS = [...Array(12)].map((_, i) => new Date(2024, i, 1).toLocaleDateString('en-GB', { month: 'long' }));
  let ME = null, D = null, LASTLANG = window.I18n ? I18n.lang : 'en';
  if (window.I18n) I18n.onChange(() => { if (I18n.lang !== LASTLANG) { LASTLANG = I18n.lang; draw(); } });
  window.pageInit = async function () {
    const now = new Date();
    document.getElementById('f_month').innerHTML = MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join(''); document.getElementById('f_month').value = now.getMonth() + 1;
    document.getElementById('f_year').innerHTML = [0, 1, 2].map(k => `<option>${now.getFullYear() - k}</option>`).join('');
    document.getElementById('e_date').value = now.toISOString().substring(0, 10); document.getElementById('e_date').max = now.toISOString().substring(0, 10);
    try { ME = (await Api.get(API.profile.get)).empId; const fil = await Api.get(FEP + '/filters');
      document.getElementById('f_emp').innerHTML = fil.employees.map(e => `<option value="${esc(e.id)}" ${e.id === ME ? 'selected' : ''}>${esc(e.name)}</option>`).join(''); await load(); } catch (e) { SFA.toast(e.message, false); }
  };
  const q = () => ({ empId: document.getElementById('f_emp').value, month: document.getElementById('f_month').value, year: document.getElementById('f_year').value });
  async function load() {
    try {
      D = await Api.get(EP + '/entries', { query: q() });
      document.getElementById('e_type').innerHTML = D.types.map(t => `<option value="${t.id}" data-bill="${t.billRequired ? 1 : 0}">${esc(t.name)}${t.billRequired ? ' *' : ''}</option>`).join('');
      document.getElementById('lockBadge').classList.toggle('d-none', !D.locked); document.getElementById('feedCard').classList.toggle('d-none', D.locked || !D.canFeed);
      draw();
    } catch (e) { SFA.toast(e.message, false); }
  }
  function draw() {
    if (!D) return; const w = document.getElementById('lst');
    document.getElementById('sumTot').textContent = num(D.rows.reduce((a, r) => a + Number(r.amount), 0));
    w.innerHTML = D.rows.length ? `<div class="table-responsive"><table class="table table-sm table-striped align-middle"><thead><tr><th>${T('exp.date', 'Date')}</th><th>${T('de.type', 'Expense type')}</th><th class="text-end">${T('exp.amount', 'Amount')}</th><th>${T('de.desc', 'Description')}</th><th>${T('de.bill', 'Bill / invoice')}</th><th></th></tr></thead><tbody>
      ${D.rows.map(r => `<tr><td>${String(r.date).substring(8, 10)}-${String(r.date).substring(5, 7)}-${String(r.date).substring(0, 4)}</td><td>${esc(r.expense)}</td><td class="text-end">${num(r.amount)}</td><td>${esc(r.description)}</td><td>${r.filePath ? SFAFiles.thumb(r.filePath, null, { name: r.fileName || 'bill' }) : ''}</td>
      <td>${D.locked || !D.canFeed ? '' : `<button class="btn btn-sm btn-outline-danger" onclick="del(${r.id})"><i class="bi bi-trash"></i></button>`}</td></tr>`).join('')}</tbody></table></div>` : `<div class="text-muted text-center py-3">${T('de.none', 'No expense fed this month')}</div>`;
  }
  document.addEventListener('change', (e) => { if (e.target && e.target.id === 'e_type') star(); });
  const star = () => { const o = document.getElementById('e_type').selectedOptions[0]; document.getElementById('e_star').textContent = o && o.dataset.bill === '1' ? '*' : ''; };
  async function feed() {
    const g = (i) => document.getElementById(i).value; let filePath = null, fileName = null, fileType = null;
    try {
      const f = document.getElementById('e_file').files[0];
      if (f) { const fd = new FormData(); fd.append('file', f); const r = await Api.post(EP + '/upload', fd); filePath = r.path; fileName = r.name; fileType = r.type; }
      await Api.post(EP + '/entry', { empId: q().empId, date: g('e_date'), expenseId: g('e_type'), amount: g('e_amt'), description: g('e_desc'), filePath, fileName, fileType });
      ['e_amt', 'e_desc', 'e_file'].forEach(i => document.getElementById(i).value = ''); SFA.toast(T('inv.saved', 'Saved'), true); await load();
    } catch (e) { SFA.toast(e.message, false); }
  }
  async function del(id) { if (!confirm(T('perm.confirmDel', 'Remove?'))) return; try { await Api.post(EP + '/entry/' + id + '/delete', {}); await load(); } catch (e) { SFA.toast(e.message, false); } }
</script>
</body>
</html>
