<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Expense Setup</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="expensesetup" data-title="Expense Setup"></div>
<template id="pageContent">
<div class="card mb-2"><div class="card-header"><i class="bi bi-signpost-split"></i> <span data-i18n="exp.routeSetting">Route setting</span></div>
  <div class="card-body"><div class="row g-2 align-items-end"><div class="col-md-6"><label class="form-label small fw-semibold" data-i18n="exp.startAfterOff">After a holiday / weekly off the next working day starts from</label>
    <select class="form-select form-select-sm" id="s_off"><option value="N" data-i18n="exp.fromHome">The starting point (home area)</option><option value="Y" data-i18n="exp.fromStay">The stay area of the last working day</option></select></div>
    <div class="col-md-3"><label class="form-label small fw-semibold" data-i18n="exp.typeRule">Area type used for the day</label><select class="form-select form-select-sm" id="s_rule"><option value="MAX" data-i18n="exp.ruleMax">The highest type of the areas visited</option><option value="LAST" data-i18n="exp.ruleLast">The type of the last area visited</option></select></div>
    <div class="col-md-3"><label class="form-label small fw-semibold" data-i18n="exp.stayType">A night stay makes the day</label><select class="form-select form-select-sm" id="s_stay"><option value="Y" data-i18n="exp.stayYes">The stay type (OUT)</option><option value="N" data-i18n="exp.stayNo">No change (the visited areas decide)</option></select></div>
    <div class="col-md-3"><label class="form-label small fw-semibold" data-i18n="exp.reqDcr">Submit the expense only after the DCR of the whole month</label><select class="form-select form-select-sm" id="s_req"><option value="Y" data-i18n="exp.reqYes">Yes - every day needs its submitted DCR (holiday, weekly off, leave and days before joining are not counted)</option><option value="N" data-i18n="exp.reqNo">No - the expense can be submitted with missing DCR days</option></select></div>
    <div class="col-12"><small class="text-muted"><i class="bi bi-info-circle"></i> <span data-i18n="exp.kmNote">The km range of every area type (e.g. 0-50 or 0-60 km) is set by your company in</span> <a id="atLink" href="#" data-i18n="at.title">Area Type Master</a>; <span data-i18n="exp.kmNote2">DA and fare rates below are given per area type.</span></small></div>
    <div class="col-auto"><button class="btn btn-sm btn-primary" onclick="saveSet()"><i class="bi bi-check2"></i> <span data-i18n="common.save">Save</span></button></div></div>
    <div class="form-text mt-2" data-i18n="exp.typeHelp">The area type of a day decides its DA and fare: the types come from the Area Type Master (HQ 0-50 km, EX 51-100, OUT EX 101-250, OUT 251+ ...). A rate set for an employee in Create Employee wins over the designation and company rates.</div>
    <div class="form-text mt-2" data-i18n="exp.routeHelp">Route of a working day: starting point - the areas visited in the order of the visits - back to the starting point. When the user stays the night in an area the day ends there and the next working day starts from that stay area. Only after a holiday / weekly off this setting decides.</div></div></div>
<div class="row g-2">
 <div class="col-lg-6"><div class="card"><div class="card-header"><i class="bi bi-cash-coin"></i> <span data-i18n="exp.daRates">Daily allowance (DA)</span></div><div class="card-body">
  <div class="row g-2 align-items-end mb-2"><div class="col-5"><label class="form-label small mb-0" data-i18n="entity.designation">Designation</label><select class="form-select form-select-sm" id="da_des"></select></div>
   <div class="col-3"><label class="form-label small mb-0" data-i18n="exp.areaType">Area type</label><select class="form-select form-select-sm" id="da_type"></select></div>
   <div class="col-2"><label class="form-label small mb-0" data-i18n="exp.amount">Amount</label><input class="form-control form-control-sm" id="da_amt" type="number" min="0" step="any"></div>
   <div class="col-2"><button class="btn btn-sm btn-outline-primary w-100" onclick="addDa()"><i class="bi bi-plus-lg"></i></button></div></div>
  <div id="daList"></div></div></div></div>
 <div class="col-lg-6"><div class="card"><div class="card-header"><i class="bi bi-fuel-pump"></i> <span data-i18n="exp.fareRates">Fare per km</span></div><div class="card-body">
  <div class="row g-2 align-items-end mb-2"><div class="col-4"><label class="form-label small mb-0" data-i18n="entity.designation">Designation</label><select class="form-select form-select-sm" id="fr_des"></select></div>
   <div class="col-4"><label class="form-label small mb-0" data-i18n="exp.travelMode">Travel mode</label><select class="form-select form-select-sm" id="fr_mode"></select></div>
   <div class="col-2"><label class="form-label small mb-0" data-i18n="exp.perKm">Rs / km</label><input class="form-control form-control-sm" id="fr_rate" type="number" min="0" step="any"></div>
   <div class="col-2"><button class="btn btn-sm btn-outline-primary w-100" onclick="addFare()"><i class="bi bi-plus-lg"></i></button></div></div>
  <div id="fareList"></div></div></div></div>
</div>
<div class="small text-muted mt-2" data-i18n="exp.rateHelp">A rate of a designation wins over the "All designations" rate. The km of a day come from the meter of the DCR, else from the positions of the areas (or their distance from the HQ); the user, the manager and the admin can change every amount in the statement.</div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/core/activity.js"></script>
<script src="js/shell.js"></script>
<script>
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);
  const EP = API.report.expense, esc = (v) => SFA.esc(v == null ? '' : v);
  let S = null;
  window.pageInit = async function () { try { S = await Api.get(EP + '/setup'); draw(); } catch (e) { SFA.toast(e.message, false); } };
  function draw() {
    document.getElementById('s_off').value = S.settings.START_FROM_STAY_AFTER_OFF; document.getElementById('s_rule').value = S.settings.TYPE_RULE; document.getElementById('s_stay').value = S.settings.STAY_FORCES_TYPE; document.getElementById('s_req').value = S.settings.REQUIRE_ALL_DCR || 'Y'; document.getElementById('atLink').href = Session.pageUrl('master/area-type.html');
    document.getElementById('da_type').innerHTML = S.areaTypes.map(t => `<option value="${esc(t.code)}">${esc(t.name)}</option>`).join('');
    const des = '<option value="">' + T('exp.allDes', 'All designations') + '</option>' + S.designations.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
    document.getElementById('da_des').innerHTML = des; document.getElementById('fr_des').innerHTML = des;
    document.getElementById('fr_mode').innerHTML = S.travelModes.map(m => `<option>${esc(m)}</option>`).join('');
    const tbl = (rows, cols) => rows.length ? `<table class="table table-sm table-striped mb-0"><tbody>${rows.join('')}</tbody></table>` : `<div class="text-muted small">${T('exp.none', 'Nothing set yet')}</div>`;
    document.getElementById('daList').innerHTML = tbl(S.da.map(r => `<tr><td>${esc(r.designation || T('exp.allDes', 'All designations'))}</td><td>${esc(r.areaType)}</td><td class="text-end">${r.amount}</td><td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="del('da',${r.id})"><i class="bi bi-trash"></i></button></td></tr>`));
    document.getElementById('fareList').innerHTML = tbl(S.fare.map(r => `<tr><td>${esc(r.designation || T('exp.allDes', 'All designations'))}</td><td>${esc(r.travelMode)}</td><td class="text-end">${r.ratePerKm}</td><td class="text-end"><button class="btn btn-sm btn-outline-danger" onclick="del('fare',${r.id})"><i class="bi bi-trash"></i></button></td></tr>`));
  }
  const reload = async () => { S = await Api.get(EP + '/setup'); draw(); };
  async function saveSet() { try { await Api.post(EP + '/setup/settings', { START_FROM_STAY_AFTER_OFF: document.getElementById('s_off').value, TYPE_RULE: document.getElementById('s_rule').value, STAY_FORCES_TYPE: document.getElementById('s_stay').value, REQUIRE_ALL_DCR: document.getElementById('s_req').value }); SFA.toast(T('inv.saved', 'Saved'), true); } catch (e) { SFA.toast(e.message, false); } }
  async function addDa() { try { await Api.post(EP + '/setup/da', { designationId: document.getElementById('da_des').value || null, areaType: document.getElementById('da_type').value, amount: document.getElementById('da_amt').value }); document.getElementById('da_amt').value = ''; await reload(); } catch (e) { SFA.toast(e.message, false); } }
  async function addFare() { try { await Api.post(EP + '/setup/fare', { designationId: document.getElementById('fr_des').value || null, travelMode: document.getElementById('fr_mode').value, ratePerKm: document.getElementById('fr_rate').value }); document.getElementById('fr_rate').value = ''; await reload(); } catch (e) { SFA.toast(e.message, false); } }
  async function del(kind, id) { if (!confirm(T('perm.confirmDel', 'Remove?'))) return; try { await Api.post(EP + '/setup/' + kind + '/' + id + '/delete', {}); await reload(); } catch (e) { SFA.toast(e.message, false); } }
</script>
</body>
</html>
