<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Fixed Expense</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="fixedexpense" data-title="Fixed Expense"></div>
<template id="pageContent">
<div class="card mb-2"><div class="card-header"><i class="bi bi-person-check"></i> <span data-i18n="fx.title">Fixed Expense - give to the employees</span></div>
  <div class="card-body"><div class="small text-muted mb-2" data-i18n="fx.help">A fixed expense (mobile bill, internet bill ...) is a monthly amount: choose the type, the amount and who gets it - everyone, a state / HQ / designation, or the employees you pick. It comes into the monthly statement of each of them; the same employee + type + start date is updated, never repeated.</div>
    <div class="row g-2 align-items-end">
      <div class="col-6 col-md-3"><label class="form-label small fw-semibold" data-i18n="fx.type">Fixed expense</label><select class="form-select form-select-sm" id="a_exp"></select></div>
      <div class="col-6 col-md-2"><label class="form-label small fw-semibold" data-i18n="exp.amount">Amount</label><input class="form-control form-control-sm" id="a_amt" type="number" min="0" step="any"></div>
      <div class="col-6 col-md-2"><label class="form-label small fw-semibold" data-i18n="fx.from">Applies from</label><input class="form-control form-control-sm" id="a_from" type="date"></div>
      <div class="col-6 col-md-2"><label class="form-label small fw-semibold" data-i18n="fx.to">Give to</label><select class="form-select form-select-sm" id="a_scope" onchange="scopeCh()"><option value="all" data-i18n="fx.all">All employees</option><option value="filter" data-i18n="fx.filter">State / HQ / designation</option><option value="pick" data-i18n="fx.pick">Employees I pick</option></select></div>
    </div>
    <div class="row g-2 mt-1 d-none" id="a_filter"><div class="col-4 col-md-2"><select class="form-select form-select-sm" id="a_state"></select></div><div class="col-4 col-md-2"><select class="form-select form-select-sm" id="a_hq"></select></div><div class="col-4 col-md-2"><select class="form-select form-select-sm" id="a_des"></select></div></div>
    <div class="d-none mt-2" id="a_pickBox"><div id="a_emps" class="border rounded p-2" style="max-height:220px;overflow:auto"></div></div>
    <div class="mt-2"><button class="btn btn-sm btn-primary" onclick="assign()"><i class="bi bi-check2"></i> <span data-i18n="fx.assign">Give</span></button></div></div></div>
<div class="card mb-2"><div class="card-header"><i class="bi bi-tags"></i> <span data-i18n="vx.title">Variable expense - who can use which</span></div>
  <div class="card-body"><div class="small text-muted mb-2" data-i18n="vx.help">Give each variable expense type (food, gift, courier ...) to the employees who may use it. An employee sees only the types given to him in the DCR, Daily Expense and his statement; an employee with nothing given can use every variable type.</div>
    <div class="row g-2 align-items-end"><div class="col-6 col-md-3"><label class="form-label small fw-semibold" data-i18n="vx.type">Variable expense</label><select class="form-select form-select-sm" id="v_exp"></select></div>
      <div class="col-6 col-md-3"><label class="form-label small fw-semibold" data-i18n="fx.to">Give to</label><select class="form-select form-select-sm" id="v_scope" onchange="vScope()"><option value="all" data-i18n="fx.all">All employees</option><option value="filter" data-i18n="fx.filter">State / HQ / designation</option><option value="pick" data-i18n="fx.pick">Employees I pick</option></select></div></div>
    <div class="row g-2 mt-1 d-none" id="v_filter"><div class="col-4 col-md-2"><select class="form-select form-select-sm" id="v_state"></select></div><div class="col-4 col-md-2"><select class="form-select form-select-sm" id="v_hq"></select></div><div class="col-4 col-md-2"><select class="form-select form-select-sm" id="v_des"></select></div></div>
    <div class="d-none mt-2" id="v_pickBox"><div id="v_emps" class="border rounded p-2" style="max-height:220px;overflow:auto"></div></div>
    <div class="mt-2 d-flex gap-2 align-items-center"><button class="btn btn-sm btn-primary" onclick="vAssign()"><i class="bi bi-check2"></i> <span data-i18n="fx.assign">Give</span></button>
      <select class="form-select form-select-sm ms-auto" style="max-width:15rem" id="vl_exp" onchange="vLoad()"></select></div>
    <div id="vlst" class="mt-2"></div></div></div>
<div class="card"><div class="card-header d-flex align-items-center gap-2"><span data-i18n="fx.given">Given</span>
  <select class="form-select form-select-sm ms-auto" style="max-width:15rem" id="l_exp" onchange="load()"></select></div><div class="card-body"><div id="lst"></div></div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/core/activity.js"></script>
<script src="js/shell.js"></script>
<script>
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);
  const EP = API.report.expense, FEP = API.report.attendance, esc = (v) => SFA.esc(v == null ? '' : v);
  let TYPES = [], FIL = null, ROWS = [];
  const picked = new Set();
  window.pageInit = async function () {
    document.getElementById('a_from').value = new Date().toISOString().substring(0, 8) + '01';
    try {
      TYPES = (await Api.get(EP + '/types')).filter(t => t.kind === 'FIXED' && t.active); FIL = await Api.get(FEP + '/filters');
      const opt = TYPES.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
      document.getElementById('a_exp').innerHTML = opt || '<option value="">-</option>'; document.getElementById('l_exp').innerHTML = '<option value="">' + T('common.all', 'All') + '</option>' + opt;
      const o = (list, first) => `<option value="">${first}</option>` + list.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
      document.getElementById('a_state').innerHTML = o(FIL.states, T('entity.state', 'State')); document.getElementById('a_hq').innerHTML = o(FIL.hqs, T('entity.hq', 'HQ')); document.getElementById('a_des').innerHTML = o(FIL.designations, T('entity.designation', 'Designation'));
      document.getElementById('a_emps').innerHTML = FIL.employees.map(e => `<div class="form-check"><input class="form-check-input" type="checkbox" value="${esc(e.id)}" id="pe_${esc(e.id)}" onchange="this.checked ? picked.add(this.value) : picked.delete(this.value)"><label class="form-check-label small" for="pe_${esc(e.id)}">${esc(e.name)}</label></div>`).join('');
      const VT = (await Api.get(EP + '/types')).filter(t => t.kind === 'VARIABLE' && t.active), vo = VT.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
      document.getElementById('v_exp').innerHTML = vo || '<option value="">-</option>'; document.getElementById('vl_exp').innerHTML = '<option value="">' + T('common.all', 'All') + '</option>' + vo;
      document.getElementById('v_state').innerHTML = o(FIL.states, T('entity.state', 'State')); document.getElementById('v_hq').innerHTML = o(FIL.hqs, T('entity.hq', 'HQ')); document.getElementById('v_des').innerHTML = o(FIL.designations, T('entity.designation', 'Designation'));
      document.getElementById('v_emps').innerHTML = FIL.employees.map(e => `<div class="form-check"><input class="form-check-input" type="checkbox" value="${esc(e.id)}" id="ve_${esc(e.id)}" onchange="this.checked ? vPicked.add(this.value) : vPicked.delete(this.value)"><label class="form-check-label small" for="ve_${esc(e.id)}">${esc(e.name)}</label></div>`).join('');
      await load(); await vLoad();
    } catch (e) { SFA.toast(e.message, false); }
  };
  const vPicked = new Set(); let VROWS = [];
  function vScope() { const v = document.getElementById('v_scope').value; document.getElementById('v_filter').classList.toggle('d-none', v !== 'filter'); document.getElementById('v_pickBox').classList.toggle('d-none', v !== 'pick'); }
  async function vAssign() {
    const g = (i) => document.getElementById(i).value, sc = g('v_scope'); const body = { expenseId: g('v_exp') };
    if (sc === 'all') body.all = true; else if (sc === 'filter') { body.stateId = g('v_state'); body.hqId = g('v_hq'); body.designationId = g('v_des'); } else body.empIds = [...vPicked];
    try { const r = await Api.post(EP + '/var-assign', body); SFA.toast(T('fx.done', 'Given') + ' (' + r.created + ' ' + T('fx.new', 'new') + ')', true); await vLoad(); } catch (e) { SFA.toast(e.message, false); }
  }
  async function vLoad() {
    try { VROWS = await Api.get(EP + '/var-assign', { query: { expenseId: document.getElementById('vl_exp').value || undefined } }); } catch (e) { SFA.toast(e.message, false); return; }
    document.getElementById('vlst').innerHTML = VROWS.length ? `<div class="table-responsive"><table class="table table-sm table-striped align-middle"><thead><tr><th>${T('entity.employee', 'Employee')}</th><th>${T('entity.designation', 'Designation')}</th><th>${T('vx.type', 'Variable expense')}</th><th></th></tr></thead><tbody>${VROWS.map(r => `<tr><td><b>${esc(r.empName)}</b> <small class="text-muted">${esc(r.empCode)}</small></td><td>${esc(r.designation)}</td><td>${esc(r.expense)}</td><td><button class="btn btn-sm btn-outline-danger" onclick="vDel(${r.id})"><i class="bi bi-trash"></i></button></td></tr>`).join('')}</tbody></table></div>` : `<div class="text-muted text-center py-2">${T('fx.none', 'Nothing given yet')}</div>`;
  }
  async function vDel(id) { if (!confirm(T('perm.confirmDel', 'Remove?'))) return; try { await Api.post(EP + '/var-assign/' + id + '/delete', {}); await vLoad(); } catch (e) { SFA.toast(e.message, false); } }

  function scopeCh() { const v = document.getElementById('a_scope').value; document.getElementById('a_filter').classList.toggle('d-none', v !== 'filter'); document.getElementById('a_pickBox').classList.toggle('d-none', v !== 'pick'); }
  async function assign() {
    const g = (i) => document.getElementById(i).value, sc = g('a_scope'); const body = { expenseId: g('a_exp'), amount: g('a_amt'), effectiveFrom: g('a_from') };
    if (sc === 'all') body.all = true; else if (sc === 'filter') { body.stateId = g('a_state'); body.hqId = g('a_hq'); body.designationId = g('a_des'); } else body.empIds = [...picked];
    try { const r = await Api.post(EP + '/fixed/assign', body); SFA.toast(T('fx.done', 'Given') + ' (' + r.created + ' ' + T('fx.new', 'new') + ', ' + r.updated + ' ' + T('fx.upd', 'updated') + ')', true); await load(); } catch (e) { SFA.toast(e.message, false); }
  }
  async function load() { try { ROWS = await Api.get(EP + '/fixed', { query: { expenseId: document.getElementById('l_exp').value || undefined } }); draw(); } catch (e) { SFA.toast(e.message, false); } }
  function draw() {
    const w = document.getElementById('lst'); if (!ROWS.length) { w.innerHTML = `<div class="text-muted text-center py-3">${T('fx.none', 'Nothing given yet')}</div>`; return; }
    w.innerHTML = `<div class="table-responsive"><table class="table table-sm table-striped align-middle"><thead><tr><th>${T('entity.employee', 'Employee')}</th><th>${T('fx.type', 'Fixed expense')}</th><th style="width:8rem">${T('exp.amount', 'Amount')}</th><th>${T('fx.from', 'Applies from')}</th><th style="width:10rem">${T('fx.till', 'Till')}</th><th></th></tr></thead><tbody>
      ${ROWS.map((r, i) => `<tr><td><b>${esc(r.empName)}</b> <small class="text-muted">${esc(r.empCode)}</small></td><td>${esc(r.expense)}</td><td><input class="form-control form-control-sm" type="number" min="0" step="any" id="am_${i}" value="${r.amount}"></td><td>${esc(String(r.effectiveFrom).substring(0, 10))}</td>
      <td><input class="form-control form-control-sm" type="date" id="to_${i}" value="${r.effectiveTo ? String(r.effectiveTo).substring(0, 10) : ''}"></td><td class="text-nowrap"><button class="btn btn-sm btn-primary" onclick="upd(${i})"><i class="bi bi-check2"></i></button> <button class="btn btn-sm btn-outline-danger" onclick="del(${r.id})"><i class="bi bi-trash"></i></button></td></tr>`).join('')}</tbody></table></div>`;
  }
  async function upd(i) { try { await Api.post(EP + '/fixed/' + ROWS[i].id, { amount: document.getElementById('am_' + i).value, effectiveTo: document.getElementById('to_' + i).value }); SFA.toast(T('inv.saved', 'Saved'), true); await load(); } catch (e) { SFA.toast(e.message, false); } }
  async function del(id) { if (!confirm(T('perm.confirmDel', 'Remove?'))) return; try { await Api.post(EP + '/fixed/' + id + '/delete', {}); await load(); } catch (e) { SFA.toast(e.message, false); } }
</script>
</body>
</html>
