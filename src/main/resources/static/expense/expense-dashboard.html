<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Expense Dashboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
<style>
  .rp-kpis { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 .6rem; } .rp-kpi { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-left: 3px solid var(--bs-primary); border-radius: .4rem; padding: .35rem .8rem; min-width: 7.5rem; flex: 1 1 7.5rem; }
  .rp-kpi small { color: var(--bs-secondary-color); display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; } .rp-kpi b { font-size: 1.05rem; } .rp-kpi.ok { border-left-color: #198754; } .rp-kpi.warn { border-left-color: #fd7e14; }
  .rp-filters .form-label { font-size: .72rem; font-weight: 600; color: var(--bs-secondary-color); margin-bottom: .1rem; }
  .ex-wrap { max-height: calc(100vh - 330px); min-height: 280px; overflow: auto; border: 1px solid var(--bs-border-color); border-radius: .4rem; }
  table.ex { border-collapse: separate; border-spacing: 0; font-size: .78rem; width: max-content; min-width: 100%; }
  table.ex th, table.ex td { border-right: 1px solid var(--bs-border-color); border-bottom: 1px solid var(--bs-border-color); padding: .25rem .4rem; vertical-align: middle; }
  table.ex thead th { background: #0a5a78; color: #fff; position: sticky; top: 0; z-index: 3; text-align: center; white-space: nowrap; }
  table.ex td.n { text-align: right; font-variant-numeric: tabular-nums; } table.ex td.route { min-width: 260px; } table.ex input { width: 5.4rem; text-align: right; } table.ex input.rm { width: 9rem; text-align: left; } table.ex input.bl { width: 3.6rem; }
  table.ex tr.lv-U td { background: #d6e9ff; } table.ex tr.lv-M td { background: #ffe2a8; } table.ex tr.lv-A td { background: #e6d0ff; } table.ex tr.k-abs td { background: #ffd0d0; color: #842029; font-weight: 600; } table.ex tr.k-lv td { background: #d3f2dd; color: #0f5132; } table.ex tr.off td { color: var(--bs-secondary-color); background: var(--bs-tertiary-bg); }
  table.ex tfoot td { position: sticky; bottom: 0; background: #e7f0f4; font-weight: 700; z-index: 3; }
  .lg { display: inline-flex; align-items: center; gap: .3rem; font-size: .75rem; margin-right: .8rem; } .lg i { width: 1rem; height: 1rem; display: inline-block; border: 1px solid #0003; border-radius: .2rem; }
  .flow { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; font-size: .78rem; } .flow span { padding: .15rem .6rem; border-radius: 1rem; background: var(--bs-tertiary-bg); } .flow span.on { background: #198754; color: #fff; } .flow span.cur { background: #fd7e14; color: #fff; }
  tr.rp-click { cursor: pointer; }
</style>
</head>
<body>
<div id="app" data-page="expensedashboard" data-title="Expense Dashboard"></div>
<template id="pageContent">
<style>
  .kc { border-radius: .8rem; color: #fff; padding: 1rem 1.2rem; cursor: pointer; height: 100%; } .kc small { opacity: .9; text-transform: uppercase; font-weight: 600; font-size: .7rem; letter-spacing: .04em; } .kc b { display: block; font-size: 1.9rem; line-height: 1.2; } .kc span { font-size: .75rem; opacity: .85; }
  .kc.k1 { background: linear-gradient(135deg, #2563eb, #3b82f6); } .kc.k2 { background: linear-gradient(135deg, #d97706, #f59e0b); } .kc.k3 { background: linear-gradient(135deg, #dc2626, #ef4444); } .kc.k4 { background: linear-gradient(135deg, #059669, #10b981); } .kc.k5 { background: linear-gradient(135deg, #0d9488, #14b8a6); }
  .rp-filters .form-label { font-size: .72rem; font-weight: 600; color: var(--bs-secondary-color); margin-bottom: .1rem; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; } a.ec { font-weight: 600; cursor: pointer; text-decoration: none; }
</style>
<div class="card mb-2">
  <div class="card-header d-flex align-items-center flex-wrap gap-2"><span><i class="bi bi-speedometer2"></i> <span data-i18n="ed.title">Expense Approval Dashboard</span></span><small class="text-muted" id="rpSub"></small>
    <div class="card-tools ms-auto d-flex gap-2 flex-wrap"><button class="btn btn-sm sfa-btn-outline" id="rpFBtn" onclick="rpFToggle()"><i class="bi bi-sliders"></i> <span data-i18n="rep.filters">Filters</span></button>
      <button class="btn btn-sm sfa-btn-outline" data-bs-toggle="modal" data-bs-target="#activityModal"><i class="bi bi-clock-history"></i> <span data-i18n="rep.recent">Recent</span></button>
      <button class="btn btn-sm btn-warning" onclick="remind('NOT_SUBMITTED')"><i class="bi bi-bell"></i> <span data-i18n="ed.remind">Send reminder</span></button>
      <button class="btn btn-sm btn-outline-warning" onclick="remind('PENDING')" title="Remind the managers who have statements to approve"><i class="bi bi-bell-fill"></i> <span data-i18n="ed.remindMgr">Remind managers</span></button>
      <button class="btn btn-sm btn-success" id="bulkBtn" onclick="bulkApprove()"><i class="bi bi-check2-all"></i> <span data-i18n="ed.approveSel">Approve selected</span> <span class="badge bg-dark" id="selCnt">0</span></button></div></div>
  <div class="card-body rp-filters" id="rpFBody"><div class="row g-2 align-items-end">
    <div class="col-6 col-md-2"><label class="form-label" data-i18n="rep.month">Month</label><select class="form-select form-select-sm" id="f_month"></select></div>
    <div class="col-6 col-md-1"><label class="form-label" data-i18n="inv.year">Year</label><select class="form-select form-select-sm" id="f_year"></select></div>
    <div class="col-6 col-md-2"><label class="form-label" data-i18n="entity.state">State</label><select class="form-select form-select-sm" id="f_state" onchange="draw()"></select></div>
    <div class="col-6 col-md-3"><label class="form-label" data-i18n="ed.manager">Manager</label><select class="form-select form-select-sm" id="f_mgr" onchange="draw()"></select></div>
    <div class="col-12 col-md-3"><label class="form-label" data-i18n="ed.search">Search name / code</label><input class="form-control form-control-sm" id="f_q" oninput="draw()"></div>
    <div class="col-auto ms-md-auto"><button class="btn btn-sm btn-primary" onclick="rpGo()"><i class="bi bi-search"></i> <span data-i18n="rep.show">Show</span></button></div></div></div>
</div>
<div class="row g-2 mb-2" id="kpis"></div>
<ul class="nav nav-pills mb-2" id="tabs"></ul>
<div class="card"><div class="card-body" id="tbl"></div></div>
<div class="modal fade" id="stmtModal" tabindex="-1"><div class="modal-dialog modal-fullscreen"><div class="modal-content">
  <div class="modal-header sfa-modal py-2"><h5 class="modal-title"><i class="bi bi-receipt"></i> <span id="stmtTitle"></span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body p-0"><iframe id="stmtFrame" style="width:100%;height:calc(100vh - 56px);border:0" title="Expense statement"></iframe></div></div></div></div>
<div class="modal fade" id="activityModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down"><div class="modal-content">
  <div class="modal-header sfa-modal"><h5 class="modal-title"><i class="bi bi-clock-history"></i> <span data-i18n="rep.recentSearches">Recent searches</span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="activityList"></div></div></div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>

<script src="js/core/endpoints.js"></script>

<script src="js/core/i18n.js"></script>

<script>
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);
  const REPORT_KEY = 'expensedashboard', REPORT_LABEL = 'Expense Dashboard', EP = API.report.expense, esc = (v) => SFA.esc(v == null ? '' : v);
  const MONTHS = [...Array(12)].map((_, i) => new Date(2024, i, 1).toLocaleDateString('en-GB', { month: 'long' }));
  const ST = { NOT_STARTED: ['Not submitted', 'danger'], DRAFT: ['Draft', 'secondary'], SUBMITTED: ['Submitted', 'info'], MGR_APPROVED: ['Manager approved', 'primary'], APPROVED: ['Approved', 'success'], REJECTED: ['Rejected', 'danger'] };
  const num = (v) => Number(v || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  let STM = null, D = null, TAB = 'all', ACT = null, VIEW = [], LASTLANG = window.I18n ? I18n.lang : 'en';
  const SEL = new Set();
  if (window.I18n) I18n.onChange(() => { if (I18n.lang !== LASTLANG) { LASTLANG = I18n.lang; draw(); } });
  window.pageInit = async function () {
    ACT = new bootstrap.Modal('#activityModal'); STM = new bootstrap.Modal('#stmtModal');
    document.getElementById('stmtModal').addEventListener('hidden.bs.modal', () => { document.getElementById('stmtFrame').src = 'about:blank'; rpGo(); });   // what was submitted / approved in the popup shows in the table
    document.getElementById('activityModal').addEventListener('shown.bs.modal', () => Activity.renderInto('activityList', REPORT_KEY, applyActivity));
    const now = new Date(); let pm = now.getMonth(), py = now.getFullYear(); if (pm === 0) { pm = 12; py--; }
    document.getElementById('f_month').innerHTML = MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join(''); document.getElementById('f_month').value = pm;
    document.getElementById('f_year').innerHTML = [0, 1, 2].map(k => `<option>${now.getFullYear() - k}</option>`).join(''); document.getElementById('f_year').value = py;
    await rpGo();
  };
  const q = () => ({ month: document.getElementById('f_month').value, year: document.getElementById('f_year').value });
  function applyActivity(f) { document.getElementById('f_month').value = f.month; document.getElementById('f_year').value = f.year; rpGo(); if (ACT) ACT.hide(); }
  function rpFToggle(close) { const b = document.getElementById('rpFBody'), hide = close === true ? true : !b.classList.contains('d-none'); b.classList.toggle('d-none', hide); document.getElementById('rpFBtn').classList.toggle('active', !hide); if (!hide) window.scrollTo(0, 0); }
  async function rpGo() {
    SEL.clear();
    try {
      D = await Api.get(EP + '/dashboard', { query: q() });
      document.getElementById('rpSub').textContent = MONTHS[q().month - 1] + ' ' + q().year + ' · ' + D.employees + ' ' + T('ed.employees', 'employees');
      const keep = (id, first, list, cur) => { const e = document.getElementById(id); e.innerHTML = `<option value="">${first}</option>` + [...new Set(list.filter(Boolean))].sort().map(x => `<option>${esc(x)}</option>`).join(''); e.value = cur || ''; };
      keep('f_state', T('common.all', 'All'), D.rows.map(r => r.state), document.getElementById('f_state').value); keep('f_mgr', T('common.all', 'All'), D.rows.map(r => r.manager), document.getElementById('f_mgr').value);
      draw(); rpFToggle(true); window.scrollTo(0, 0); Activity.record(REPORT_KEY, REPORT_LABEL, q(), MONTHS[q().month - 1] + ' ' + q().year);
    } catch (e) { SFA.toast(e.message, false); }
  }
  const inTab = (r) => TAB === 'all' || (TAB === 'pending' && ['SUBMITTED', 'MGR_APPROVED'].includes(r.status)) || (TAB === 'notsub' && ['NOT_STARTED', 'DRAFT', 'REJECTED'].includes(r.status)) || (TAB === 'approved' && r.status === 'APPROVED');
  function setTab(t) { TAB = t; draw(); }
  function draw() {
    if (!D) return;
    const k = (cls, l, v, sub, t) => `<div class="col-6 col-md"><div class="kc ${cls}" onclick="setTab('${t}')"><small>${l}</small><b>${v}</b><span>${sub}</span></div></div>`;
    document.getElementById('kpis').innerHTML = k('k1', T('ed.totalEmp', 'Total employees'), D.employees, MONTHS[q().month - 1] + ' ' + q().year, 'all') + k('k2', T('ed.pending', 'Pending approval'), D.pending, T('ed.awaiting', 'Awaiting review'), 'pending') + k('k3', T('ed.notSub', 'Not submitted'), D.notSubmitted, T('ed.sendRem', 'Send reminder'), 'notsub') + k('k4', T('ed.approved', 'Approved'), D.approved, T('ed.processed', 'Processed'), 'approved') + k('k5', T('ed.claims', 'Total claims'), '₹' + num(D.claims), T('ed.allEmp', 'All employees'), 'all');
    const tabs = [['all', T('ed.tabAll', 'All expenses')], ['pending', T('ed.tabPending', 'Pending approval')], ['notsub', T('ed.tabNotSub', 'Not submitted')], ['approved', T('ed.tabApproved', 'Approved')]];
    document.getElementById('tabs').innerHTML = tabs.map(t => `<li class="nav-item"><button class="nav-link ${TAB === t[0] ? 'active' : ''}" onclick="setTab('${t[0]}')">${t[1]}</button></li>`).join('');
    const st = document.getElementById('f_state').value, mg = document.getElementById('f_mgr').value, qs = document.getElementById('f_q').value.trim().toLowerCase();
    VIEW = D.rows.filter(r => inTab(r) && (!st || r.state === st) && (!mg || r.manager === mg) && (!qs || (r.empName + ' ' + r.empCode).toLowerCase().includes(qs)));
    document.getElementById('tbl').innerHTML = `<table id="dT" data-screen-key="EXPENSE_DASHBOARD" class="table table-striped table-bordered nowrap" style="width:100%"><thead><tr><th class="no-export"><input type="checkbox" onchange="selAll(this.checked)"></th><th>${T('common.sno', 'S.No')}</th><th data-field="code">${T('ed.empCode', 'Emp code')}</th><th data-field="name">${T('ed.name', 'Name')}</th><th data-field="doj">${T('ed.doj', 'DOJ')}</th><th data-field="state">${T('entity.state', 'State')}</th><th data-field="hq">${T('entity.hq', 'HQ')}</th><th data-field="manager">${T('ed.manager', 'Manager')}</th><th data-field="status">${T('ed.status', 'Status')}</th><th data-field="workDays">${T('exp.workDays', 'Work days')}</th><th data-field="visits">${T('ed.visits', 'Visits')}</th><th data-field="da">DA</th><th data-field="total">${T('ed.totalClaim', 'Total claim')}</th><th class="no-export">${T('ed.actions', 'Actions')}</th></tr></thead><tbody>
      ${VIEW.map((r, i) => { const s = ST[r.status] || [r.status, 'secondary']; return `<tr><td class="no-export">${r.canApprove ? `<input type="checkbox" ${SEL.has(r.statementId) ? 'checked' : ''} onchange="sel(${r.statementId},this.checked)">` : ''}</td><td>${i + 1}</td><td><a class="ec" onclick="openStmt(${i})" title="${T('ed.open', 'Open the statement')}">${esc(r.empCode)}</a></td><td>${esc(r.empName)}</td><td data-order="${esc(String(r.doj || '').substring(0, 10))}">${esc(String(r.doj || '').substring(0, 10))}</td><td>${esc(r.state)}</td><td>${esc(r.hq)}</td><td>${esc(r.manager)}</td><td><span class="badge bg-${s[1]}${s[1] === 'info' ? ' text-dark' : ''}">${T('ed.st.' + r.status, s[0])}</span></td><td class="n">${r.workDays || 0}</td><td class="n">${r.visits || 0}</td><td class="n">${num(r.da)}</td><td class="n" data-order="${Number(r.total)}">₹${num(r.total)}</td>
        <td class="no-export text-nowrap">${r.canApprove ? `<button class="btn btn-sm btn-success py-0" onclick="approveRow(${i})">${T('ed.approveBtn', 'Approve')}</button> ` : ''}${r.canReject ? `<button class="btn btn-sm btn-outline-danger py-0" onclick="rejectRow(${i})">${T('exp.reject', 'Reject')}</button>` : ''}</td></tr>`; }).join('')}</tbody></table>`;
    sfaDataTable('#dT', { order: [[3, 'asc']] }); selCount();
  }
  // empCode click: the statement of that employee and month opens full screen in a popup, already chosen - to submit it when it is not submitted, to approve / change it when it is
  function openStmt(i) {
    const r = VIEW[i]; document.getElementById('stmtTitle').textContent = r.empName + ' (' + r.empCode + ') - ' + MONTHS[q().month - 1] + ' ' + q().year;
    document.getElementById('stmtFrame').src = Session.pageUrl('expense/expense-statement.html?embed=1&empId=' + encodeURIComponent(r.empId) + '&empName=' + encodeURIComponent(r.empName) + '&month=' + q().month + '&year=' + q().year); STM.show();
  }
  function sel(id, on) { on ? SEL.add(id) : SEL.delete(id); selCount(); }
  function selAll(on) { VIEW.forEach(r => { if (r.canApprove) on ? SEL.add(r.statementId) : SEL.delete(r.statementId); }); document.querySelectorAll('#dT tbody input[type=checkbox]').forEach(c => c.checked = on); selCount(); }
  const selCount = () => { const e = document.getElementById('selCnt'); if (e) e.textContent = SEL.size; };
  async function approveRow(i) { const r = VIEW[i]; if (!confirm(T('ed.confirmApprove', 'Approve the expense of') + ' ' + r.empName + '?')) return; try { await Api.post(EP + '/' + r.statementId + '/approve', {}); SFA.toast(T('exp.done', 'Done'), true); await rpGo(); } catch (e) { SFA.toast(e.message, false); } }
  async function rejectRow(i) { const r = VIEW[i]; const why = prompt(T('exp.rejectAsk', 'Reason of the rejection')); if (!why || !why.trim()) return; try { await Api.post(EP + '/' + r.statementId + '/reject', { reason: why }); SFA.toast(T('exp.done', 'Done'), true); await rpGo(); } catch (e) { SFA.toast(e.message, false); } }
  async function bulkApprove() {
    if (!SEL.size) { SFA.toast(T('ed.pickFirst', 'Tick the statements to approve'), false); return; } if (!confirm(T('ed.confirmBulk', 'Approve the selected statements?') + ' (' + SEL.size + ')')) return;
    let ok = 0, bad = 0, last = ''; for (const id of [...SEL]) { try { await Api.post(EP + '/' + id + '/approve', {}); ok++; } catch (e) { bad++; last = e.message; } }
    SFA.toast(ok + ' ' + T('ed.approvedN', 'approved') + (bad ? ', ' + bad + ' ' + T('ed.failedN', 'failed') + ' (' + last + ')' : ''), !bad); await rpGo();
  }
  async function remind(kind) {
    if (!D.mailReady) { SFA.toast(T('ed.mailOff', 'The mail server is not set up - fill it in Expense Setup > Email (SMTP)'), false); return; }
    const n = kind === 'PENDING' ? D.pending : D.notSubmitted; if (!confirm((kind === 'PENDING' ? T('ed.confirmRemMgr', 'Mail the managers who have statements waiting?') : T('ed.confirmRem', 'Mail every employee whose expense is not submitted?')) + ' (' + n + ')')) return;
    try { const r = await Api.post(EP + '/dashboard/remind', { month: q().month, year: q().year, kind }); SFA.toast(T('ed.sent', 'Mails sent') + ': ' + r.sent + (r.noEmail ? ', ' + T('ed.noEmail', 'no email') + ': ' + r.noEmail : '') + (r.failed ? ', ' + T('ed.failedN', 'failed') + ': ' + r.failed + (r.error ? ' (' + r.error + ')' : '') : ''), !r.failed); } catch (e) { SFA.toast(e.message, false); }
  }
</script>
