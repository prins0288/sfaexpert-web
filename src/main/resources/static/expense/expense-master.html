<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Expense Master</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="expensemaster" data-title="Expense Master"></div>
<template id="pageContent">
<div class="card"><div class="card-header d-flex align-items-center gap-2"><span><i class="bi bi-tags"></i> <span data-i18n="em.title">Expense Master</span></span>
  <div class="card-tools ms-auto"><button class="btn btn-sm btn-primary" onclick="addRow()"><i class="bi bi-plus-lg"></i> <span data-i18n="at.add">Add type</span></button></div></div>
  <div class="card-body"><div class="small text-muted mb-2" data-i18n="em.help"><b>Fixed</b> expense: a monthly amount given to the employees (mobile bill, internet bill ...) - assigned in Fixed Expense and it comes into the monthly statement. <b>Variable</b> expense: entered when it happens with its bill (courier, birthday ...) - only these types are offered in the DCR expense check-in and in Daily Expense.</div>
    <div class="table-responsive"><table class="table table-sm align-middle" id="emT"><thead><tr><th>Code</th><th data-i18n="inv.label">Name</th><th style="width:9rem" data-i18n="em.kind">Kind</th><th class="text-center" data-i18n="em.travel">Travel</th><th class="text-center" data-i18n="em.bill">Bill required</th><th style="width:6rem" data-i18n="inv.order">Order</th><th class="text-center" data-i18n="at.on">On</th><th></th></tr></thead><tbody></tbody></table></div></div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/core/activity.js"></script>
<script src="js/shell.js"></script>
<script>
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);
  const EP = API.report.expense + '/types', esc = (v) => SFA.esc(v == null ? '' : v);
  let ROWS = [];
  window.pageInit = async function () { await load(); };
  async function load() { try { ROWS = await Api.get(EP); draw(); } catch (e) { SFA.toast(e.message, false); } }
  function draw() {
    document.querySelector('#emT tbody').innerHTML = ROWS.map((r, i) => `<tr><td><input class="form-control form-control-sm" data-i="${i}" data-k="code" value="${esc(r.code)}" maxlength="30" style="text-transform:uppercase"></td><td><input class="form-control form-control-sm" data-i="${i}" data-k="name" value="${esc(r.name)}" maxlength="80"></td>
      <td><select class="form-select form-select-sm" data-i="${i}" data-k="kind"><option value="VARIABLE" ${r.kind === 'VARIABLE' ? 'selected' : ''}>${T('em.variable', 'Variable')}</option><option value="FIXED" ${r.kind === 'FIXED' ? 'selected' : ''}>${T('em.fixed', 'Fixed')}</option></select></td>
      <td class="text-center"><input class="form-check-input" type="checkbox" data-i="${i}" data-k="travel" ${r.travel ? 'checked' : ''}></td><td class="text-center"><input class="form-check-input" type="checkbox" data-i="${i}" data-k="billRequired" ${r.billRequired ? 'checked' : ''}></td>
      <td><input class="form-control form-control-sm" type="number" data-i="${i}" data-k="sortOrder" value="${esc(r.sortOrder)}"></td><td class="text-center"><input class="form-check-input" type="checkbox" data-i="${i}" data-k="active" ${r.active !== false ? 'checked' : ''}></td>
      <td class="text-nowrap"><button class="btn btn-sm btn-primary" onclick="save(${i})"><i class="bi bi-check2"></i></button> ${r.id ? `<button class="btn btn-sm btn-outline-danger" onclick="del(${r.id})"><i class="bi bi-trash"></i></button>` : ''}</td></tr>`).join('');
  }
  function addRow() { ROWS.push({ id: null, code: '', name: '', kind: 'VARIABLE', travel: false, billRequired: false, sortOrder: 100, active: true }); draw(); }
  async function save(i) {
    const g = (k) => document.querySelector(`[data-i="${i}"][data-k="${k}"]`);
    try { await Api.post(EP, { id: ROWS[i].id, code: g('code').value, name: g('name').value, kind: g('kind').value, travel: g('travel').checked, billRequired: g('billRequired').checked, sortOrder: g('sortOrder').value, active: g('active').checked }); SFA.toast(T('inv.saved', 'Saved'), true); await load(); } catch (e) { SFA.toast(e.message, false); }
  }
  async function del(id) { if (!confirm(T('perm.confirmDel', 'Remove?'))) return; try { await Api.post(EP + '/' + id + '/delete', {}); await load(); } catch (e) { SFA.toast(e.message, false); } }
</script>
</body>
</html>
