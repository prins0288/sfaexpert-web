<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Stock &amp; Sales Submit</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="partyinventory" data-title="Stock &amp; Sales Submit"></div>
<template id="pageContent">
<style>
  .inv-grid th { white-space: nowrap; font-size: .75rem; text-align: center; vertical-align: middle; background: #0a6a7d; color: #fff; position: sticky; top: 0; z-index: 2; }
  .inv-grid td { vertical-align: middle; font-size: .8rem; padding: .2rem .3rem; } .inv-grid input { width: 6.2rem; text-align: right; } .inv-grid input.sm { width: 5.2rem; }
  .inv-grid td.num { text-align: right; font-variant-numeric: tabular-nums; } .inv-grid input.bad { border-color: #dc3545; }
  .inv-wrap { max-height: 58vh; overflow: auto; } .inv-chip { display: inline-block; background: #0a6a7d; color: #fff; padding: .15rem .6rem; font-size: .8rem; } .inv-chip.v { background: #eef1f4; color: #111; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; } tr.rp-click { cursor: pointer; }
</style>
<div class="card mb-2">
  <div class="card-header d-flex align-items-center flex-wrap gap-2"><span><i class="bi bi-box-seam"></i> <span data-i18n="inv.title">Stock &amp; Sales Submit</span></span>
    <div class="card-tools ms-auto d-flex gap-2"><button class="btn btn-sm btn-primary" onclick="openEntry()"><i class="bi bi-pencil-square"></i> <span data-i18n="inv.entry">Stock entry</span></button></div></div>
  <div class="card-body"><div class="row g-2 align-items-end">
    <div class="col-6 col-md-2"><label class="form-label small fw-semibold" data-i18n="entity.state">State</label><select class="form-select form-select-sm" id="f_state" onchange="fCascade()"><option value="">All</option></select></div>
    <div class="col-6 col-md-3"><label class="form-label small fw-semibold" data-i18n="entity.employee">Employee</label><select class="form-select form-select-sm" id="f_emp" onchange="empChanged()"></select></div>
    <div class="col-12 col-md-3"><label class="form-label small fw-semibold" data-i18n="inv.party">Party / Stockist</label><select class="form-select form-select-sm" id="f_party"><option value="">All</option></select></div>
    <div class="col-6 col-md-2"><label class="form-label small fw-semibold" data-i18n="rep.month">Month</label><select class="form-select form-select-sm" id="f_month"></select></div>
    <div class="col-6 col-md-1"><label class="form-label small fw-semibold" data-i18n="inv.year">Year</label><select class="form-select form-select-sm" id="f_year"></select></div>
    <div class="col-12 col-md-1 text-end"><button class="btn btn-sm btn-primary w-100" onclick="listLoad()"><i class="bi bi-search"></i> <span data-i18n="rep.show">Show</span></button></div>
  </div></div>
</div>
<div class="card"><div class="card-body"><div id="invList"></div></div></div>

<div class="modal fade" id="entryModal" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-fullscreen"><div class="modal-content">
  <div class="modal-header sfa-modal"><h5 class="modal-title"><i class="bi bi-box-seam"></i> <span data-i18n="inv.title">Stock &amp; Sales Submit</span> <span class="badge bg-warning text-dark ms-2 d-none" id="eUpd" data-i18n="inv.updating">Updating a submitted record</span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div class="text-center mb-2"><span class="inv-chip" data-i18n="inv.party">Party / Stockist</span><span class="inv-chip v" id="eParty"></span> <span class="inv-chip" data-i18n="rep.month">Month</span><span class="inv-chip v" id="eMonth"></span> <span class="inv-chip" data-i18n="inv.year">Year</span><span class="inv-chip v" id="eYear"></span></div>
    <div class="small text-primary text-center mb-1" id="eOpen"></div>
    <div class="small text-danger text-center mb-2" id="eFormula"></div>
    <div class="inv-wrap border rounded"><table class="table table-sm table-bordered mb-0 inv-grid" id="eGrid"><thead></thead><tbody></tbody></table></div>
    <div class="row g-2 mt-2"><div class="col-md-8"><label class="form-label small fw-semibold" data-i18n="inv.remarks">Remarks</label><input class="form-control form-control-sm" id="eRemarks" maxlength="500"></div>
      <div class="col-md-4" id="eFileBox"></div></div>
  </div>
  <div class="modal-footer"><span class="me-auto small text-muted" id="eTotal"></span><button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="common.close">Close</button><button type="button" class="btn btn-danger" onclick="saveEntry()"><i class="bi bi-check2"></i> <span data-i18n="common.save">Save</span></button></div></div></div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/core/activity.js"></script>
<script src="js/shell.js"></script>
<script>
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);
  const EP = API.report.inventory, FEP = API.report.attendance;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  const loc = () => (window.I18n && I18n.lang === 'hi' ? 'hi-IN' : 'en-GB');
  const money = (v) => Number(v || 0).toLocaleString(loc(), { maximumFractionDigits: 2 });
  let FIL = null, ROWS = [], E = null, VALS = [], MODAL = null, ME = null, LASTLANG = window.I18n ? I18n.lang : 'en';
  if (window.I18n) I18n.onChange(() => { if (I18n.lang !== LASTLANG) { LASTLANG = I18n.lang; drawList(); } });
  const MONTHS = [...Array(12)].map((_, i) => new Date(2024, i, 1).toLocaleDateString('en-GB', { month: 'long' }));

  window.pageInit = async function () {
    MODAL = new bootstrap.Modal('#entryModal');
    const now = new Date();
    document.getElementById('f_month').innerHTML = MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join(''); document.getElementById('f_month').value = now.getMonth() + 1;
    document.getElementById('f_year').innerHTML = [0, 1, 2, 3].map(k => `<option>${now.getFullYear() - k}</option>`).join('');
    try {
      FIL = await Api.get(FEP + '/filters'); ME = (Session.me && Session.me()) || null;
      document.getElementById('f_state').innerHTML = '<option value="">All</option>' + FIL.states.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
      fCascade(); await listLoad();
    } catch (e) { SFA.toast(e.message, false); }
  };
  function fCascade() {
    const st = document.getElementById('f_state').value, sel = document.getElementById('f_emp').value;
    const list = FIL.employees.filter(e => !st || String(e.stateId) === st);
    document.getElementById('f_emp').innerHTML = list.map(e => `<option value="${esc(e.id)}" ${String(e.id) === sel ? 'selected' : ''}>${esc(e.name)}</option>`).join('');
    empChanged();
  }
  async function empChanged() {
    const emp = document.getElementById('f_emp').value; const p = document.getElementById('f_party');
    if (!emp) { p.innerHTML = '<option value="">All</option>'; return; }
    try { const list = await Api.get(EP + '/parties', { query: { empId: emp }, noLoader: true }); p.innerHTML = '<option value="">All</option>' + list.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join(''); }
    catch (e) { p.innerHTML = '<option value="">All</option>'; }
  }
  async function listLoad() {
    const g = (i) => document.getElementById(i).value;
    try { ROWS = await Api.get(EP + '/list', { query: { month: g('f_month'), year: g('f_year'), stateId: g('f_state') || undefined, empId: g('f_emp') || undefined, partyId: g('f_party') || undefined } }); drawList(); } catch (e) { SFA.toast(e.message, false); }
  }
  function drawList() {
    const w = document.getElementById('invList');
    if (window.jQuery && $.fn.DataTable.isDataTable('#invT')) $('#invT').DataTable().destroy();
    if (!ROWS.length) { w.innerHTML = `<div class="text-center text-muted py-4">${T('inv.none', 'Nothing submitted for these filters')}</div>`; return; }
    w.innerHTML = `<table id="invT" data-screen-key="PARTY_INVENTORY" class="table table-striped table-bordered nowrap" style="width:100%"><thead><tr><th>${T('common.sno', 'S.No')}</th><th data-field="employee">${T('entity.employee', 'Employee')}</th><th data-field="party">${T('inv.party', 'Party / Stockist')}</th><th data-field="state">${T('entity.state', 'State')}</th><th data-field="period">${T('inv.period', 'Month / Year')}</th>
      <th data-field="items" class="text-end">${T('inv.items', 'Items')}</th><th data-field="closing" class="text-end">${T('inv.closing', 'Closing qty')}</th><th data-field="value" class="text-end">${T('inv.stockValue', 'Stock value')}</th><th data-field="file">${T('inv.file', 'File')}</th><th data-field="updated">${T('inv.updated', 'Last updated')}</th></tr></thead><tbody>
      ${ROWS.map((r, i) => `<tr class="rp-click" onclick="openEntry(${i})"><td>${i + 1}</td><td><b>${esc(r.empName)}</b> <small class="text-muted">${esc(r.empCode)}</small></td><td>${esc(r.party)} <small class="text-muted">${esc(r.partyCode)}</small></td><td>${esc(r.state)}</td>
      <td data-order="${r.year * 100 + r.month}">${MONTHS[r.month - 1]} ${r.year}</td><td class="num">${r.items}</td><td class="num">${money(r.closing)}</td><td class="num">${money(r.stockValue)}</td><td>${r.fileName ? '<i class="bi bi-paperclip"></i> ' + esc(r.fileName) : ''}</td><td>${esc(String(r.updatedAt || r.createdAt || '').replace('T', ' ').substring(0, 16))}</td></tr>`).join('')}</tbody></table>`;
    sfaDataTable('#invT', { order: [[4, 'desc']] });
  }

  // ------------------------------------------------------------------ the entry (the columns are the fields the company set up in Inventory Master)
  const COLS = () => E.fields.filter(f => f.enabled && f.role !== 'VALUE');
  const roleF = (role) => E.fields.find(f => f.enabled && f.role === role);
  async function openEntry(i) {
    let emp, party, month, year; const g = (id) => document.getElementById(id).value;
    if (i != null) { const r = ROWS[i]; emp = r.empId; party = r.partyId; month = r.month; year = r.year; }
    else { emp = g('f_emp'); party = g('f_party'); month = g('f_month'); year = g('f_year'); if (!emp || !party) { SFA.toast(T('inv.pick', 'Choose the employee and the party / stockist first'), false); return; } }
    try { E = await Api.get(EP + '/entry', { query: { empId: emp, partyId: party, month, year } }); } catch (e) { SFA.toast(e.message, false); return; }
    E.empId = emp; VALS = E.items.map(it => { const o = {}; E.fields.forEach(f => o[f.code] = it.v[f.code] == null ? '' : String(it.v[f.code])); return o; });
    document.getElementById('eParty').textContent = E.party.name; document.getElementById('eMonth').textContent = MONTHS[E.month - 1]; document.getElementById('eYear').textContent = E.year;
    document.getElementById('eUpd').classList.toggle('d-none', !E.exists);
    document.getElementById('eOpen').textContent = E.openingLocked ? T('inv.openFrom', 'Opening = closing of') + ' ' + MONTHS[Number(E.openingFrom.split('-')[0]) - 1] + ' ' + E.openingFrom.split('-')[1] + ' (' + T('inv.readOnly', 'read only') + ')' : (E.openingFrom ? '' : T('inv.openFirst', 'First submission of this party: type the opening'));
    document.getElementById('eRemarks').value = (E.parent && E.parent.remarks) || '';
    E.filePath = E.parent && E.parent.filePath; E.fileName = E.parent && E.parent.fileName;
    E.basis = (E.parent && E.parent.rateBasis) || E.settings.RATE_BASIS;
    const plus = COLS().filter(f => f.role === 'NORMAL' && f.sign > 0).map(f => f.label), minus = COLS().filter(f => f.role === 'NORMAL' && f.sign < 0).map(f => f.label), sf = roleF('SALE'), cf = roleF('CLOSING');
    document.getElementById('eFormula').textContent = E.settings.SALE_CLOSING_CALC === 'Y' && cf ? (T('inv.closingWord', 'Closing') + ' = (' + plus.join(' + ') + ')' + (sf || minus.length ? ' - (' + [sf ? sf.label : null].concat(minus).filter(Boolean).join(' + ') + ')' : '') + '. ' + (sf ? T('inv.eitherOr', 'Type the Sale and the Closing is calculated, or type the Closing and the Sale is calculated.') : '')) : '';
    drawGrid(); drawFile(); MODAL.show();
  }
  function drawGrid() {
    const cols = COLS(), sv = E.fields.find(f => f.role === 'VALUE' && f.enabled);
    document.querySelector('#eGrid thead').innerHTML = `<tr><th>${T('common.sno', 'Sr.')}</th><th style="min-width:14rem">${T('inv.item', 'Item Name')}</th><th>${T('inv.pack', 'Packing Size')}</th><th>${esc(E.basis)}</th>${cols.map(c => `<th>${esc(c.label)}</th>`).join('')}${sv ? `<th>${esc(sv.label)}</th>` : ''}</tr>`;
    document.querySelector('#eGrid tbody').innerHTML = E.items.map((it, i) => `<tr><td>${i + 1}</td><td>${esc(it.name)}</td><td class="text-center">${esc(it.pack)}</td><td class="num">${money(it.rate)}</td>
      ${cols.map(c => `<td><input class="form-control form-control-sm ${c.role === 'RATE' ? 'sm' : ''}" type="number" min="0" step="any" inputmode="decimal" id="v_${i}_${c.code}" value="${esc(VALS[i][c.code])}" ${E.openingLocked && c.code === 'OPENING' ? 'readonly tabindex="-1" style="background:#eef1f4"' : ''} oninput="vIn(${i},'${c.code}',this.value)"></td>`).join('')}
      ${sv ? `<td class="num" id="sv_${i}"></td>` : ''}</tr>`).join('');
    E.items.forEach((_, i) => recalc(i)); totals();
  }
  function vIn(i, code, v) { VALS[i][code] = v; recalc(i); totals(); }
  // the calculation of one row (the server does the same on save)
  function calcRow(i) {
    const r = VALS[i], n = (c) => (c == null || r[c] === '' || r[c] == null ? null : Number(r[c])), cols = COLS(), sf = roleF('SALE'), cf = roleF('CLOSING'), rf = roleF('RATE');
    let base = 0; cols.forEach(f => { if (f.role === 'NORMAL' && f.sign) base += f.sign * (n(f.code) || 0); });
    let S = sf ? n(sf.code) : null, C = cf ? n(cf.code) : null, hint = null; const any = cols.some(f => n(f.code) != null);
    if (E.settings.SALE_CLOSING_CALC === 'Y' && !(S != null && C != null) && any) { if (S != null) { C = base - S; hint = cf ? cf.code : null; } else if (C != null && sf) { S = base - C; hint = sf.code; } else if (C == null) { C = base; hint = cf ? cf.code : null; } }
    const sp = rf ? n(rf.code) : null, rate = E.settings.RATE_SHOWN === 'SPECIAL' && sp > 0 ? sp : Number(E.items[i].rate);
    return { S, C, hint, value: (C || 0) * rate, any, bad: (C != null && C < 0) || (S != null && S < 0), sf, cf };
  }
  function recalc(i) {
    const c = calcRow(i);
    [c.sf, c.cf].filter(Boolean).forEach(f => { const el = document.getElementById('v_' + i + '_' + f.code); if (!el) return; el.placeholder = c.hint === f.code ? '= ' + (f.role === 'CLOSING' ? c.C : c.S) : ''; el.classList.toggle('bad', c.bad && (c.hint === f.code || el.value !== '')); });
    const sv = document.getElementById('sv_' + i); if (sv) sv.textContent = c.any ? money(c.value) : '';
  }
  function totals() { let n = 0, v = 0; E.items.forEach((_, i) => { const c = calcRow(i); if (c.any) { n++; v += c.value; } }); document.getElementById('eTotal').textContent = n + ' ' + T('inv.items', 'Items') + ' · ' + T('inv.stockValue', 'Stock value') + ' ' + money(v); }

  function drawFile() {
    const box = document.getElementById('eFileBox');
    if (E.settings.FILE_UPLOAD !== 'Y') { box.innerHTML = ''; return; }
    box.innerHTML = `<label class="form-label small fw-semibold">${T('inv.file', 'File')}${E.settings.FILE_MANDATORY === 'Y' ? ' *' : ''}</label>
      ${E.filePath ? `<div class="small mb-1"><i class="bi bi-paperclip"></i> ${esc(E.fileName || 'file')} <a href="#" onclick="E.filePath=null;E.fileName=null;E.removeFile=true;drawFile();return false"><i class="bi bi-x-circle text-danger"></i></a></div>` : ''}
      <input class="form-control form-control-sm" type="file" onchange="fileUp(this)">`;
  }
  async function fileUp(el) {
    const f = el.files[0]; if (!f) return;
    try { const fd = new FormData(); fd.append('file', f); const r = await Api.post(EP + '/upload', fd); E.filePath = r.path; E.fileName = r.name; E.removeFile = false; drawFile(); } catch (e) { SFA.toast(e.message, false); }
  }
  async function saveEntry() {
    const rows = [];
    E.items.forEach((it, i) => { const c = calcRow(i); if (!c.any) return; const o = { itemId: it.id }; COLS().forEach(col => { if (VALS[i][col.code] !== '') o[col.code] = VALS[i][col.code]; }); rows.push(o); });
    try {
      const r = await Api.post(EP + '/save', { empId: E.empId, partyId: E.party.id, month: E.month, year: E.year, remarks: document.getElementById('eRemarks').value, filePath: E.filePath, fileName: E.fileName, removeFile: !!E.removeFile, rows });
      SFA.toast((r.updated ? T('inv.updatedOk', 'Updated') : T('inv.savedOk', 'Saved')) + ' (' + r.items + ' ' + T('inv.items', 'Items').toLowerCase() + ')', true); MODAL.hide(); listLoad();
    } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
