<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Inventory Master</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="inventorymaster" data-title="Inventory Master"></div>
<template id="pageContent">
<div class="card mb-2">
  <div class="card-header d-flex align-items-center flex-wrap gap-2"><span><i class="bi bi-sliders"></i> <span data-i18n="inv.master">Inventory Master</span></span>
    <div class="card-tools ms-auto"><button class="btn btn-sm btn-primary" onclick="mSave()"><i class="bi bi-check2"></i> <span data-i18n="common.save">Save</span></button></div></div>
  <div class="card-body"><div class="small text-muted mb-2" data-i18n="inv.masterHelp">What the user fills in the Stock &amp; Sales Submit of a party / stockist. A field that is switched off is not shown and counts as 0. Closing is typed OR calculated from the sale; Stock value is always calculated.</div>
    <div class="table-responsive"><table class="table table-sm align-middle" id="fieldT"><thead><tr><th style="width:3.5rem">#</th><th>Code</th><th data-i18n="inv.label">Label</th><th style="width:6rem" data-i18n="inv.short">Report code</th><th style="width:9rem" data-i18n="inv.sign">In closing</th><th class="text-center" data-i18n="inv.show">Show</th><th class="text-center" data-i18n="inv.mandatory">Mandatory</th><th style="width:6rem" data-i18n="inv.order">Order</th><th></th></tr></thead><tbody></tbody></table></div>
    <div class="border rounded p-2 mt-2"><div class="fw-semibold small mb-2" data-i18n="inv.addField">Add your own field</div><div class="row g-2 align-items-end">
      <div class="col-6 col-md-2"><label class="form-label small mb-0">Code</label><input class="form-control form-control-sm" id="n_code" maxlength="24" placeholder="DAMAGE" style="text-transform:uppercase"></div>
      <div class="col-6 col-md-4"><label class="form-label small mb-0" data-i18n="inv.label">Label</label><input class="form-control form-control-sm" id="n_label" maxlength="60" placeholder="Damaged goods"></div>
      <div class="col-6 col-md-2"><label class="form-label small mb-0" data-i18n="inv.short">Report code</label><input class="form-control form-control-sm" id="n_short" maxlength="10"></div>
      <div class="col-6 col-md-2"><label class="form-label small mb-0" data-i18n="inv.sign">In closing</label><select class="form-select form-select-sm" id="n_sign"><option value="1">+ added</option><option value="-1">- subtracted</option><option value="0">information only</option></select></div>
      <div class="col-12 col-md-2"><button class="btn btn-sm btn-outline-primary w-100" onclick="mAdd()"><i class="bi bi-plus-lg"></i> <span data-i18n="inv.add">Add</span></button></div></div></div></div>
</div>
<div class="card mb-2"><div class="card-header"><i class="bi bi-gear"></i> <span data-i18n="inv.settings">Settings</span></div>
  <div class="card-body"><div class="row g-3">
    <div class="col-md-4"><label class="form-label small fw-semibold" data-i18n="inv.rateBasis">Stock is submitted on the rate</label>
      <select class="form-select form-select-sm" id="s_basis"><option value="PTS">PTS</option><option value="PTR">PTR</option><option value="MRP">MRP</option><option value="PURCHASE_RATE">Purchase rate</option></select>
      <div class="form-text" data-i18n="inv.rateBasisHelp">The column of the item rate master (state wise rate first, else the all-state rate) the item rate is taken from.</div>
      <label class="form-label small fw-semibold mt-2" data-i18n="inv.rateShown">Rate used / shown in the inventory</label>
      <select class="form-select form-select-sm" id="s_rate"><option value="SPECIAL" data-i18n="inv.rateSpecial">Special rate when entered, else the item rate</option><option value="ITEM" data-i18n="inv.rateItem">Always the item rate (PTS)</option></select>
      <div class="form-text" data-i18n="inv.rateHelp">Both rates are always saved when a special rate is entered. This decides which one the stock value and the views use.</div></div>
    <div class="col-md-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="s_calc"><label class="form-check-label" for="s_calc" data-i18n="inv.calc">Calculate Sale / Closing</label></div>
      <div class="form-text" data-i18n="inv.calcHelp">ON: only Sale typed - Closing is calculated; only Closing typed - Sale is calculated; both typed - no formula. OFF: nothing is calculated, what is typed is saved.</div></div>
    <div class="col-md-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="s_file" onchange="mFileToggle()"><label class="form-check-label" for="s_file" data-i18n="inv.fileUpload">File upload (stock statement)</label></div>
      <div class="form-check form-switch mt-2"><input class="form-check-input" type="checkbox" id="s_filem"><label class="form-check-label" for="s_filem" data-i18n="inv.fileMandatory">File is mandatory</label></div></div>
  </div></div></div>
<div class="card"><div class="card-body small">
  <b data-i18n="inv.formula">Formula</b>: Closing = (Opening + Purchase) - (Sale + Free) + (Return from Retailer - Return to Consignee) + (Expiry from Retailer - Expiry to Consignee).<br>
  Stock value = Closing x Spl. Rate (when a special rate is entered and the setting is on) else Closing x PTS.</div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/core/activity.js"></script>
<script src="js/shell.js"></script>
<script>
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);
  const EP = API.report.inventory;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  let CFG = null;
  window.pageInit = async function () { try { CFG = await Api.get(EP + '/config'); draw(); } catch (e) { SFA.toast(e.message, false); } };
  function draw() {
    document.querySelector('#fieldT tbody').innerHTML = CFG.fields.map((f, i) => {
      const fixed = f.role !== 'NORMAL' || f.core, noMand = f.role !== 'NORMAL';
      return `<tr><td>${i + 1}</td><td><code>${esc(f.code)}</code>${f.role === 'VALUE' ? ' <span class="badge bg-info">auto</span>' : f.role !== 'NORMAL' ? ' <span class="badge bg-secondary">' + esc(f.role.toLowerCase()) + '</span>' : ''}${f.builtin ? '' : ' <span class="badge bg-success">own</span>'}${f.core ? '' : ''}</td>
      <td><input class="form-control form-control-sm" data-k="label" data-i="${i}" value="${esc(f.label)}" maxlength="60"></td>
      <td><input class="form-control form-control-sm" data-k="short" data-i="${i}" value="${esc(f.short)}" maxlength="10"></td>
      <td><select class="form-select form-select-sm" data-k="sign" data-i="${i}" ${fixed ? 'disabled' : ''}><option value="1" ${f.sign === 1 ? 'selected' : ''}>+ added</option><option value="-1" ${f.sign === -1 ? 'selected' : ''}>- subtracted</option><option value="0" ${f.sign === 0 ? 'selected' : ''}>${fixed ? '-' : 'information only'}</option></select></td>
      <td class="text-center"><input class="form-check-input" type="checkbox" data-k="enabled" data-i="${i}" ${f.enabled ? 'checked' : ''} ${f.core ? 'disabled' : ''}></td>
      <td class="text-center"><input class="form-check-input" type="checkbox" data-k="mandatory" data-i="${i}" ${f.mandatory ? 'checked' : ''} ${noMand ? 'disabled' : ''}></td>
      <td><input class="form-control form-control-sm" type="number" data-k="sortOrder" data-i="${i}" value="${esc(f.sortOrder)}"></td>
      <td>${f.core ? '<i class="bi bi-lock-fill text-muted" title="Always stays - you can rename it"></i>' : `<button class="btn btn-sm btn-outline-danger" title="Delete" onclick="mDel('${esc(f.code)}')"><i class="bi bi-trash"></i></button>`}</td></tr>`; }).join('');
    const s = CFG.settings;
    document.getElementById('s_basis').value = s.RATE_BASIS; document.getElementById('s_rate').value = s.RATE_SHOWN; document.getElementById('s_calc').checked = s.SALE_CLOSING_CALC === 'Y';
    document.getElementById('s_file').checked = s.FILE_UPLOAD === 'Y'; document.getElementById('s_filem').checked = s.FILE_MANDATORY === 'Y'; mFileToggle();
  }
  async function mAdd() {
    const g = (i) => document.getElementById(i).value.trim();
    try { await Api.post(EP + '/config', { fields: [{ code: g('n_code'), label: g('n_label'), short: g('n_short'), sign: g('n_sign'), enabled: true, mandatory: false, sortOrder: 200 + CFG.fields.length }] }); ['n_code', 'n_label', 'n_short'].forEach(i => document.getElementById(i).value = ''); SFA.toast(T('inv.saved', 'Saved'), true); CFG = await Api.get(EP + '/config'); draw(); } catch (e) { SFA.toast(e.message, false); }
  }
  async function mDel(code) { if (!confirm('Delete this field?')) return; try { await Api.post(EP + '/config/field/' + code + '/delete', {}); CFG = await Api.get(EP + '/config'); draw(); } catch (e) { SFA.toast(e.message, false); } }
  function mFileToggle() { const on = document.getElementById('s_file').checked; const m = document.getElementById('s_filem'); m.disabled = !on; if (!on) m.checked = false; }
  async function mSave() {
    const fields = CFG.fields.map((f, i) => {
      const g = (k) => document.querySelector(`[data-k="${k}"][data-i="${i}"]`);
      return { code: f.code, label: g('label').value, short: g('short').value, sign: g('sign').value, enabled: g('enabled').checked, mandatory: g('mandatory').checked, sortOrder: g('sortOrder').value };
    });
    const settings = { RATE_BASIS: document.getElementById('s_basis').value, RATE_SHOWN: document.getElementById('s_rate').value, SALE_CLOSING_CALC: document.getElementById('s_calc').checked ? 'Y' : 'N', FILE_UPLOAD: document.getElementById('s_file').checked ? 'Y' : 'N', FILE_MANDATORY: document.getElementById('s_filem').checked ? 'Y' : 'N' };
    try { await Api.post(EP + '/config', { fields, settings }); SFA.toast(T('inv.saved', 'Saved'), true); CFG = await Api.get(EP + '/config'); draw(); } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
