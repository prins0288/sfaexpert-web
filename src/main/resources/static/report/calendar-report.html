<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>

  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
<style>

  .rp-kpi { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-left: 3px solid var(--bs-primary); border-radius: .4rem; padding: .35rem .8rem; min-width: 7.5rem; flex: 1 1 7.5rem; }
  .rp-kpi small { color: var(--bs-secondary-color); display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; } .rp-kpi b { font-size: 1.1rem; line-height: 1.2; }
  .rp-kpi.bad { border-left-color: #dc3545; } .rp-kpi.bad b { color: #b02a37; } .rp-kpi.ok { border-left-color: #198754; } .rp-kpi.warn { border-left-color: #fd7e14; } .rp-kpi.mut { border-left-color: #6c757d; }
  .rp-filters .form-label { font-size: .72rem; font-weight: 600; color: var(--bs-secondary-color); margin-bottom: .1rem; } .rp-tabs .nav-link { padding: .3rem .8rem; font-size: .85rem; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--bs-border-color); border: 1px solid var(--bs-border-color); border-radius: .4rem; overflow: hidden; }
  .cal .h { background: var(--bs-tertiary-bg); text-align: center; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: .35rem 0; }
  .cal .c { background: var(--bs-body-bg); min-height: 5.6rem; padding: .3rem .35rem; font-size: .72rem; position: relative; } .cal .c.out { background: var(--bs-tertiary-bg); opacity: .55; } .cal .c.blank { opacity: .6; }
  .cal .c.clk { cursor: pointer; } .cal .c.clk:hover { background: var(--bs-primary-bg-subtle); } .cal .c.today { background: #111 !important; color: #fff; } .cal .c.today .off { color: #ddd; }
  .cal .d { font-weight: 700; font-size: .8rem; margin-bottom: .15rem; } .cal .off { color: var(--bs-secondary-color); font-style: italic; }
  .cal .chip { display: inline-block; border-radius: .25rem; padding: 0 .35rem; margin: 0 .15rem .15rem 0; font-weight: 600; white-space: nowrap; }
  .chip.p { background: #a8e0b5; color: #14532d; } .chip.hd { background: #ffd98a; color: #7a4a00; } .chip.a { background: #ff5b6b; color: #fff; } .chip.l { background: #b9ccf5; color: #1d3a82; } .chip.k { background: #ff0000; color: #fff; } .cal .c.me-k { background: #ff0000; color: #fff; } .chip.o { background: #dfe3e8; color: #4b5563; }
  .cal .c.me-p { background: #cfeed8; } .cal .c.me-hd { background: #fff0c9; } .cal .c.me-a { background: #ffdde1; } .cal .c.me-l { background: #e3ebfb; } .cal .c.me-o { background: #eceff2; }
  #calGroup table.dataTable td, #calGroup table.dataTable th, #dayBody table.dataTable td, #dayBody table.dataTable th { font-size: .8rem; padding: .3rem .5rem; vertical-align: middle; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; } .rp-zero { color: var(--bs-secondary-color); opacity: .55; } .rp-bad { color: #b02a37; font-weight: 700; } tr.rp-click { cursor: pointer; }
  .cal-wrap.single .cal .c { min-height: 9rem; font-size: .7rem; line-height: 1.35; } .cal-wrap.single .cal .c > div { overflow-wrap: anywhere; }
  @media (max-width: 767.98px) { .cal-wrap.single .cal { grid-template-columns: 1fr; } .cal-wrap.single .cal .h, .cal-wrap.single .cal .c.out, .cal-wrap.single .cal .c.blank { display: none; } .cal-wrap.single .cal .c { min-height: 0; } .cal .c { min-height: 4.2rem; padding: .2rem; } .cal .chip { padding: 0 .2rem; } }
</style>

<div id="app" data-page="calendarreport" data-title="Calendar Report"></div>
<template id="pageContent">
<div class="card mb-2">
  <div class="card-header d-flex align-items-center flex-wrap gap-2"><span><i class="bi bi-calendar3"></i> <span data-i18n="rep.cal.title">Calendar Report</span></span><small class="text-muted" id="rpSub"></small>
    <div class="card-tools ms-auto d-flex gap-2 flex-wrap">
      <button class="btn btn-sm sfa-btn-outline" id="rpFBtn" onclick="rpFToggle()"><i class="bi bi-sliders"></i> <span data-i18n="rep.filters">Filters</span></button>
      <button class="btn btn-sm sfa-btn-outline" data-bs-toggle="modal" data-bs-target="#activityModal"><i class="bi bi-clock-history"></i> <span data-i18n="rep.recent">Recent</span></button></div></div>
  <div class="card-body rp-filters" id="rpFBody">
    <div class="row g-2 align-items-end">
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="rep.month">Month</label><input type="month" class="form-control form-control-sm" id="f_month"></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="entity.state">State</label><select class="form-select form-select-sm" id="f_state" onchange="rpFilterChange()"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="entity.hq">HQ</label><select class="form-select form-select-sm" id="f_hq" onchange="rpFilterChange()"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="entity.designation">Designation</label><select class="form-select form-select-sm" id="f_des" onchange="rpFilterChange()"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="entity.employee">Employee</label><select class="form-select form-select-sm" id="f_emp" onchange="rpSearch()"></select></div>
      <div class="col-auto ms-md-auto d-flex gap-2"><button class="btn btn-sm btn-light" onclick="rpReset()" data-i18n="common.reset">Reset</button><button class="btn btn-sm btn-primary" onclick="rpSearch()"><i class="bi bi-search"></i> <span data-i18n="rep.show">Show</span></button></div>

</div>


<div class="card mb-2">
  <div class="card-header d-flex align-items-center flex-wrap gap-2">
    <span class="small text-muted ms-auto" id="rpHint"></span>
  </div>
  <div class="card-body"><div class="d-flex justify-content-center gap-3 small mb-2"><a href="#" class="text-decoration-none" onclick="monthGo(-1);return false"><i class="bi bi-caret-left-fill"></i> <span data-i18n="rep.cal.prev">Previous Month</span></a><a href="#" class="text-decoration-none" onclick="monthGo(0);return false"><span data-i18n="rep.cal.cur">Current Month</span></a><a href="#" class="text-decoration-none" onclick="monthGo(1);return false"><span data-i18n="rep.cal.next">Next Month</span> <i class="bi bi-caret-right-fill"></i></a></div><div id="calTotals" class="mb-2"></div><div class="cal-wrap"><div id="calWrap"></div></div>
  <div class="d-flex flex-wrap justify-content-center gap-2 small mt-3" id="calLegend"></div><div class="small text-muted mt-2" id="calNote"></div></div>
</div>

<div class="modal fade" id="dayModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-lg-down"><div class="modal-content">
  <div class="modal-header sfa-modal"><h5 class="modal-title" id="dayTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="dayBody"></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="common.close">Close</button></div></div></div></div>

  <div class="modal-header sfa-modal"><h5 class="modal-title"><i class="bi bi-clock-history"></i> <span data-i18n="rep.recentSearches">Recent searches</span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><div id="activityList"></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="common.close">Close</button></div></div></div></div>
</template>

<script>
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);   // text of the chosen language (lang_*.properties + the tenant's label_master)
  const REPORT_KEY = 'calendarreport', REPORT_LABEL = 'Calendar Report', EP = API.report.attendance;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  const pad = (n) => String(n).padStart(2, '0');
  const loc = () => (window.I18n && I18n.lang === 'hi' ? 'hi-IN' : 'en-GB');
  const fmt = (d) => { const x = new Date(d + 'T00:00:00'); return pad(x.getDate()) + '-' + pad(x.getMonth() + 1) + '-' + x.getFullYear(); };
  const hrs = (m) => m ? Math.floor(m / 60) + 'h ' + (Math.round(m) % 60) + 'm' : '';
  const nz = (v) => v ? v : '<span class="rp-zero">0</span>';
  let GDATA = null, DET = null, FIL = null, DATA = null, VIEW = 'state', ACT = null, LASTLANG = window.I18n ? I18n.lang : 'en', DAYROWS = null, DAYSEL = null;
  if (window.I18n) I18n.onChange(() => { if (I18n.lang !== LASTLANG) { LASTLANG = I18n.lang; if (DATA) rpRender(); } });
  const GROUPS = { state: ['rep.cal.stateWise', 'State wise', 'state', 'entity.state', 'State'], hq: ['rep.cal.hqWise', 'HQ wise', 'hq', 'entity.hq', 'HQ'], des: ['rep.cal.desWise', 'Designation wise', 'designation', 'entity.designation', 'Designation'], emp: ['rep.cal.empWise', 'Employee wise', 'name', 'entity.employee', 'Employee'] };
  const gOf = (e) => { const f = GROUPS[VIEW][2]; return (e[f] == null || e[f] === '') ? '-' : String(e[f]); };

  window.pageInit = async function () {
    ACT = new bootstrap.Modal('#activityModal');
    document.getElementById('activityModal').addEventListener('shown.bs.modal', () => Activity.renderInto('activityList', REPORT_KEY, applyActivity));
    const d = new Date(); document.getElementById('f_month').value = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    try { FIL = await Api.get(EP + '/filters'); fillFilters(); await rpSearch(); } catch (e) { SFA.toast(e.message, false); }
  };
  const opt = (list, first, sel) => `<option value="">${first}</option>` + list.map(x => `<option value="${esc(x.id)}" ${String(x.id) === String(sel) ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  function fillFilters() {
    const v = (id) => document.getElementById(id).value;
    document.getElementById('f_state').innerHTML = opt(FIL.states, T('common.all', 'All'), v('f_state'));
    document.getElementById('f_hq').innerHTML = opt(FIL.hqs, T('common.all', 'All'), v('f_hq'));
    document.getElementById('f_des').innerHTML = opt(FIL.designations, T('common.all', 'All'), v('f_des'));
    rpCascade();
  }
  function rpCascade() {
    const v = (id) => document.getElementById(id).value, sel = v('f_emp');
    const list = FIL.employees.filter(e => (!v('f_state') || String(e.stateId) === v('f_state')) && (!v('f_hq') || String(e.hqId) === v('f_hq')) && (!v('f_des') || String(e.designationId) === v('f_des')));
    const keep = list.some(e => String(e.id) === sel) ? sel : (list[0] ? String(list[0].id) : '');   // never All: one employee is always chosen
    document.getElementById('f_emp').innerHTML = list.map(x => `<option value="${esc(x.id)}" ${String(x.id) === keep ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  }
  function rpFilterChange() { rpCascade(); document.getElementById('f_emp').value = (document.getElementById('f_emp').options[0] || {}).value || ''; rpSearch(); }
  function rpFilterChange() { rpCascade(); const f = document.getElementById('f_emp'); f.value = (f.options[0] || {}).value || ''; rpSearch(); }
  function query() { const v = (id) => { const x = document.getElementById(id).value; return x === '' ? undefined : x; }; return { month: v('f_month'), stateId: v('f_state'), hqId: v('f_hq'), designationId: v('f_des'), empId: v('f_emp') }; }
  async function rpSearch() {
    try {
      const q = query(); DET = null;
      if (!q.empId) { DATA = null; document.getElementById('rpSub').textContent = ''; document.getElementById('calTotals').innerHTML = ''; document.getElementById('calLegend').innerHTML = ''; document.getElementById('calNote').textContent = '';
        document.getElementById('calWrap').innerHTML = `<div class="text-center text-muted py-5"><i class="bi bi-person-circle fs-2 d-block mb-2"></i>${T('rep.cal.pick', 'Choose an employee and press Show to see his calendar')}</div>`; document.getElementById('rpHint').textContent = ''; rpFToggle(false); return; }
      DATA = await Api.get(EP + '/sheet', { query: q });   // the chosen employee only
      document.getElementById('rpSub').textContent = new Date(DATA.from + 'T00:00:00').toLocaleDateString(loc(), { month: 'long', year: 'numeric' });
      const one = DATA.employees.length ? query().empId : null;
      if (one) { try { DET = (await Api.get(EP + '/calendar-detail', { query: { empId: one, month: query().month } })).days; } catch (e) { DET = null; } }
      rpRender(); rpFToggle(true); rpScrollTop();   // loaded: the filter card folds away, the page goes to the top
      Activity.record(REPORT_KEY, REPORT_LABEL, filterState(), summaryText());
    } catch (e) { SFA.toast(e.message, false); }
  }
  function rpFToggle(close) { const b = document.getElementById('rpFBody'), hide = close === true ? true : !b.classList.contains('d-none'); b.classList.toggle('d-none', hide); const btn = document.getElementById('rpFBtn'); if (btn) btn.classList.toggle('active', !hide); if (!hide) rpScrollTop(); }
  function rpScrollTop() { let n = document.getElementById('rpFBody'); while (n && n !== document.body) { const o = getComputedStyle(n).overflowY; if ((o === 'auto' || o === 'scroll') && n.scrollHeight > n.clientHeight) n.scrollTop = 0; n = n.parentElement; } window.scrollTo(0, 0); }
  function rpReset() { ['f_state', 'f_hq', 'f_des', 'f_emp'].forEach(i => document.getElementById(i).value = ''); rpCascade(); rpSearch(); }
  function filterState() { const g = (i) => document.getElementById(i).value; return { month: g('f_month'), state: g('f_state'), hq: g('f_hq'), des: g('f_des'), emp: g('f_emp'), view: VIEW }; }
  function summaryText() { return new Date(DATA.from + 'T00:00:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) + ' · ' + DATA.employees.length + ' ' + T('entity.employees', 'Employees').toLowerCase() + ' · ' + T(GROUPS[VIEW][0], GROUPS[VIEW][1]); }
  function applyActivity(f) {
    const set = (i, v) => document.getElementById(i).value = v || '';
    set('f_month', f.month); set('f_state', f.state); set('f_hq', f.hq); set('f_des', f.des); rpCascade(); set('f_emp', f.emp); if (f.view) VIEW = f.view;
    document.querySelectorAll('#rpTabs .nav-link').forEach(b => b.classList.toggle('active', b.dataset.v === VIEW)); rpSearch(); if (ACT) ACT.hide();
  }
  function monthGo(n) { const el = document.getElementById('f_month'); let [y, m] = (el.value || '').split('-').map(Number); const d = new Date(); if (n === 0 || !y) { y = d.getFullYear(); m = d.getMonth() + 1; } else { m += n; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } } el.value = y + '-' + pad(m); rpSearch(); }
  function legend() { const l = (c, t) => `<span><span class="chip ${c}">&nbsp;&nbsp;&nbsp;</span> ${esc(t)}</span>`; document.getElementById('calLegend').innerHTML = l('p', T('rep.present', 'Present')) + l('hd', T('rep.att.halfDay', 'Half day')) + l('a', T('rep.absent', 'Absent')) + l('k', T('rep.cal.locked', 'Locked')) + l('l', T('rep.leave', 'Leave')) + l('o', T('rep.holidayOff', 'Holiday / off')) + `<span><span class="chip" style="background:#111;color:#fff">&nbsp;&nbsp;&nbsp;</span> ${esc(T('rep.cal.today', 'Current date'))}</span>`; }
  function rpView(v) { VIEW = v; document.querySelectorAll('#rpTabs .nav-link').forEach(b => b.classList.toggle('active', b.dataset.v === v)); rpRender(); }

  // ------------------------------------------------------------------ counts
  const tally = (cells) => { const t = { p: 0, hd: 0, a: 0, k: 0, l: 0, o: 0, n: 0 }; cells.forEach(c => { if (!c) return; t.n++; if (c.s === 'P') t.p++; else if (c.s === 'HD') t.hd++; else if (c.s === 'A' && c.lk) t.k++; else if (c.s === 'A') t.a++; else if (c.s === 'L') t.l++; else t.o++; }); return t; };
  function kpis() {
    const t = GDATA.employees.reduce((a, e) => { const s = e.sum; a.p += s.present; a.h += s.half; a.l += s.leave; a.o += s.off; a.a += s.absent; a.c += s.calls; return a; }, { p: 0, h: 0, l: 0, o: 0, a: 0, c: 0 });
    const k = (l, v, c) => `<div class="rp-kpi ${c || ''}"><small>${l}</small><b>${v}</b></div>`;
    document.getElementById('rpKpis').innerHTML = k(T('entity.employees', 'Employees'), GDATA.employees.length) + k(T('rep.present', 'Present'), t.p, 'ok') + k(T('rep.att.half', 'Half days'), t.h, 'warn') + k(T('rep.leave', 'Leave'), t.l)
      + k(T('rep.holidayOff', 'Holiday / off'), t.o, 'mut') + k(T('rep.absent', 'Absent'), t.a, t.a ? 'bad' : '') + k(T('rep.calls', 'Calls'), t.c);
  }

  function rpRender() {
    if (!DATA) return;
    const emps = DATA.employees, single = document.getElementById('f_emp').value && emps.length ? emps[0] : null;
    document.getElementById('rpHint').textContent = single ? single.name + ' (' + single.empCode + ')' : T('rep.cal.clickDay', 'Click a day to see the details');
    document.querySelector('.cal-wrap')?.classList.toggle('single', !!single); monthTotals(single); renderCalendar(single); legend();
  }

  // ------------------------------------------------------------------ the month calendar
  const money = (v) => Number(v || 0).toLocaleString(loc(), { maximumFractionDigits: 2 });
  const ln = (t) => `<div>${t}</div>`;
  function detailLines(date) {
    const d = DET && DET[date]; if (!d) return '';
    let h = '';
    const sum = (o) => Object.values(o || {}).reduce((a, b) => a + Number(b), 0);
    Object.entries(d.listed || {}).forEach(([t, n]) => h += ln(`${esc(t)} ${T('rep.cal.calls', 'Calls').toLowerCase()}: <b>${n}</b>`));
    Object.entries(d.unlisted || {}).forEach(([t, n]) => h += ln(`${T('rep.cal.unlisted', 'Unlisted')} ${esc(t)}: <b>${n}</b>`));
    if (d.refused) h += ln(`${T('rep.cal.refused', 'Refused')}: <b>${d.refused}</b>`);
    if (Number(d.pob)) h += ln(`${T('rep.cal.pob', 'POB')}: <b>${money(d.pob)}</b>`);
    Object.entries(d.items || {}).forEach(([t, m]) => { h += ln(`${esc(t)}: <b>${m.qty}</b>${Number(m.amount) ? ' · ' + money(m.amount) : ''}`); });
    if (d.joint && d.joint.length) h += ln(`${T('rep.cal.joint', 'Joint work')}: ${esc(d.joint.join(', '))}`);
    if (d.areas && d.areas.length) h += ln(`${T('rep.cal.areas', 'Areas')}: ${esc(d.areas.join(', '))}`);
    if (Number(d.expense)) h += ln(`${T('rep.cal.expense', 'Expense')}: <b>${money(d.expense)}</b>`);
    return h;
  }
  function monthTotals(single) {
    if (!DET) { document.getElementById('calTotals').innerHTML = ''; return; }
    const tot = { listed: {}, unlisted: {}, items: {}, pob: 0, refused: 0, expense: 0, days: 0 };
    Object.values(DET).forEach(d => { tot.days++; tot.pob += Number(d.pob); tot.refused += d.refused; tot.expense += Number(d.expense);
      Object.entries(d.listed).forEach(([t, n]) => tot.listed[t] = (tot.listed[t] || 0) + n); Object.entries(d.unlisted).forEach(([t, n]) => tot.unlisted[t] = (tot.unlisted[t] || 0) + n);
      Object.entries(d.items).forEach(([t, m]) => tot.items[t] = (tot.items[t] || 0) + Number(m.qty)); });
    const k = (l, v, c) => `<div class="rp-kpi ${c || ''}"><small>${l}</small><b>${v}</b></div>`;
    document.getElementById('calTotals').innerHTML = `<div class="small fw-semibold mb-1">${T('rep.cal.monthTotal', 'Month total')} - ${esc(single.name)} (${esc(single.empCode)})</div><div class="rp-kpis">`
      + Object.entries(tot.listed).map(([t, n]) => k(esc(t) + ' ' + T('rep.cal.calls', 'Calls').toLowerCase(), n)).join('')
      + Object.entries(tot.unlisted).map(([t, n]) => k(T('rep.cal.unlisted', 'Unlisted') + ' ' + esc(t), n, 'warn')).join('')
      + k(T('rep.cal.refused', 'Refused'), tot.refused, 'mut') + k(T('rep.cal.pob', 'POB'), money(tot.pob), 'ok')
      + Object.entries(tot.items).map(([t, q]) => k(esc(t), q)).join('') + k(T('rep.cal.expense', 'Expense'), money(tot.expense), 'mut') + '</div>';
  }
  function renderCalendar(single) {
    const first = new Date(DATA.from + 'T00:00:00'), y = first.getFullYear(), m = first.getMonth(), dim = new Date(y, m + 1, 0).getDate();
    const lead = first.getDay();   // Sunday first
    const today = new Date(); const todayS = today.getFullYear() + '-' + pad(today.getMonth() + 1) + '-' + pad(today.getDate());
    const names = [...Array(7)].map((_, i) => new Date(2024, 0, 7 + i).toLocaleDateString(loc(), { weekday: 'short' }));   // 7 Jan 2024 is a Sunday
    let h = names.map(n => `<div class="h">${esc(n)}</div>`).join('');
    for (let i = 0; i < lead; i++) h += '<div class="c out"></div>';
    for (let d = 1; d <= dim; d++) {
      const date = y + '-' + pad(m + 1) + '-' + pad(d), j = DATA.dates.indexOf(date), cells = j < 0 ? [] : DATA.employees.map(e => e.cells[j]);
      const t = tally(cells), cls = ['c', 'clk', date === todayS ? 'today' : ''];
      let body = '';
      if (single) {   // one employee: the day itself
        const c = single.cells[j];
        if (c) {
          const lbl = { P: T('rep.present', 'Present'), HD: T('rep.att.halfDay', 'Half day'), A: c.lk ? T('rep.cal.locked', 'Locked') : T('rep.absent', 'Absent'), L: T('rep.leave', 'Leave'), HL: T('rep.holiday', 'Holiday'), WK: T('rep.weeklyOff', 'Weekly off') }[c.s];
          cls.push(c.s === 'P' ? 'me-p' : c.s === 'HD' ? 'me-hd' : c.s === 'A' && c.lk ? 'me-k' : c.s === 'A' ? 'me-a' : c.s === 'L' ? 'me-l' : 'me-o');
          body = `<div><b>${esc(lbl)}${c.s === 'A' && c.id ? '*' : ''}</b></div>${c.n || c.t ? `<div>${esc(c.n || c.t)}</div>` : ''}${c.in ? `<div>${esc(c.in)} - ${esc(c.out || '')}${c.h ? ' (' + esc(c.h) + ')' : ''}</div>` : ''}${c.c != null && !DET ? `<div>${c.c} ${T('rep.calls', 'Calls').toLowerCase()}</div>` : ''}${detailLines(date)}`;
        } else cls.push('blank');
      } else if (t.n) {
        const chip = (k, n, c) => n ? `<span class="chip ${c}">${k} ${n}</span>` : '';
        body = t.o === t.n ? `<div class="off">${T('rep.cal.offDay', 'Holiday / off')}</div>` : chip('P', t.p, 'p') + chip(T('rep.att.hd', 'HD'), t.hd, 'hd') + chip('A', t.a, 'a') + chip(T('rep.cal.locked', 'Locked'), t.k, 'k') + chip('L', t.l, 'l') + (t.o ? chip(T('rep.att.hl', 'HL'), t.o, 'o') : '');
      } else cls.push('blank');
      h += `<div class="${cls.filter(Boolean).join(' ')}" ${j >= 0 && (single ? single.cells[j] : t.n) ? `onclick="dayOpen('${date}')"` : ''}><div class="d">${d}</div>${body}</div>`;
    }
    document.getElementById('calWrap').innerHTML = `<div class="cal">${h}</div>`;
    document.getElementById('calNote').textContent = T('rep.cal.note', 'P present · HD half day · A absent · L leave · HL holiday / weekly off. Days before the joining date, after the last working day and in the future are not counted.');
  }

  // ------------------------------------------------------------------ the summary of the month, grouped by State / HQ / Designation / Employee
  function groups() {
    const m = new Map();
    GDATA.employees.forEach(e => {
      const k = gOf(e); let g = m.get(k);
      if (!g) m.set(k, g = { key: k, emps: [], present: 0, half: 0, leave: 0, off: 0, absent: 0, absentFull: 0, calls: 0, workMin: 0 });
      g.emps.push(e); const s = e.sum; g.present += s.present; g.half += s.half; g.leave += s.leave; g.off += s.off; g.absent += s.absent; g.absentFull += s.absentFull; g.calls += s.calls; g.workMin += s.workMin;
    });
    return [...m.values()].sort((a, b) => String(a.key).localeCompare(String(b.key)));
  }
  const pct = (g) => { const w = g.present + g.half + g.absentFull; return w ? Math.round((g.present + g.half * 0.5) * 100 / w) : null; };
  function renderGroup() {
    const G = groups(), wrap = document.getElementById('calGroup'), meta = GROUPS[VIEW];
    document.getElementById('grpTitle').textContent = T(meta[0], meta[1]) + ' - ' + T('rep.cal.summary', 'month summary');
    if (window.jQuery && $.fn.DataTable.isDataTable('#grpT')) $('#grpT').DataTable().destroy();
    if (!G.length) { wrap.innerHTML = `<div class="text-center text-muted py-4">${T('rep.nothing', 'Nothing found for these filters')}</div>`; return; }
    wrap.innerHTML = `<table id="grpT" data-screen-key="CALENDAR_SUMMARY" class="table table-striped table-bordered nowrap" style="width:100%"><thead><tr><th data-i18n="common.sno">S.No</th><th data-field="group">${esc(T(meta[3], meta[4]))}</th><th data-field="employees" class="text-end" data-i18n="entity.employees">Employees</th>
      <th data-field="present" class="text-end" data-i18n="rep.present">Present</th><th data-field="half" class="text-end" data-i18n="rep.att.half">Half days</th><th data-field="leave" class="text-end" data-i18n="rep.leave">Leave</th><th data-field="off" class="text-end" data-i18n="rep.holidayOff">Holiday / off</th><th data-field="absent" class="text-end" data-i18n="rep.absent">Absent</th>
      <th data-field="calls" class="text-end" data-i18n="rep.calls">Calls</th><th data-field="hours" class="text-end" data-i18n="rep.workHours">Working hours</th><th data-field="pct" class="text-end" data-i18n="rep.att.pct">Attendance %</th></tr></thead><tbody>
      ${G.map((g, i) => { const p = pct(g); return `<tr class="rp-click" onclick="drill(${i})"><td>${i + 1}</td><td><b>${esc(g.key)}</b></td><td class="num">${g.emps.length}</td><td class="num">${nz(g.present)}</td><td class="num">${nz(g.half)}</td><td class="num">${nz(g.leave)}</td><td class="num">${nz(g.off)}</td><td class="num ${g.absent ? 'rp-bad' : ''}">${nz(g.absent)}</td><td class="num">${nz(g.calls)}</td><td class="num" data-order="${g.workMin}">${hrs(g.workMin)}</td><td class="num" data-order="${p == null ? -1 : p}">${p == null ? '' : p + '%'}</td></tr>`; }).join('')}
      </tbody></table>`;
    window.__G = G; sfaDataTable('#grpT', { order: [[1, 'asc']] });
  }
  // click a row: that State / HQ / Designation / Employee becomes the filter
  function drill(i) {
    const g = (window.__G || [])[i]; if (!g || !FIL) return;
    const pick = (list, name, field, sel) => { const m = list.find(x => String(x.name) === name || String(x.name).startsWith(name + ' (')); if (m) document.getElementById(sel).value = m.id; return !!m; };
    let ok = false;
    if (VIEW === 'state') ok = pick(FIL.states, g.key, 'name', 'f_state');
    else if (VIEW === 'hq') ok = pick(FIL.hqs, g.key, 'name', 'f_hq');
    else if (VIEW === 'des') ok = pick(FIL.designations, g.key, 'name', 'f_des');
    else { rpCascade(); const e = FIL.employees.find(x => String(x.name).endsWith('(' + g.emps[0].empCode + ')')); if (e) { document.getElementById('f_emp').value = e.id; ok = true; } }
    if (ok) { rpCascade(); if (VIEW === 'emp') { const e = FIL.employees.find(x => String(x.name).endsWith('(' + g.emps[0].empCode + ')')); if (e) document.getElementById('f_emp').value = e.id; } rpSearch(); }
  }

  // ------------------------------------------------------------------ a day: the groups (or, employee wise, the employees) with their numbers
  function dayOpen(date) {
    const j = DATA.dates.indexOf(date); if (j < 0) return;
    const title = new Date(date + 'T00:00:00').toLocaleDateString(loc(), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    document.getElementById('dayTitle').innerHTML = `<i class="bi bi-calendar-event"></i> ${esc(title)}`;
    const meta = GROUPS[VIEW];
    const wrap = document.getElementById('dayBody');
    if (true) {   // the calendar is of one employee: his day
      const lbl = { P: T('rep.present', 'Present'), HD: T('rep.att.halfDay', 'Half day'), A: T('rep.absent', 'Absent'), L: T('rep.leave', 'Leave'), HL: T('rep.holiday', 'Holiday'), WK: T('rep.weeklyOff', 'Weekly off') };
      const rows = DATA.employees.map(e => ({ e, c: e.cells[j] })).filter(x => x.c);
      wrap.innerHTML = `<table id="dayT" class="table table-striped table-bordered nowrap" style="width:100%"><thead><tr><th>${esc(T('entity.employee', 'Employee'))}</th><th>${esc(T('common.code', 'Code'))}</th><th>${esc(T('entity.hq', 'HQ'))}</th><th>${esc(T('common.status', 'Status'))}</th><th>${esc(T('rep.d.item', 'Type'))}</th><th>${esc(T('rep.dayStart', 'Day start'))}</th><th>${esc(T('rep.dayEnd', 'Day end'))}</th><th class="text-end">${esc(T('rep.calls', 'Calls'))}</th><th>${esc(T('rep.workHours', 'Working hours'))}</th></tr></thead><tbody>
        ${rows.map(({ e, c }) => `<tr class="${c.id ? 'rp-click' : ''}" ${c.id ? `onclick="location.href='${Session.pageUrl('report/dcr-day.html?id=' + c.id)}'"` : ''}><td><b>${esc(e.name)}</b></td><td>${esc(e.empCode)}</td><td>${esc(e.hq)}</td><td><span class="chip ${({ P: 'p', HD: 'hd', A: c.lk ? 'k' : 'a', L: 'l' })[c.s] || 'o'}">${esc(c.s === 'A' && c.lk ? T('rep.cal.locked', 'Locked') : lbl[c.s])}${c.s === 'A' && c.id ? '*' : ''}</span></td><td>${esc(c.n || c.t || '')}</td><td>${esc(c.in || '')}</td><td>${esc(c.out || '')}</td><td class="num">${c.c != null ? c.c : ''}</td><td>${esc(c.h || '')}</td></tr>`).join('')}</tbody></table>`;
    } else {
      const m = new Map();
      DATA.employees.forEach(e => { const c = e.cells[j]; if (!c) return; const k = gOf(e); let g = m.get(k); if (!g) m.set(k, g = { key: k, n: 0, p: 0, hd: 0, l: 0, o: 0, a: 0, k: 0, calls: 0 }); g.n++; if (c.s === 'P') g.p++; else if (c.s === 'HD') g.hd++; else if (c.s === 'A' && c.lk) g.k++; else if (c.s === 'A') g.a++; else if (c.s === 'L') g.l++; else g.o++; if (c.c) g.calls += Number(c.c); });
      const rows = [...m.values()].sort((a, b) => String(a.key).localeCompare(String(b.key)));
      wrap.innerHTML = `<table id="dayT" data-screen-key="CALENDAR_DAY" class="table table-striped table-bordered nowrap" style="width:100%"><thead><tr><th data-field="group">${esc(T(meta[3], meta[4]))}</th><th data-field="employees" class="text-end">${esc(T('entity.employees', 'Employees'))}</th><th data-field="present" class="text-end">${esc(T('rep.present', 'Present'))}</th><th data-field="half" class="text-end">${esc(T('rep.att.half', 'Half days'))}</th><th data-field="leave" class="text-end">${esc(T('rep.leave', 'Leave'))}</th><th data-field="off" class="text-end">${esc(T('rep.holidayOff', 'Holiday / off'))}</th><th data-field="absent" class="text-end">${esc(T('rep.absent', 'Absent'))}</th><th data-field="calls" class="text-end">${esc(T('rep.calls', 'Calls'))}</th></tr></thead><tbody>
        ${rows.map(g => `<tr><td><b>${esc(g.key)}</b></td><td class="num">${g.n}</td><td class="num">${nz(g.p)}</td><td class="num">${nz(g.hd)}</td><td class="num">${nz(g.l)}</td><td class="num">${nz(g.o)}</td><td class="num ${g.a ? 'rp-bad' : ''}">${nz(g.a)}</td><td class="num">${nz(g.calls)}</td></tr>`).join('')}</tbody></table>`;
    }
    const modal = bootstrap.Modal.getOrCreateInstance('#dayModal');
    document.getElementById('dayModal').addEventListener('shown.bs.modal', function once() { document.getElementById('dayModal').removeEventListener('shown.bs.modal', once); if ($.fn.DataTable.isDataTable('#dayT')) $('#dayT').DataTable().destroy(); sfaDataTable('#dayT', { order: [[0, 'asc']], scrollY: '50vh' }); });
    modal.show();
  }
</script>
</body>
