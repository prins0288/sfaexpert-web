<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; DCR Report</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="dcrreport" data-title="DCR Report"></div>

<template id="pageContent">
  <div class="card">
    <div class="card-header"><i class="bi bi-funnel"></i> Filters
      <div class="card-tools">
        <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#activityModal">
          <i class="bi bi-clock-history"></i> Activity Summary</button>
      </div>
    </div>
    <div class="card-body">
      <!-- Division always comes first, on its own row, above every other filter. -->
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Division</label>
          <select class="form-select" id="f_division"><option value="">All Divisions</option></select>
        </div>
      </div>
      <hr class="my-3" />
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Route</label>
          <select class="form-select" id="f_route"><option value="">All Routes</option></select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Area</label>
          <select class="form-select" id="f_area"><option value="">All Areas</option></select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Employee</label>
          <select class="form-select" id="f_employee"><option value="">All Employees</option></select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Work Type</label>
          <select class="form-select" id="f_workType">
            <option value="">All</option>
            <option value="Working">Working</option>
            <option value="Leave">Leave</option>
            <option value="Holiday">Holiday</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Quick Range</label>
          <select class="form-select" id="f_quickRange" onchange="dcrApplyQuickRange()">
            <option value="CUSTOM_RANGE">Custom Range</option>
            <option value="LAST_7_DAYS">Last 7 Days</option>
            <option value="LAST_1_MONTH">Last 1 Month</option>
            <option value="LAST_6_MONTHS">Last 6 Months</option>
            <option value="LAST_1_YEAR">Last 1 Year</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">From Date</label>
          <input type="text" class="form-control sfa-date" id="f_from" />
        </div>
        <div class="col-md-3">
          <label class="form-label">To Date</label>
          <input type="text" class="form-control sfa-date" id="f_to" />
        </div>
        <div class="col-md-6 d-flex align-items-end gap-2">
          <button class="btn btn-primary" onclick="dcrSearch()"><i class="bi bi-search"></i> Search</button>
          <button class="btn btn-outline-secondary" onclick="dcrReset()"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card mt-3">
    <div class="card-header"><i class="bi bi-clipboard-data"></i> DCR Entries</div>
    <div class="card-body">
      <div class="table-responsive">
        <table id="dcrTable" data-screen-key="DCR_REPORT" class="table table-striped table-bordered nowrap" style="width:100%">
          <thead><tr>
            <th>S.No</th><th data-field="date">Date</th><th data-field="employee">Employee</th><th data-field="division">Division</th><th data-field="route">Route</th><th data-field="area">Area</th>
            <th data-field="client">Client</th><th data-field="clientType">Client Type</th><th data-field="workType">Work Type</th><th data-field="timeIn">Time In</th><th data-field="timeOut">Time Out</th><th data-field="remarks">Remarks</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Your own recent searches (never anyone else's) — click Load to re-select
       those exact filters and re-run the search live, one click. -->
  <div class="modal fade" id="activityModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
    <div class="modal-content">
      <div class="modal-header sfa-modal"><h5 class="modal-title"><i class="bi bi-clock-history"></i> Activity Summary</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="activityList"></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button></div>
    </div>
  </div></div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/activity.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let DT = null;
  const REPORT_KEY = 'dcrreport';
  const REPORT_LABEL = 'DCR Report';

  // Nepal clients store their DCR date as free text (Bikram Sambat calendar) in
  // dcrDateNp, since it isn't a Gregorian date; every other client uses the
  // real dcrDate column. The report shows whichever one applies per row.
  function displayDate(r) {
    if (r.countryName === 'Nepal') return SFA.esc(r.dcrDateNp || '');
    return SFA.esc(Settings.formatDate(r.dcrDate));
  }
  const hhmm = (t) => (t ? SFA.esc(t.substring(0, 5)) : '');

  function fillSelect(id, items, placeholder) {
    const sel = document.getElementById(id);
    sel.innerHTML = `<option value="">${placeholder}</option>` +
      items.map(i => `<option value="${i.oid}">${SFA.esc(i.label)}</option>`).join('');
  }

  let ACTIVITY_MODAL = null;

  window.pageInit = async function () {
    ACTIVITY_MODAL = new bootstrap.Modal('#activityModal');
    // load the list fresh every time the modal opens, not just once on page load
    document.getElementById('activityModal').addEventListener('shown.bs.modal', loadActivity);
    try {
      const lk = await Api.get(API.lookups);
      fillSelect('f_division', lk.divisions || [], 'All Divisions');
      fillSelect('f_route', lk.routes || [], 'All Routes');
      fillSelect('f_area', lk.areas || [], 'All Areas');
      fillSelect('f_employee', lk.employees || [], 'All Employees');
      await dcrSearch();
    } catch (e) { SFA.toast(e.message, false); }
  };

  async function dcrSearch() {
    const v = id => { const x = document.getElementById(id).value; return x === '' ? undefined : x; };
    try {
      const rows = await Api.get(API.report.dcr, { query: {
        divisionOid: v('f_division'),
        routeOid: v('f_route'),
        areaOid: v('f_area'),
        empId: v('f_employee'),
        fromDate: v('f_from'),
        toDate: v('f_to'),
      } });
      const filtered = v('f_workType') ? rows.filter(r => r.workType === v('f_workType')) : rows;
      renderRows(filtered);
      // record this search (best-effort) — shows up next time the Activity Summary modal opens
      Activity.record(REPORT_KEY, REPORT_LABEL, currentFilters(), filtersSummary());
    } catch (e) { SFA.toast(e.message, false); }
  }

  // ---- Activity Summary: capture / re-apply this report's own filter shape ----
  function currentFilters() {
    return {
      divisionOid: document.getElementById('f_division').value,
      routeOid: document.getElementById('f_route').value,
      areaOid: document.getElementById('f_area').value,
      empId: document.getElementById('f_employee').value,
      workType: document.getElementById('f_workType').value,
      quickRange: document.getElementById('f_quickRange').value,
      fromDate: document.getElementById('f_from').value,
      toDate: document.getElementById('f_to').value,
    };
  }

  function filtersSummary() {
    const label = id => { const el = document.getElementById(id); return el.selectedIndex >= 0 ? el.options[el.selectedIndex].text : ''; };
    const parts = [];
    if (document.getElementById('f_division').value) parts.push('Division: ' + label('f_division'));
    if (document.getElementById('f_route').value) parts.push('Route: ' + label('f_route'));
    if (document.getElementById('f_area').value) parts.push('Area: ' + label('f_area'));
    if (document.getElementById('f_employee').value) parts.push('Employee: ' + label('f_employee'));
    if (document.getElementById('f_workType').value) parts.push('Work: ' + label('f_workType'));
    const from = document.getElementById('f_from').value, to = document.getElementById('f_to').value;
    if (from || to) parts.push((from ? Settings.formatDate(from) : '…') + ' to ' + (to ? Settings.formatDate(to) : '…'));
    return parts.length ? parts.join(' · ') : 'All records';
  }

  // Called when the user clicks "Load" on a past activity — re-selects those
  // exact filters AND re-runs the search live (dcrSearch), one click.
  function applyActivityFilters(f) {
    document.getElementById('f_division').value = f.divisionOid || '';
    document.getElementById('f_route').value = f.routeOid || '';
    document.getElementById('f_area').value = f.areaOid || '';
    document.getElementById('f_employee').value = f.empId || '';
    document.getElementById('f_workType').value = f.workType || '';
    document.getElementById('f_quickRange').value = f.quickRange || '';
    sfaSetDate('f_from', f.fromDate || '');
    sfaSetDate('f_to', f.toDate || '');
    dcrSearch();
    if (ACTIVITY_MODAL) ACTIVITY_MODAL.hide();
  }

  function loadActivity() {
    Activity.renderInto('activityList', REPORT_KEY, applyActivityFilters);
  }

  // Quick Range -> fills From/To (still plain editable Flatpickr fields) and searches.
  // "Custom Range" / blank is a no-op: it just leaves whatever From/To already hold.
  function dcrApplyQuickRange() {
    const v = document.getElementById('f_quickRange').value;
    if (!v || v === 'CUSTOM_RANGE') return;
    const iso = (d) => d.toISOString().slice(0, 10);
    const to = new Date();
    const from = new Date();
    if (v === 'LAST_7_DAYS') from.setDate(from.getDate() - 7);
    else if (v === 'LAST_1_MONTH') from.setMonth(from.getMonth() - 1);
    else if (v === 'LAST_6_MONTHS') from.setMonth(from.getMonth() - 6);
    else if (v === 'LAST_1_YEAR') from.setFullYear(from.getFullYear() - 1);
    sfaSetDate('f_from', iso(from));
    sfaSetDate('f_to', iso(to));
    dcrSearch();
  }

  function dcrReset() {
    ['f_division', 'f_route', 'f_area', 'f_employee', 'f_workType', 'f_quickRange']
      .forEach(id => document.getElementById(id).value = '');
    ['f_from', 'f_to'].forEach(id => sfaSetDate(id, ''));
    dcrSearch();
  }

  function renderRows(rows) {
    if (DT) { DT.destroy(); }
    document.querySelector('#dcrTable tbody').innerHTML = rows.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${displayDate(r)}</td>
        <td>${SFA.esc(r.empName)}</td>
        <td>${SFA.esc(r.divisionName)}</td>
        <td>${SFA.esc(r.routeName)}</td>
        <td>${SFA.esc(r.areaName)}</td>
        <td>${SFA.esc(r.clientName)}</td>
        <td>${SFA.esc(r.clientTypeName)}</td>
        <td>${SFA.esc(r.workType)}</td>
        <td>${hhmm(r.timeIn)}</td>
        <td>${hhmm(r.timeOut)}</td>
        <td>${SFA.esc(r.remarks)}</td>
      </tr>`).join('');
    DT = sfaDataTable('#dcrTable');
  }
</script>
</body>
</html>
