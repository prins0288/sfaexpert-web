<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; DCR Report</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
<style>
  /* enterprise report look: a card, a compact filter strip, KPI strip, tabs, then the standard DataTable (Excel / Column Settings / Filter / entries / search) */
  .rp-kpis { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 .6rem; }
  .rp-kpi { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-left: 3px solid var(--bs-primary); border-radius: .4rem; padding: .35rem .8rem; min-width: 7.5rem; flex: 1 1 7.5rem; }
  .rp-kpi small { color: var(--bs-secondary-color); display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; }
  .rp-kpi b { font-size: 1.1rem; line-height: 1.2; }
  .rp-kpi.bad { border-left-color: #dc3545; } .rp-kpi.bad b { color: #b02a37; } .rp-kpi.ok { border-left-color: #198754; } .rp-kpi.warn { border-left-color: #fd7e14; } .rp-kpi.mut { border-left-color: #6c757d; }
  .rp-tag { display: inline-block; font-size: .7rem; font-weight: 600; border-radius: .3rem; padding: .08rem .45rem; white-space: nowrap; }
  .rp-tag.present { background: var(--bs-success-bg-subtle); color: var(--bs-success-text-emphasis); } .rp-tag.absent { background: var(--bs-danger-bg-subtle); color: var(--bs-danger-text-emphasis); }
  .rp-tag.leave { background: var(--bs-info-bg-subtle); color: var(--bs-info-text-emphasis); } .rp-tag.off { background: var(--bs-secondary-bg); color: var(--bs-secondary-color); }
  .rp-tag.warn { background: var(--bs-warning-bg-subtle); color: var(--bs-warning-text-emphasis); }
  .rp-filters .form-label { font-size: .72rem; font-weight: 600; color: var(--bs-secondary-color); margin-bottom: .1rem; }
  #rpTableWrap table.dataTable td, #rpTableWrap table.dataTable th { font-size: .82rem; padding: .32rem .55rem; vertical-align: middle; }
  #rpTableWrap tbody tr.rp-click { cursor: pointer; }
  #rpTableWrap td.num { text-align: right; font-variant-numeric: tabular-nums; } .rp-zero { color: var(--bs-secondary-color); opacity: .55; } .rp-bad { color: #b02a37; font-weight: 700; }
  .rp-tabs .nav-link { padding: .3rem .8rem; font-size: .85rem; } .rp-chip { border: 1px solid var(--bs-border-color); background: var(--bs-body-bg); border-radius: 999px; padding: .1rem .7rem; font-size: .78rem; } .rp-chip.on { background: var(--bs-primary); color: #fff; border-color: var(--bs-primary); }
  .rp-day th { font-size: .7rem; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; background: var(--bs-tertiary-bg); } .rp-day td { font-size: .82rem; vertical-align: middle; }
  .rp-day tr.clk { cursor: pointer; } .rp-day tr.clk:hover td { background: var(--bs-tertiary-bg); }
</style>

<body>
<div id="app" data-page="dcrreport" data-title="DCR Report"></div>
<template id="pageContent">
<div class="card mb-2">
  <div class="card-header d-flex align-items-center flex-wrap gap-2"><span><i class="bi bi-journal-check"></i> <span data-i18n="report.dcr.title">DCR Report</span></span><small class="text-muted" id="rpSub"></small>
    <div class="card-tools ms-auto d-flex gap-2 flex-wrap">
      <button class="btn btn-sm sfa-btn-outline" id="rpFBtn" onclick="rpFToggle()"><i class="bi bi-sliders"></i> <span data-i18n="rep.filters">Filters</span></button>
      <button class="btn btn-sm sfa-btn-outline" data-bs-toggle="modal" data-bs-target="#activityModal"><i class="bi bi-clock-history"></i> <span data-i18n="rep.recent">Recent</span></button>
      <button class="btn btn-sm btn-accent" onclick="rpExport()" title="Full report with every column, from the server"><i class="bi bi-file-earmark-excel"></i> <span data-i18n="rep.fullExcel">Full Excel</span></button></div></div>
  <div class="card-body rp-filters" id="rpFBody">
    <div class="row g-2 align-items-end">
      <div class="col-auto"><div class="btn-group btn-group-sm" id="rpMode"><button type="button" class="btn btn-primary" data-m="month" onclick="rpMode('month')" data-i18n="rep.month">Month</button><button type="button" class="btn btn-outline-primary" data-m="range" onclick="rpMode('range')" data-i18n="rep.fromTo">From - To</button></div></div>
      <div class="col-6 col-md-2" id="rpMonthWrap"><label class="form-label" data-i18n="rep.month">Month</label><input type="month" class="form-control form-control-sm" id="f_month"></div>
      <div class="col-6 col-md-2 d-none rp-rng"><label class="form-label" data-i18n="common.from">From</label><input type="date" class="form-control form-control-sm" id="f_from"></div>
      <div class="col-6 col-md-2 d-none rp-rng"><label class="form-label" data-i18n="common.to">To</label><input type="date" class="form-control form-control-sm" id="f_to"></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="entity.state">State</label><select class="form-select form-select-sm" id="f_state" onchange="rpCascade()"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="entity.hq">HQ</label><select class="form-select form-select-sm" id="f_hq" onchange="rpCascade()"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="entity.designation">Designation</label><select class="form-select form-select-sm" id="f_des" onchange="rpCascade()"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="entity.employee">Employee</label><select class="form-select form-select-sm" id="f_emp"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="rep.dcrStatus">DCR status</label><select class="form-select form-select-sm" id="f_status"><option value="" data-i18n="common.all">All</option><option value="0" data-i18n="rep.draft">Draft</option><option value="1" data-i18n="rep.submitted">Submitted</option><option value="2" data-i18n="rep.approved">Approved</option><option value="3" data-i18n="rep.rejected">Rejected</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="rep.submittedFrom">Submitted from</label><select class="form-select form-select-sm" id="f_source"><option value="" data-i18n="rep.webApp">Web + App</option><option value="2" data-i18n="rep.web">Web</option><option value="1" data-i18n="rep.app">App</option></select></div>
      <div class="col-auto"><div class="form-check form-switch mb-1"><input class="form-check-input" type="checkbox" id="f_absent" checked><label class="form-check-label small" for="f_absent" data-i18n="rep.showAbsent">Show absent days</label></div></div>
      <div class="col-auto ms-md-auto d-flex gap-2"><button class="btn btn-sm btn-light" onclick="rpReset()" data-i18n="common.reset">Reset</button><button class="btn btn-sm btn-primary" onclick="rpSearch()"><i class="bi bi-search"></i> <span data-i18n="rep.show">Show</span></button></div>
    </div>
  </div>
</div>

<div class="rp-kpis" id="rpKpis"></div>

<div class="card">
  <div class="card-header d-flex align-items-center flex-wrap gap-2">
    <ul class="nav nav-pills rp-tabs" id="rpTabs"><li class="nav-item"><button class="nav-link active" data-v="emp" onclick="rpView('emp')"><i class="bi bi-people"></i> <span data-i18n="rep.empSummary">Employee summary</span></button></li><li class="nav-item"><button class="nav-link" data-v="day" onclick="rpView('day')"><i class="bi bi-calendar3"></i> <span data-i18n="rep.dateWise">Date wise</span></button></li></ul>
    <div class="d-flex gap-1 flex-wrap ms-2 d-none" id="rpChips"></div>
    <span class="small text-muted ms-auto" id="rpHint"></span>
  </div>
  <div class="card-body"><div id="rpTableWrap"></div></div>
</div>

<!-- employee details: every day of the period -->
<div class="modal fade" id="empModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-lg-down"><div class="modal-content">
  <div class="modal-header sfa-modal"><h5 class="modal-title" id="empModalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="empModalBody"></div>
  <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="common.close">Close</button></div></div></div></div>

<div class="modal fade" id="activityModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down"><div class="modal-content">
  <div class="modal-header sfa-modal"><h5 class="modal-title"><i class="bi bi-clock-history"></i> <span data-i18n="rep.recentSearches">Recent searches</span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><div id="activityList"></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="common.close">Close</button></div></div></div></div>
</template>

<script>
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);   // text of the chosen language (lang_*.properties + the tenant's label_master); the English given here shows when a key has no translation
  const REPORT_KEY = 'dcrreport', REPORT_LABEL = 'DCR Report', EP = API.report.dcr;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  const pad = (n) => String(n).padStart(2, '0');
  const money = (v) => Number(v || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  const hm = (t) => t ? String(t).slice(0, 5) : '';
  const dowName = (d) => new Date(d + 'T00:00:00').toLocaleDateString(window.I18n && I18n.lang === 'hi' ? 'hi-IN' : 'en-GB', { weekday: 'short' });
  let LASTLANG = window.I18n ? I18n.lang : 'en';
  const fmt = (d) => { const x = new Date(d + 'T00:00:00'); return pad(x.getDate()) + '-' + pad(x.getMonth() + 1) + '-' + x.getFullYear(); };
  let FIL = null, DATA = null, MODE = 'month', CHIP = 'all', VIEW = 'emp', ACT = null;

  // language switch: redraw the JS-built parts (only when the language really changed - the table calls I18n.apply itself)
  if (window.I18n) I18n.onChange(() => { if (I18n.lang !== LASTLANG) { LASTLANG = I18n.lang; if (DATA) { kpis(); rpRender(); } } });
  window.pageInit = async function () {
    ACT = new bootstrap.Modal('#activityModal');
    document.getElementById('activityModal').addEventListener('shown.bs.modal', () => Activity.renderInto('activityList', REPORT_KEY, applyActivity));
    const d = new Date(); document.getElementById('f_month').value = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    try { FIL = await Api.get(EP + '/filters'); fillFilters(); await rpSearch(); } catch (e) { SFA.toast(e.message, false); }
  };
  const opt = (list, first, sel) => `<option value="">${first}</option>` + list.map(x => `<option value="${esc(x.id)}" ${String(x.id) === String(sel) ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  function fillFilters() {
    const v = (id) => document.getElementById(id).value;
    document.getElementById('f_state').innerHTML = opt(FIL.states, 'All', v('f_state'));
    document.getElementById('f_hq').innerHTML = opt(FIL.hqs, 'All', v('f_hq'));
    document.getElementById('f_des').innerHTML = opt(FIL.designations, 'All', v('f_des'));
    rpCascade();
  }
  // the employee list follows the state / HQ / designation chosen
  function rpCascade() {
    const v = (id) => document.getElementById(id).value, sel = v('f_emp');
    const list = FIL.employees.filter(e => (!v('f_state') || String(e.stateId) === v('f_state')) && (!v('f_hq') || String(e.hqId) === v('f_hq')) && (!v('f_des') || String(e.designationId) === v('f_des')));
    document.getElementById('f_emp').innerHTML = opt(list, 'All', sel);
  }
  function rpMode(m) {
    MODE = m;
    document.querySelectorAll('#rpMode button').forEach(b => { const on = b.dataset.m === m; b.classList.toggle('btn-primary', on); b.classList.toggle('btn-outline-primary', !on); });
    document.getElementById('rpMonthWrap').classList.toggle('d-none', m !== 'month');
    document.querySelectorAll('.rp-rng').forEach(e => e.classList.toggle('d-none', m !== 'range'));
  }
  function query() {
    const v = (id) => { const x = document.getElementById(id).value; return x === '' ? undefined : x; };
    const q = { stateId: v('f_state'), hqId: v('f_hq'), designationId: v('f_des'), empId: v('f_emp'), status: v('f_status'), source: v('f_source'), absent: document.getElementById('f_absent').checked };
    if (MODE === 'month') q.month = v('f_month'); else { q.from = v('f_from'); q.to = v('f_to'); }
    return q;
  }
  async function rpSearch() {
    try {
      DATA = await Api.get(EP + '/summary', { query: query() }); CHIP = 'all';
      document.getElementById('rpSub').textContent = fmt(DATA.from) + ' to ' + fmt(DATA.to);
      kpis(); rpRender();
      rpFToggle(true); rpScrollTop();   // report loaded: the filter card folds away and the page goes to the top so the report is what is seen; the Filters button brings it back
      Activity.record(REPORT_KEY, REPORT_LABEL, filterState(), summaryText());
    } catch (e) { SFA.toast(e.message, false); }
  }
  function rpFToggle(close) {
    const b = document.getElementById('rpFBody'), hide = close === true ? true : !b.classList.contains('d-none');
    b.classList.toggle('d-none', hide);
    const btn = document.getElementById('rpFBtn'); if (btn) btn.classList.toggle('active', !hide);
    if (!hide) rpScrollTop();
  }
  // the page scrolls inside the shell's content area, not the window: find that scroller and send it to the top
  function rpScrollTop() {
    let n = document.getElementById('rpFBody');
    while (n && n !== document.body) { const o = getComputedStyle(n).overflowY; if ((o === 'auto' || o === 'scroll') && n.scrollHeight > n.clientHeight) n.scrollTop = 0; n = n.parentElement; }
    window.scrollTo(0, 0);
  }
  function rpReset() { ['f_state', 'f_hq', 'f_des', 'f_emp', 'f_status', 'f_source'].forEach(i => document.getElementById(i).value = ''); document.getElementById('f_absent').checked = true; rpCascade(); rpSearch(); }
  function filterState() { const g = (i) => document.getElementById(i).value; return { mode: MODE, month: g('f_month'), from: g('f_from'), to: g('f_to'), state: g('f_state'), hq: g('f_hq'), des: g('f_des'), emp: g('f_emp'), status: g('f_status'), source: g('f_source'), absent: document.getElementById('f_absent').checked }; }
  function summaryText() { const t = DATA.totals; return fmt(DATA.from) + ' to ' + fmt(DATA.to) + ' · ' + t.employees + ' employees · ' + t.dcrs + ' DCR · ' + t.absent + ' absent'; }
  function applyActivity(f) {
    rpMode(f.mode || 'month'); const set = (i, v) => document.getElementById(i).value = v || '';
    set('f_month', f.month); set('f_from', f.from); set('f_to', f.to); set('f_state', f.state); set('f_hq', f.hq); set('f_des', f.des); rpCascade(); set('f_emp', f.emp); set('f_status', f.status); set('f_source', f.source);
    document.getElementById('f_absent').checked = f.absent !== false; rpSearch(); if (ACT) ACT.hide();
  }
  function rpExport() { const q = query(); const qs = Object.entries(q).filter(([, v]) => v !== undefined && v !== '').map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&'); Api.download(EP + '/export?' + qs, 'DCR-report.xlsx').catch(e => SFA.toast(e.message, false)); }

  function kpis() {
    const t = DATA.totals, k = (l, v, cls) => `<div class="rp-kpi ${cls || ''}"><small>${l}</small><b>${v}</b></div>`;
    const off = DATA.rows.filter(r => r.kind === 'HOLIDAY' || r.kind === 'WEEKLY_OFF' || (r.kind === 'DCR' && (r.workType === 'HOLIDAY' || r.workType === 'WEEKLY_OFF'))).length;
    const leave = DATA.rows.filter(r => r.kind === 'DCR' && r.workType === 'LEAVE').length;
    document.getElementById('rpKpis').innerHTML = k(T('entity.employees', 'Employees'), t.employees) + k(T('rep.dcrDays', 'DCR days'), t.dcrs, 'ok') + k(T('rep.absentDays', 'Absent days'), t.absent, t.absent ? 'bad' : '') + k(T('rep.leaveDays', 'Leave days'), leave, 'warn') + k(T('rep.holidayOff', 'Holiday / off'), off, 'mut') + k(T('rep.calls', 'Calls'), t.calls) + k(T('rep.pob', 'POB'), '\u20b9' + money(t.pob)) + k(T('rep.expense', 'Expense'), '\u20b9' + money(t.expense))
      + k(T('rep.webAppKpi', 'Web / App'), t.web + ' / ' + t.app) + k(T('rep.dsa', 'Draft / Submitted / Approved'), t.draft + ' / ' + t.submitted + ' / ' + t.approved);
  }

  // ---------------------------------------------------------------- the two views
  const WORKOFF = ['HOLIDAY', 'WEEKLY_OFF'];
  // what a row of the API means for the report: PRESENT (a DCR with work) / LEAVE / OFF (holiday, weekly off) / ABSENT / PENDING (today, not started)
  function cls(r) {
    if (r.kind === 'ABSENT') return 'ABSENT';
    if (r.kind === 'HOLIDAY' || r.kind === 'WEEKLY_OFF') return 'OFF';
    if (r.kind === 'NOT_STARTED') return 'PENDING';
    if (WORKOFF.includes(r.workType)) return 'OFF';
    return r.workType === 'LEAVE' ? 'LEAVE' : 'PRESENT';
  }
  const tag = (c, r) => ({ PRESENT: `<span class="rp-tag present">${T('rep.present', 'Present')}</span>`, ABSENT: `<span class="rp-tag absent">${T('rep.absent', 'Absent')}</span>`, LEAVE: `<span class="rp-tag leave">${T('rep.leave', 'Leave')}</span>`,
    OFF: `<span class="rp-tag off">${r.kind === 'HOLIDAY' || r.workType === 'HOLIDAY' ? T('rep.holiday', 'Holiday') : T('rep.weeklyOff', 'Weekly off')}</span>`, PENDING: `<span class="rp-tag warn">${T('rep.notStarted', 'Not started')}</span>` })[c];
  const STNAME = () => [T('rep.draft', 'Draft'), T('rep.submitted', 'Submitted'), T('rep.approved', 'Approved'), T('rep.rejected', 'Rejected')];
  const dcrTag = (r) => r.kind === 'DCR' ? `<span class="rp-tag ${r.status === 2 ? 'present' : r.status === 3 ? 'absent' : r.status === 1 ? 'leave' : 'off'}">${esc(STNAME()[Math.max(0, Math.min(3, r.status))])}</span>` : '';
  const num = (v) => Number(v) ? money(v) : '<span class="rp-zero">0</span>';
  const dayOf = (d) => dowName(d);
  const open_ = (r) => Session.pageUrl('report/dcr-day.html?id=' + r.dcrId);
  const hasDetail = (r) => r.kind === 'DCR' && r.dcrId && cls(r) !== 'OFF';

  function employees() {
    const m = new Map();
    DATA.rows.forEach(r => {
      const k = r.empCode || r.empName; let e = m.get(k);
      if (!e) m.set(k, e = { code: r.empCode, name: r.empName, designation: r.designation, hq: r.hq, state: r.state, present: 0, absent: 0, leave: 0, off: 0, calls: 0, pob: 0, expense: 0, draft: 0, submitted: 0, last: '', rows: [] });
      e.rows.push(r); const c = cls(r);
      if (c === 'ABSENT') e.absent++; else if (c === 'LEAVE') e.leave++; else if (c === 'OFF') e.off++;
      if (c === 'PRESENT') { e.present++; e.calls += Number(r.calls || 0); e.pob += Number(r.pob || 0); e.expense += Number(r.expense || 0); if (r.status === 0) e.draft++; else e.submitted++; if (r.date > e.last) e.last = r.date; }
    });
    return [...m.values()].sort((a, b) => String(a.name).localeCompare(String(b.name)));
  }
  let EMPS = [];
  function rpView(v) {
    VIEW = v;
    document.querySelectorAll('#rpTabs .nav-link').forEach(b => b.classList.toggle('active', b.dataset.v === v));
    document.getElementById('rpChips').classList.toggle('d-none', v !== 'day');
    rpRender();
  }
  function rpRender() {
    if (!DATA) return;
    const wrap = document.getElementById('rpTableWrap');
    if (wrap.querySelector('table') && window.jQuery && $.fn.DataTable.isDataTable('#rpT')) $('#rpT').DataTable().destroy();
    if (!DATA.rows.length) { wrap.innerHTML = `<div class="text-center text-muted py-5"><i class="bi bi-inbox fs-1"></i><div>${T('rep.nothing', 'Nothing found for these filters')}</div></div>`; return; }
    if (VIEW === 'emp') {
      EMPS = employees();
      document.getElementById('rpHint').textContent = T('rep.hintEmp', 'Click an employee to see every day');
      wrap.innerHTML = `<table id="rpT" data-screen-key="DCR_REPORT_EMP" class="table table-striped table-bordered nowrap" style="width:100%"><thead><tr>
        <th data-i18n="common.sno">S.No</th><th data-field="code" data-i18n="common.code">Code</th><th data-field="employee" data-i18n="entity.employee">Employee</th><th data-field="designation" data-i18n="entity.designation">Designation</th><th data-field="hq" data-i18n="entity.hq">HQ</th><th data-field="state" data-i18n="entity.state">State</th><th data-field="present" class="text-end" data-i18n="rep.present">Present</th><th data-field="absent" class="text-end" data-i18n="rep.absent">Absent</th><th data-field="leave" class="text-end" data-i18n="rep.leave">Leave</th><th data-field="off" class="text-end" data-i18n="rep.holidayOff">Holiday / off</th>
        <th data-field="calls" class="text-end" data-i18n="rep.calls">Calls</th><th data-field="pob" class="text-end" data-i18n="rep.pob">POB</th><th data-field="expense" class="text-end" data-i18n="rep.expense">Expense</th><th data-field="submitted" class="text-end" data-i18n="rep.submitted">Submitted</th><th data-field="draft" class="text-end" data-i18n="rep.draft">Draft</th><th data-field="last" data-i18n="rep.lastDcr">Last DCR</th><th class="no-export" data-i18n="rep.details">Details</th></tr></thead><tbody>
        ${EMPS.map((e, i) => `<tr class="rp-click" onclick="empOpen(${i})"><td>${i + 1}</td><td>${esc(e.code)}</td><td><b>${esc(e.name)}</b></td><td>${esc(e.designation)}</td><td>${esc(e.hq)}</td><td>${esc(e.state)}</td>
          <td class="num">${num(e.present)}</td><td class="num ${e.absent ? 'rp-bad' : ''}">${num(e.absent)}</td><td class="num">${num(e.leave)}</td><td class="num">${num(e.off)}</td><td class="num">${num(e.calls)}</td><td class="num">${num(e.pob)}</td><td class="num">${num(e.expense)}</td>
          <td class="num">${num(e.submitted)}</td><td class="num">${num(e.draft)}</td><td data-order="${esc(e.last)}">${e.last ? fmt(e.last) : ''}</td><td class="no-export text-center"><button class="btn btn-sm btn-outline-primary" title="Every day of ${esc(e.name)}" onclick="event.stopPropagation();empOpen(${i})"><i class="bi bi-eye"></i></button></td></tr>`).join('')}
        </tbody></table>`;
      sfaDataTable('#rpT', { order: [[2, 'asc']] });
    } else {
      const rows = shownDays();
      document.getElementById('rpChips').innerHTML = CHIPS().map(([k, n]) => `<button type="button" class="rp-chip ${CHIP === k ? 'on' : ''}" onclick="chip('${k}')">${n}</button>`).join('');
      document.getElementById('rpHint').textContent = T('rep.hintDay', 'Click a DCR row for the complete details');
      wrap.innerHTML = `<table id="rpT" data-screen-key="DCR_REPORT_DAY" class="table table-striped table-bordered nowrap" style="width:100%"><thead><tr>
        <th data-i18n="common.sno">S.No</th><th data-field="date" data-i18n="common.date">Date</th><th data-field="day" data-i18n="rep.day">Day</th><th data-field="code" data-i18n="common.code">Code</th><th data-field="employee" data-i18n="entity.employee">Employee</th><th data-field="designation" data-i18n="entity.designation">Designation</th><th data-field="hq" data-i18n="entity.hq">HQ</th><th data-field="status" data-i18n="common.status">Status</th><th data-field="workType" data-i18n="report.dcr.workType">Work type</th><th data-field="in" data-i18n="rep.in">In</th><th data-field="out" data-i18n="rep.out">Out</th><th data-field="startArea" data-i18n="rep.startArea">Start area</th><th data-field="areaType" data-i18n="rep.areaType">Area type</th>
        <th data-field="calls" class="text-end" data-i18n="rep.calls">Calls</th><th data-field="pob" class="text-end" data-i18n="rep.pob">POB</th><th data-field="expense" class="text-end" data-i18n="rep.expense">Expense</th><th data-field="dcrStatus" data-i18n="rep.dcrStatus">DCR status</th><th data-field="source" data-i18n="rep.source">Source</th><th class="no-export" data-i18n="rep.details">Details</th></tr></thead><tbody>
        ${rows.map((r, i) => { const c = cls(r), d = r.kind === 'DCR';
          return `<tr class="${hasDetail(r) ? 'rp-click' : ''}" ${hasDetail(r) ? `onclick="location.href='${open_(r)}'"` : ''}><td>${i + 1}</td><td data-order="${esc(r.date)}">${fmt(r.date)}</td><td>${dayOf(r.date)}</td><td>${esc(r.empCode)}</td><td><b>${esc(r.empName)}</b></td><td>${esc(r.designation)}</td><td>${esc(r.hq)}</td>
          <td>${tag(c, r)}</td><td>${d ? esc(r.workTypeName) : esc(c === 'OFF' || c === 'PENDING' ? '' : T('rep.noDcr', 'No DCR'))}</td><td>${d ? hm(r.timeIn) : ''}</td><td>${d ? hm(r.timeOut) : ''}</td><td>${d ? esc(r.startArea) : ''}</td><td>${d ? esc(r.areaType) : ''}</td>
          <td class="num">${c === 'PRESENT' ? num(r.calls) : ''}</td><td class="num">${c === 'PRESENT' ? num(r.pob) : ''}</td><td class="num">${c === 'PRESENT' ? num(r.expense) : ''}</td><td>${dcrTag(r)}</td><td>${d ? esc(r.sourceName) : ''}</td>
          <td class="no-export text-center">${hasDetail(r) ? `<a class="btn btn-sm btn-outline-primary" title="Complete details" href="${open_(r)}" onclick="event.stopPropagation()"><i class="bi bi-box-arrow-up-right"></i></a>` : ''}</td></tr>`; }).join('')}
        </tbody></table>`;
      sfaDataTable('#rpT', { order: [[1, 'desc'], [4, 'asc']] });
    }
  }
  const CHIPS = () => [['all', T('common.all', 'All')], ['PRESENT', T('rep.present', 'Present')], ['ABSENT', T('rep.absent', 'Absent')], ['LEAVE', T('rep.leave', 'Leave')], ['OFF', T('rep.holidayOff', 'Holiday / off')]];
  function shownDays() { return DATA.rows.filter(r => CHIP === 'all' || cls(r) === CHIP); }
  function chip(k) { CHIP = k; rpRender(); }

  // employee -> every day of the period; a DCR day opens the complete details
  function empOpen(i) {
    const e = EMPS[i]; if (!e) return;
    document.getElementById('empModalTitle').innerHTML = `<i class="bi bi-person-badge"></i> ${esc(e.name)} <small class="text-muted">${esc(e.code)}</small>`;
    const k = (l, v, c) => `<div class="rp-kpi ${c || ''}"><small>${l}</small><b>${v}</b></div>`;
    const rows = e.rows.slice().sort((a, b) => a.date < b.date ? -1 : 1);
    document.getElementById('empModalBody').innerHTML = `<div class="small text-muted mb-2">${[e.designation, e.hq, e.state].filter(Boolean).map(esc).join(' · ')} · ${fmt(DATA.from)} ${T('rep.period', 'to')} ${fmt(DATA.to)}</div>
      <div class="rp-kpis">${k(T('rep.present', 'Present'), e.present, 'ok')}${k(T('rep.absent', 'Absent'), e.absent, e.absent ? 'bad' : '')}${k(T('rep.leave', 'Leave'), e.leave, 'warn')}${k(T('rep.holidayOff', 'Holiday / off'), e.off, 'mut')}${k(T('rep.calls', 'Calls'), e.calls)}${k(T('rep.pob', 'POB'), '\u20b9' + money(e.pob))}${k(T('rep.expense', 'Expense'), '\u20b9' + money(e.expense))}</div>
      <div class="table-responsive"><table class="table table-sm table-bordered rp-day mb-0"><thead><tr><th>${T('common.date', 'Date')}</th><th>${T('rep.day', 'Day')}</th><th>${T('common.status', 'Status')}</th><th>${T('report.dcr.workType', 'Work type')}</th><th>${T('rep.inOut', 'In - Out')}</th><th>${T('rep.startArea', 'Start area')}</th><th class="text-end">${T('rep.calls', 'Calls')}</th><th class="text-end">${T('rep.pob', 'POB')}</th><th class="text-end">${T('rep.expense', 'Expense')}</th><th>${T('rep.dcrStatus', 'DCR status')}</th><th></th></tr></thead><tbody>
      ${rows.map(r => { const c = cls(r), d = r.kind === 'DCR';
        return `<tr class="${hasDetail(r) ? 'clk' : ''}" ${hasDetail(r) ? `onclick="location.href='${open_(r)}'"` : ''}><td class="text-nowrap">${fmt(r.date)}</td><td>${dayOf(r.date)}</td><td>${tag(c, r)}</td><td>${d ? esc(r.workTypeName) : esc(c === 'ABSENT' ? T('rep.noDcr', 'No DCR') : (c === 'OFF' ? (r.note || '') : ''))}</td>
        <td class="text-nowrap">${d && r.timeIn ? hm(r.timeIn) + ' - ' + hm(r.timeOut) : ''}</td><td>${d ? esc(r.startArea) : ''}</td><td class="text-end">${c === 'PRESENT' ? r.calls : ''}</td><td class="text-end">${c === 'PRESENT' ? money(r.pob) : ''}</td><td class="text-end">${c === 'PRESENT' ? money(r.expense) : ''}</td><td>${dcrTag(r)}</td>
        <td class="text-end">${hasDetail(r) ? '<i class="bi bi-chevron-right text-muted"></i>' : ''}</td></tr>`; }).join('')}
      </tbody></table></div>`;
    bootstrap.Modal.getOrCreateInstance('#empModal').show();
  }
</script>
</body>
</html>
