<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; DCR Report</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
<style>
  .rp-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; margin-bottom: .75rem; }
  @media (min-width: 768px) { .rp-kpis { grid-template-columns: repeat(6, 1fr); } }
  .rp-kpi { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: 1rem; padding: .65rem .8rem; }
  .rp-kpi small { color: var(--bs-secondary-color); display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
  .rp-kpi b { font-size: 1.35rem; line-height: 1.15; }
  .rp-kpi.bad { background: rgba(220, 53, 69, .06); border-color: rgba(220, 53, 69, .25); } .rp-kpi.bad b { color: #a8505a; }
  /* soft, easy-on-the-eye colours for days without a DCR */
  .rp-absent { background: rgba(220, 53, 69, .06) !important; color: #a8505a; }   /* a faint rose, easy on the eyes */
  .rp-off { background: var(--bs-tertiary-bg) !important; color: var(--bs-secondary-color); }
  .rp-tag { display: inline-block; font-size: .72rem; font-weight: 700; border-radius: .45rem; padding: .1rem .5rem; }
  .rp-tag.absent { background: rgba(220, 53, 69, .10); color: #a8505a; } .rp-tag.off { background: var(--bs-secondary-bg); color: var(--bs-secondary-color); }
  .rp-tag.web { background: var(--bs-info-bg-subtle); color: var(--bs-info-text-emphasis); } .rp-tag.app { background: var(--bs-success-bg-subtle); color: var(--bs-success-text-emphasis); }
  .rp-card { border: 1px solid var(--bs-border-color); border-radius: 1rem; padding: .7rem .9rem; margin-bottom: .55rem; background: var(--bs-body-bg); }
  .rp-card.clk { cursor: pointer; } .rp-card.clk:active { background: var(--bs-tertiary-bg); }
  .rp-card .l2 { font-size: .82rem; color: var(--bs-secondary-color); }
  .rp-table { width: 100%; font-size: .88rem; } .rp-table th { position: sticky; top: 0; background: var(--bs-tertiary-bg); font-size: .72rem; text-transform: uppercase; letter-spacing: .03em; padding: .5rem .6rem; white-space: nowrap; }
  .rp-table td { padding: .45rem .6rem; border-top: 1px solid var(--bs-border-color); vertical-align: middle; } .rp-table tr.clk { cursor: pointer; } .rp-table tr.clk:hover td { background: var(--bs-tertiary-bg); }
  .rp-wrap { max-height: 70vh; overflow: auto; border: 1px solid var(--bs-border-color); border-radius: .5rem; }
  @media (max-width: 991.98px) { .rp-desk { display: none; } }
  @media (min-width: 992px) { .rp-mob { display: none; } }
  .rp-filters .form-label { font-size: .75rem; font-weight: 600; color: var(--bs-secondary-color); margin-bottom: .15rem; }
</style>
</head>
<body>
<div id="app" data-page="dcrreport" data-title="DCR Report"></div>
<template id="pageContent">
<div class="ap-app">
  <div class="ap-top"><div><h1 class="ap-title">DCR Report</h1><div class="text-muted small" id="rpSub"></div></div>
    <div class="d-flex gap-2 flex-wrap justify-content-end">
      <button class="ap-btn light sm" data-bs-toggle="modal" data-bs-target="#activityModal"><i class="bi bi-clock-history"></i> Recent</button>
      <button class="ap-btn go sm" onclick="rpExport()"><i class="bi bi-file-earmark-excel"></i> Excel</button></div></div>

  <div class="ap-card rp-filters">
    <div class="d-flex align-items-center d-lg-none" id="rpFHead" onclick="rpFToggle()" style="cursor:pointer"><b class="flex-fill"><i class="bi bi-funnel"></i> Filters</b><span class="small text-muted me-2" id="rpFSum"></span><i class="bi bi-chevron-down" id="rpFIcon"></i></div>
    <div id="rpFBody"><div class="ap-seg mb-2 mt-2 mt-lg-0" id="rpMode"><button class="active" data-m="month" onclick="rpMode('month')">Month</button><button data-m="range" onclick="rpMode('range')">From - To</button></div>
    <div class="row g-2">
      <div class="col-12 col-md-4" id="rpMonthWrap"><label class="form-label">Month</label><input type="month" class="form-control" id="f_month"></div>
      <div class="col-6 col-md-2 d-none rp-rng"><label class="form-label">From</label><input type="date" class="form-control" id="f_from"></div>
      <div class="col-6 col-md-2 d-none rp-rng"><label class="form-label">To</label><input type="date" class="form-control" id="f_to"></div>
      <div class="col-6 col-md-2"><label class="form-label">State</label><select class="form-select" id="f_state" onchange="rpCascade()"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label">HQ</label><select class="form-select" id="f_hq" onchange="rpCascade()"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label">Designation</label><select class="form-select" id="f_des" onchange="rpCascade()"><option value="">All</option></select></div>
      <div class="col-6 col-md-3"><label class="form-label">Employee</label><select class="form-select" id="f_emp"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label">Status</label><select class="form-select" id="f_status"><option value="">All</option><option value="0">Draft</option><option value="1">Submitted</option><option value="2">Approved</option><option value="3">Rejected</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label">Submitted from</label><select class="form-select" id="f_source"><option value="">Web + App</option><option value="2">Web</option><option value="1">App</option></select></div>
      <div class="col-12 col-md-3 d-flex align-items-end gap-2"><div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="f_absent" checked><label class="form-check-label" for="f_absent">Show absent days</label></div></div>
      <div class="col-12 col-md-auto d-flex align-items-end gap-2 ms-md-auto"><button class="ap-btn light" onclick="rpReset()">Reset</button><button class="ap-btn" onclick="rpSearch()"><i class="bi bi-search"></i> Show</button></div>
    </div></div>
  </div>

  <div class="rp-kpis" id="rpKpis"></div>
  <div class="ap-card d-flex gap-2 flex-wrap align-items-center">
    <div class="ap-chips" id="rpChips"></div>
    <input class="form-control ms-md-auto" style="max-width:16rem" id="rpQ" placeholder="Search employee / code / HQ…" oninput="rpRender()">
  </div>
  <div id="rpBody"></div>

  <div class="modal fade" id="activityModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down"><div class="modal-content">
    <div class="modal-header sfa-modal"><h5 class="modal-title"><i class="bi bi-clock-history"></i> Recent searches</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div id="activityList"></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button></div></div></div></div>
</div>
</template>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/core/activity.js"></script>
<script src="js/shell.js"></script>
<script>
  const REPORT_KEY = 'dcrreport', REPORT_LABEL = 'DCR Report', EP = API.report.dcr;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  const pad = (n) => String(n).padStart(2, '0');
  const money = (v) => Number(v || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  const hm = (t) => t ? String(t).slice(0, 5) : '';
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const fmt = (d) => { const x = new Date(d + 'T00:00:00'); return pad(x.getDate()) + '-' + pad(x.getMonth() + 1) + '-' + x.getFullYear(); };
  let FIL = null, DATA = null, MODE = 'month', CHIP = 'all', PAGE = 1, ACT = null;
  const PER = 60;

  window.pageInit = async function () {
    ACT = new bootstrap.Modal('#activityModal');
    document.getElementById('activityModal').addEventListener('shown.bs.modal', () => Activity.renderInto('activityList', REPORT_KEY, applyActivity));
    const d = new Date(); document.getElementById('f_month').value = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    try { FIL = await Api.get(EP + '/filters'); fillFilters(); await rpSearch(); } catch (e) { SFA.toast(e.message, false); }
  };
  const opt = (list, first, sel) => `<option value="">${first}</option>` + list.map(x => `<option value="${esc(x.id)}" ${String(x.id) === String(sel) ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  function fillFilters() {
    const v = (id) => document.getElementById(id).value;
    document.getElementById('f_state').innerHTML = opt(FIL.states, 'All', v('f_state'));
    document.getElementById('f_hq').innerHTML = opt(FIL.hqs, 'All', v('f_hq'));
    document.getElementById('f_des').innerHTML = opt(FIL.designations, 'All', v('f_des'));
    rpCascade();
  }
  // the employee list follows the state / HQ / designation chosen
  function rpCascade() {
    const v = (id) => document.getElementById(id).value, sel = v('f_emp');
    const list = FIL.employees.filter(e => (!v('f_state') || String(e.stateId) === v('f_state')) && (!v('f_hq') || String(e.hqId) === v('f_hq')) && (!v('f_des') || String(e.designationId) === v('f_des')));
    document.getElementById('f_emp').innerHTML = opt(list, 'All', sel);
  }
  function rpMode(m) {
    MODE = m;
    document.querySelectorAll('#rpMode button').forEach(b => b.classList.toggle('active', b.dataset.m === m));
    document.getElementById('rpMonthWrap').classList.toggle('d-none', m !== 'month');
    document.querySelectorAll('.rp-rng').forEach(e => e.classList.toggle('d-none', m !== 'range'));
  }
  function query() {
    const v = (id) => { const x = document.getElementById(id).value; return x === '' ? undefined : x; };
    const q = { stateId: v('f_state'), hqId: v('f_hq'), designationId: v('f_des'), empId: v('f_emp'), status: v('f_status'), source: v('f_source'), absent: document.getElementById('f_absent').checked };
    if (MODE === 'month') q.month = v('f_month'); else { q.from = v('f_from'); q.to = v('f_to'); }
    return q;
  }
  async function rpSearch() {
    try {
      DATA = await Api.get(EP + '/summary', { query: query() }); PAGE = 1; CHIP = 'all';
      document.getElementById('rpSub').textContent = fmt(DATA.from) + ' to ' + fmt(DATA.to);
      kpis(); rpRender();
      if (window.innerWidth < 992) rpFToggle(true);   // phone: fold the filters so the result is on screen
      document.getElementById('rpFSum').textContent = DATA.totals.dcrs + ' DCR · ' + DATA.totals.absent + ' absent';
      Activity.record(REPORT_KEY, REPORT_LABEL, filterState(), summaryText());
    } catch (e) { SFA.toast(e.message, false); }
  }
  function rpFToggle(close) { const b = document.getElementById('rpFBody'), hide = close === true ? true : !b.classList.contains('d-none'); b.classList.toggle('d-none', hide); document.getElementById('rpFIcon').className = 'bi bi-chevron-' + (hide ? 'down' : 'up'); }
  function rpReset() { ['f_state', 'f_hq', 'f_des', 'f_emp', 'f_status', 'f_source'].forEach(i => document.getElementById(i).value = ''); document.getElementById('f_absent').checked = true; rpCascade(); rpSearch(); }
  function filterState() { const g = (i) => document.getElementById(i).value; return { mode: MODE, month: g('f_month'), from: g('f_from'), to: g('f_to'), state: g('f_state'), hq: g('f_hq'), des: g('f_des'), emp: g('f_emp'), status: g('f_status'), source: g('f_source'), absent: document.getElementById('f_absent').checked }; }
  function summaryText() { const t = DATA.totals; return fmt(DATA.from) + ' to ' + fmt(DATA.to) + ' · ' + t.employees + ' employees · ' + t.dcrs + ' DCR · ' + t.absent + ' absent'; }
  function applyActivity(f) {
    rpMode(f.mode || 'month'); const set = (i, v) => document.getElementById(i).value = v || '';
    set('f_month', f.month); set('f_from', f.from); set('f_to', f.to); set('f_state', f.state); set('f_hq', f.hq); set('f_des', f.des); rpCascade(); set('f_emp', f.emp); set('f_status', f.status); set('f_source', f.source);
    document.getElementById('f_absent').checked = f.absent !== false; rpSearch(); if (ACT) ACT.hide();
  }
  function rpExport() { const q = query(); const qs = Object.entries(q).filter(([, v]) => v !== undefined && v !== '').map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&'); Api.download(EP + '/export?' + qs, 'DCR-report.xlsx').catch(e => SFA.toast(e.message, false)); }

  function kpis() {
    const t = DATA.totals, k = (l, v, cls) => `<div class="rp-kpi ${cls || ''}"><small>${l}</small><b>${v}</b></div>`;
    document.getElementById('rpKpis').innerHTML = k('Employees', t.employees) + k('DCR days', t.dcrs) + k('Absent days', t.absent, t.absent ? 'bad' : '') + k('Calls', t.calls) + k('POB', '₹' + money(t.pob)) + k('Expense', '₹' + money(t.expense))
      + `<div class="col-12" style="grid-column:1/-1"><span class="rp-tag web">Web ${t.web}</span> <span class="rp-tag app">App ${t.app}</span> <span class="rp-tag off">Draft ${t.draft}</span> <span class="rp-tag off">Submitted ${t.submitted}</span> <span class="rp-tag off">Approved ${t.approved}</span> <span class="rp-tag off">Rejected ${t.rejected}</span> <span class="rp-tag off">Holidays ${t.holidays}</span> <span class="rp-tag off">Weekly off ${t.weeklyOff}</span></div>`;
  }
  const CHIPS = [['all', 'All'], ['dcr', 'DCR'], ['absent', 'Absent'], ['off', 'Holiday / off']];
  function shown() {
    const q = document.getElementById('rpQ').value.trim().toLowerCase();
    return DATA.rows.filter(r => (CHIP === 'all' || (CHIP === 'dcr' && r.kind === 'DCR') || (CHIP === 'absent' && r.kind === 'ABSENT') || (CHIP === 'off' && (r.kind === 'HOLIDAY' || r.kind === 'WEEKLY_OFF' || r.kind === 'NOT_STARTED')))
      && (!q || ((r.empName || '') + ' ' + (r.empCode || '') + ' ' + (r.hq || '') + ' ' + (r.designation || '')).toLowerCase().includes(q)));
  }
  function chip(k) { CHIP = k; PAGE = 1; rpRender(); }
  const dayOf = (d) => DOW[new Date(d + 'T00:00:00').getDay()];
  function statusTag(r) { return `<span class="rp-tag ${r.status === 2 ? 'app' : r.status === 3 ? 'absent' : 'off'}">${esc(r.statusName)}</span>`; }
  function rpRender() {
    if (!DATA) return;
    document.getElementById('rpChips').innerHTML = CHIPS.map(([k, n]) => `<button type="button" class="ap-chip ${CHIP === k ? 'on' : ''}" onclick="chip('${k}')">${n}</button>`).join('');
    const all = shown(), rows = all.slice(0, PER * PAGE);
    const more = all.length > rows.length ? `<div class="text-center my-3"><button class="ap-btn light" onclick="PAGE++;rpRender()">Show more (${all.length - rows.length} left)</button></div>` : '';
    if (!all.length) { document.getElementById('rpBody').innerHTML = '<div class="ap-card ap-empty"><i class="bi bi-inbox fs-1"></i><div>Nothing found for these filters</div></div>'; return; }
    const link = (r) => r.kind === 'DCR' ? `onclick="location.href='report/dcr-day.html?id=${r.dcrId}'"` : '';
    const note = (r) => r.kind === 'DCR' ? esc(r.workTypeName) : r.kind === 'ABSENT' ? '<span class="rp-tag absent">Absent</span>' : `<span class="rp-tag off">${esc(r.note)}</span>`;
    const cls = (r) => r.kind === 'ABSENT' ? 'rp-absent' : r.kind === 'DCR' ? '' : 'rp-off';
    document.getElementById('rpBody').innerHTML = `
      <div class="rp-desk"><div class="rp-wrap"><table class="rp-table"><thead><tr><th>Date</th><th>Employee</th><th>Designation</th><th>HQ</th><th>Day</th><th>In - Out</th><th>Start area</th><th class="text-end">Calls</th><th class="text-end">POB</th><th class="text-end">Expense</th><th>Status</th><th>From</th><th></th></tr></thead><tbody>
        ${rows.map(r => `<tr class="${cls(r)} ${r.kind === 'DCR' ? 'clk' : ''}" ${link(r)}><td class="text-nowrap">${fmt(r.date)} <small class="text-muted">${dayOf(r.date)}</small></td><td><b>${esc(r.empName)}</b> <small class="text-muted">${esc(r.empCode)}</small></td><td>${esc(r.designation)}</td><td>${esc(r.hq)}</td>
          <td>${note(r)}</td><td class="text-nowrap">${r.kind === 'DCR' ? hm(r.timeIn) + ' - ' + hm(r.timeOut) : ''}</td><td>${r.kind === 'DCR' ? esc(r.startArea) + (r.areaType ? ' <span class="rp-tag off">' + esc(r.areaType) + '</span>' : '') : ''}</td>
          <td class="text-end">${r.kind === 'DCR' ? r.calls : ''}</td><td class="text-end">${r.kind === 'DCR' ? money(r.pob) : ''}</td><td class="text-end">${r.kind === 'DCR' ? money(r.expense) : ''}</td>
          <td>${r.kind === 'DCR' ? statusTag(r) : ''}</td><td>${r.kind === 'DCR' ? `<span class="rp-tag ${r.sourceName === 'App' ? 'app' : 'web'}">${r.sourceName}</span>` : ''}</td><td>${r.kind === 'DCR' ? '<i class="bi bi-chevron-right text-muted"></i>' : ''}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="rp-mob">${rows.map(r => `<div class="rp-card ${cls(r)} ${r.kind === 'DCR' ? 'clk' : ''}" ${link(r)}><div class="d-flex justify-content-between align-items-start gap-2"><div><b>${esc(r.empName)}</b> <small>${esc(r.empCode)}</small><div class="l2">${fmt(r.date)} · ${dayOf(r.date)} · ${esc(r.designation || '')}${r.hq ? ' · ' + esc(r.hq) : ''}</div></div><div class="text-end">${r.kind === 'DCR' ? statusTag(r) + ' <span class="rp-tag ' + (r.sourceName === 'App' ? 'app' : 'web') + '">' + r.sourceName + '</span>' : note(r)}</div></div>
        ${r.kind === 'DCR' ? `<div class="l2 mt-1">${note(r)} · ${hm(r.timeIn)} - ${hm(r.timeOut)}${r.startArea ? ' · ' + esc(r.startArea) + (r.areaType ? ' (' + esc(r.areaType) + ')' : '') : ''}</div><div class="mt-1 small"><b>${r.calls}</b> calls · POB <b>₹${money(r.pob)}</b> · Expense <b>₹${money(r.expense)}</b></div>` : ''}</div>`).join('')}</div>${more}`;
  }
</script>
</body>
</html>
