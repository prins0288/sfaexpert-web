  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>

  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
<style>
  /* DCR of the day - enterprise look (same family as the DCR report): cards, bordered key / value tables, KPI strip, standard DataTable for the calls */
  .rp-kpis { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 .6rem; }
  .rp-kpi { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-left: 3px solid var(--bs-primary); border-radius: .4rem; padding: .35rem .8rem; min-width: 7.5rem; flex: 1 1 7.5rem; }
  .rp-kpi small { color: var(--bs-secondary-color); display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; } .rp-kpi b { font-size: 1.1rem; line-height: 1.2; }
  .dd-tag { display: inline-block; font-size: .7rem; font-weight: 600; border-radius: .3rem; padding: .08rem .5rem; background: var(--bs-secondary-bg); color: var(--bs-secondary-color); white-space: nowrap; }
  .dd-tag.ok { background: var(--bs-success-bg-subtle); color: var(--bs-success-text-emphasis); } .dd-tag.bad { background: var(--bs-danger-bg-subtle); color: var(--bs-danger-text-emphasis); }
  .dd-tag.web { background: var(--bs-info-bg-subtle); color: var(--bs-info-text-emphasis); } .dd-tag.warn { background: var(--bs-warning-bg-subtle); color: var(--bs-warning-text-emphasis); }
  table.dd-kv { width: 100%; border-collapse: collapse; font-size: .83rem; } table.dd-kv td { border: 1px solid var(--bs-border-color); padding: .3rem .6rem; vertical-align: top; width: 25%; }
  table.dd-kv td.k { background: var(--bs-tertiary-bg); color: var(--bs-secondary-color); width: 15%; font-size: .75rem; } table.dd-kv td.v { font-weight: 600; width: 35%; word-break: break-word; }
  @media (max-width: 767.98px) { table.dd-kv td { display: block; width: 100% !important; border-bottom: 0; } table.dd-kv td.v { border-top: 0; } }
  #ddCalls table.dataTable td, #ddCalls table.dataTable th { font-size: .82rem; padding: .32rem .55rem; vertical-align: middle; } #ddCalls tbody tr { cursor: pointer; } #ddCalls td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .dd-tbl { width: 100%; font-size: .82rem; } .dd-tbl th { font-size: .7rem; text-transform: uppercase; color: var(--bs-secondary-color); padding: .25rem .4rem; border-bottom: 1px solid var(--bs-border-color); } .dd-tbl td { padding: .25rem .4rem; border-top: 1px solid var(--bs-border-color); }
  .dd-sub { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; color: var(--bs-secondary-color); margin: .7rem 0 .2rem; }
  @media print {
    body * { visibility: hidden !important; } #ddPrint, #ddPrint * { visibility: visible !important; } #ddPrint { position: absolute; left: 0; top: 0; width: 100%; } .no-print { display: none !important; }
    .dataTables_wrapper .dt-buttons, .dataTables_wrapper .dataTables_filter, .dataTables_wrapper .dataTables_length, .dataTables_wrapper .dataTables_paginate, .dataTables_wrapper .dataTables_info, tr.sfa-filter-row { display: none !important; }
    .dataTables_scrollBody { max-height: none !important; overflow: visible !important; }
  }
</style>

<script>
  const EP = API.report.dcr;
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);   // text of the chosen language (lang_*.properties + the tenant's label_master); the English given here shows when a key has no translation
  const esc = (v) => SFA.esc(v == null ? '' : v);
  const money = (v) => Number(v || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  const hm = (t) => t ? String(t).slice(0, 5) : '';
  const loc = () => (window.I18n && I18n.lang === 'hi' ? 'hi-IN' : 'en-GB');
  const fmtD = (d) => d ? new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString(loc(), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '';
  const fmtS = (d) => d ? new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-GB') : '';
  const fmtT = (d) => d ? String(d).replace('T', ' ').slice(0, 16) : '';
  const mapUrl = (lat, lng) => 'https://www.google.com/maps?q=' + lat + ',' + lng;
  const dist = (m) => m == null ? '' : (m < 1000 ? m + ' m' : (m / 1000).toFixed(1) + ' km');
  let D = null, LASTLANG = window.I18n ? I18n.lang : 'en';
  if (window.I18n) I18n.onChange(() => { if (I18n.lang !== LASTLANG) { LASTLANG = I18n.lang; if (D) render(); } });
  window.pageInit = async function () {
    const id = new URLSearchParams(location.search).get('id');
    document.getElementById('ddBack').setAttribute('href', Session.pageUrl('report/dcr-report.html'));
    if (!id) { document.getElementById('ddHead').innerHTML = '<div class="text-muted">' + T('rep.d.none', 'No DCR chosen') + '</div>'; return; }
    try { D = await Api.get(EP + '/day/' + id); render(); } catch (e) { SFA.toast(e.message, false); document.getElementById('ddHead').innerHTML = '<div class="text-danger">' + esc(e.message) + '</div>'; }
  };
  const mins = (a, b) => { if (!a || !b) return ''; const [h1, m1] = String(a).split(':'), [h2, m2] = String(b).split(':'); const m = (h2 * 60 + +m2) - (h1 * 60 + +m1); return m > 0 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : ''; };
  const STNAME = () => [T('rep.draft', 'Draft'), T('rep.submitted', 'Submitted'), T('rep.approved', 'Approved'), T('rep.rejected', 'Rejected')];
  const kv = (...p) => { const rows = []; for (let i = 0; i < p.length; i += 2) { const a = p[i], b = p[i + 1]; if ((a[1] == null || a[1] === '') && (!b || b[1] == null || b[1] === '')) continue; rows.push([a, b]); }
    return '<table class="dd-kv"><tbody>' + rows.map(([a, b]) => `<tr><td class="k">${a[0]}</td><td class="v">${a[1] == null || a[1] === '' ? '-' : a[1]}</td>${b ? `<td class="k">${b[0]}</td><td class="v">${b[1] == null || b[1] === '' ? '-' : b[1]}</td>` : '<td class="k"></td><td class="v"></td>'}</tr>`).join('') + '</tbody></table>'; };
  const k = (l, v) => `<div class="rp-kpi"><small>${l}</small><b>${v}</b></div>`;
  const callKind = (c) => c.kind === 'Unlisted' ? T('rep.d.unlistedKind', 'Unlisted') : T('rep.d.listedKind', 'Listed');

  function render() {
    const d = D.day, st = d.status === 2 ? 'ok' : d.status === 3 ? 'bad' : d.status === 1 ? 'web' : '';
    const calls = (d.listedCalls || 0) + (d.unlistedCalls || 0);
    document.getElementById('ddSub').textContent = fmtS(d.date) + ' · ' + d.empName;
    document.getElementById('ddHead').innerHTML = `<div class="d-flex justify-content-between align-items-start flex-wrap gap-2"><div><div class="fs-5 fw-bold">${esc(d.empName)} <small class="text-muted">${esc(d.empCode)}</small></div>
        <div class="text-muted">${esc(d.designation || '')}${d.hq ? ' · ' + esc(d.hq) : ''}${d.state ? ' · ' + esc(d.state) : ''}${d.manager ? ' · ' + T('rep.d.manager', 'Manager') + ': ' + esc(d.manager) : ''}</div><div class="fw-semibold mt-1">${esc(fmtD(d.date))}</div></div>
        <div class="text-end"><span class="dd-tag ${st}">${esc(STNAME()[Math.max(0, Math.min(3, d.status))])}</span> <span class="dd-tag ${d.source === 'Web' ? 'web' : 'ok'}">${T('rep.d.submittedFrom', 'Submitted from')} ${esc(d.source === 'Web' ? T('rep.web', 'Web') : T('rep.app', 'App'))}</span>
        <div class="small text-muted mt-1">${d.submittedAt ? T('rep.d.submittedAt', 'Submitted') + ' ' + esc(fmtT(d.submittedAt)) : T('rep.d.notSubmitted', 'Not submitted')}${d.approvedBy ? '<br>' + T('rep.d.approvedBy', 'Approved by') + ' ' + esc(d.approvedBy) + ' · ' + esc(fmtT(d.approvedAt)) : ''}</div></div></div>
      ${d.approvalRemarks ? `<div class="alert alert-secondary py-2 small mt-2 mb-0">${T('rep.d.approver', 'Approver')}: ${esc(d.approvalRemarks)}</div>` : ''}`;
    const start = d.startLat != null ? `<a class="no-print" target="_blank" rel="noopener" href="${mapUrl(d.startLat, d.startLng)}"><i class="bi bi-geo-alt"></i> ${esc(d.startAddress || (Number(d.startLat).toFixed(5) + ', ' + Number(d.startLng).toFixed(5)))}</a>` : '';
    let h = `<div class="rp-kpis">${k(T('rep.calls', 'Calls'), calls + ' <small class="text-muted fs-6">(' + (d.listedCalls || 0) + ' ' + T('rep.d.listed', 'listed') + ', ' + (d.unlistedCalls || 0) + ' ' + T('rep.d.unlisted', 'unlisted') + ')</small>')}${k(T('rep.pob', 'POB'), '₹' + money(d.pob))}${k(T('rep.expense', 'Expense'), '₹' + money(d.expense))}${k(T('rep.d.duration', 'Duration'), mins(hm(d.timeIn), hm(d.timeOut)) || '-')}</div>
      <div class="card mb-2"><div class="card-header"><i class="bi bi-sun"></i> ${T('rep.d.section', 'Day details')}</div><div class="card-body">
        ${kv([T('report.dcr.workType', 'Work type'), esc(d.workType)], [T('report.dcr.timeIn', 'Time in'), esc(hm(d.timeIn))],
             [T('report.dcr.timeOut', 'Time out'), esc(hm(d.timeOut))], [T('rep.d.dayStart', 'Day start location'), start],
             [T('rep.startArea', 'Start area'), esc(d.startArea)], [T('rep.areaType', 'Area type'), esc(d.areaType)],
             [T('rep.d.workingArea', 'Working area'), esc(d.workingArea)], [T('rep.d.travelMode', 'Travel mode'), esc(d.travelMode)],
             [T('rep.d.meterStart', 'Meter start'), esc(d.meterStart)], [T('rep.d.meterEnd', 'Meter end'), esc(d.meterEnd)],
             [T('rep.d.dayEndArea', 'Day end area'), esc(d.dayEndArea)], [T('rep.d.dayEndTime', 'Day end time'), esc(fmtT(d.dayEndAt))],
             [T('rep.d.nightStay', 'Night stay'), esc(d.stayArea)], [T('rep.d.hotel', 'Hotel'), esc(d.stayHotel)],
             [T('common.remarks', 'Remarks'), esc(d.remarks)], [T('rep.d.dayEndRemarks', 'Day end remarks'), esc(d.dayEndRemarks)])}
        ${D.dayJoint.length ? `<div class="mt-2 small"><b>${T('rep.d.joint', 'Joint working (whole day)')}:</b> ${D.dayJoint.map(j => esc(j.name)).join(', ')}</div>` : ''}</div></div>
      <div class="card mb-2" id="ddCalls"><div class="card-header"><i class="bi bi-telephone"></i> ${T('rep.d.callsTitle', 'Calls')} (${D.calls.length})</div><div class="card-body">`;
    if (!D.calls.length) h += `<div class="text-muted text-center py-3">${T('rep.d.noCalls', 'No call on this day')}</div>`;
    else h += `<table id="ddT" data-screen-key="DCR_DAY_CALLS" class="table table-striped table-bordered nowrap" style="width:100%"><thead><tr>
        <th data-i18n="common.sno">S.No</th><th data-field="client" data-i18n="entity.client">Client</th><th data-field="kind" data-i18n="rep.d.kind">Kind</th><th data-field="code" data-i18n="rep.d.codeMobile">Code / Mobile</th><th data-field="type" data-i18n="entity.clientType">Client Type</th>
        <th data-field="category" data-i18n="entity.category">Category</th><th data-field="speciality" data-i18n="entity.speciality">Speciality</th><th data-field="area" data-i18n="entity.area">Area</th><th data-field="in" data-i18n="rep.in">In</th><th data-field="out" data-i18n="rep.out">Out</th>
        <th data-field="duration" data-i18n="rep.d.duration2">Duration</th><th data-field="visit" data-i18n="rep.d.visitType">Visit type</th><th data-field="activity" data-i18n="rep.d.activity">Activity</th><th data-field="pob" class="text-end" data-i18n="rep.pob">POB</th>
        <th data-field="joint" data-i18n="rep.d.jointWith">With</th><th data-field="location" data-i18n="rep.d.location">Location</th><th data-field="distance" data-i18n="rep.d.distance">Distance</th></tr></thead><tbody>
        ${D.calls.map((c, n) => `<tr onclick="callOpen(${n})"><td>${n + 1}</td><td><b>${esc(c.name)}</b>${c.refused ? ` <span class="dd-tag bad">${T('rep.d.refused', 'Refused')}</span>` : ''}</td><td>${callKind(c)}</td><td>${esc(c.code || c.mobile)}</td><td>${esc(c.clientType)}</td><td>${esc(c.category)}</td><td>${esc(c.speciality)}</td><td>${esc(c.area)}</td>
          <td>${hm(c.inTime)}</td><td>${hm(c.outTime)}</td><td>${esc(mins(hm(c.inTime), hm(c.outTime)))}</td><td>${esc(c.visitType)}</td><td>${esc(c.activityType)}</td><td class="num">${c.pob ? money(c.pob) : ''}</td><td>${esc((c.jointWith || []).map(j => j.name).join(', '))}</td>
          <td>${c.lat ? `<a class="no-print" target="_blank" rel="noopener" href="${mapUrl(c.lat, c.lng)}" onclick="event.stopPropagation()" title="${esc(c.address || '')}"><i class="bi bi-geo-alt"></i> ${T('rep.d.openMap', 'Open in map')}</a>` : ''}</td><td data-order="${c.distanceM == null ? -1 : c.distanceM}">${esc(dist(c.distanceM))}</td></tr>`).join('')}
        </tbody></table>`;
    h += '</div></div>';
    if (D.expenses.length) h += `<div class="card mb-2"><div class="card-header"><i class="bi bi-wallet2"></i> ${T('rep.d.expenses', 'Expenses')}</div><div class="card-body"><table class="dd-tbl"><thead><tr><th>${T('rep.d.expenseType', 'Expense')}</th><th>${T('rep.details', 'Details')}</th><th class="text-end">${T('rep.d.amount', 'Amount')}</th></tr></thead><tbody>${D.expenses.map(e => `<tr><td>${esc(e.type)}</td><td>${esc([e.description, e.fromArea && e.toArea ? e.fromArea + ' → ' + e.toArea : '', e.totalKm ? e.totalKm + ' km' : '', e.client].filter(Boolean).join(' · '))}</td><td class="text-end">${money(e.amount)}</td></tr>`).join('')}
      <tr><td colspan="2" class="text-end fw-bold">${T('rep.d.total', 'Total')}</td><td class="text-end fw-bold">₹${money(D.expenses.reduce((s, e) => s + Number(e.amount || 0), 0))}</td></tr></tbody></table></div></div>`;
    document.getElementById('ddBody').innerHTML = h;
    if (D.calls.length && window.sfaDataTable) {
      if ($.fn.DataTable.isDataTable('#ddT')) $('#ddT').DataTable().destroy();
      sfaDataTable('#ddT', { order: [[8, 'asc']], scrollY: false, scrollCollapse: false });
    }
  }
  // click a call: everything about it
  function callOpen(n) {
    const c = D.calls[n]; if (!c) return;
    const smp = c.items.filter(i => /sample/i.test(i.type) && i.qty > 0), inp = c.items.filter(i => /input/i.test(i.type) && i.qty > 0), pob = c.items.filter(i => i.pobQty > 0), det = c.items.filter(i => i.detailed);
    document.getElementById('callTitle').innerHTML = `<i class="bi bi-person-lines-fill"></i> ${n + 1}. ${esc(c.name)} <span class="dd-tag">${callKind(c)}</span> ${c.refused ? `<span class="dd-tag bad">${T('rep.d.refused', 'Refused')}</span>` : ''}`;
    document.getElementById('callBody').innerHTML = `${kv([T('rep.d.codeMobile', 'Code / Mobile'), esc(c.code || c.mobile)], [T('entity.clientType', 'Client Type'), esc(c.clientType)], [T('entity.category', 'Category'), esc(c.category)], [T('entity.speciality', 'Speciality'), esc(c.speciality)],
        [T('entity.area', 'Area'), esc(c.area)], [T('rep.d.visitType', 'Visit type'), esc([c.visitType, c.activityType].filter(Boolean).join(' · '))], [T('rep.in', 'In') + ' - ' + T('rep.out', 'Out'), esc(hm(c.inTime) + ' - ' + hm(c.outTime) + (mins(hm(c.inTime), hm(c.outTime)) ? '  (' + mins(hm(c.inTime), hm(c.outTime)) + ')' : ''))],
        [T('rep.d.location', 'Location'), c.lat ? `<a target="_blank" rel="noopener" href="${mapUrl(c.lat, c.lng)}"><i class="bi bi-geo-alt"></i> ${esc(c.address || (Number(c.lat).toFixed(5) + ', ' + Number(c.lng).toFixed(5)))}</a>` : ''], [T('rep.d.distance', 'Distance'), esc(dist(c.distanceM))],
        [T('rep.pob', 'POB'), c.pob ? '₹' + money(c.pob) : ''], [T('rep.d.jointWith', 'With'), esc((c.jointWith || []).map(j => j.name).join(', '))])}
      ${smp.length ? `<div class="dd-sub">${T('rep.d.sample', 'Sample')}</div><table class="dd-tbl"><tbody>${smp.map(i => `<tr><td>${esc(i.name)}</td><td class="text-end">${i.qty}</td></tr>`).join('')}</tbody></table>` : ''}
      ${inp.length ? `<div class="dd-sub">${T('rep.d.input', 'Input')}</div><table class="dd-tbl"><tbody>${inp.map(i => `<tr><td>${esc(i.name)}</td><td class="text-end">${i.qty}</td></tr>`).join('')}</tbody></table>` : ''}
      ${pob.length ? `<div class="dd-sub">${T('rep.d.pobOrder', 'POB / Order')}</div><table class="dd-tbl"><thead><tr><th>${T('rep.d.item', 'Item')}</th><th class="text-end">${T('rep.d.qty', 'Qty')}</th><th class="text-end">${T('rep.d.rate', 'Rate')}</th><th class="text-end">${T('rep.d.amount', 'Amount')}</th></tr></thead><tbody>${pob.map(i => `<tr><td>${esc(i.name)}</td><td class="text-end">${i.pobQty}</td><td class="text-end">${money(i.rate)}</td><td class="text-end">${money(i.amount)}</td></tr>`).join('')}</tbody></table>` : ''}
      ${det.length ? `<div class="dd-sub">${T('rep.d.detailed', 'Detailed')}</div><div class="small">${det.map(i => esc(i.name)).join(', ')}</div>` : ''}
      ${(c.leaflets || []).length ? `<div class="dd-sub">${T('rep.d.leaflets', 'Leaflets')}</div><div class="small">${c.leaflets.map(l => esc(l.name) + ' x' + l.qty).join(', ')}</div>` : ''}
      ${(c.treatments || []).length ? `<div class="dd-sub">${T('rep.d.treatment', 'Treatment')}</div><div class="small">${c.treatments.map(esc).join(', ')}</div>` : ''}
      ${c.remarks ? `<div class="dd-sub">${T('common.remarks', 'Remarks')}</div><div class="small">${esc(c.remarks)}</div>` : ''}
      ${c.nextVisit ? `<div class="dd-sub">${T('rep.d.nextVisit', 'Next visit')}</div><div class="small">${esc(fmtD(c.nextVisit))}${c.priority ? ' · ' + esc(c.priority) : ''}${c.nextRemarks ? ' · ' + esc(c.nextRemarks) : ''}</div>` : ''}`;
    bootstrap.Modal.getOrCreateInstance('#callModal').show();
  }
  function ddExcel() { Api.download(EP + '/export?from=' + D.day.date + '&to=' + D.day.date + '&empId=' + encodeURIComponent(D.day.empId) + '&absent=false', 'DCR-' + D.day.empCode + '-' + D.day.date + '.xlsx').catch(e => SFA.toast(e.message, false)); }
</script>
</body>
</html>
