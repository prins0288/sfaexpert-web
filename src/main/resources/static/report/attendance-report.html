<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Attendance Report</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
<style>
  .rp-kpis { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 .6rem; }
  .rp-kpi { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-left: 3px solid var(--bs-primary); border-radius: .4rem; padding: .35rem .8rem; min-width: 7.5rem; flex: 1 1 7.5rem; }
  .rp-kpi small { color: var(--bs-secondary-color); display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; } .rp-kpi b { font-size: 1.1rem; line-height: 1.2; }
  .rp-kpi.bad { border-left-color: #dc3545; } .rp-kpi.bad b { color: #b02a37; } .rp-kpi.ok { border-left-color: #198754; } .rp-kpi.warn { border-left-color: #fd7e14; } .rp-kpi.mut { border-left-color: #6c757d; }
  .rp-filters .form-label { font-size: .72rem; font-weight: 600; color: var(--bs-secondary-color); margin-bottom: .1rem; }
  .rp-tabs .nav-link { padding: .3rem .8rem; font-size: .85rem; }
  #attWrap table.dataTable td, #attWrap table.dataTable th { font-size: .78rem; padding: .28rem .45rem; vertical-align: middle; }
  #attWrap td.att { text-align: center; font-size: .7rem; min-width: 4.6rem; white-space: nowrap; border-color: rgba(255,255,255,.55); }
  #attWrap td.att.clk { cursor: pointer; } #attWrap td.att.clk:hover { filter: brightness(.94); }
  .att-p { background: #a8e0b5 !important; color: #14532d; } .att-hd { background: #ffd98a !important; color: #7a4a00; } .att-a { background: #ff5b6b !important; color: #fff; font-weight: 600; }
  .att-l { background: #b9ccf5 !important; color: #1d3a82; } .att-hl { background: #a6dcee !important; color: #0b4a5e; } .att-wk { background: #dfe3e8 !important; color: #4b5563; }
  #attWrap td.num { text-align: right; font-variant-numeric: tabular-nums; } .rp-zero { color: var(--bs-secondary-color); opacity: .55; } .rp-bad { color: #b02a37; font-weight: 700; }
  .att-legend { display: flex; flex-wrap: wrap; gap: .35rem .9rem; font-size: .75rem; } .att-legend span.k { display: inline-block; min-width: 2.3rem; text-align: center; border-radius: .25rem; padding: .05rem .4rem; font-weight: 700; margin-right: .3rem; background: var(--bs-secondary-bg); }
</style>
</head>
<body>
<div id="app" data-page="attendancereport" data-title="Attendance Report"></div>
<template id="pageContent">
<div class="card mb-2">
  <div class="card-header d-flex align-items-center flex-wrap gap-2"><span><i class="bi bi-calendar-check"></i> <span data-i18n="rep.att.title">Attendance Report</span></span><small class="text-muted" id="rpSub"></small>
    <div class="card-tools ms-auto d-flex gap-2 flex-wrap">
      <button class="btn btn-sm sfa-btn-outline" id="rpFBtn" onclick="rpFToggle()"><i class="bi bi-sliders"></i> <span data-i18n="rep.filters">Filters</span></button>
      <button class="btn btn-sm sfa-btn-outline" data-bs-toggle="modal" data-bs-target="#activityModal"><i class="bi bi-clock-history"></i> <span data-i18n="rep.recent">Recent</span></button></div></div>
  <div class="card-body rp-filters" id="rpFBody">
    <div class="row g-2 align-items-end">
      <div class="col-auto"><div class="btn-group btn-group-sm" id="rpMode"><button type="button" class="btn btn-primary" data-m="month" onclick="rpMode('month')" data-i18n="rep.month">Month</button><button type="button" class="btn btn-outline-primary" data-m="range" onclick="rpMode('range')" data-i18n="rep.fromTo">From - To</button></div></div>
      <div class="col-6 col-md-2" id="rpMonthWrap"><label class="form-label" data-i18n="rep.month">Month</label><input type="month" class="form-control form-control-sm" id="f_month"></div>
      <div class="col-6 col-md-2 d-none rp-rng"><label class="form-label" data-i18n="common.from">From</label><input type="date" class="form-control form-control-sm" id="f_from"></div>
      <div class="col-6 col-md-2 d-none rp-rng"><label class="form-label" data-i18n="common.to">To</label><input type="date" class="form-control form-control-sm" id="f_to"></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="entity.state">State</label><select class="form-select form-select-sm" id="f_state" onchange="rpCascade()"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="entity.hq">HQ</label><select class="form-select form-select-sm" id="f_hq" onchange="rpCascade()"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="entity.designation">Designation</label><select class="form-select form-select-sm" id="f_des" onchange="rpCascade()"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="entity.employee">Employee</label><select class="form-select form-select-sm" id="f_emp"><option value="">All</option></select></div>
      <div class="col-6 col-md-2"><label class="form-label" data-i18n="common.status">Status</label><select class="form-select form-select-sm" id="f_status"><option value="" data-i18n="common.all">All</option><option value="ACTIVE" data-i18n="common.active">Active</option><option value="RESIGNED" data-i18n="rep.att.resigned">Resigned</option></select></div>
      <div class="col-auto ms-md-auto d-flex gap-2"><button class="btn btn-sm btn-light" onclick="rpReset()" data-i18n="common.reset">Reset</button><button class="btn btn-sm btn-primary" onclick="rpSearch()"><i class="bi bi-search"></i> <span data-i18n="rep.show">Show</span></button></div>
    </div>
  </div>
</div>

<div class="rp-kpis" id="rpKpis"></div>

<div class="card mb-2">
  <div class="card-header d-flex align-items-center flex-wrap gap-2">
    <ul class="nav nav-pills rp-tabs" id="rpTabs"><li class="nav-item"><button class="nav-link active" data-v="sheet" onclick="rpView('sheet')"><i class="bi bi-grid-3x3-gap"></i> <span data-i18n="rep.att.sheet">Attendance sheet</span></button></li><li class="nav-item"><button class="nav-link" data-v="sum" onclick="rpView('sum')"><i class="bi bi-people"></i> <span data-i18n="rep.empSummary">Employee summary</span></button></li></ul>
    <span class="small text-muted ms-auto" id="rpHint"></span>
  </div>
  <div class="card-body"><div id="attWrap"></div></div>
</div>
<div class="card mb-2" id="legendCard"><div class="card-body py-2"><div class="att-legend" id="attLegend"></div><div class="small text-muted mt-1" id="attNote"></div></div></div>
<div class="card mb-2" id="nsCard"><div class="card-header"><i class="bi bi-person-x"></i> <span id="nsTitle"></span></div><div class="card-body"><div id="nsWrap"></div></div></div>

<div class="modal fade" id="activityModal" tabindex="-1"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down"><div class="modal-content">
  <div class="modal-header sfa-modal"><h5 class="modal-title"><i class="bi bi-clock-history"></i> <span data-i18n="rep.recentSearches">Recent searches</span></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><div id="activityList"></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="common.close">Close</button></div></div></div></div>
</template>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/core/activity.js"></script>
<script src="js/shell.js"></script>
<script>
  const T = (k, en) => (window.I18n ? I18n.t(k, en) : en);   // text of the chosen language (lang_*.properties + the tenant's label_master)
  const REPORT_KEY = 'attendancereport', REPORT_LABEL = 'Attendance Report', EP = API.report.attendance;
  const esc = (v) => SFA.esc(v == null ? '' : v);
  const pad = (n) => String(n).padStart(2, '0');
  const loc = () => (window.I18n && I18n.lang === 'hi' ? 'hi-IN' : 'en-GB');
  const dowOf = (d) => new Date(d + 'T00:00:00').toLocaleDateString(loc(), { weekday: 'short' }).toUpperCase();
  const fmt = (d) => { const x = new Date(d + 'T00:00:00'); return pad(x.getDate()) + '-' + pad(x.getMonth() + 1) + '-' + x.getFullYear(); };
  const hrs = (m) => m ? Math.floor(m / 60) + 'h ' + (Math.round(m) % 60) + 'm' : '';
  let FIL = null, DATA = null, MODE = 'month', VIEW = 'sheet', ACT = null, LASTLANG = window.I18n ? I18n.lang : 'en';
  if (window.I18n) I18n.onChange(() => { if (I18n.lang !== LASTLANG) { LASTLANG = I18n.lang; if (DATA) { kpis(); rpRender(); } } });

  window.pageInit = async function () {
    ACT = new bootstrap.Modal('#activityModal');
    document.getElementById('activityModal').addEventListener('shown.bs.modal', () => Activity.renderInto('activityList', REPORT_KEY, applyActivity));
    const d = new Date(); document.getElementById('f_month').value = d.getFullYear() + '-' + pad(d.getMonth() + 1);
    try { FIL = await Api.get(EP + '/filters'); fillFilters(); await rpSearch(); } catch (e) { SFA.toast(e.message, false); }
  };
  const opt = (list, first, sel) => `<option value="">${first}</option>` + list.map(x => `<option value="${esc(x.id)}" ${String(x.id) === String(sel) ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  function fillFilters() {
    const v = (id) => document.getElementById(id).value;
    document.getElementById('f_state').innerHTML = opt(FIL.states, T('common.all', 'All'), v('f_state'));
    document.getElementById('f_hq').innerHTML = opt(FIL.hqs, T('common.all', 'All'), v('f_hq'));
    document.getElementById('f_des').innerHTML = opt(FIL.designations, T('common.all', 'All'), v('f_des'));
    rpCascade();
  }
  function rpCascade() {
    const v = (id) => document.getElementById(id).value, sel = v('f_emp');
    const list = FIL.employees.filter(e => (!v('f_state') || String(e.stateId) === v('f_state')) && (!v('f_hq') || String(e.hqId) === v('f_hq')) && (!v('f_des') || String(e.designationId) === v('f_des')));
    document.getElementById('f_emp').innerHTML = opt(list, T('common.all', 'All'), sel);
  }
  function rpMode(m) {
    MODE = m;
    document.querySelectorAll('#rpMode button').forEach(b => { const on = b.dataset.m === m; b.classList.toggle('btn-primary', on); b.classList.toggle('btn-outline-primary', !on); });
    document.getElementById('rpMonthWrap').classList.toggle('d-none', m !== 'month');
    document.querySelectorAll('.rp-rng').forEach(e => e.classList.toggle('d-none', m !== 'range'));
  }
  function query() {
    const v = (id) => { const x = document.getElementById(id).value; return x === '' ? undefined : x; };
    const q = { stateId: v('f_state'), hqId: v('f_hq'), designationId: v('f_des'), empId: v('f_emp'), empStatus: v('f_status') };
    if (MODE === 'month') q.month = v('f_month'); else { q.from = v('f_from'); q.to = v('f_to'); }
    return q;
  }
  async function rpSearch() {
    try {
      DATA = await Api.get(EP + '/sheet', { query: query() });
      document.getElementById('rpSub').textContent = fmt(DATA.from) + ' ' + T('rep.period', 'to') + ' ' + fmt(DATA.to);
      kpis(); rpRender();
      rpFToggle(true); rpScrollTop();   // report loaded: the filter card folds away and the page goes to the top; the Filters button brings it back
      Activity.record(REPORT_KEY, REPORT_LABEL, filterState(), summaryText());
    } catch (e) { SFA.toast(e.message, false); }
  }
  function rpFToggle(close) {
    const b = document.getElementById('rpFBody'), hide = close === true ? true : !b.classList.contains('d-none');
    b.classList.toggle('d-none', hide); const btn = document.getElementById('rpFBtn'); if (btn) btn.classList.toggle('active', !hide); if (!hide) rpScrollTop();
  }
  function rpScrollTop() { let n = document.getElementById('rpFBody'); while (n && n !== document.body) { const o = getComputedStyle(n).overflowY; if ((o === 'auto' || o === 'scroll') && n.scrollHeight > n.clientHeight) n.scrollTop = 0; n = n.parentElement; } window.scrollTo(0, 0); }
  function rpReset() { ['f_state', 'f_hq', 'f_des', 'f_emp', 'f_status'].forEach(i => document.getElementById(i).value = ''); rpCascade(); rpSearch(); }
  function filterState() { const g = (i) => document.getElementById(i).value; return { mode: MODE, month: g('f_month'), from: g('f_from'), to: g('f_to'), state: g('f_state'), hq: g('f_hq'), des: g('f_des'), emp: g('f_emp'), status: g('f_status') }; }
  function summaryText() { return fmt(DATA.from) + ' ' + T('rep.period', 'to') + ' ' + fmt(DATA.to) + ' · ' + DATA.employees.length + ' ' + T('entity.employees', 'Employees').toLowerCase(); }
  function applyActivity(f) {
    rpMode(f.mode || 'month'); const set = (i, v) => document.getElementById(i).value = v || '';
    set('f_month', f.month); set('f_from', f.from); set('f_to', f.to); set('f_state', f.state); set('f_hq', f.hq); set('f_des', f.des); rpCascade(); set('f_emp', f.emp); set('f_status', f.status); rpSearch(); if (ACT) ACT.hide();
  }

  function kpis() {
    const t = DATA.employees.reduce((a, e) => { const s = e.sum; a.p += s.present; a.h += s.half; a.l += s.leave; a.o += s.off; a.a += s.absent; a.c += s.calls; return a; }, { p: 0, h: 0, l: 0, o: 0, a: 0, c: 0 });
    const k = (l, v, c) => `<div class="rp-kpi ${c || ''}"><small>${l}</small><b>${v}</b></div>`;
    document.getElementById('rpKpis').innerHTML = k(T('entity.employees', 'Employees'), DATA.employees.length) + k(T('rep.present', 'Present'), t.p, 'ok') + k(T('rep.att.half', 'Half days'), t.h, 'warn') + k(T('rep.leave', 'Leave'), t.l)
      + k(T('rep.holidayOff', 'Holiday / off'), t.o, 'mut') + k(T('rep.absent', 'Absent'), t.a, t.a ? 'bad' : '') + k(T('rep.calls', 'Calls'), t.c) + k(T('rep.att.notSubmitted', 'DCR not submitted'), DATA.notSubmitted.length, DATA.notSubmitted.length ? 'bad' : '');
  }
  function rpView(v) { VIEW = v; document.querySelectorAll('#rpTabs .nav-link').forEach(b => b.classList.toggle('active', b.dataset.v === v)); rpRender(); }

  // ------------------------------------------------------------ the cell of a day
  function cell(c, date) {
    if (!c) return '<td class="att"></td>';
    const day = Number(date.slice(8, 10)), calls = c.c != null ? c.c : '';
    const tip = c.why ? ` title="${esc(c.why)}"` : '';
    const go = c.id ? ` data-dcr="${c.id}"` : '';
    switch (c.s) {
      case 'P': return `<td class="att att-p ${c.id ? 'clk' : ''}"${go}${tip}>${day} (${esc(c.t)}/${calls})</td>`;
      case 'HD': return `<td class="att att-hd ${c.id ? 'clk' : ''}"${go}${tip}>${day} (${esc(c.t)}/${calls}) ${T('rep.att.hd', 'HD')}</td>`;
      case 'A': return `<td class="att att-a ${c.id ? 'clk' : ''}"${go}${tip}>${c.id ? 'A*' : 'A'}</td>`;
      case 'L': return `<td class="att att-l ${c.id ? 'clk' : ''}"${go}${tip}>${day} (${esc(c.t || 'L')})</td>`;
      case 'HL': return `<td class="att att-hl"${tip}>${day} (${T('rep.att.hl', 'HL')})</td>`;
      default: return `<td class="att att-wk">${day} (${T('rep.att.wk', 'WK')})</td>`;
    }
  }
  const pctOf = (s) => { const w = s.present + s.half + s.absentFull; return w ? Math.round((s.present + s.half * 0.5) * 100 / w) : null; };
  const nz = (v) => v ? v : '<span class="rp-zero">0</span>';

  function rpRender() {
    if (!DATA) return;
    const wrap = document.getElementById('attWrap');
    if (window.jQuery && $.fn.DataTable.isDataTable('#attT')) $('#attT').DataTable().destroy();
    if (!DATA.employees.length) { wrap.innerHTML = `<div class="text-center text-muted py-5"><i class="bi bi-inbox fs-1"></i><div>${T('rep.nothing', 'Nothing found for these filters')}</div></div>`; renderBelow(); return; }
    if (VIEW === 'sheet') {
      document.getElementById('rpHint').textContent = T('rep.att.hintSheet', 'Click a day to open that DCR; A* = a DCR that failed the attendance conditions (hover for the reason)');
      wrap.innerHTML = `<table id="attT" class="table table-bordered nowrap" style="width:100%"><thead><tr>
        <th data-i18n="common.sno">S.No</th><th data-i18n="common.name">Name</th><th data-i18n="common.code">Code</th><th data-i18n="rep.att.doj">DOJ</th><th data-i18n="common.status">Status</th><th data-i18n="entity.designation">Designation</th><th data-i18n="entity.state">State</th><th data-i18n="entity.hq">HQ</th>
        ${DATA.dates.map(d => `<th data-i18n-skip="1" title="${d}">${Number(d.slice(8, 10))}-${dowOf(d)}</th>`).join('')}
        <th class="text-end" data-i18n="rep.present">Present</th><th class="text-end" data-i18n="rep.att.half">Half days</th><th class="text-end" data-i18n="rep.leave">Leave</th><th class="text-end" data-i18n="rep.holidayOff">Holiday / off</th><th class="text-end" data-i18n="rep.absent">Absent</th><th class="text-end" data-i18n="rep.calls">Calls</th><th class="text-end" data-i18n="rep.workHours">Working hours</th></tr></thead><tbody>
        ${DATA.employees.map((e, i) => `<tr><td>${i + 1}</td><td><b>${esc(e.name)}</b></td><td>${esc(e.empCode)}</td><td data-order="${esc(e.doj)}">${e.doj ? fmt(e.doj) : ''}</td><td>${esc(e.status === 'Active' ? T('common.active', 'Active') : T('rep.att.resigned', 'Resigned'))}</td><td>${esc(e.designation)}</td><td>${esc(e.state)}</td><td>${esc(e.hq)}</td>
          ${e.cells.map((c, j) => cell(c, DATA.dates[j])).join('')}
          <td class="num">${nz(e.sum.present)}</td><td class="num">${nz(e.sum.half)}</td><td class="num">${nz(e.sum.leave)}</td><td class="num">${nz(e.sum.off)}</td><td class="num ${e.sum.absent ? 'rp-bad' : ''}">${nz(e.sum.absent)}</td><td class="num">${nz(e.sum.calls)}</td><td class="num" data-order="${e.sum.workMin}">${hrs(e.sum.workMin)}</td></tr>`).join('')}
        </tbody></table>`;
      sfaDataTable('#attT', { order: [[1, 'asc']], scrollY: '62vh' });
      $('#attT tbody').off('click.att').on('click.att', 'td[data-dcr]', function () { location.href = Session.pageUrl('report/dcr-day.html?id=' + this.getAttribute('data-dcr')); });
    } else {
      document.getElementById('rpHint').textContent = '';
      wrap.innerHTML = `<table id="attT" data-screen-key="ATTENDANCE_SUMMARY" class="table table-striped table-bordered nowrap" style="width:100%"><thead><tr>
        <th data-i18n="common.sno">S.No</th><th data-field="code" data-i18n="common.code">Code</th><th data-field="employee" data-i18n="entity.employee">Employee</th><th data-field="designation" data-i18n="entity.designation">Designation</th><th data-field="hq" data-i18n="entity.hq">HQ</th><th data-field="state" data-i18n="entity.state">State</th>
        <th data-field="doj" data-i18n="rep.att.doj">DOJ</th><th data-field="status" data-i18n="common.status">Status</th><th data-field="present" class="text-end" data-i18n="rep.present">Present</th><th data-field="half" class="text-end" data-i18n="rep.att.half">Half days</th><th data-field="leave" class="text-end" data-i18n="rep.leave">Leave</th>
        <th data-field="off" class="text-end" data-i18n="rep.holidayOff">Holiday / off</th><th data-field="absent" class="text-end" data-i18n="rep.absent">Absent</th><th data-field="calls" class="text-end" data-i18n="rep.calls">Calls</th><th data-field="hours" class="text-end" data-i18n="rep.workHours">Working hours</th><th data-field="pct" class="text-end" data-i18n="rep.att.pct">Attendance %</th></tr></thead><tbody>
        ${DATA.employees.map((e, i) => { const s = e.sum, p = pctOf(s); return `<tr><td>${i + 1}</td><td>${esc(e.empCode)}</td><td><b>${esc(e.name)}</b></td><td>${esc(e.designation)}</td><td>${esc(e.hq)}</td><td>${esc(e.state)}</td><td data-order="${esc(e.doj)}">${e.doj ? fmt(e.doj) : ''}</td><td>${esc(e.status === 'Active' ? T('common.active', 'Active') : T('rep.att.resigned', 'Resigned'))}</td>
          <td class="num">${nz(s.present)}</td><td class="num">${nz(s.half)}</td><td class="num">${nz(s.leave)}</td><td class="num">${nz(s.off)}</td><td class="num ${s.absent ? 'rp-bad' : ''}">${nz(s.absent)}</td><td class="num">${nz(s.calls)}</td><td class="num" data-order="${s.workMin}">${hrs(s.workMin)}</td><td class="num" data-order="${p == null ? -1 : p}">${p == null ? '' : p + '%'}</td></tr>`; }).join('')}
        </tbody></table>`;
      sfaDataTable('#attT', { order: [[2, 'asc']] });
    }
    renderBelow();
  }
  // legend (work types come from the DCR work type master) + the employees without any DCR
  function renderBelow() {
    const k = (c, n, cls) => `<span><span class="k ${cls || ''}">${esc(c)}</span>${esc(n)}</span>`;
    document.getElementById('attLegend').innerHTML = DATA.legend.map(l => k(l.code, l.name)).join('') + k('HL', T('rep.holiday', 'Holiday'), 'att-hl') + k('WK', T('rep.weeklyOff', 'Weekly off'), 'att-wk') + k('A', T('rep.absent', 'Absent'), 'att-a') + k('HD', T('rep.att.halfDay', 'Half day'), 'att-hd');
    document.getElementById('attNote').textContent = T('rep.att.note', 'A cell shows: date (day type / calls). Days before the joining date, after the last working day and in the future are blank.');
    document.getElementById('nsTitle').textContent = T('rep.att.notSubmittedFor', 'DCR not submitted for') + ' ' + fmt(DATA.from) + ' ' + T('rep.period', 'to') + ' ' + fmt(DATA.to);
    if (window.jQuery && $.fn.DataTable.isDataTable('#nsT')) $('#nsT').DataTable().destroy();
    document.getElementById('nsCard').classList.toggle('d-none', !DATA.notSubmitted.length);
    if (!DATA.notSubmitted.length) { document.getElementById('nsWrap').innerHTML = ''; return; }
    document.getElementById('nsWrap').innerHTML = `<table id="nsT" data-screen-key="ATTENDANCE_NOTSUB" class="table table-striped table-bordered nowrap" style="width:100%"><thead><tr><th data-i18n="common.sno">S.No</th><th data-field="employee" data-i18n="entity.employee">Employee</th><th data-field="code" data-i18n="common.code">Code</th><th data-field="designation" data-i18n="entity.designation">Designation</th><th data-field="hq" data-i18n="entity.hq">HQ</th><th data-field="mobile" data-i18n="common.mobile">Mobile</th></tr></thead><tbody>
      ${DATA.notSubmitted.map((e, i) => `<tr><td>${i + 1}</td><td><b>${esc(e.name)}</b></td><td>${esc(e.empCode)}</td><td>${esc(e.designation)}</td><td>${esc(e.hq)}</td><td>${esc(e.mobile)}</td></tr>`).join('')}</tbody></table>`;
    sfaDataTable('#nsT', { order: [[1, 'asc']], scrollY: '40vh' });
  }
</script>
</body>
</html>
