<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; HR Audit Log</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="hraudit" data-title="HR Audit Log"></div>
<template id="pageContent">
<div class="ap-app">
  <div class="ap-top"><div><h1 class="ap-title">HR Audit Log</h1><div class="text-muted small">Who changed what, when - old and new value and the reason. Rows are never edited or deleted</div></div></div>
  <div class="ap-card"><div class="row g-2">
    <div class="col-6 col-md-3"><label class="form-label small">What</label><select class="form-select" id="a_entity" onchange="load()"><option value="">Everything</option>
      <option>SETTING</option><option>COMPANY</option><option>BRANCHES</option><option>DEPARTMENTS</option><option>GRADES</option><option>COST_CENTERS</option><option>EMPLOYEE_TYPES</option><option>EMPLOYMENT</option><option>ROLE_PERMISSION</option><option>EMP_ROLE</option></select></div>
    <div class="col-6 col-md-3"><label class="form-label small">From</label><input type="date" class="form-control" id="a_from" onchange="load()"></div>
    <div class="col-6 col-md-3"><label class="form-label small">To</label><input type="date" class="form-control" id="a_to" onchange="load()"></div></div></div>
  <div id="body"></div>
</div>
</template>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>

const H = API.master.hr;
const esc = (v) => SFA.esc(v == null ? '' : v);
const val = (id) => document.getElementById(id).value;
const chk = (id) => document.getElementById(id).checked;
const SHEETS = {};
function sheet(id) { return SHEETS[id] || (SHEETS[id] = new bootstrap.Offcanvas('#' + id)); }
async function askReason(label) { const r = prompt(label || 'Reason for this change (kept in the audit log)'); if (r == null) return null; if (!r.trim()) { SFA.toast('A reason is required', false); return null; } return r.trim(); }

window.pageInit = async function () { await load(); };
async function load() {
  try {
    const rows = await Api.get(H.audit, { query: { entity: val('a_entity'), from: val('a_from'), to: val('a_to') } });
    document.getElementById('body').innerHTML = rows.map(r => `<div class="ap-card"><div class="d-flex flex-wrap gap-2 align-items-center"><span class="ap-badge ${r.action === 'DELETE' ? 'bad' : r.action === 'CREATE' ? 'ok' : 'wait'}">${esc(r.action)}</span><b>${esc(r.entity)}</b> <span class="text-muted">${esc(r.entityId)}</span>
      ${r.subjectName ? '<span>· ' + esc(r.subjectName) + ' (' + esc(r.subjectCode) + ')</span>' : ''}<span class="ms-auto small text-muted">${esc(String(r.atTime).replace('T', ' ').slice(0, 16))} · ${esc(r.byName) || '-'}</span></div>
      <div class="mt-1"><span class="text-muted">${esc(r.field)}:</span> <s class="text-muted">${esc(r.oldValue)}</s> → <b>${esc(r.newValue)}</b></div>${r.reason ? '<div class="small text-muted">' + esc(r.reason) + '</div>' : ''}</div>`).join('')
      || '<div class="ap-card ap-empty"><i class="bi bi-journal fs-1"></i><div>No entries</div></div>';
  } catch (e) { document.getElementById('body').innerHTML = '<div class="ap-card ap-empty">' + esc(e.message) + '</div>'; }
}

</script>
</body>
</html>
