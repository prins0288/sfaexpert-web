<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Leave Master</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="hrleavemaster" data-title="Leave Master"></div>
<template id="pageContent">
<div class="ap-app"><div class="ap-top"><div><h1 class="ap-title">Leave Master</h1><div class="text-muted small">Leave types and their policy - quota, accrual, notice, back-date, limits, half day, sandwich rule. Applications are checked against this</div></div><button class="ap-btn go" onclick="add()"><i class="bi bi-plus-circle"></i> Add leave type</button></div>
<div id="body"></div><div class="offcanvas offcanvas-bottom ap-sheet" tabindex="-1" id="sh" data-bs-backdrop="true"><div class="offcanvas-header"><h5 class="offcanvas-title" id="shT"></h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body" id="shB"></div><div class="ap-sheet-foot" id="shF"></div></div></div>
</template>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>

const L = API.master.hr.leave;
const esc = (v) => SFA.esc(v == null ? '' : v);
const val = (id) => document.getElementById(id).value;
const chk = (id) => document.getElementById(id).checked;
let SHEET = null; const sheet = () => SHEET || (SHEET = new bootstrap.Offcanvas('#sh'));
const fmtD = (d) => d ? new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const num = (v) => Number(v).toString();

let ROWS = [], SEL = new Set(), CUR = null;
window.pageInit = async function () { await load(); };
async function load() {
  try { ROWS = await Api.get(L.types); } catch (e) { document.getElementById('body').innerHTML = '<div class="ap-card ap-empty">' + esc(e.message) + '</div>'; return; }
  document.getElementById('body').innerHTML = ROWS.map(r => `<div class="ap-card" style="cursor:pointer" onclick="edit(${r.id})"><div class="d-flex align-items-center gap-2">
    <input type="checkbox" class="form-check-input" ${SEL.has(r.id) ? 'checked' : ''} onclick="event.stopPropagation()" onchange="this.checked ? SEL.add(${r.id}) : SEL.delete(${r.id}); bar()">
    <div class="flex-fill" style="min-width:0"><b>${esc(r.name)}</b> <span class="text-muted">${esc(r.code)}</span> ${r.paid ? '<span class="ap-badge ok">Paid</span>' : '<span class="ap-badge wait">Unpaid</span>'} ${r.active ? '' : '<span class="ap-badge bad">Off</span>'}
    <div class="small text-muted">${num(r.annualQuota)} days / year · ${r.accrual === 'MONTHLY' ? 'monthly accrual' : 'whole year upfront'}${Number(r.carryForwardMax) ? ' · carry ' + num(r.carryForwardMax) : ''}${r.maxConsecutive ? ' · max ' + r.maxConsecutive + ' at a time' : ''}${r.minNoticeDays ? ' · ' + r.minNoticeDays + 'd notice' : ''}${r.sandwich ? ' · sandwich' : ''}${r.autoApprove ? ' · auto-approve' : ''}</div></div><i class="bi bi-chevron-right text-muted"></i></div></div>`).join('') || '<div class="ap-card ap-empty">No leave type yet</div>'
    + '<div class="ap-bar" id="bar"><div class="info" id="barInfo"></div><button class="ap-btn danger" onclick="del()"><i class="bi bi-trash"></i> Delete</button></div>';
  bar();
}
function bar() { const b = document.getElementById('bar'); if (!b) return; b.classList.toggle('show', SEL.size > 0); document.getElementById('barInfo').textContent = SEL.size + ' selected'; }
async function del() { if (!confirm('Delete ' + SEL.size + ' leave type(s)? Used ones must be switched off instead.')) return; try { await Api.post(L.typesDelete, { ids: [...SEL] }); SEL = new Set(); await load(); SFA.toast('Deleted'); } catch (e) { SFA.toast(e.message, false); } }
function add() { form({ paid: true, annualQuota: 0, accrual: 'UPFRONT', carryForwardMax: 0, allowHalfDay: true, maxConsecutive: 0, maxPerMonth: 0, minNoticeDays: 0, backdateDays: 0, futureDays: 0, requiresReason: true, sandwich: false, allowNegative: false, autoApprove: false, minServiceMonths: 0, sortOrder: 0, active: true }); }
function edit(id) { form(ROWS.find(r => r.id === id)); }
function form(r) {
  CUR = r; document.getElementById('shT').textContent = r.id ? 'Edit ' + r.name : 'Add leave type';
  const t = (id, l, v, ty, hint) => `<div class="col-6 col-md-4"><label class="form-label">${l}</label><input class="form-control" id="f_${id}" type="${ty || 'text'}" value="${esc(v)}">${hint ? '<div class="small text-muted">' + hint + '</div>' : ''}</div>`;
  const sw = (id, l, v, hint) => `<div class="col-12 col-md-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="f_${id}" ${v ? 'checked' : ''}><label class="form-check-label" for="f_${id}">${l}</label></div>${hint ? '<div class="small text-muted">' + hint + '</div>' : ''}</div>`;
  document.getElementById('shB').innerHTML = `<div class="row g-3">${t('code', 'Code', r.code)}${t('name', 'Name', r.name)}${t('annualQuota', 'Days per year', r.annualQuota, 'number')}
   <div class="col-6 col-md-4"><label class="form-label">Accrual</label><select class="form-select" id="f_accrual"><option value="UPFRONT" ${r.accrual === 'UPFRONT' ? 'selected' : ''}>Whole year at start</option><option value="MONTHLY" ${r.accrual === 'MONTHLY' ? 'selected' : ''}>Monthly (quota / 12)</option></select></div>
   ${t('carryForwardMax', 'Carry forward (max days)', r.carryForwardMax, 'number')}${t('maxConsecutive', 'Max days at a time', r.maxConsecutive, 'number', '0 = no limit')}${t('maxPerMonth', 'Max days per month', r.maxPerMonth, 'number', '0 = no limit')}
   ${t('minNoticeDays', 'Notice (days before)', r.minNoticeDays, 'number')}${t('backdateDays', 'Back-date allowed (days)', r.backdateDays, 'number')}${t('futureDays', 'How far ahead (days)', r.futureDays, 'number', '0 = no limit')}
   ${t('minServiceMonths', 'Eligible after (months of service)', r.minServiceMonths, 'number')}${t('sortOrder', 'Order', r.sortOrder, 'number')}
   ${sw('paid', 'Paid leave', r.paid)}${sw('allowHalfDay', 'Half day allowed', r.allowHalfDay)}${sw('requiresReason', 'Reason is compulsory', r.requiresReason)}${sw('sandwich', 'Sandwich rule', r.sandwich, 'Weekly offs / holidays between leave days also count as leave')}
   ${sw('allowNegative', 'Allow when balance is over', r.allowNegative, 'The extra days become loss-of-pay')}${sw('autoApprove', 'Approve automatically', r.autoApprove)}${sw('active', 'Active', r.active)}
   <div class="col-12"><label class="form-label">Reason for this change</label><input class="form-control" id="f_reason" placeholder="kept in the audit log"></div></div>`;
  document.getElementById('shF').innerHTML = '<button class="ap-btn light" data-bs-dismiss="offcanvas">Cancel</button><button class="ap-btn go" onclick="save()"><i class="bi bi-check2"></i> Save</button>';
  sheet().show();
}
async function save() {
  const b = { id: CUR.id || null, reason: val('f_reason') };
  ['code','name','annualQuota','accrual','carryForwardMax','maxConsecutive','maxPerMonth','minNoticeDays','backdateDays','futureDays','minServiceMonths','sortOrder'].forEach(k => b[k] = val('f_' + k));
  ['paid','allowHalfDay','requiresReason','sandwich','allowNegative','autoApprove','active'].forEach(k => b[k] = chk('f_' + k));
  try { await Api.post(L.types, b); sheet().hide(); await load(); SFA.toast('Saved'); } catch (e) { SFA.toast(e.message, false); }
}

</script>
</body>
</html>
