<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; HR Settings</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="hrsettings" data-title="HR Settings"></div>
<template id="pageContent">
<div class="ap-app">
  <div class="ap-top"><div><h1 class="ap-title">HR Settings</h1><div class="text-muted small">Every rate, ceiling and rule is a dated setting - a change starts from a date you choose and the old value stays in the history</div></div></div>
  <div class="alert alert-warning py-2 small"><i class="bi bi-exclamation-triangle"></i> Statutory values were filled in from the requirements brief. <b>Please have a CA / labour-law consultant verify them</b> before running a real payroll.</div>
  <div id="body"></div>
  <div class="offcanvas offcanvas-bottom ap-sheet" tabindex="-1" id="sh" data-bs-backdrop="true">
    <div class="offcanvas-header"><h5 class="offcanvas-title" id="shT"></h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body" id="shB"></div><div class="ap-sheet-foot" id="shF"></div></div>
</div>
</template>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>

const H = API.master.hr;
const esc = (v) => SFA.esc(v == null ? '' : v);
const val = (id) => document.getElementById(id).value;
const chk = (id) => document.getElementById(id).checked;
const SHEETS = {};
function sheet(id) { return SHEETS[id] || (SHEETS[id] = new bootstrap.Offcanvas('#' + id)); }
async function askReason(label) { const r = prompt(label || 'Reason for this change (kept in the audit log)'); if (r == null) return null; if (!r.trim()) { SFA.toast('A reason is required', false); return null; } return r.trim(); }

let ROWS = [], CUR = null;
const fmtD = (d) => d ? new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
window.pageInit = async function () { await load(); };
async function load() {
  try { ROWS = await Api.get(H.settings); } catch (e) { document.getElementById('body').innerHTML = '<div class="ap-card ap-empty">' + esc(e.message) + '</div>'; return; }
  const groups = [...new Set(ROWS.map(r => r.group))];
  document.getElementById('body').innerHTML = groups.map(g => `<div class="ap-sec">${esc(g)}</div>` + ROWS.filter(r => r.group === g).map(r => `<div class="ap-card" style="cursor:pointer" onclick="open_('${r.key}')">
    <div class="d-flex align-items-center gap-2"><div class="flex-fill" style="min-width:0"><b>${esc(r.label)}</b><div class="small text-muted">${esc(r.help)}</div>
    ${r.nextFrom ? `<div class="small"><span class="ap-badge wait">From ${fmtD(r.nextFrom)}: ${esc(r.nextValue)} ${esc(r.unit)}</span></div>` : ''}</div>
    <div class="text-end"><div class="fs-5 fw-bold">${r.value == null ? '-' : esc(r.value)} <small class="text-muted">${esc(r.unit)}</small></div><div class="small text-muted">${r.effectiveFrom ? 'since ' + fmtD(r.effectiveFrom) : ''}</div></div></div></div>`).join('')).join('');
}
async function open_(key) {
  CUR = ROWS.find(r => r.key === key);
  document.getElementById('shT').textContent = CUR.label;
  let hist = [];
  try { hist = await Api.get(H.settingHistory, { query: { key } }); } catch (e) {}
  const today = new Date().toISOString().slice(0, 10);
  const input = CUR.type === 'ENUM' ? `<select class="form-select" id="s_val">${CUR.options.split(',').map(o => `<option ${o === CUR.value ? 'selected' : ''}>${o}</option>`).join('')}</select>`
    : CUR.type === 'BOOL' ? `<select class="form-select" id="s_val"><option value="true" ${CUR.value === 'true' ? 'selected' : ''}>Yes</option><option value="false" ${CUR.value === 'false' ? 'selected' : ''}>No</option></select>`
    : `<input class="form-control" id="s_val" value="${esc(CUR.value)}" inputmode="decimal">`;
  document.getElementById('shB').innerHTML = `<div class="small text-muted mb-2">${esc(CUR.help)}</div><div class="row g-3">
   <div class="col-12 col-md-4"><label class="form-label">New value ${CUR.unit ? '(' + esc(CUR.unit) + ')' : ''}</label>${input}</div>
   <div class="col-12 col-md-4"><label class="form-label">Applies from</label><input type="date" class="form-control" id="s_from" value="${today}"></div>
   <div class="col-12 col-md-4"><label class="form-label">Reason</label><input class="form-control" id="s_reason" placeholder="e.g. Govt notification dated ..."></div></div>
   <div class="ap-sec">History</div>` + (hist.map(h => `<div class="ap-card"><div class="d-flex"><b>${esc(h.value)} ${esc(CUR.unit)}</b><span class="ms-auto small text-muted">${fmtD(h.effectiveFrom)} → ${h.effectiveTo ? fmtD(h.effectiveTo) : 'open'}</span></div>
     <div class="small text-muted">${h.source === 'BRIEF' ? '<span class="ap-badge wait">Default - verify</span> ' : ''}${esc(h.reason)}${h.byName ? ' · ' + esc(h.byName) : ''}</div></div>`).join('') || '<div class="text-muted">No history</div>');
  document.getElementById('shF').innerHTML = '<button class="ap-btn light" data-bs-dismiss="offcanvas">Cancel</button><button class="ap-btn go" onclick="saveS()"><i class="bi bi-check2"></i> Save change</button>';
  sheet('sh').show();
}
async function saveS() {
  try { await Api.post(H.settings, { key: CUR.key, value: val('s_val'), effectiveFrom: val('s_from'), reason: val('s_reason') }); sheet('sh').hide(); await load(); SFA.toast('Saved'); } catch (e) { SFA.toast(e.message, false); }
}

</script>
</body>
</html>
