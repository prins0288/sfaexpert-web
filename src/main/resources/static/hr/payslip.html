<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* sub-path support: make relative css/js resolve under the deploy prefix */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salary Slip</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root { --ac: #d9441a; --ink: #111827; --mut: #6b7280; --line: #e3e6ec; --soft: #f6f7f9; }
    * { box-sizing: border-box; }
    body { background: #e9ecf1; font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: var(--ink); font-size: 12px; margin: 0; }
    .bar { max-width: 794px; margin: .75rem auto 0; display: flex; justify-content: flex-end; padding: 0 .5rem; }
    .slip { width: 794px; max-width: 100%; margin: .6rem auto 1.5rem; background: #fff; border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    .pad { padding: 0 28px; }
    .hd { display: flex; align-items: center; gap: 14px; padding: 20px 28px 16px; }
    .hd img { max-height: 54px; max-width: 150px; object-fit: contain; }
    .hd .co { flex: 1; min-width: 0; } .hd .co b { font-size: 17px; display: block; line-height: 1.2; } .hd .co span { color: var(--mut); font-size: 10.5px; display: block; line-height: 1.4; }
    .band { background: var(--ac); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 7px 28px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; }
    .band span { font-weight: 400; letter-spacing: 0; text-transform: none; opacity: .92; font-size: 11px; }
    .note { text-align: center; color: var(--mut); font-size: 10.5px; margin-top: 6px; }
    .top { display: flex; gap: 18px; margin-top: 14px; align-items: stretch; }
    .who { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 22px; align-content: start; }
    .who div { display: flex; gap: 6px; min-width: 0; } .who span { color: var(--mut); flex: 0 0 92px; } .who b { font-weight: 600; overflow-wrap: anywhere; }
    .pay { flex: 0 0 200px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .pay .amt { background: var(--soft); padding: 10px 12px; border-left: 4px solid var(--ac); } .pay .amt small { color: var(--mut); display: block; font-size: 10.5px; } .pay .amt b { font-size: 20px; letter-spacing: -.01em; }
    .pay .days { padding: 7px 12px; display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-size: 11px; } .pay .days span { color: var(--mut); } .pay .days b { text-align: right; font-weight: 600; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; align-items: start; }
    table.t { width: 100%; border-collapse: collapse; border: 1px solid var(--line); }
    table.t th { background: var(--soft); text-align: left; padding: 6px 10px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); border-bottom: 2px solid var(--ac); }
    table.t td { padding: 5px 10px; border-bottom: 1px solid var(--line); } table.t .r { text-align: right; font-variant-numeric: tabular-nums; }
    table.t tr.tot td { background: var(--soft); font-weight: 700; border-bottom: 0; }
    .net { margin-top: 14px; background: var(--soft); border: 1px solid var(--line); border-left: 4px solid var(--ac); padding: 9px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .net .w { font-size: 11px; color: var(--mut); } .net .w b { color: var(--ink); display: block; font-size: 12px; } .net .v { font-size: 18px; font-weight: 700; white-space: nowrap; }
    .er { margin-top: 10px; font-size: 10.5px; color: var(--mut); } .er b { color: var(--ink); font-weight: 600; }
    .ft { margin: 18px 0 0; padding: 10px 28px 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; font-size: 10px; color: var(--mut); gap: 12px; }
    .sign { border-top: 1px solid #9ca3af; padding-top: 3px; min-width: 150px; text-align: center; color: var(--ink); }
    .hold { background: #fef2f2; color: #991b1b; padding: 6px 10px; margin-top: 10px; font-weight: 600; border-radius: 4px; }
    @page { size: A4; margin: 10mm; }
    @media print { body { background: #fff; } .bar { display: none; } .slip { zoom: 1 !important; width: auto !important; max-width: none !important; margin: 0 !important; border: 0; box-shadow: none; } * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style>
</head>
<body>
<div class="bar"><button class="btn btn-dark btn-sm" onclick="window.print()">Print / Save as PDF</button></div>
<div class="slip" id="slip"><div class="text-muted">Loading…</div></div>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script>
  // opened without the account slot (/u/0): go to the same page under it, so the sign-in is found
  if (!/\/u\/\d+\//.test(location.pathname)) { location.replace(location.pathname.replace(/\/hr\/payslip\.html$/, '/u/0/hr/payslip.html') + location.search); }
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const money = (v) => Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const MON3 = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MON = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const fmtD = (d) => d ? new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
  function words(n) {   // Indian numbering, rupees and paise
    const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'], b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    const two = (x) => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
    const three = (x) => (x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : '');
    const r = Math.floor(n), p = Math.round((n - r) * 100);
    const parts = [[10000000, 'Crore'], [100000, 'Lakh'], [1000, 'Thousand']]; let rest = r, out = [];
    parts.forEach(([v, name]) => { if (rest >= v) { out.push(three(Math.floor(rest / v)) + ' ' + name); rest %= v; } });
    if (rest) out.push(three(rest));
    return 'Rupees ' + (out.join(' ') || 'Zero') + (p ? ' and ' + two(p) + ' Paise' : '') + ' only';
  }
  (async function () {
    const id = new URLSearchParams(location.search).get('id'), el = document.getElementById('slip');
    try {
      const d = await Api.get(API.master.hr.payroll.slip(id));
      let logo = '';
      try { const c = await Api.get(API.company.get); logo = c && c.logo ? c.logo : ''; } catch (e) { }
      const c = d.config, e = d.emp, co = d.company, on = (k) => !!c[k];
      document.documentElement.style.setProperty('--ac', c.accentColor || '#d9441a');
      const by = (t) => d.lines.filter(l => l.type === t);
      const earn = by('EARNING'), ded = by('DEDUCTION'), emp = by('EMPLOYER');
      const acct = e.accountNo ? 'XXXXXX' + String(e.accountNo).slice(-4) : '';
      const lastDay = new Date(d.year, d.month, 0).getDate();
      const kv = (k, v) => v == null || v === '' ? '' : `<div><span>${k}</span><b>${esc(v)}</b></div>`;   // empty fields are left out, not shown as "-"
      const tbl = (title, list, totLabel, tot) => `<table class="t"><thead><tr><th>${title}</th><th class="r">Amount (Rs)</th></tr></thead><tbody>${list.map(l => `<tr><td>${esc(l.name)}</td><td class="r">${money(l.amount)}</td></tr>`).join('') || '<tr><td colspan="2" style="color:var(--mut)">None</td></tr>'}<tr class="tot"><td>${totLabel}</td><td class="r">${money(tot)}</td></tr></tbody></table>`;
      el.innerHTML = `<div class="hd">${on('showLogo') && logo ? `<img src="${esc(logo)}" alt="">` : ''}<div class="co"><b>${esc(co.legalName || co.tradeName || '')}</b>${on('showAddress') && co.address ? `<span>${esc(co.address)}</span>` : ''}${co.pan || co.tan || co.pfCode || co.esiCode ? `<span>${[co.pan && 'PAN: ' + co.pan, co.tan && 'TAN: ' + co.tan, co.pfCode && 'PF: ' + co.pfCode, co.esiCode && 'ESI: ' + co.esiCode].filter(Boolean).map(esc).join(' &nbsp;·&nbsp; ')}</span>` : ''}</div></div>
        <div class="band"><div>${esc(c.title)} &nbsp;·&nbsp; ${MON[d.month]} ${d.year}</div><span>No. PS-${d.year}${String(d.month).padStart(2, '0')}-${String(d.id).padStart(5, '0')}</span></div>
        <div class="pad">${c.headerNote ? `<div class="note">${esc(c.headerNote)}</div>` : ''}${d.status === 'HELD' ? `<div class="hold">Salary on hold: ${esc(d.holdReason)}</div>` : ''}
        <div class="top"><div class="who">${kv('Employee', e.name)}${kv('Employee code', e.empCode)}${kv('Designation', e.designation)}${kv('Department', e.department)}${kv('Location', e.branch || e.hq)}${kv('Grade', e.grade)}${kv('Date of joining', fmtD(e.doj))}${kv('Pay period', '01 to ' + lastDay + ' ' + MON3[d.month] + ' ' + d.year)}
            ${on('showStatutoryIds') ? kv('PAN', e.pan) + kv('UAN', e.uan) + kv('PF number', e.pfNo) + kv('ESI number', e.esiNo) : ''}${on('showBank') ? kv('Bank', e.bank) + kv('Account no.', acct) : ''}</div>
          <div class="pay"><div class="amt"><small>Net pay</small><b>Rs ${money(d.net)}</b></div>${on('showAttendance') ? `<div class="days"><span>Days in month</span><b>${d.daysInMonth}</b><span>Paid days</span><b>${Number(d.paidDays)}</b><span>Loss of pay days</span><b>${Number(d.lopDays)}</b></div>` : ''}</div></div>
        <div class="two">${tbl('Earnings', earn, 'Gross earnings', d.gross)}${tbl('Deductions', ded, 'Total deductions', d.deductions)}</div>
        <div class="net"><div class="w"><b>Net pay = Gross earnings - Total deductions</b>${on('showNetInWords') ? words(Number(d.net)) : ''}</div><div class="v">Rs ${money(d.net)}</div></div>
        ${on('showEmployerContrib') && emp.length ? `<div class="er"><b>Employer contributions (not part of your pay):</b> ${emp.map(l => esc(l.name) + ' Rs ' + money(l.amount)).join(' &nbsp;·&nbsp; ')}</div>` : ''}</div>
        <div class="ft"><div>${esc(c.footerNote)}<br>Generated on ${new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}</div>${c.signatoryLabel ? `<div class="sign">${esc(c.signatoryLabel)}</div>` : ''}</div>`;
      if (window.innerWidth < 820) { el.style.width = '794px'; el.style.maxWidth = 'none'; el.style.zoom = (window.innerWidth - 8) / 794; el.style.margin = '4px 0'; }   // phone: the same page, scaled to fit
      document.title = 'Salary Slip - ' + e.name + ' - ' + MON[d.month] + ' ' + d.year;
    } catch (err) { el.innerHTML = '<div class="alert alert-danger mb-0">' + esc(err.message || 'Could not load the payslip') + '</div>'; }
  })();
</script>
</body>
</html>
