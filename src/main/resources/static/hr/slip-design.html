<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Salary Slip Design</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="slipdesign" data-title="Salary Slip Design"></div>
<template id="pageContent">
<div class="ap-app"><div class="ap-top"><div><h1 class="ap-title">Salary Slip Design</h1><div class="text-muted small">What the salary slip shows and how it looks. The logo is the company logo (Company Profile)</div></div></div><div class="ap-card" id="body"></div></div>
</template>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>

const S = API.master.hr.salary, P = API.master.hr.payroll;
const esc = (v) => SFA.esc(v == null ? '' : v);
const val = (id) => document.getElementById(id).value;
const chk = (id) => document.getElementById(id).checked;
let SHEET = null; const sheet = () => SHEET || (SHEET = new bootstrap.Offcanvas('#sh'));
const money = (v) => Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MON = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtD = (d) => d ? new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const ask = (t) => { const r = prompt(t); if (r == null) return null; if (!r.trim()) { SFA.toast('A reason is required', false); return null; } return r.trim(); };
const stBadge = (s) => `<span class="ap-badge ${s === 'GENERATED' || s === 'RELEASED' || s === 'APPROVED' || s === 'PAID' ? 'ok' : s === 'HELD' ? 'bad' : 'wait'}">${s}</span>`;

let CFGD = null;
window.pageInit = async function () {
  try { CFGD = await Api.get(P.design); } catch (e) { document.getElementById('body').innerHTML = esc(e.message); return; }
  const c = CFGD, sw = (id, l) => `<div class="col-12 col-md-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="d_${id}" ${c[id] ? 'checked' : ''}><label class="form-check-label" for="d_${id}">${l}</label></div></div>`;
  document.getElementById('body').innerHTML = `<div class="row g-3"><div class="col-12 col-md-6"><label class="form-label">Title</label><input class="form-control" id="d_title" value="${esc(c.title)}"></div><div class="col-12 col-md-3"><label class="form-label">Accent colour</label><input type="color" class="form-control form-control-color" id="d_accentColor" value="${esc(c.accentColor)}"></div>
   <div class="col-12 col-md-3"><label class="form-label">Signatory label</label><input class="form-control" id="d_signatoryLabel" value="${esc(c.signatoryLabel)}" placeholder="Authorised signatory"></div>
   <div class="col-12"><label class="form-label">Note under the heading</label><input class="form-control" id="d_headerNote" value="${esc(c.headerNote)}"></div><div class="col-12"><label class="form-label">Footer note</label><input class="form-control" id="d_footerNote" value="${esc(c.footerNote)}"></div>
   ${sw('showLogo', 'Company logo')}${sw('showAddress', 'Company address')}${sw('showAttendance', 'Days paid / loss of pay')}${sw('showStatutoryIds', 'PAN / UAN / PF / ESI numbers')}${sw('showBank', 'Bank account (last 4 digits)')}${sw('showEmployerContrib', 'Employer contributions')}${sw('showNetInWords', 'Net pay in words')}</div>
   <div class="mt-3 text-end"><button class="ap-btn go" onclick="save()"><i class="bi bi-check2"></i> Save design</button></div>`;
};
async function save() {
  const b = {}; ['title', 'accentColor', 'signatoryLabel', 'headerNote', 'footerNote'].forEach(k => b[k] = val('d_' + k)); ['showLogo', 'showAddress', 'showAttendance', 'showStatutoryIds', 'showBank', 'showEmployerContrib', 'showNetInWords'].forEach(k => b[k] = chk('d_' + k));
  try { await Api.post(P.design, b); SFA.toast('Saved - open any payslip to see it'); } catch (e) { SFA.toast(e.message, false); }
}

</script>
</body>
</html>
