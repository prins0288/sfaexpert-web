<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Employee Salary</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/app-ui.css" rel="stylesheet" />
  <script>
    /* Apply the saved theme (mode / layout / density / colours) BEFORE first
       paint so there is no flash. theme.js re-applies from the server after. */
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="empsalary" data-title="Employee Salary"></div>
<template id="pageContent">
<div class="ap-app"><div class="ap-top"><div><h1 class="ap-title">Employee Salary</h1><div class="text-muted small">Gross and the value of each head, from a date. A new revision keeps the old one in the history</div></div></div><input class="form-control mb-2" placeholder="Search name or code" oninput="load(this.value)"><div id="body"></div><div class="offcanvas offcanvas-bottom ap-sheet" tabindex="-1" id="sh" data-bs-backdrop="true"><div class="offcanvas-header"><h5 class="offcanvas-title" id="shT"></h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body" id="shB"></div><div class="ap-sheet-foot" id="shF"></div></div></div>
</template>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.colVis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>

const S = API.master.hr.salary, P = API.master.hr.payroll;
const esc = (v) => SFA.esc(v == null ? '' : v);
const val = (id) => document.getElementById(id).value;
const chk = (id) => document.getElementById(id).checked;
let SHEET = null; const sheet = () => SHEET || (SHEET = new bootstrap.Offcanvas('#sh'));
const money = (v) => Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MON = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtD = (d) => d ? new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const ask = (t) => { const r = prompt(t); if (r == null) return null; if (!r.trim()) { SFA.toast('A reason is required', false); return null; } return r.trim(); };
const stBadge = (s) => `<span class="ap-badge ${s === 'GENERATED' || s === 'RELEASED' || s === 'APPROVED' || s === 'PAID' ? 'ok' : s === 'HELD' ? 'bad' : 'wait'}">${s}</span>`;

let EMPS = [], D = null, CURE = null, T = null;
window.pageInit = async function () { await load(''); };
async function load(q) {
  try { EMPS = await Api.get(S.employees, { query: { q } }); } catch (e) { document.getElementById('body').innerHTML = '<div class="ap-card ap-empty">' + esc(e.message) + '</div>'; return; }
  document.getElementById('body').innerHTML = EMPS.map(e => `<div class="ap-card" style="cursor:pointer" onclick="open_('${esc(e.empId)}')"><div class="d-flex align-items-center gap-2"><div class="flex-fill" style="min-width:0"><b>${esc(e.name)}</b> <span class="text-muted">${esc(e.empCode)}</span><div class="small text-muted">${esc(e.designation)}</div></div>
    <div class="text-end">${e.gross == null ? '<span class="ap-badge wait">No salary</span>' : '<b>Rs ' + money(e.gross) + '</b><div class="small text-muted">since ' + fmtD(e.since) + '</div>'}</div><i class="bi bi-chevron-right text-muted"></i></div></div>`).join('') || '<div class="ap-card ap-empty">No employee</div>';
}
async function open_(empId) {
  CURE = empId; D = await Api.get(S.of(empId));
  const cur = D.revisions[0], valOf = (h) => { const v = cur && cur.values.find(x => x.headId === h.id); return v ? Number(v.value) : Number(h.defaultValue); };
  document.getElementById('shT').textContent = D.emp.name + ' (' + D.emp.empCode + ')';
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('shB').innerHTML = `<div class="row g-3"><div class="col-6"><label class="form-label">Gross salary a month (Rs)</label><input type="number" class="form-control" id="g_gross" value="${cur ? Number(cur.gross) : ''}" oninput="prev()"></div>
    <div class="col-6"><label class="form-label">Applies from</label><input type="date" class="form-control" id="g_from" value="${today}" oninput="prev()"></div>
    ${D.heads.slice().sort((a, b) => (a.headType === b.headType ? a.sortOrder - b.sortOrder : a.headType === 'EARNING' ? -1 : 1)).map(h => `<div class="col-6 col-md-4"><label class="form-label">${esc(h.name)} <small class="text-muted">${h.calcType === 'PERCENT' ? '% of ' + esc(h.calcBase) : h.calcType === 'BALANCE' ? '(balance)' : 'Rs'}</small></label>
      <input type="number" step="0.01" class="form-control hv" data-head="${h.id}" value="${h.calcType === 'BALANCE' ? 0 : valOf(h)}" ${h.calcType === 'BALANCE' ? 'readonly' : ''} oninput="prev()"></div>`).join('')}
    <div class="col-12"><label class="form-label">Reason</label><input class="form-control" id="g_reason" placeholder="e.g. joining / increment 2026"></div>
    <div class="col-12"><div id="g_prev"></div></div></div>
    <div class="ap-sec">History</div>` + (D.revisions.map(r => `<div class="ap-card"><div class="d-flex"><b>Rs ${money(r.gross)}</b><span class="ms-auto small text-muted">${fmtD(r.effectiveFrom)} → ${r.effectiveTo ? fmtD(r.effectiveTo) : 'open'}</span></div><div class="small text-muted">${esc(r.remarks)}</div></div>`).join('') || '<div class="text-muted">No salary yet</div>');
  document.getElementById('shF').innerHTML = '<button class="ap-btn light" data-bs-dismiss="offcanvas">Cancel</button><button class="ap-btn go" onclick="save()"><i class="bi bi-check2"></i> Save salary</button>';
  sheet().show(); prev();
}
const body = () => ({ gross: val('g_gross'), effectiveFrom: val('g_from'), values: [...document.querySelectorAll('.hv')].map(i => ({ headId: Number(i.dataset.head), value: i.value || 0 })), reason: val('g_reason') });
function prev() { clearTimeout(T); T = setTimeout(async () => {
  const el = document.getElementById('g_prev'); if (!el) return; const b = body(); if (!b.gross) { el.innerHTML = ''; return; }
  try {
    const p = await Api.post(S.preview(CURE), b);
    const rows = (t) => p.lines.filter(l => l.type === t).map(l => `<tr><td>${esc(l.name)}</td><td class="text-end">${money(l.amount)}</td></tr>`).join('');
    el.innerHTML = (p.warnings.length ? `<div class="alert alert-warning py-2 small">${p.warnings.map(esc).join('<br>')}</div>` : '') + `<div class="small text-muted mb-1">A full month (no leave) would look like:</div><table class="table table-sm mb-0"><tbody>${rows('EARNING')}<tr class="table-light fw-bold"><td>Gross</td><td class="text-end">${money(p.grossEarnings)}</td></tr>${rows('DEDUCTION')}<tr class="table-light fw-bold"><td>Net pay</td><td class="text-end">${money(p.net)}</td></tr></tbody></table><div class="small text-muted mt-1">Employer cost: Rs ${money(p.employerCost)}</div>`;
  } catch (e) { el.innerHTML = '<div class="alert alert-danger py-2 small mb-0">' + esc(e.message) + '</div>'; } }, 300); }
async function save() {
  try { const r = await Api.post(S.of(CURE), body()); sheet().hide(); await load(''); SFA.toast('Salary saved'); } catch (e) { SFA.toast(e.message, false); }
}

</script>
</body>
</html>
