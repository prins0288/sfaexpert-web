<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Sign in</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
  <script>
    /* Login is pre-auth (no user theme yet): honour the OS light/dark setting so
       the card matches the app the user is about to enter. */
    (function () {
      try {
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: linear-gradient(135deg,
             color-mix(in srgb, var(--sfa-primary) 82%, black),
             var(--sfa-primary-hover)); }
    .login-card { width: 380px; max-width: 92vw; background: var(--sfa-surface);
      border-radius: 16px; box-shadow: 0 18px 50px rgba(0,0,0,.35); overflow: hidden; }
    .login-head { background: var(--sfa-primary); color: #fff; padding: 24px; text-align: center; }
    .login-head .brand { font-size: 22px; font-weight: 700; }
    .login-head .brand i { color: var(--sfa-accent); }
    .login-body { padding: 26px; }
    .login-body .form-label { font-weight: 600; font-size: 13px; }
    .btn-login { background: var(--sfa-primary-hover); border: none; color: var(--sfa-primary-contrast); }
    .btn-login:hover { background: var(--sfa-primary); color: var(--sfa-primary-contrast); }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-head">
    <div class="brand"><i class="bi bi-graph-up-arrow"></i> StarSFA</div>
    <div class="small">Sales Force Automation</div>
  </div>
  <div class="login-body">
    <div id="error" class="alert alert-danger py-2 small" style="display:none"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" id="username" name="username" required autofocus placeholder="admin" value="acme" />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" id="password" name="password" type="password" required value="pass" />
      </div>
      <button class="btn btn-login w-100" type="submit" id="submitBtn">Login</button>
    </form>
    <p class="text-muted small mt-3 mb-0 text-center">Demo: acme &middot; globex &middot; initech / pass</p>
  </div>
</div>

<script src="/js/core/session.js"></script>
<script src="/js/core/endpoints.js"></script>
<script src="/js/core/http.js"></script>
<script>
  // Uses the shared Session store + global Api client (same modules as the app).
  const params = new URLSearchParams(location.search);
  const adding = params.has('add');

  // Already signed in and not explicitly adding another? Jump to the first account.
  if (Session.list().length && !adding) { location.replace('/u/0/dashboard.html'); }
  if (adding && Session.list().length) {
    const note = document.createElement('div');
    note.className = 'alert alert-info py-2 small';
    note.innerHTML = 'Adding another account (' + Session.list().length +
      ' already signed in). Your other accounts stay logged in.';
    document.querySelector('.login-body').prepend(note);
  }

  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';
    try {
      const data = await Api.post(API.auth.login, {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }, { noAuthRedirect: true });   // a bad-credentials 401 should show an error, not redirect
      const idx = Session.add(data.token);   // append (or replace same user+tenant)
      location.href = '/u/' + idx + '/dashboard.html';
    } catch (err) {
      errBox.textContent = err.message || 'Login failed';
      errBox.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Login';
    }
  });
</script>
</body>
</html>
