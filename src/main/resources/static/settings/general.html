<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Settings</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="settings" data-title="Settings"></div>

<template id="pageContent">
  <div class="row g-3">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-header"><i class="bi bi-calendar-date"></i> Date Format</div>
        <div class="card-body">
          <p class="text-muted small mb-3">
            Applies everywhere in the app — every date picker (masters, reports)
            and every report's date column, immediately, with no page-by-page setup.
          </p>
          <label class="form-label">Format</label>
          <select class="form-select mb-3" id="st_dateFormat">
            <option value="dd-MM-yyyy">dd-MM-yyyy (31-07-2026)</option>
            <option value="MM-dd-yyyy">MM-dd-yyyy (07-31-2026)</option>
            <option value="yyyy-MM-dd">yyyy-MM-dd (2026-07-31)</option>
            <option value="dd/MM/yyyy">dd/MM/yyyy (31/07/2026)</option>
            <option value="dd.MM.yyyy">dd.MM.yyyy (31.07.2026)</option>
          </select>
          <div class="mb-3">
            <label class="form-label">Preview</label>
            <div class="form-control-plaintext fw-bold" id="st_preview">&mdash;</div>
          </div>
          <button class="btn btn-primary" onclick="stgSaveDateFormat()"><i class="bi bi-check-lg"></i> Save</button>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card">
        <div class="card-header"><i class="bi bi-shield-lock"></i> Content Protection</div>
        <div class="card-body">
          <p class="text-muted small mb-2">
            One switch, applies everywhere: hides every report/master's <b>Excel</b> export
            button, and blocks right-click, copy/cut, text selection, and Ctrl/Cmd+C/X/S/P.
          </p>
          <p class="text-muted small mb-3">
            <i class="bi bi-info-circle"></i> <b>This is a deterrent for casual users, not real
            security.</b> No web page can truly block a browser's built-in developer tools —
            we only show a warning when it looks open. Anyone technical (view-source, disabling
            JavaScript, the network tab, etc.) can still get around all of this. Don't rely on
            it to keep data away from someone who shouldn't have API access in the first place.
          </p>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" role="switch" id="st_contentProtection" />
            <label class="form-check-label" for="st_contentProtection">Enabled</label>
          </div>
          <button class="btn btn-primary" onclick="stgSaveContentProtection()"><i class="bi bi-check-lg"></i> Save</button>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  window.pageInit = async function () {
    try {
      const s = await Settings.load();
      document.getElementById('st_dateFormat').value = s.dateFormat;
      document.getElementById('st_contentProtection').checked = (s.contentProtection === 'Y');
      updatePreview();
      document.getElementById('st_dateFormat').addEventListener('change', updatePreview);
    } catch (e) { SFA.toast(e.message, false); }
  };

  function updatePreview() {
    const fmt = document.getElementById('st_dateFormat').value;
    document.getElementById('st_preview').textContent = Settings.formatDate(new Date(), fmt);
  }

  async function stgSaveDateFormat() {
    const fmt = document.getElementById('st_dateFormat').value;
    try {
      await Api.post(API.settings.save, { dateFormat: fmt });
      await Settings.load(true);   // bypass cache — this tab must see the new value on its very next page too
      SFA.toast('Saved — every date picker and report now uses ' + fmt);
    } catch (e) { SFA.toast(e.message, false); }
  }

  async function stgSaveContentProtection() {
    const on = document.getElementById('st_contentProtection').checked;
    try {
      await Api.post(API.settings.save, { contentProtection: on ? 'Y' : 'N' });
      await Settings.load(true);
      SFA.toast('Saved — reload other open tabs/pages for it to take effect there too');
    } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
