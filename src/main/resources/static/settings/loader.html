<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Page Loader</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
  <style>
    /* The live preview mirrors the real loader overlay, boxed instead of full-screen. */
    .lp-preview{position:relative;min-height:200px;border:1px dashed var(--sfa-border,#e3e7ee);border-radius:12px;
      background:rgba(15,23,42,.16);display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .lp-current-img{max-height:60px;max-width:120px;object-fit:contain;border:1px solid var(--sfa-border,#e3e7ee);border-radius:8px;padding:4px;background:#fff;}
  </style>
</head>
<body>
<div id="app" data-page="loader" data-title="Page Loader"></div>

<template id="pageContent">
  <div class="row g-3">
    <!-- Settings -->
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header"><i class="bi bi-hourglass-split"></i> Page Loader</div>
        <div class="card-body">
          <p class="text-muted small mb-3">Customise the loading spinner shown while data loads. Applies to everyone in this company. Images are stored in the server's external file folder.</p>

          <label class="form-label fw-semibold">Style</label>
          <div class="mb-3">
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="ld_type" id="ld_type_spinner" value="spinner" onchange="lpRender()" />
              <label class="form-check-label" for="ld_type_spinner">Ring spinner</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="ld_type" id="ld_type_image" value="image" onchange="lpRender()" />
              <label class="form-check-label" for="ld_type_image">Custom image</label>
            </div>
          </div>

          <div id="ld_imageRow" class="mb-3">
            <label class="form-label">Image <span class="text-muted small">(PNG, JPG, GIF, SVG, WEBP)</span></label>
            <div class="d-flex align-items-center gap-3">
              <img id="ld_currentImg" class="lp-current-img" alt="" style="display:none" />
              <input type="file" class="form-control" id="ld_file" accept="image/*" onchange="lpFilePicked()" />
              <button type="button" class="btn btn-outline-danger btn-sm" id="ld_removeImg" onclick="lpRemoveImage()" style="display:none"><i class="bi bi-trash"></i> Remove</button>
            </div>
            <div class="form-text">A GIF animates on its own. For a still image, pick an animation below.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Animation</label>
            <select class="form-select" id="ld_anim" onchange="lpRender()">
              <option value="spin">Spin</option>
              <option value="pulse">Pulse</option>
              <option value="none">None (static)</option>
            </select>
            <div class="form-text">Applies to a custom image. The ring spinner always spins.</div>
          </div>

          <div class="mb-3">
            <label class="form-label d-block">Options</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="ld_round" onchange="lpRender()" />
              <label class="form-check-label" for="ld_round">Round image</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="ld_ring" onchange="lpRender()" />
              <label class="form-check-label" for="ld_ring">Spinning ring around image</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="ld_bar" onchange="lpRender()" />
              <label class="form-check-label" for="ld_bar">Progress bar</label>
            </div>
            <div class="form-text">"Spinning ring" = a round logo with an arc circling it (branded splash, like OptCRM).</div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label">Size <span class="text-muted small">(px)</span></label>
              <input type="number" class="form-control" id="ld_size" min="16" max="200" step="2" value="56" oninput="lpRender()" />
            </div>
            <div class="col-sm-6">
              <label class="form-label">Speed <span class="text-muted small">(ms per cycle)</span></label>
              <input type="number" class="form-control" id="ld_speed" min="200" max="4000" step="50" value="800" oninput="lpRender()" />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Loading text <span class="text-muted small">(optional)</span></label>
            <input type="text" class="form-control" id="ld_text" maxlength="80" placeholder="e.g. Loading, please wait…" oninput="lpRender()" />
          </div>

          <div class="d-flex gap-2">
            <button class="btn btn-primary" onclick="lpSave()"><i class="bi bi-check-lg"></i> Save</button>
            <button class="btn btn-outline-secondary" onclick="lpReload()"><i class="bi bi-arrow-counterclockwise"></i> Reset changes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Live preview -->
    <div class="col-lg-5">
      <div class="card">
        <div class="card-header"><i class="bi bi-eye"></i> Live preview</div>
        <div class="card-body">
          <div class="lp-preview"><div id="lp_box"></div></div>
          <p class="text-muted small mt-2 mb-0">This is exactly how the loader will look app-wide.</p>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let CFG = { type: 'spinner', anim: 'spin', size: 56, speed: 800, text: '', hasImage: false, imageName: '', companyCode: '' };
  let pickedFile = null;      // a newly-selected file, not yet uploaded
  let removeImage = false;    // user asked to remove the current image

  window.pageInit = async function () {
    await lpReload();
  };

  async function lpReload() {
    try {
      CFG = await Api.get(API.loader.get);
      pickedFile = null; removeImage = false;
      document.getElementById('ld_file').value = '';
      document.getElementById(CFG.type === 'image' ? 'ld_type_image' : 'ld_type_spinner').checked = true;
      document.getElementById('ld_anim').value = CFG.anim || 'spin';
      document.getElementById('ld_size').value = CFG.size || 56;
      document.getElementById('ld_speed').value = CFG.speed || 800;
      document.getElementById('ld_text').value = CFG.text || '';
      document.getElementById('ld_round').checked = !!CFG.round;
      document.getElementById('ld_ring').checked = !!CFG.ring;
      document.getElementById('ld_bar').checked = !!CFG.bar;
      lpRender();
    } catch (e) { SFA.toast(e.message, false); }
  }

  function currentImageUrl() {
    if (CFG.hasImage && CFG.imageName && CFG.companyCode) {
      return Session.ctx() + API.loader.publicImage +
        '?companyCode=' + encodeURIComponent(CFG.companyCode) + '&file=' + encodeURIComponent(CFG.imageName) + '&v=' + Date.now();
    }
    return '';
  }

  function lpFilePicked() {
    const f = document.getElementById('ld_file').files[0];
    pickedFile = f || null;
    removeImage = false;
    if (pickedFile) document.getElementById('ld_type_image').checked = true;
    lpRender();
  }

  function lpRemoveImage() {
    removeImage = true; pickedFile = null;
    document.getElementById('ld_file').value = '';
    document.getElementById('ld_type_spinner').checked = true;
    lpRender();
  }

  // Build the preview from the current control values (no server round-trip).
  function lpRender() {
    const type = document.querySelector('input[name="ld_type"]:checked').value;
    const anim = document.getElementById('ld_anim').value;
    const size = parseInt(document.getElementById('ld_size').value, 10) || 56;
    const speed = parseInt(document.getElementById('ld_speed').value, 10) || 800;
    const text = document.getElementById('ld_text').value;
    const round = document.getElementById('ld_round').checked;
    const ring = document.getElementById('ld_ring').checked;
    const bar = document.getElementById('ld_bar').checked;

    // image source for preview: freshly picked file (data URL) > existing image (unless removed)
    const finishRender = (imgSrc) => {
      let visual;
      if (type === 'image' && imgSrc) {
        const rc = round ? ' round' : '';
        const onerr = ' onerror="sfaLoaderImgFallback && sfaLoaderImgFallback(this)"';
        if (ring) {
          visual = '<div class="sfa-loader-ring"><img class="sfa-loader-img anim-none' + rc + '" src="' + imgSrc + '"' + onerr + ' alt="" /></div>';
        } else {
          visual = '<img class="sfa-loader-img anim-' + anim + rc + '" src="' + imgSrc + '"' + onerr + ' alt="" />';
        }
      } else {
        visual = '<div class="sfa-loader-spinner"></div>';
      }
      const t = text ? '<div class="sfa-loader-text">' + SFA.esc(text) + '</div>' : '';
      const b = bar ? '<div class="sfa-loader-bar"></div>' : '';
      const box = document.getElementById('lp_box');
      box.className = 'sfa-loader-box';
      box.style.setProperty('--sfa-loader-size', size + 'px');
      box.style.setProperty('--sfa-loader-speed', speed + 'ms');
      box.innerHTML = visual + t + b;
    };

    // current-image thumbnail + remove button state
    const cur = document.getElementById('ld_currentImg');
    const rm = document.getElementById('ld_removeImg');
    const showExisting = CFG.hasImage && !removeImage && !pickedFile;
    cur.style.display = showExisting ? '' : 'none';
    rm.style.display = (CFG.hasImage && !removeImage) ? '' : 'none';
    if (showExisting) cur.src = currentImageUrl();

    if (pickedFile) {
      const reader = new FileReader();
      reader.onload = () => finishRender(reader.result);
      reader.readAsDataURL(pickedFile);
    } else if (type === 'image' && !removeImage) {
      finishRender(currentImageUrl());
    } else {
      finishRender('');
    }
  }

  async function lpSave() {
    const type = document.querySelector('input[name="ld_type"]:checked').value;
    const body = {
      type: type,
      anim: document.getElementById('ld_anim').value,
      size: String(parseInt(document.getElementById('ld_size').value, 10) || 56),
      speed: String(parseInt(document.getElementById('ld_speed').value, 10) || 800),
      text: document.getElementById('ld_text').value || '',
      round: document.getElementById('ld_round').checked,
      ring: document.getElementById('ld_ring').checked,
      bar: document.getElementById('ld_bar').checked
    };
    try {
      if (removeImage) { await Api.del(API.loader.image); }
      if (pickedFile) { await Api.upload(API.loader.image, pickedFile); }
      await Api.post(API.loader.save, body);
      SFA.toast('Loader saved');
      if (window.SFALoader) SFALoader.refresh();   // update the live global loader now
      await lpReload();
    } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
