<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; AI Settings</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="ai-settings" data-title="AI Settings"></div>

<template id="pageContent">
  <div class="row g-3">
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header"><i class="bi bi-robot"></i> AI provider &amp; key</div>
        <div class="card-body">
          <p class="text-muted small mb-3">
            Choose the AI provider and paste its API key. The assistant answers questions from THIS
            company's data (read-only). Each company can use its own provider/key; a super-admin can
            also set an app-wide default.
          </p>

          <div id="scopeRow" class="mb-3" hidden>
            <label class="form-label">Scope</label>
            <select id="ai_scope" class="form-select">
              <option value="tenant">This company only</option>
              <option value="global">App-wide default (all companies)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Provider</label>
            <select id="ai_provider" class="form-select"></select>
          </div>

          <div class="mb-3">
            <label class="form-label">Default model</label>
            <select id="ai_model" class="form-select"></select>
            <div class="form-text">Users can switch models on the chat page too.</div>
          </div>

          <div class="mb-3">
            <label class="form-label">API key</label>
            <input type="password" id="ai_key" class="form-control" autocomplete="off" placeholder="Paste API key" />
            <div class="form-text" id="ai_keyHint"></div>
          </div>

          <button class="btn btn-primary" onclick="saveAi()"><i class="bi bi-check-lg"></i> Save</button>
          <a class="btn btn-outline-secondary" id="openChat"><i class="bi bi-chat-dots"></i> Open assistant</a>
        </div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="card">
        <div class="card-header"><i class="bi bi-shield-lock"></i> How it stays safe</div>
        <div class="card-body small text-muted">
          <ul class="mb-0">
            <li>The AI only ever runs <b>read-only SELECT</b> queries, one statement at a time.</li>
            <li>Writes / DDL / system schemas are blocked; results are row-capped.</li>
            <li>Queries hit only the logged-in company's database.</li>
            <li>API keys are stored server-side and never sent back to the browser.</li>
            <li>The assistant is available to Admin / Manager / Super-admin.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let meta = null;

  window.pageInit = async function () {
    document.getElementById('openChat').href = Session.uUrl(Session.activeIndex(), 'ai/chat.html');
    const isSuper = (Session.claims().role === 'SUPER_ADMIN');
    document.getElementById('scopeRow').hidden = !isSuper;

    try {
      meta = await Api.get(API.ai.meta);
      const psel = document.getElementById('ai_provider');
      (meta.providers || []).forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.label; psel.appendChild(o); });
      psel.addEventListener('change', fillModels);
      document.getElementById('ai_scope').addEventListener('change', loadScope);
      await loadScope();
    } catch (e) { SFA.toast(e.message, false); }
  };

  function providerModels(id) {
    const p = (meta.providers || []).find(x => x.id === id);
    return (p && p.models) || [];
  }

  function fillModels(selected) {
    const id = document.getElementById('ai_provider').value;
    const msel = document.getElementById('ai_model');
    msel.innerHTML = '';
    providerModels(id).forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; msel.appendChild(o); });
    const want = (typeof selected === 'string') ? selected : null;
    if (want && !providerModels(id).includes(want)) { const o = document.createElement('option'); o.value = want; o.textContent = want; msel.appendChild(o); }
    if (want) msel.value = want;
  }

  async function loadScope() {
    const scope = document.getElementById('ai_scope').value || 'tenant';
    try {
      const cfg = await Api.get(API.ai.settings, { query: { scope } });
      if (cfg.provider) document.getElementById('ai_provider').value = cfg.provider;
      fillModels(cfg.model);
      document.getElementById('ai_key').value = '';
      document.getElementById('ai_keyHint').textContent = cfg.hasKey ? 'A key is already saved — leave blank to keep it.' : 'No key saved yet.';
    } catch (e) { SFA.toast(e.message, false); }
  }

  async function saveAi() {
    const body = {
      scope: document.getElementById('ai_scope').value || 'tenant',
      provider: document.getElementById('ai_provider').value,
      model: document.getElementById('ai_model').value,
      apiKey: document.getElementById('ai_key').value
    };
    try {
      await Api.post(API.ai.settings, body);
      document.getElementById('ai_key').value = '';
      SFA.toast('AI settings saved');
      await loadScope();
    } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
