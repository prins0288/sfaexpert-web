<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Branding</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
  <style>
    .logo-box { height: 120px; border: 1px dashed var(--sfa-border); border-radius: 10px;
      display: grid; place-items: center; background: var(--sfa-surface-2); overflow: hidden; }
    .logo-box img { max-height: 104px; max-width: 100%; object-fit: contain; }
    .logo-box .none { color: var(--sfa-text-muted); font-size: 13px; }
  </style>
</head>
<body>
<div id="app" data-page="branding" data-title="Branding &amp; Logos"></div>

<template id="pageContent">
  <div class="row g-3">
    <!-- company profile + logo -->
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header"><i class="bi bi-building"></i> Company profile &amp; logo
          <div class="card-tools"><small class="text-muted">this tenant</small></div>
        </div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Company logo</label>
              <div class="logo-box mb-2" id="companyLogoBox"><span class="none">No logo</span></div>
              <input type="file" id="companyFile" accept="image/*" class="form-control form-control-sm mb-2" />
              <div class="d-flex gap-2">
                <button class="btn btn-sm btn-primary" onclick="uploadCompanyLogo()"><i class="bi bi-upload"></i> Upload</button>
                <button class="btn btn-sm btn-outline-danger" onclick="removeCompanyLogo()"><i class="bi bi-trash"></i></button>
              </div>
            </div>
            <div class="col-md-8">
              <form onsubmit="saveCompany(event)"><div class="row g-2">
                <div class="col-12"><label class="form-label">Company name</label>
                  <input class="form-control" id="c_companyName" /></div>
                <div class="col-md-8"><label class="form-label">Address</label>
                  <input class="form-control" id="c_address" /></div>
                <div class="col-md-4"><label class="form-label">City</label>
                  <input class="form-control" id="c_city" /></div>
                <div class="col-md-4"><label class="form-label">Phone</label>
                  <input class="form-control" id="c_phone" /></div>
                <div class="col-md-4"><label class="form-label">Email</label>
                  <input class="form-control" id="c_email" /></div>
                <div class="col-md-4"><label class="form-label">Website</label>
                  <input class="form-control" id="c_website" /></div>
                <div class="col-12 mt-2"><button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Save company</button></div>
              </div></form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- default logo -->
    <div class="col-lg-5">
      <div class="card">
        <div class="card-header"><i class="bi bi-image"></i> Default logo
          <div class="card-tools"><small class="text-muted">app-wide fallback</small></div>
        </div>
        <div class="card-body">
          <p class="text-muted small">App-wide default (super-admin). Shown wherever a tenant has not set its own
            company logo — e.g. the sign-in page (before any tenant is known). Stored as a file, not in the DB.</p>
          <div class="mb-3">
            <label class="form-label">Application name</label>
            <div class="input-group">
              <input class="form-control" id="d_appName" placeholder="StarSFA" />
              <button class="btn btn-outline-primary" onclick="saveAppName()"><i class="bi bi-check-lg"></i> Save</button>
            </div>
          </div>
          <label class="form-label">Default logo</label>
          <div class="logo-box mb-2" id="defaultLogoBox"><span class="none">No logo</span></div>
          <input type="file" id="defaultFile" accept="image/*" class="form-control form-control-sm mb-2" />
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-primary" onclick="uploadDefaultLogo()"><i class="bi bi-upload"></i> Upload</button>
            <button class="btn btn-sm btn-outline-danger" onclick="removeDefaultLogo()"><i class="bi bi-trash"></i> Remove</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  window.pageInit = async function () {
    try {
      const [company, branding] = await Promise.all([Api.get(API.company.get), Api.get(API.branding.get)]);
      document.getElementById('c_companyName').value = company.companyName || '';
      document.getElementById('c_address').value = company.address || '';
      document.getElementById('c_city').value = company.city || '';
      document.getElementById('c_phone').value = company.phone || '';
      document.getElementById('c_email').value = company.email || '';
      document.getElementById('c_website').value = company.website || '';
      document.getElementById('d_appName').value = branding.appName || '';
      setBox('companyLogoBox', company.logo);
      setBox('defaultLogoBox', branding.defaultLogo);   // now a served URL, not base64
    } catch (e) { SFA.toast(e.message, false); }
  };

  function setBox(boxId, dataUri) {
    const box = document.getElementById(boxId);
    box.innerHTML = dataUri ? `<img src="${dataUri}" alt="logo" />` : '<span class="none">No logo</span>';
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error('Could not read the file'));
      r.readAsDataURL(file);
    });
  }

  // Live preview when a file is chosen — DELEGATED on document so it works even
  // though the inputs start life inside the shell's <template> (only injected
  // into the live DOM later). A direct getElementById(...) at parse time is null.
  document.addEventListener('change', async function (e) {
    const box = { companyFile: 'companyLogoBox', defaultFile: 'defaultLogoBox' }[e.target && e.target.id];
    if (!box) return;
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 8 * 1024 * 1024) { SFA.toast('Please choose an image under 8 MB', false); e.target.value = ''; return; }
    try { setBox(box, await fileToDataUrl(f)); } catch (_) {}
  });

  // Read the chosen file at CLICK time (robust — no reliance on a pre-read value).
  async function uploadLogo(inputId, endpoint, label) {
    const f = document.getElementById(inputId).files[0];
    if (!f) { SFA.toast('Choose an image first', false); return; }
    if (f.size > 8 * 1024 * 1024) { SFA.toast('Please choose an image under 8 MB', false); return; }
    try { await Api.post(endpoint, { image: await fileToDataUrl(f) }); SFA.toast(label + ' updated'); refreshChrome(); }
    catch (e) { SFA.toast(e.message, false); }
  }
  function uploadCompanyLogo() { return uploadLogo('companyFile', API.company.logo, 'Company logo'); }

  // Default (app-wide) logo is a FILE, not base64 — multipart upload, super-admin only.
  async function uploadDefaultLogo() {
    const f = document.getElementById('defaultFile').files[0];
    if (!f) { SFA.toast('Choose an image first', false); return; }
    if (f.size > 8 * 1024 * 1024) { SFA.toast('Please choose an image under 8 MB', false); return; }
    try { const r = await Api.upload(API.branding.defaultLogo, f); setBox('defaultLogoBox', r && r.defaultLogo);
      SFA.toast('Default logo updated'); refreshChrome(); }
    catch (e) { SFA.toast(e.message, false); }
  }

  async function saveAppName() {
    try { await Api.post(API.branding.appName, { appName: document.getElementById('d_appName').value });
      SFA.toast('Application name saved'); refreshChrome(); }
    catch (e) { SFA.toast(e.message, false); }
  }

  async function removeCompanyLogo() {
    if (!confirm('Remove the company logo?')) return;
    try { await Api.post(API.company.logo, { image: '' }); setBox('companyLogoBox', null);
      document.getElementById('companyFile').value = ''; SFA.toast('Removed'); refreshChrome(); }
    catch (e) { SFA.toast(e.message, false); }
  }
  async function removeDefaultLogo() {
    if (!confirm('Remove the default logo?')) return;
    try { await Api.del(API.branding.defaultLogo); setBox('defaultLogoBox', null);
      document.getElementById('defaultFile').value = ''; SFA.toast('Removed'); refreshChrome(); }
    catch (e) { SFA.toast(e.message, false); }
  }

  async function saveCompany(ev) {
    ev.preventDefault();
    const v = id => { const x = document.getElementById(id).value; return x === '' ? null : x; };
    const body = {
      companyName: v('c_companyName'), address: v('c_address'), city: v('c_city'),
      phone: v('c_phone'), email: v('c_email'), website: v('c_website')
    };
    try { await Api.post(API.company.save, body); SFA.toast('Company saved'); refreshChrome(); }
    catch (e) { SFA.toast(e.message, false); }
  }

  function refreshChrome() { if (window.Shell && Shell.refreshIdentity) Shell.refreshIdentity(); }
</script>
</body>
</html>
