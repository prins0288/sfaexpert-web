<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; My Profile</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
  <style>
    .sfa-photo { width: 132px; height: 132px; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--sfa-border); background: var(--sfa-surface-2); display: block; }
    .sfa-photo-wrap { position: relative; width: 132px; }
  </style>
</head>
<body>
<div id="app" data-page="profile" data-title="My Profile"></div>

<template id="pageContent">
  <div class="row g-3">
    <!-- photo + password -->
    <div class="col-lg-4">
      <div class="card mb-3">
        <div class="card-header"><i class="bi bi-person-badge"></i> Photo</div>
        <div class="card-body text-center">
          <div class="sfa-photo-wrap mx-auto mb-3">
            <img id="photoImg" class="sfa-photo" alt="photo" />
          </div>
          <div id="photoName" class="fw-semibold"></div>
          <div id="photoRole" class="text-muted small mb-3"></div>
          <input type="file" id="photoFile" accept="image/*" class="form-control form-control-sm mb-2" />
          <div class="d-flex gap-2 justify-content-center">
            <button class="btn btn-sm btn-primary" onclick="uploadPhoto()"><i class="bi bi-upload"></i> Upload</button>
            <button class="btn btn-sm btn-outline-danger" onclick="removePhoto()"><i class="bi bi-trash"></i> Remove</button>
          </div>
          <div class="form-text mt-2">JPG / PNG, up to a few MB.</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><i class="bi bi-key"></i> Change password</div>
        <div class="card-body">
          <form onsubmit="changePassword(event)">
            <div class="mb-2"><label class="form-label">Current password <span class="required-star">*</span></label>
              <input class="form-control" id="pw_current" type="password" required /></div>
            <div class="mb-2"><label class="form-label">New password <span class="required-star">*</span></label>
              <input class="form-control" id="pw_new" type="password" required minlength="4" /></div>
            <div class="mb-3"><label class="form-label">Confirm new password <span class="required-star">*</span></label>
              <input class="form-control" id="pw_confirm" type="password" required /></div>
            <button class="btn btn-primary w-100" type="submit">Update password</button>
          </form>
        </div>
      </div>
    </div>

    <!-- details -->
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header"><i class="bi bi-pencil-square"></i> Profile details
          <div class="card-tools"><span class="badge bg-secondary" id="p_username"></span></div>
        </div>
        <div class="card-body">
          <form onsubmit="saveProfile(event)"><div class="row g-3">
            <div class="col-md-6"><label class="form-label">Full name <span class="required-star">*</span></label>
              <input class="form-control" id="p_name" required /></div>
            <div class="col-md-6"><label class="form-label">Employee ID</label>
              <input class="form-control" id="p_empId" readonly /></div>
            <div class="col-md-4"><label class="form-label">Designation</label>
              <select class="form-select" id="p_designationOid"></select></div>
            <div class="col-md-4"><label class="form-label">State</label>
              <select class="form-select" id="p_stateOid"></select></div>
            <div class="col-md-4"><label class="form-label">District</label>
              <select class="form-select" id="p_districtOid"></select></div>
            <div class="col-md-4"><label class="form-label">Mobile</label>
              <input class="form-control" id="p_mobile" /></div>
            <div class="col-md-4"><label class="form-label">Email</label>
              <input class="form-control" id="p_email" type="email" /></div>
            <div class="col-md-4"><label class="form-label">Date of birth</label>
              <input class="form-control sfa-date" id="p_dob" type="text" /></div>
            <div class="col-12"><button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Save profile</button></div>
          </div></form>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  const FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="132" height="132"><rect width="100%" height="100%" fill="#e3e7ee"/>' +
    '<text x="50%" y="54%" font-size="60" text-anchor="middle" fill="#8b9ab1" font-family="Arial">?</text></svg>');
  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error('Could not read the file'));
      r.readAsDataURL(file);
    });
  }

  window.pageInit = async function () {
    try {
      const [lk, me] = await Promise.all([Api.get(API.lookups), Api.get(API.profile.get)]);
      SFA.fillSelect(document.getElementById('p_designationOid'), lk.designations);
      SFA.fillSelect(document.getElementById('p_stateOid'), lk.states);
      SFA.fillSelect(document.getElementById('p_districtOid'), lk.districts);
      fill(me);
    } catch (e) { SFA.toast(e.message, false); }
  };

  function fill(me) {
    document.getElementById('photoImg').src = me.photo || FALLBACK;
    document.getElementById('photoName').textContent = me.name || me.username || '';
    document.getElementById('photoRole').textContent = me.role || '';
    document.getElementById('p_username').textContent = '@' + (me.username || '');
    document.getElementById('p_name').value = me.name || '';
    document.getElementById('p_empId').value = me.empId || '';
    document.getElementById('p_designationOid').value = me.designationOid || '';
    document.getElementById('p_stateOid').value = me.stateOid || '';
    document.getElementById('p_districtOid').value = me.districtOid || '';
    document.getElementById('p_mobile').value = me.mobile || '';
    document.getElementById('p_email').value = me.email || '';
    sfaSetDate('p_dob', me.dob);
  }

  // live preview when a file is chosen — delegated so it works for the
  // shell-injected content (the input is inside <template> until then).
  document.addEventListener('change', async function (e) {
    if (!e.target || e.target.id !== 'photoFile') return;
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 8 * 1024 * 1024) { SFA.toast('Please choose an image under 8 MB', false); e.target.value = ''; return; }
    try { document.getElementById('photoImg').src = await fileToDataUrl(f); } catch (_) {}
  });

  // read the chosen file at CLICK time (robust: no reliance on a pre-read value)
  async function uploadPhoto() {
    const f = document.getElementById('photoFile').files[0];
    if (!f) { SFA.toast('Choose an image first', false); return; }
    if (f.size > 8 * 1024 * 1024) { SFA.toast('Please choose an image under 8 MB', false); return; }
    try {
      const dataUri = await fileToDataUrl(f);
      await Api.post(API.profile.photo, { image: dataUri });
      document.getElementById('photoImg').src = dataUri;
      SFA.toast('Photo updated'); refreshChrome();
    } catch (e) { SFA.toast(e.message, false); }
  }
  async function removePhoto() {
    if (!confirm('Remove your profile photo?')) return;
    try {
      await Api.post(API.profile.photo, { image: '' });
      document.getElementById('photoImg').src = FALLBACK;
      document.getElementById('photoFile').value = '';
      SFA.toast('Photo removed'); refreshChrome();
    } catch (e) { SFA.toast(e.message, false); }
  }

  async function saveProfile(ev) {
    ev.preventDefault();
    const v = id => { const x = document.getElementById(id).value; return x === '' ? null : x; };
    const body = {
      name: v('p_name'), designationOid: v('p_designationOid'), stateOid: v('p_stateOid'),
      districtOid: v('p_districtOid'), mobile: v('p_mobile'), email: v('p_email'), dob: v('p_dob')
    };
    try { await Api.post(API.profile.save, body); SFA.toast('Profile saved'); refreshChrome(); }
    catch (e) { SFA.toast(e.message, false); }
  }

  async function changePassword(ev) {
    ev.preventDefault();
    const cur = document.getElementById('pw_current').value;
    const nw = document.getElementById('pw_new').value;
    const cf = document.getElementById('pw_confirm').value;
    if (nw !== cf) { SFA.toast('New passwords do not match', false); return; }
    try {
      await Api.post(API.profile.password, { currentPassword: cur, newPassword: nw });
      ['pw_current', 'pw_new', 'pw_confirm'].forEach(id => document.getElementById(id).value = '');
      SFA.toast('Password updated');
    } catch (e) { SFA.toast(e.message, false); }
  }

  // let the shell re-read the photo into the header avatar
  function refreshChrome() { if (window.Shell && Shell.refreshIdentity) Shell.refreshIdentity(); }
</script>
</body>
</html>
