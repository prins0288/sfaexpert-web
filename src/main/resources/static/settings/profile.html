<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; My Profile</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        // theme is PER TENANT and several tenants can be signed in at once
        // (/u/0, /u/1...), so these caches are scoped to the account slot —
        // a shared key would paint the last-customised tenant's colours here.
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
  <style>
    .pf-hero { display: flex; align-items: center; gap: 1.1rem; flex-wrap: wrap; }
    .pf-photo { position: relative; width: 112px; height: 112px; flex: 0 0 auto; }
    .pf-photo img { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; border: 3px solid var(--sfa-border); background: var(--sfa-surface-2); display: block; }
    .pf-photo .pf-cam { position: absolute; right: 0; bottom: 0; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--sfa-surface); background: var(--sfa-primary); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .pf-name { font-size: 1.35rem; font-weight: 700; line-height: 1.2; } .pf-sub { color: var(--bs-secondary-color); }
    .pf-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .75rem 1.25rem; }
    .pf-info .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: var(--bs-secondary-color); font-weight: 600; } .pf-info .v { font-weight: 600; word-break: break-word; }
    .pf-lock { color: var(--bs-secondary-color); font-size: .75rem; }
  </style>
</head>
<body>
<div id="app" data-page="profile" data-title="My Profile"></div>
<template id="pageContent">
  <div class="card mb-3"><div class="card-body"><div class="pf-hero">
    <div class="pf-photo"><img id="photoImg" alt="photo" /><label class="pf-cam" for="photoFile" title="Change photo"><i class="bi bi-camera-fill"></i></label><input type="file" id="photoFile" accept="image/*" class="d-none" /></div>
    <div class="flex-grow-1"><div class="pf-name" id="photoName"></div><div class="pf-sub"><span id="photoRole"></span> <span class="badge bg-secondary" id="p_username"></span></div>
      <div class="d-flex gap-2 mt-2 flex-wrap"><button class="btn btn-sm btn-primary" onclick="document.getElementById('photoFile').click()"><i class="bi bi-image"></i> Choose photo</button>
        <button class="btn btn-sm btn-outline-danger" onclick="removePhoto()"><i class="bi bi-trash"></i> Remove</button></div>
      <div class="form-text">JPG / PNG, up to 8 MB. The photo is saved as soon as you choose it.</div></div>
  </div></div></div>

  <div class="row g-3">
    <div class="col-lg-6"><div class="card h-100">
      <div class="card-header"><i class="bi bi-person-vcard"></i> Work details <span class="pf-lock ms-2"><i class="bi bi-lock-fill"></i> set by your admin, cannot be changed here</span></div>
      <div class="card-body"><div class="pf-info">
        <div><div class="k">Employee code</div><div class="v" id="i_code">-</div></div>
        <div><div class="k">Designation</div><div class="v" id="i_des">-</div></div>
        <div><div class="k">HQ</div><div class="v" id="i_hq">-</div></div>
        <div><div class="k">State</div><div class="v" id="i_state">-</div></div>
        <div><div class="k">Reporting manager</div><div class="v" id="i_mgr">-</div></div>
        <div><div class="k">Date of joining</div><div class="v" id="i_doj">-</div></div>
      </div></div></div></div>

    <div class="col-lg-6"><div class="card h-100">
      <div class="card-header"><i class="bi bi-pencil-square"></i> Basic details</div>
      <div class="card-body"><form onsubmit="saveProfile(event)"><div class="row g-3">
        <div class="col-12"><label class="form-label">Full name <span class="required-star">*</span></label><input class="form-control" id="p_name" maxlength="100" required /></div>
        <div class="col-md-6"><label class="form-label">Mobile</label><input class="form-control" id="p_mobile" inputmode="numeric" maxlength="10" placeholder="10 digit number" /></div>
        <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" id="p_email" type="email" maxlength="120" /></div>
        <div class="col-12"><button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Save</button></div>
      </div></form></div></div></div>

    <div class="col-12"><div class="card">
      <div class="card-header"><i class="bi bi-key"></i> Change password</div>
      <div class="card-body"><form onsubmit="changePassword(event)"><div class="row g-3 align-items-end">
        <div class="col-md-4"><label class="form-label">Current password <span class="required-star">*</span></label><input class="form-control" id="pw_current" type="password" required /></div>
        <div class="col-md-3"><label class="form-label">New password <span class="required-star">*</span></label><input class="form-control" id="pw_new" type="password" required minlength="4" /></div>
        <div class="col-md-3"><label class="form-label">Confirm new password <span class="required-star">*</span></label><input class="form-control" id="pw_confirm" type="password" required /></div>
        <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Update</button></div>
      </div></form></div></div></div>
  </div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  const FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112"><rect width="100%" height="100%" fill="#e3e7ee"/>' +
    '<text x="50%" y="56%" font-size="52" text-anchor="middle" fill="#8b9ab1" font-family="Arial">?</text></svg>');
  const fmtDate = (d) => d ? String(d).substring(8, 10) + '-' + String(d).substring(5, 7) + '-' + String(d).substring(0, 4) : '-';
  const txt = (id, v) => { document.getElementById(id).textContent = v == null || v === '' ? '-' : v; };

  window.pageInit = async function () {
    try { fill(await Api.get(API.profile.get)); } catch (e) { SFA.toast(e.message, false); }
  };
  function fill(me) {
    document.getElementById('photoImg').src = me.photo || FALLBACK;
    document.getElementById('photoName').textContent = me.name || me.username || '';
    document.getElementById('photoRole').textContent = me.designation || me.role || '';
    document.getElementById('p_username').textContent = '@' + (me.username || '');
    document.getElementById('p_name').value = me.name || '';
    document.getElementById('p_mobile').value = me.mobile || '';
    document.getElementById('p_email').value = me.email || '';
    txt('i_code', me.empCode); txt('i_des', me.designation); txt('i_hq', me.hq); txt('i_state', me.state); txt('i_mgr', me.manager); txt('i_doj', me.joined ? fmtDate(me.joined) : '');
  }

  // choosing a photo uploads it right away (multipart file - the server stores it as a file)
  document.addEventListener('change', async function (e) {
    if (!e.target || e.target.id !== 'photoFile') return;
    const f = e.target.files[0]; if (!f) return;
    if (!/^image\//.test(f.type)) { SFA.toast('Please choose an image file', false); e.target.value = ''; return; }
    if (f.size > 8 * 1024 * 1024) { SFA.toast('Please choose an image under 8 MB', false); e.target.value = ''; return; }
    try {
      const fd = new FormData(); fd.append('file', f);
      const r = await Api.post(API.profile.photo, fd);
      document.getElementById('photoImg').src = r.photo || URL.createObjectURL(f);
      SFA.toast('Photo updated'); refreshChrome();
    } catch (err) { SFA.toast(err.message, false); }
    e.target.value = '';
  });
  async function removePhoto() {
    if (!confirm('Remove your profile photo?')) return;
    try { await Api.del(API.profile.photo); document.getElementById('photoImg').src = FALLBACK; SFA.toast('Photo removed'); refreshChrome(); }
    catch (e) { SFA.toast(e.message, false); }
  }

  async function saveProfile(ev) {
    ev.preventDefault();
    const v = id => { const x = document.getElementById(id).value.trim(); return x === '' ? null : x; };
    try { await Api.post(API.profile.save, { name: v('p_name'), mobile: v('p_mobile'), email: v('p_email') }); SFA.toast('Profile saved'); document.getElementById('photoName').textContent = v('p_name') || ''; refreshChrome(); }
    catch (e) { SFA.toast(e.message, false); }
  }

  async function changePassword(ev) {
    ev.preventDefault();
    const cur = document.getElementById('pw_current').value, nw = document.getElementById('pw_new').value, cf = document.getElementById('pw_confirm').value;
    if (nw !== cf) { SFA.toast('New passwords do not match', false); return; }
    try {
      await Api.post(API.profile.password, { currentPassword: cur, newPassword: nw });
      ['pw_current', 'pw_new', 'pw_confirm'].forEach(id => document.getElementById(id).value = '');
      SFA.toast('Password updated');
    } catch (e) { SFA.toast(e.message, false); }
  }
  function refreshChrome() { if (window.Shell && Shell.refreshIdentity) Shell.refreshIdentity(); }
</script>
</body>
</html>
