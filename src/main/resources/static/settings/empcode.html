<!DOCTYPE html>
<html lang="en">
<head>
  <script>/* reverse-proxy sub-path support: make relative css/js resolve under the deploy prefix (e.g. /sfaexpert), "" locally */
  (function(){try{var p=location.pathname,m=p.match(/^(.*?)\/u\/\d+(\/|$)/),c=m?m[1]:p.replace(/\/[^\/]*$/,'');document.write('<base href="'+(c||'')+'/">');}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StarSFA &middot; Employee Code</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <script>
    (function () {
      try {
        var d = document.documentElement, s = localStorage;
        var m = location.pathname.match(/\/u\/(\d+)(\/|$)/), q = '_u' + (m ? m[1] : '0');
        d.setAttribute('data-theme', s.getItem('sfa_mode' + q) || 'light');
        d.setAttribute('data-nav', s.getItem('sfa_nav' + q) || 'vertical');
        d.setAttribute('data-density', s.getItem('sfa_density' + q) || 'comfortable');
        var f = s.getItem('sfa_font' + q); if (f) d.style.setProperty('--sfa-font-scale', f);
        var c = s.getItem('sfa_theme' + q);
        if (c) { c = JSON.parse(c); var t = (c.resolved && c.resolved[c.mode]) || {};
          for (var k in t) d.style.setProperty('--sfa-' + k, t[k]); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="app" data-page="empcode" data-title="Employee Code Format"></div>

<template id="pageContent">
  <div class="row g-3">
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header"><i class="bi bi-upc-scan"></i> Employee Code (emp_code) Format</div>
        <div class="card-body">
          <p class="text-muted small mb-3">
            The company-facing employee code (e.g. <b>AWT201</b>) is built as
            <b>prefix + running number + suffix</b>. Set the format for <b>your company</b> here —
            it applies to every new employee from now on. The running number keeps counting up and
            is never reused, so codes never clash. This is separate from <b>emp_id</b>, the internal
            developer key that never changes.
          </p>

          <div class="row g-3">
            <div class="col-sm-4">
              <label class="form-label">Prefix</label>
              <input type="text" class="form-control" id="ec_prefix" maxlength="20" placeholder="AWT" />
            </div>
            <div class="col-sm-4">
              <label class="form-label">Number width
                <i class="bi bi-info-circle" title="Zero-pad the number to this many digits. 0 = no padding."></i>
              </label>
              <input type="number" class="form-control" id="ec_width" min="0" max="12" value="0" />
            </div>
            <div class="col-sm-4">
              <label class="form-label">Suffix <span class="text-muted">(optional)</span></label>
              <input type="text" class="form-control" id="ec_suffix" maxlength="20" placeholder="" />
            </div>
          </div>

          <div class="mt-4 mb-3">
            <label class="form-label">Next code preview</label>
            <div class="form-control-plaintext"><span class="badge bg-primary fs-6" id="ec_preview">&mdash;</span></div>
          </div>

          <button class="btn btn-primary" onclick="ecSave()"><i class="bi bi-check-lg"></i> Save format</button>
        </div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="card">
        <div class="card-header"><i class="bi bi-lightbulb"></i> Examples</div>
        <div class="card-body">
          <table class="table table-sm mb-0">
            <thead><tr><th>Prefix</th><th>Width</th><th>Suffix</th><th>Result</th></tr></thead>
            <tbody class="small">
              <tr><td>AWT</td><td>0</td><td>&mdash;</td><td><code>AWT201</code></td></tr>
              <tr><td>AWT</td><td>5</td><td>&mdash;</td><td><code>AWT00201</code></td></tr>
              <tr><td>EMP-</td><td>4</td><td>/26</td><td><code>EMP-0201/26</code></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/core/session.js"></script>
<script src="js/core/endpoints.js"></script>
<script src="js/core/http.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/core/uikit.js"></script>
<script src="js/shell.js"></script>
<script>
  let ecNextNumber = 1;

  window.pageInit = async function () {
    try {
      const cfg = await Api.get(API.code.empCodeConfig);
      document.getElementById('ec_prefix').value = cfg.prefix || '';
      document.getElementById('ec_width').value = (cfg.width == null ? 0 : cfg.width);
      document.getElementById('ec_suffix').value = cfg.suffix || '';
      ecNextNumber = cfg.nextNumber || 1;
      ecPreview();
      ['ec_prefix', 'ec_width', 'ec_suffix'].forEach(id =>
        document.getElementById(id).addEventListener('input', ecPreview));
    } catch (e) { SFA.toast(e.message, false); }
  };

  function ecPreview() {
    const prefix = document.getElementById('ec_prefix').value;
    const suffix = document.getElementById('ec_suffix').value;
    let width = parseInt(document.getElementById('ec_width').value, 10);
    if (isNaN(width) || width < 0) width = 0;
    let num = String(ecNextNumber);
    if (width > 0) num = num.padStart(width, '0');
    document.getElementById('ec_preview').textContent = prefix + num + suffix;
  }

  async function ecSave() {
    const prefix = document.getElementById('ec_prefix').value.trim();
    let width = parseInt(document.getElementById('ec_width').value, 10);
    if (isNaN(width) || width < 0) width = 0;
    const suffix = document.getElementById('ec_suffix').value.trim();
    try {
      const cfg = await Api.post(API.code.empCodeConfig, { prefix, width, suffix });
      ecNextNumber = cfg.nextNumber || ecNextNumber;
      ecPreview();
      SFA.toast('Saved — new employees will get codes like ' + (cfg.preview || ''));
    } catch (e) { SFA.toast(e.message, false); }
  }
</script>
</body>
</html>
